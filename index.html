somkostninger er derfor: 4+21+24=49 kr. pr. enhed. De samlede faste produktionsomkostninger er 54.000 kr. Normalproduktionen er 12.000 enheder. Den budgetterede sats for faste produktionsomkostninger bliver: 54.000 divideret med 12.000=4,50 kr. pr. enhed. Produktionsomkostningen under regnskabsmetoden bliver derfor: 49+4,50=53,50 kr. pr. enhed. Under bidragsmetoden er lagerkostprisen 49 kr., mens den under regnskabsmetoden er 53,50 kr. Forskellen på 4,50 kr. pr. enhed er den allokerede andel af de faste produktionsomkostninger. Variable salgsomkostninger er 2 kr. pr. solgt enhed, og øvrige faste omkostninger er 30.000 kr. om året."},{"t":"År 1 – lageropbygning","b":"I år 1 producerer virksomheden 10.000 enheder og sælger 8.000 enheder. Da der ikke er noget åbningslager, bliver slutlageret: 0+10.000-8.000=2.000 enheder. Produktionen er større end salget, og virksomheden opbygger derfor lager. Regnskabsmetoden i år 1. Omsætningen udgør. 8.000×71=568.000 kr. Vareforbruget beregnes med den fulde produktionsomkostning: 8.000×53,50=428.000 kr. Virksomheden producerer kun 10.000 enheder mod en normalproduktion på 12.000. Der opstår derfor en ugunstig produktionsvolumenafvigelse: 12.000-10.000×4,50=9.000 kr. ugunstig. Bruttoresultatet bliver. 568.000-428.000-9.000=131.000 kr. De variable salgsomkostninger er. 8.000×2=16.000 kr. Sammen med de faste øvrige omkostninger på 30.000 kr. bliver de samlede øvrige omkostninger 46.000 kr. Driftsresultatet er derfor. 131.000-46.000=85.000 kr. Bidragsmetoden i år 1. Omsætningen er fortsat 568.000 kr. De variable produktionsomkostninger for de solgte varer er: 8.000×49=392.000 kr. Efter fradrag af variable salgsomkostninger på 16.000 kr. bliver dækningsbidraget. 568.000-392.000-16.000=160.000 kr. Samtlige faste produktionsomkostninger på 54.000 kr. omkostningsføres i år 1. Sammen med de øvrige faste omkostninger på 30.000 kr. bliver driftsresultatet. 160.000-54.000-30.000=76.000 kr. Regnskabsmetoden viser altså et resultat på 85.000 kr., mens bidragsmetoden viser 76.000 kr. Forskellen er 9.000 kr. Forklaringen er, at de 2.000 enheder på lager indeholder faste produktionsomkostninger under regnskabsmetoden: 2.000×4,50=9.000 kr. Disse 9.000 kr. er aktiveret i lageret frem for at blive omkostningsført i år 1. Resultatet under regnskabsmetoden bliver derfor 9.000 kr. højere. Lagerværdien bliver. Regnskabsmetoden: 2.000×53,50=107.000 kr. Bidragsmetoden. 2.000×49=98.000 kr. Forskellen på 9.000 kr. svarer præcist til forskellen mellem de to driftsresultater."},{"t":"År 2 – lagernedbringelse","b":"I år 2 er åbningslageret 2.000 enheder. Virksomheden producerer 11.500 enheder og sælger 13.000 enheder. Slutlageret bliver. 2.000+11.500-13.000=500 enheder. Salget er 1.500 enheder større end årets produktion. Virksomheden sælger derfor både årets produktion og 1.500 enheder fra åbningslageret. Regnskabsmetoden i år 2. Omsætningen er. 13.000×71=923.000 kr. Vareforbruget er. 13.000×53,50=695.500 kr. Produktionen ligger 500 enheder under normalproduktionen. Den ugunstige produktionsvolumenafvigelse bliver. 12.000-11.500×4,50=2.250 kr. Bruttoresultatet bliver. 923.000-695.500-2.250=225.250 kr. Variable salgsomkostninger udgør 26.000 kr., og øvrige faste omkostninger udgør 30.000 kr. Driftsresultatet bliver derfor. 225.250-26.000-30.000=169.250 kr. Bidragsmetoden i år 2. De variable produktionsomkostninger for de solgte varer er: 13.000×49=637.000 kr. Dækningsbidraget bliver. 923.000-637.000-26.000=260.000 kr. Efter fradrag af faste produktionsomkostninger på 54.000 kr. og øvrige faste omkostninger på 30.000 kr. bliver resultatet. 260.000-54.000-30.000=176.000 kr. Bidragsmetoden viser dermed et resultat, der er 6.750 kr. højere end regnskabsmetodens. 176.000-169.250=6.750 kr. Forskellen opstår, fordi lageret falder med 1.500 enheder. Under regnskabsmetoden frigives de faste produktionsomkostninger, der tidligere var aktiveret i lageret: 1.500×4,50=6.750 kr. Når lageret sælges, bliver de tidligere udskudte faste produktionsomkostninger en del af periodens vareforbrug. Derfor bliver resultatet under regnskabsmetoden lavere end under bidragsmetoden."},{"t":"Samlet resultat over flere perioder","b":"Efter år 2 er der stadig 500 enheder på lager. Det samlede resultat for de to år er 254.250 kr. efter regnskabsmetoden og 252.000 kr. efter bidragsmetoden. Forskellen udgør. 254.250-252.000=2.250 kr. De 500 enheder i slutlageret indeholder netop 2.250 kr. i faste produktionsomkostninger. 500×4,50=2.250 kr. Hvis hele lageret på et senere tidspunkt sælges, og produktionen samlet set er lig med salget over hele virksomhedens levetid, vil den samlede resultatforskel forsvinde. Regnskabsmetoden udskyder kun omkostningsføringen. Metoden fjerner ikke omkostningerne. Den generelle afstemningsformel er. Resultat efter regnskabsmetoden − resultat efter bidragsmetoden= faste produktionsomkostninger i slutlageret − faste produktionsomkostninger i åbningslageret. Hvis den faste produktionssats er konstant, kan sammenhængen også udtrykkes som: Resultatforskel=ændring i lagerbeholdningen×fast produktionsomkostning pr. enhed."},{"t":"Sammenhængen mellem produktion, salg og resultat","b":"Når produktion og salg er ens, ændres lageret ikke. Under forudsætning af en konstant sats bliver periodens resultat derfor det samme efter de to metoder. Når produktionen er større end salget, stiger lageret. Regnskabsmetoden aktiverer en del af periodens faste produktionsomkostninger i lageret. Resultatet efter regnskabsmetoden bliver derfor højere end efter bidragsmetoden. Når salget er større end produktionen, falder lageret. Tidligere aktiverede faste produktionsomkostninger frigives fra lageret og bliver en del af vareforbruget. Resultatet efter regnskabsmetoden bliver derfor lavere end efter bidragsmetoden. Det afgørende er altså lagerændringen, ikke blot produktions- eller salgsmængden isoleret set."},{"t":"Produktionsvolumenafvigelse","b":"Ved normal costing fordeles de budgetterede faste produktionsomkostninger med en på forhånd fastlagt sats: Budgetterede faste produktionsomkostninger / valgt kapacitetsniveau. Hvis den faktiske produktion er lavere end kapacitetsniveauet, bliver en del af de faste produktionsomkostninger ikke allokeret til produkterne. Der opstår underallokering og en ugunstig produktionsvolumenafvigelse. I Fredonia-eksemplet er normalproduktionen 12.000 enheder, og den faste sats er 4,50 kr. Ved produktion af 10.000 enheder allokeres: 10.000×4,50=45.000 kr. De faktiske faste produktionsomkostninger er 54.000 kr. De resterende 9.000 kr. er underallokerede. 54.000-45.000=9.000 kr. Hvis produktionen er højere end det valgte kapacitetsniveau, kan der opstå over-allokering og en gunstig produktionsvolumenafvigelse. En gunstig afvigelse betyder imidlertid ikke nødvendigvis, at virksomheden har opnået en reel økonomisk gevinst. Den kan blot være et resultat af høj produktion og lageropbygning."},{"t":"Adfærdsmæssige problemer ved regnskabsmetoden","b":"Regnskabsmetoden kan give ledelsen incitament til at producere mere, end kunderne efterspørger. Når produktionen øges uden en tilsvarende stigning i salget, bliver flere faste produktionsomkostninger aktiveret i lageret, og færre belaster periodens resultat. I eksemplet producerer Fredonia først 4.400 enheder og sælger 4.100. Produktionsvolumenafvigelsen er. 12.000-4.400×4,50=34.200 kr. ugunstig. Resultatet bliver et tab på 650 kr., og slutlageret er 300 enheder med en værdi på: 300×53,50=16.050 kr. Hvis produktionen året efter øges til 9.000 enheder, mens salget fortsat kun er 4.100, falder den ugunstige volumenafvigelse til: 12.000-9.000×4,50=13.500 kr. Virksomheden kan nu rapportere et overskud på 20.050 kr., selv om salget er uændret. Slutlageret vokser samtidig til. 300+9.000-4.100=5.200 enheder. Lagerværdien bliver. 5.200×53,50=278.200 kr. Det forbedrede regnskabsresultat skyldes altså ikke større salg eller bedre markedsperformance. Det skyldes, at en større del af de faste produktionsomkostninger er placeret i balancen som lager. Overproduktion kan medføre kapitalbinding, lageromkostninger, risiko for ukurans, beskadigelse og prisfald. Den kan også skjule kapacitetsproblemer og flytte omkostninger til senere perioder. Derfor bør resultatmåling ikke belønne produktion, der ikke understøttes af realistisk efterspørgsel."},{"t":"Begrænsning af uhensigtsmæssig lageropbygning","b":"Uønsket adfærd kan reduceres ved at anvende bidragsmetoden til intern rapportering, fordi den ikke gør det muligt at forbedre periodens resultat ved at aktivere faste produktionsomkostninger i lageret. Virksomheden kan desuden anvende realistiske salgs- og lagerbudgetter, opkræve interne omkostninger for lagerbinding og evaluere ledere over længere perioder. Finansielle mål bør kombineres med ikke-finansielle mål som lageromsætningshastighed, lagerets alder, leveringsevne, kvalitet og forholdet mellem salg og slutlager. Formålet er at sikre, at en rapporteret resultatforbedring også repræsenterer en reel driftsmæssig forbedring."},{"t":"Valg af kapacitetsniveau","b":"Den faste produktionssats afhænger af, hvilket kapacitetsniveau virksomheden bruger som nævner. Fire almindelige muligheder er teoretisk, praktisk, normal og budgetteret kapacitet. Teoretisk kapacitet er den maksimale produktion under ideelle forhold uden stop, vedligeholdelse, fejl eller ineffektivitet. Niveauet er normalt urealistisk som planlægningsgrundlag. Praktisk kapacitet tager højde for uundgåelige driftsstop som vedligeholdelse, omstilling, ferie og normale fejl. Den viser, hvad virksomheden realistisk kan producere, hvis efterspørgslen er tilstrækkelig. Normal kapacitet bygger på den gennemsnitlige forventede efterspørgsel over en længere periode. Den udjævner sæsonmæssige og konjunkturelle udsving. Hovedbudgettets kapacitet bygger på den forventede aktivitet i den kommende budgetperiode, typisk det næste år. Den kan derfor variere betydeligt fra år til år."},{"t":"Kapacitetsniveauets påvirkning af satsen","b":"Lloyds Cykler har faste produktionsomkostninger på 200.000 kr. Den teoretiske kapacitet er 10.000 maskintimer. Ved teoretisk kapacitet bliver satsen. 200.000 divideret med 10.000=20 kr. pr. maskintime. Praktisk kapacitet er 85 %, svarende til 8.500 timer: 200.000 divideret med 8.500=23,53 kr. pr. maskintime. Normal kapacitet er 75 %, svarende til 7.500 timer: 200.000 divideret med 7.500=26,67 kr. pr. maskintime. Hovedbudgettets kapacitet er 60 %, svarende til 6.000 timer: 200.000 divideret med 6.000=33,33 kr. pr. maskintime. Jo lavere kapacitetsniveau der anvendes som nævner, desto højere bliver den faste omkostningssats. Produkterne og lageret tilføres dermed en større andel af de faste produktionsomkostninger pr. enhed. Hvis virksomheden faktisk anvender 8.400 maskintimer, bliver produktionsvolumenafvigelserne: Teoretisk kapacitet: 10.000-8.400×20=32.000 kr. ugunstig. Praktisk kapacitet. 8.500-8.400×23,53=2.353 kr. ugunstig. Normal kapacitet. 7.500-8.400×26,67=24.003 kr. gunstig. Budgetteret kapacitet. 6.000-8.400×33,33=79.992 kr. gunstig. Valget af kapacitetsniveau påvirker således både produktomkostningen, lagerværdien, volumenafvigelsen og det rapporterede resultat. Effekten på resultatet er især relevant, når produktion og salg ikke er ens."},{"t":"Samlet vurdering af metoderne","b":"Regnskabsmetoden viser produkternes fulde produktionsomkostninger og anvendes ved ekstern lager- og resultatrapportering. Metoden kan dog skabe uhensigtsmæssige incitamenter, fordi ledelsen kan forbedre det kortsigtede resultat gennem lageropbygning. Bidragsmetoden tydeliggør sammenhængen mellem salgsvolumen, variable omkostninger, dækningsbidrag og faste omkostninger. Den er derfor ofte bedre til intern styring, kortsigtede beslutninger og præstationsevaluering. Metoderne bør ikke nødvendigvis opfattes som konkurrenter. De leverer forskellige perspektiver. Regnskabsmetoden viser den fulde produktionsomkostning, mens bidragsmetoden bedre viser omkostningernes adfærd og den kortsigtede økonomiske virkning af ændringer i aktivitet."}]},{"n":8,"name":"L8 CVP-analyse","items":[{"t":"Formålet med CVP-analyse","b":"Cost-Volume-Profit-analyse, CVP, undersøger sammenhængen mellem virksomhedens salgsvolumen, indtægter, omkostninger og resultat. Analysen bruges til at vurdere, hvor meget virksomheden skal sælge for at dække sine omkostninger, opnå en bestemt profit eller gøre en ændring i pris og omkostningsstruktur rentabel. CVP kan blandt andet bruges til at besvare følgende spørgsmål: Hvor mange enheder skal virksomheden sælge for at gå i nul? Hvor stor omsætning kræves for at opnå en bestemt profit? Hvordan påvirkes resultatet af ændringer i salgspris, variable omkostninger og faste omkostninger? Er en reklamekampagne, prisnedsættelse eller kapacitetsudvidelse økonomisk fordelagtig? Hvordan ændres risikoen, hvis virksomheden erstatter variable omkostninger med faste omkostninger? Analysen er især relevant i planlægning og kortsigtet beslutningstagning. CVP er en forenklet model, men giver en tydelig forståelse af, hvilke faktorer der skaber virksomhedens resultat."},{"t":"Indtægts- og omkostningsfaktorer","b":"Virksomhedens resultat før skat kan grundlæggende beregnes som: Resultat før skat=samlede indtægter-samlede omkostninger. Indtægterne påvirkes først og fremmest af salgsprisen og antallet af solgte enheder: Omsætning=salgspris pr. enhed×antal solgte enheder. Virksomhedens omkostninger kan påvirkes af en række forskellige faktorer, eksempelvis antallet af producerede enheder, antal salgsbesøg, antal ordrer og forsendelser, produkternes vægt samt kompleksiteten i produktsortimentet. I den simple CVP-model antages salgsvolumen at være den centrale aktivitetsfaktor. I mere komplekse virksomheder kan flere forskellige aktiviteter dog være årsag til omkostningerne. Det er en af grundene til, at CVP skal anvendes med forståelse for modellens begrænsninger."},{"t":"Variable og faste omkostninger","b":"CVP kræver, at virksomhedens omkostninger opdeles i variable og faste omkostninger. Variable omkostninger ændrer sig samlet set, når aktivitetsniveauet ændrer sig. Det kan eksempelvis være materialer, produktionsløn, emballage, salgsprovision og energiforbrug. Inden for det relevante aktivitetsinterval antages den variable omkostning pr. enhed at være konstant. Hvis den variable omkostning er 42 kr. pr. enhed, vil 1.000 enheder medføre samlede variable omkostninger på 42.000 kr., mens 2.000 enheder vil medføre 84.000 kr. Den samlede variable omkostning ændrer sig dermed proportionalt med aktivitetsniveauet. Faste omkostninger, også kaldet kapacitetsomkostninger, antages samlet set at være konstante inden for en bestemt periode og et relevant aktivitetsinterval. Det kan eksempelvis være husleje, faste lønninger, forsikringer og afskrivninger. Hvis de faste omkostninger er 84.000 kr., er det samlede beløb stadig 84.000 kr., uanset om virksomheden sælger 2.000 eller 3.000 enheder. Den faste omkostning pr. enhed falder derimod, når volumen stiger. Ved 2.000 enheder: 84.000 divideret med 2.000=42 kr. pr. enhed. Ved 3.000 enheder: 84.000 divideret med 3.000=28 kr. pr. enhed. Det er derfor vigtigt at skelne mellem samlede omkostninger og omkostninger pr. enhed. De samlede variable omkostninger ændrer sig med aktiviteten, mens den variable omkostning pr. enhed er konstant. De samlede faste omkostninger er konstante, mens den faste omkostning pr. enhed ændrer sig med aktiviteten. Faste omkostninger kan være udbetalingskrævende, eksempelvis husleje og faste afgifter, eller kalkulatoriske, eksempelvis afskrivninger. Selvom afskrivninger ikke medfører en betaling i den aktuelle periode, påvirker afskrivninger stadig det regnskabsmæssige resultat."},{"t":"Dækningsbidrag og bruttoresultat","b":"I intern økonomistyring anvendes dækningsbidraget til at analysere sammenhængen mellem salg, variable omkostninger og resultat: Dækningsbidrag=omsætning-variable omkostninger. Dækningsbidraget viser, hvor meget salget bidrager med til først at dække de faste omkostninger og derefter skabe overskud. Dækningsbidraget adskiller sig fra bruttoresultatet i det eksterne regnskab. Bruttoresultatet beregnes efter fradrag af vareforbruget, som normalt indeholder både variable og allokerede faste produktionsomkostninger. Dækningsbidraget bygger derimod på en opdeling efter omkostningernes adfærd og fratrækker alle variable omkostninger, mens faste omkostninger vises separat. Dækningsbidragsopstillingen er særligt relevant for CVP, fordi ledelsen på kort sigt ofte kan påvirke salgsvolumen og variable omkostninger mere direkte end den eksisterende kapacitet og de faste omkostninger."},{"t":"CVP-modellens antagelser","b":"CVP bygger på en række forenklinger. Resultaterne er derfor kun pålidelige, hvis antagelserne er nogenlunde realistiske inden for det analyserede område. De samlede omkostninger skal kunne opdeles i variable og faste omkostninger. Omsætning og variable omkostninger antages at udvikle sig lineært med antallet af solgte enheder. Salgsprisen, den variable omkostning pr. enhed og de samlede faste omkostninger antages at være kendte og konstante. Ved flere produkter antages produktmixet at være konstant. Hvis salgsmixet ændrer sig, vil det gennemsnitlige dækningsbidrag også ændre sig, og det oprindelige break-even-punkt gælder ikke længere. Modellen ser desuden bort fra tidsværdien af penge. Indtægter og omkostninger behandles, som om de kan sammenlignes direkte, uanset hvornår betalingerne finder sted. I den simple model antages alle ændringer i indtægter og omkostninger at skyldes ændringer i volumen. I praksis kan priser, effektivitet, produktkvalitet, rabatter, lønsatser og indkøbspriser også ændre sig. Endelig forudsætter analysen normalt, at producerede og solgte mængder er ens, eller at lagerændringer ikke påvirker resultatet væsentligt. Hvis produktion og salg er forskellige, kan lagerregnskabet påvirke det rapporterede resultat."},{"t":"Det relevante interval","b":"CVP-antagelserne gælder kun inden for et relevant aktivitetsinterval. Faste omkostninger er ikke nødvendigvis faste ved alle aktivitetsniveauer. Hvis efterspørgslen overstiger den eksisterende kapacitet, kan virksomheden eksempelvis blive nødt til at leje ekstra lokaler, købe en maskine eller ansætte en ekstra leder. På samme måde kan variable enhedsomkostninger ændre sig ved store mængder på grund af mængderabatter, overtid, kapacitetsproblemer eller ineffektivitet. CVP skal derfor forstås som en lokal tilnærmelse inden for et realistisk område, ikke som en præcis beskrivelse ved alle tænkelige aktivitetsniveauer."},{"t":"Dresses by Mary – grundeksempel","b":"Dresses by Mary sælger kjoler for 70 pund pr. enhed. En kjole købes for 32 pund, og andre variable omkostninger udgør 10 pund. Den samlede variable omkostning er derfor. 32+10=42 pund pr. kjole. De samlede faste omkostninger er 84.000 pund. Da usolgte kjoler kan returneres og refunderes, kan modellen fokusere på antallet af solgte kjoler uden at tage højde for lageromkostninger på de returnerede varer. Ved salg af 2.500 kjoler bliver omsætningen: 2.500×70=175.000 pund. De samlede variable omkostninger bliver. 2.500×42=105.000 pund. Resultatet før skat bliver. 175.000-105.000-84.000=-14.000 pund. Virksomheden får dermed et underskud på 14.000 pund. Salget genererer et positivt dækningsbidrag, men dækningsbidraget er ikke stort nok til at dække de faste omkostninger."},{"t":"Dækningsbidrag pr. enhed og dækningsgrad","b":"Dækningsbidraget pr. enhed beregnes som. DB pr. enhed=salgspris pr. enhed-variable omkostninger pr. enhed. For Dresses by Mary er dækningsbidraget. 70-42=28 pund pr. kjole. Hver ekstra solgt kjole forbedrer derfor resultatet med 28 pund, så længe salgsprisen, de variable enhedsomkostninger og de faste omkostninger er uændrede. Det totale dækningsbidrag beregnes som. Totalt dækningsbidrag=antal solgte enheder×DB pr. enhed. Ved 2.500 solgte kjoler bliver dækningsbidraget: 2.500×28=70.000 pund. Dækningsgraden viser, hvor stor en del af omsætningen der er tilbage efter de variable omkostninger: Dækningsgrad=dækningsbidrag divideret med omsætning. For Mary bliver dækningsgraden. 28 divideret med 70=40 %. Det betyder, at 40 procent af hver omsætningskrone bidrager til at dække faste omkostninger og skabe resultat. De resterende 60 procent anvendes til variable omkostninger. Ved en omsætning på 210.000 pund bliver dækningsbidraget: 210.000×40 %=84.000 pund. Dækningsbidraget svarer her præcis til de faste omkostninger, og resultatet bliver derfor nul."},{"t":"Break-even","b":"Break-even er det aktivitetsniveau, hvor virksomhedens resultat er nul. Ved break-even er det samlede dækningsbidrag præcis tilstrækkeligt til at dække de faste omkostninger: Samlet dækningsbidrag=faste omkostninger. Det kan også udtrykkes som. Samlet omsætning=samlede omkostninger. Salg under break-even giver underskud, mens salg over break-even giver overskud, så længe modellens antagelser holder. Break-even kan beregnes matematisk, ved hjælp af dækningsbidraget eller grafisk. Metoderne bygger på samme økonomiske sammenhæng og skal derfor give det samme resultat."},{"t":"Den matematiske metode","b":"Virksomhedens resultat kan skrives som. Resultat=omsætning-variable omkostninger-faste omkostninger. Hvis Q er antallet af solgte enheder, bliver ligningen: Resultat=salgspris×Q-variabel enhedsomkostning×Q-faste omkostninger. Ved break-even sættes resultatet lig nul. For Mary bliver ligningen. 70Q-42Q-84.000=0. 28Q=84.000. Q=3.000 kjoler. Mary skal dermed sælge 3.000 kjoler for at gå i nul. Kontrollen er. Omsætning: 3.000×70=210.000 pund. Variable omkostninger. 3.000×42=126.000 pund. Faste omkostninger. 84.000 pund. Resultat. 210.000-126.000-84.000=0 pund."},{"t":"Dækningsbidragsmetoden","b":"Break-even i enheder kan beregnes direkte. Break-even i enheder=faste omkostninger divideret med DB pr. enhed. For Mary bliver det. 84.000 divideret med 28=3.000 kjoler. Hvis virksomheden ønsker at beregne break-even som en omsætning, anvendes dækningsgraden: Break-even-omsætning=faste omkostninger divideret med dækningsgrad. For Mary bliver break-even-omsætningen. 84.000 divideret med 0,40=210.000 pund. Resultaterne hænger sammen, fordi. 3.000 kjoler×70 pund=210.000 pund. Enhedsformlen er velegnet, når virksomheden sælger ensartede produkter og ønsker et antal enheder. Omsætningsformlen er praktisk, når virksomheden arbejder med salgsbudgetter i kroner eller har flere produkter med et stabilt salgsmix."},{"t":"Den grafiske metode","b":"Ved den grafiske metode vises volumen på den vandrette akse og beløb på den lodrette. Omsætningslinjen begynder normalt i nul, fordi nul solgte enheder giver nul omsætning. Linjens hældning bestemmes af salgsprisen pr. enhed. Linjen for de samlede omkostninger begynder ved de faste omkostninger, fordi virksomheden har faste omkostninger, selvom salget er nul. Linjens hældning bestemmes af den variable omkostning pr. enhed. Break-even findes i skæringspunktet mellem omsætningslinjen og linjen for de samlede omkostninger. Til venstre for skæringspunktet er omkostningerne større end omsætningen, og virksomheden har underskud. Til højre er omsætningen større end omkostningerne, og virksomheden har overskud. Grafen viser samtidig virksomhedens sikkerhed og følsomhed. Ligger det forventede salg tæt på break-even, kan en mindre nedgang i salget føre til underskud."},{"t":"Ønsket resultat","b":"Virksomheder ønsker normalt ikke blot at gå i nul. CVP kan også beregne den salgsmængde, der kræves for at opnå et bestemt resultat før skat: Nødvendigt antal enheder=faste omkostninger+ønsket resultat divideret med DB pr. enhed. Den nødvendige omsætning kan beregnes som. Nødvendig omsætning=faste omkostninger+ønsket resultat divideret med dækningsgrad. Hvis en virksomhed har faste omkostninger på 180.000 dollars, ønsker en profit på 5.000 dollars og har en dækningsgrad på 25 procent, bliver den nødvendige omsætning: 180.000+5.000 divideret med 0,25=740.000 dollars. Ved almindelig break-even sættes det ønskede resultat blot til nul. Hvis Mary ønsker et resultat før skat på 28.000 pund, skal virksomheden sælge: 84.000+28.000 divideret med 28=4.000 kjoler. Ved 4.000 enheder giver det samlede dækningsbidrag 112.000 pund. Efter fradrag af de faste omkostninger på 84.000 pund bliver resultatet 28.000 pund."},{"t":"Indkomstskat","b":"Hvis målet angives som profit efter skat, skal beløbet først omregnes til den nødvendige profit før skat: Ønsket profit før skat=ønsket profit efter skat divideret med 1-skattesats. Hvis en virksomhed tjener 1.440 dollars før skat og betaler 40 procent i skat, bliver resultatet efter skat: 1.440×1-0,40=864 dollars. Hvis virksomheden i stedet ønsker 1.440 dollars efter skat, skal resultatet før skat være: 1.440 divideret med 1-0,40=2.400 dollars. Det nødvendige salg beregnes derefter ved at indsætte de 2.400 dollars som ønsket resultat før skat: Nødvendige enheder=faste omkostninger+ønsket resultat efter skat divideret med 1-skattesats divideret med DB pr. enhed. Skat påvirker ikke break-even, når resultatet er nul, fordi der ikke er nogen positiv indkomst at beskatte. Skat er derimod relevant ved beregning af et ønsket resultat efter skat."},{"t":"Sikkerhedsmargin","b":"Sikkerhedsmarginen viser, hvor meget det forventede eller faktiske salg kan falde, før virksomheden når break-even: Sikkerhedsmargin i enheder=forventet salg-break-even-salg. Sikkerhedsmargin i kroner=forventet omsætning-break-even-omsætning. Sikkerhedsgrad=sikkerhedsmargin divideret med forventet omsætning. Hvis Mary forventer at sælge 3.200 kjoler og break-even er 3.000, bliver sikkerhedsmarginen: 3.200-3.000=200 kjoler. Omsætningsmæssigt bliver sikkerhedsmarginen. 200×70=14.000 pund. Sikkerhedsgraden bliver. 14.000 divideret med 224.000=6,25 %. Salget kan altså kun falde med 6,25 procent, før virksomheden begynder at få underskud. En lille sikkerhedsmargin er udtryk for større driftsmæssig risiko."},{"t":"Følsomhedsanalyse","b":"Følsomhedsanalyse undersøger, hvordan resultatet ændres, når forudsætninger som volumen, pris, variable omkostninger eller faste omkostninger ændres. Analysen er relevant, fordi de værdier, der anvendes i CVP, sjældent er helt sikre. Man kan opstille et basisscenarie og sammenligne det med alternative scenarier. Fokus bør især være på ændringen i indtægter og omkostninger. Omkostninger og indtægter, der er ens i alle alternativer, påvirker ikke valget. Følsomhedsanalyse kan eksempelvis undersøge optimistiske, forventede og pessimistiske scenarier. Den kan også vise, hvilken minimumsstigning i salget der kræves, før en kampagne eller investering er rentabel."},{"t":"Eksempel: reklamekampagne","b":"Mary regner i basisscenariet med at sælge 3.200 kjoler. Resultatet uden kampagne er. Dækningsbidrag: 3.200×28=89.600 pund. Resultat. 89.600-84.000=5.600 pund. En reklamekampagne koster 10.000 pund og forventes at øge salget til 4.000 kjoler. De faste omkostninger stiger derfor til 94.000 pund: Dækningsbidrag: 4.000×28=112.000 pund. Resultat. 112.000-94.000=18.000 pund. Kampagnen øger resultatet med. 18.000-5.600=12.400 pund. Kampagnen bør derfor gennemføres, hvis salgsprognosen er realistisk. Den samme beslutning kan analyseres marginalt. Kampagnen forventes at skabe 800 ekstra salg, som giver: 800×28=22.400 pund i ekstra dækningsbidrag. Efter fradrag af kampagnens 10.000 pund bliver den marginale gevinst: 22.400-10.000=12.400 pund. Kampagnens nødvendige meromsætning i enheder kan beregnes som: 10.000 divideret med 28=357,14. Da der ikke kan sælges en brøkdel af en kjole, skal kampagnen skabe mindst 358 ekstra salg for at være rentabel."},{"t":"Eksempel: prisnedsættelse","b":"Mary overvejer at reducere salgsprisen fra 70 til 61 pund. Den variable omkostning er stadig 42 pund, så det nye dækningsbidrag bliver: 61-42=19 pund pr. kjole. Den lavere pris forventes at øge salget fra 3.200 til 4.500 kjoler. Det nye resultat bliver. 4.500×19-84.000=1.500 pund. Det oprindelige resultat var 5.600 pund. Prisnedsættelsen reducerer derfor resultatet med. 1.500-5.600=-4.100 pund. Prisnedsættelsen bør ikke gennemføres ud fra de forventede mængder. Eksemplet viser, at en højere salgsvolumen ikke nødvendigvis giver et højere resultat. Prisnedsættelsen reducerer dækningsbidraget på alle solgte enheder, også de enheder virksomheden allerede forventede at sælge. Det nødvendige salg ved den lavere pris for at fastholde det oprindelige resultat kan beregnes som: 84.000+5.600 divideret med 19=4.715,79. Mary skal dermed sælge mindst 4.716 kjoler til 61 pund for at opnå samme resultat som ved salg af 3.200 kjoler til 70 pund."},{"t":"Eksempel: kapacitetsudvidelse","b":"Mary kan sælge 4.000 kjoler, men den eksisterende kapacitet er begrænset til 3.500. En udvidelse af kapaciteten koster 6.000 pund. De ekstra 500 kjoler giver et ekstra dækningsbidrag på: 500×28=14.000 pund. Efter fradrag af kapacitetsomkostningen bliver den økonomiske fordel: 14.000-6.000=8.000 pund. Kapacitetsudvidelsen bør derfor gennemføres, hvis de 500 ekstra enheder faktisk kan sælges, og udvidelsen ikke medfører andre relevante omkostninger. Det nødvendige ekstra salg for at dække udvidelsen er: 6.000 divideret med 28=214,29. Der skal dermed sælges mindst 215 ekstra kjoler for at gøre udvidelsen rentabel."},{"t":"Marginal analyse","b":"Ledelsesbeslutninger bør ofte baseres på marginale eller inkrementelle indtægter og omkostninger. Det vil sige de beløb, der ændrer sig, hvis virksomheden vælger ét alternativ frem for et andet. En ændring er økonomisk fordelagtig, når. Marginal indtægt>marginal omkostning. En ændring er økonomisk ufordelagtig, når. Marginal indtægt<marginal omkostning. Allerede afholdte omkostninger, som ikke kan ændres, er sunk costs og bør ikke påvirke beslutningen. Fælles omkostninger, der fortsætter uanset valget, er heller ikke relevante for sammenligningen. CVP og marginal analyse hænger tæt sammen, fordi dækningsbidraget viser den kortsigtede økonomiske virkning af en ekstra solgt enhed, så længe de faste omkostninger ikke ændres."},{"t":"Omkostningsplanlægning og valg af omkostningsstruktur","b":"Marys leverandør tilbyder at reducere indkøbsprisen fra 32 til 25 pund pr. kjole mod en ekstra fast betaling på 30.000 pund. Under den eksisterende aftale er de variable omkostninger: 32+10=42 pund. Dækningsbidraget er. 70-42=28 pund. De faste omkostninger er 84.000 pund. Under den nye aftale bliver de variable omkostninger: 25+10=35 pund. Dækningsbidraget bliver. 70-35=35 pund. De faste omkostninger stiger til. 84.000+30.000=114.000 pund. Den nye aftale giver 7 pund mere i dækningsbidrag pr. solgt kjole, men kræver 30.000 pund mere i faste omkostninger. Indifferenspunktet findes ved at sætte alternativerne lig hinanden: 28Q-84.000=35Q-114.000. 30.000=7Q. Q=4.285,71. Ved salg over 4.286 kjoler er den nye aftale mest fordelagtig. Ved salg under dette niveau er den eksisterende aftale bedst. Break-even for virksomheden under den oprindelige aftale er: 84.000 divideret med 28=3.000 kjoler. Break-even under den nye aftale er. 114.000 divideret med 35=3.257,14. Den nye aftale har dermed et højere almindeligt break-even-punkt, selvom den bliver mere profitabel ved høje salgsmængder. Virksomheden påtager sig større risiko til gengæld for et større indtjeningspotentiale."},{"t":"Driftsmæssig gearing","b":"Driftsmæssig gearing beskriver, hvor følsomt resultatet er over for ændringer i salgsvolumen. En virksomhed med høje faste omkostninger og lave variable enhedsomkostninger har høj driftsmæssig gearing. En virksomhed med lave faste omkostninger og høje variable enhedsomkostninger har lav gearing. Graden af driftsmæssig gearing ved et bestemt salgsniveau kan beregnes som: Driftsmæssig gearing=samlet dækningsbidrag divideret med driftsresultat. Under Marys oprindelige aftale og ved salg af 3.500 kjoler bliver dækningsbidraget: 3.500×28=98.000 pund. Resultatet bliver. 98.000-84.000=14.000 pund. Den driftsmæssige gearing er. 98.000 divideret med 14.000=7,0. Det betyder omtrent, at en ændring i salget på 1 procent medfører en ændring i driftsresultatet på 7 procent omkring dette aktivitetsniveau. Under den nye aftale bliver dækningsbidraget. 3.500×35=122.500 pund. Resultatet bliver. 122.500-114.000=8.500 pund. Den driftsmæssige gearing bliver. 122.500 divideret med 8.500=14,4. Den nye aftale er altså mere følsom over for salgsændringer. En lille stigning i salget kan give en stor procentvis resultatforbedring, men et fald i salget kan også give et stort resultatfald. Driftsmæssig gearing afhænger både af virksomhedens omkostningsstruktur og det aktuelle salgsniveau. Gearingen er særlig høj tæt på break-even, fordi resultatet her er lille. Gearingen falder normalt, når salget og resultatet bevæger sig længere over break-even."},{"t":"Risiko og indtjeningspotentiale","b":"Høj driftsmæssig gearing giver normalt et højere break-even-punkt og større driftsmæssig risiko. Virksomheden skal skabe et relativt højt salg for at dække sine faste omkostninger. Når break-even først er passeret, giver hver ekstra enhed til gengæld et stort dækningsbidrag. Lav driftsmæssig gearing giver ofte et lavere break-even-punkt og mindre risiko. Virksomheden har færre faste forpligtelser, men de højere variable omkostninger betyder, at resultatet vokser langsommere ved stigende salg. Valget af omkostningsstruktur afhænger derfor af forventet efterspørgsel og usikkerhed. En stabil og høj efterspørgsel kan gøre en høj gearing attraktiv. Ved usikker eller svingende efterspørgsel kan en mere fleksibel omkostningsstruktur med lavere faste omkostninger være sikrere."},{"t":"Salgsmix ved flere produkter","b":"Når en virksomhed sælger flere produkter, afhænger resultatet både af den samlede salgsvolumen og af fordelingen mellem produkterne. Salgsmixet er den relative andel af de forskellige produkter i det samlede salg. Mary tilføjer bluser til sortimentet. I det grundlæggende eksempel har en kjole et dækningsbidrag på 28 pund, mens én bluse har et dækningsbidrag på 11 pund. Det forventede salgsmix er to bluser for hver kjole. Salgsmixet kan behandles som en samlet pakke. 1 kjole+2 bluser. Pakkens samlede dækningsbidrag bliver. 28+2×11=50 pund. Ved faste omkostninger på 84.000 pund bliver break-even i salgspakker: 84.000 divideret med 50=1.680 pakker. Det svarer til. 1.680 kjoler. 1.680×2=3.360 bluser. Det samlede break-even-salg er derfor. 1.680+3.360=5.040 enheder. Beregningen forudsætter, at det forventede salgsmix på én kjole og to bluser opretholdes. Hvis salgsmixet ændrer sig, ændres det vægtede dækningsbidrag og dermed break-even."},{"t":"Vægtet dækningsgrad","b":"Ved flere produkter kan break-even-omsætningen beregnes med en vægtet gennemsnitlig dækningsgrad. I det alternative eksempel fra materialet sælges én kjole til 70 pund med et dækningsbidrag på 28 pund og to bluser samlet til 40 pund med et samlet dækningsbidrag på 22 pund. Den samlede omsætning i mixet er. 70+40=110 pund. Kjolens andel af omsætningen er. 70 divideret med 110=63,6 %. Blusernes andel er. 40 divideret med 110=36,4 %. Kjolens dækningsgrad er 40 procent, og blusernes samlede dækningsgrad er: 22 divideret med 40=55 %. Den vægtede dækningsgrad bliver. 40 %×63,6 %+55 %×36,4 %=ca. 45,46 %. Break-even-omsætningen bliver derfor. 84.000 divideret med 45,46 %=ca. 184.800 pund. Resultatet svarer omtrent til omsætningen fra 1.680 kjoler og 3.360 bluser: 1.680×70+3.360×20=184.800 pund. Den lille forskel fra 184.778 pund skyldes afrunding i den vægtede dækningsgrad."},{"t":"Salgsmixets betydning for resultatet","b":"To perioder kan have samme samlede salgsvolumen og alligevel forskellige resultater, hvis produktmixet er forskelligt. Flere solgte enheder af produktet med det højeste dækningsbidrag er normalt gunstigt, mens flere af produktet med det laveste dækningsbidrag er ugunstigt. Det er dog vigtigt at vurdere dækningsbidraget i forhold til den knappe ressource. Hvis produkterne kræver forskellige mængder af maskintid, arbejdstid eller materialer, bør virksomheden ikke nødvendigvis prioritere produktet med det højeste dækningsbidrag pr. enhed. Den relevante beregning er. DB pr. enhed af den knappe ressource=DB pr. produkt divideret med forbrug af den knappe ressource. Et produkt med et lavere dækningsbidrag pr. enhed kan være mest attraktivt, hvis det bruger væsentligt mindre af den begrænsede kapacitet."},{"t":"CVP som planlægningsværktøj","b":"CVP kan hjælpe ledelsen med at opstille salgsbudgetter, fastsætte profitmål og vurdere alternative priser og omkostningsstrukturer. Analysen er også nyttig til at identificere virksomhedens mest følsomme forudsætninger. En god analyse bør ikke kun beregne ét forventet resultat. Ledelsen bør også undersøge, hvad der sker, hvis salget bliver lavere end forventet, de variable omkostninger stiger, eller den planlagte pris ikke kan opretholdes. Særligt følgende forhold bør vurderes samlet. break-even, sikkerhedsmargin, driftsmæssig gearing, kapacitetsgrænser og sandsynligheden for de anvendte salgsforventninger. Et alternativ kan give den højeste forventede profit, men samtidig indebære en risiko, som virksomheden ikke ønsker eller har økonomisk mulighed for at bære."},{"t":"Begrænsninger ved CVP","b":"CVP giver overblik, men bygger på forenklinger. Virkeligheden er sjældent fuldstændig lineær. Salgspriser kan falde ved stor volumen, variable enhedsomkostninger kan ændre sig på grund af rabatter eller overtid, og faste omkostninger kan stige trinvist ved kapacitetsudvidelser. Efterspørgslen kan desuden påvirkes af konkurrenter, kvalitet, markedsføring og konjunkturer. Modellen antager ofte, at virksomheden kan sælge alle producerede enheder, og at salgsmixet er konstant. Disse antagelser kan være urealistiske. CVP bør derfor bruges som et beslutningsgrundlag og ikke som en automatisk beslutningsregel. Resultaterne bør kombineres med følsomhedsanalyse, vurdering af kapacitet og kvalitative forhold som kundereaktioner, produktkvalitet, medarbejdere og langsigtet strategi."},{"t":"Samlet fremgangsmåde","b":"En CVP-opgave løses bedst ved først at identificere salgsprisen, den variable omkostning pr. enhed, de samlede faste omkostninger og det forventede salgsniveau. Derefter beregnes dækningsbidraget pr. enhed og dækningsgraden. DB pr. enhed=salgspris-variable omkostninger pr. enhed. Dækningsgrad=DB pr. enhed divideret med salgspris. Herefter vælges den relevante beregning. Break-even i enheder=faste omkostninger divideret med DB pr. enhed. Break-even-omsætning=faste omkostninger divideret med dækningsgrad. Enheder ved ønsket resultat=faste omkostninger+ønsket resultat før skat divideret med DB pr. enhed. Ved ændringer i pris eller omkostningsstruktur skal dækningsbidraget genberegnes. Ved flere produkter skal der anvendes et konstant salgsmix og et vægtet dækningsbidrag. Til sidst bør resultatet vurderes gennem sikkerhedsmargin, følsomhedsanalyse og driftsmæssig gearing. Den centrale pointe er, at indtjening ikke alene afgøres af salgsvolumen. Salgspris, variable omkostninger, faste omkostninger, kapacitet og salgsmix påvirker tilsammen virksomhedens resultat og risiko."}]},{"n":9,"name":"L9 ABC og ABM","items":[{"t":"Formålet med omkostningsfordeling","b":"Lektion 9 – Activity-Based Costing og Activity-Based Management. Et omkostningssystem skal beregne omkostningerne ved produkter, kunder, serviceydelser, afdelinger eller andre omkostningsobjekter. Beregningerne bruges blandt andet til prissætning, produktvalg, kundevurdering, budgettering, procesforbedringer og kapacitetsbeslutninger. Et omkostningsobjekt er det, virksomheden ønsker at kende omkostningen ved. Det kan være en enkelt vare, en produktlinje, en ordre, en kunde, en serviceydelse, et marked eller en organisatorisk enhed. En omkostning er ikke direkte eller indirekte i sig selv. Klassifikationen afhænger af omkostningsobjektet. Fabrikschefens løn er indirekte i forhold til et enkelt produkt, men kan være direkte i forhold til fabrikken som samlet omkostningsobjekt."},{"t":"Direkte og indirekte omkostninger","b":"En direkte omkostning kan på en økonomisk rimelig og entydig måde henføres til et bestemt omkostningsobjekt. Direkte materialer og direkte løn er typiske eksempler. En indirekte omkostning kan ikke på en rimelig måde spores direkte til det enkelte omkostningsobjekt. Den skal derfor fordeles ved hjælp af en fordelingsnøgle eller cost driver. Eksempler er produktionsplanlægning, kvalitetskontrol, fabriksledelse, vedligeholdelse, IT-support og bygningsomkostninger. Variable omkostninger er ofte direkte, men begreberne er ikke identiske. En maskines energiforbrug kan være variabelt, men stadig indirekte, hvis det ikke registreres på de enkelte produkter. En fast licensomkostning kan omvendt være direkte, hvis licensen udelukkende vedrører ét produkt."},{"t":"Overcosting og undercosting","b":"Overcosting opstår, når et omkostningsobjekt bliver belastet med flere omkostninger, end det reelt forbruger. Produktet fremstår derfor dyrere og mindre rentabelt, end det faktisk er. Undercosting opstår, når et omkostningsobjekt bliver belastet med færre omkostninger, end det reelt forbruger. Produktet fremstår billigere og mere rentabelt, end det faktisk er. Hvis tre personer køber frokost til henholdsvis 14, 30 og 16 pund og deler regningen lige, betaler alle 20 pund. De to billige måltider bliver belastet med for store andele, mens det dyre måltid bliver belastet med en for lille andel. Det illustrerer, hvordan brede gennemsnit kan skabe krydssubsidiering. I en virksomhed betyder krydssubsidiering, at overcostede produkter indirekte finansierer undercostede produkter. Problemet kan føre til for høje priser på standardprodukter og for lave priser på komplekse specialprodukter."},{"t":"Traditionel omkostningsfordeling","b":"Et traditionelt omkostningssystem samler ofte de indirekte omkostninger i én eller få store omkostningspuljer. Omkostningerne fordeles derefter med volumenbaserede fordelingsnøgler som direkte løntimer, direkte lønomkostninger, maskintimer eller materialeomkostninger. Den traditionelle fremgangsmåde er. Omkostningsobjektet defineres. De direkte omkostninger identificeres og spores til objektet. De indirekte omkostninger samles i en eller flere puljer. Der vælges en fordelingsnøgle. En omkostningssats beregnes. De indirekte omkostninger fordeles efter objekternes forbrug af fordelingsnøglen. Direkte og fordelte indirekte omkostninger lægges sammen. Omkostningssatsen beregnes som. Omkostningssats=omkostningspuljens samlede omkostninger divideret med samlet mængde af fordelingsnøglen. De allokerede omkostninger til et produkt beregnes som: Omkostningssats×produktets forbrug af fordelingsnøglen. Metoden kan være rimelig i en simpel virksomhed, hvor produkterne er ensartede, og de indirekte omkostninger hovedsageligt påvirkes af produktionsvolumen. Problemerne stiger, når produkter varierer i volumen, kompleksitet, batchstørrelse, kundetilpasning og behov for støtteaktiviteter."},{"t":"Hvorfor volumenbaserede fordelingsnøgler kan være misvisende","b":"Mange indirekte omkostninger varierer ikke direkte med antallet af producerede enheder. Omkostninger til produktdesign afhænger eksempelvis mere af antallet og kompleksiteten af designs end af produktionsvolumen. Omstillingsomkostninger afhænger af antallet og varigheden af omstillinger, mens indkøbsomkostninger kan afhænge af antallet af ordrer. Et masseproduceret standardprodukt kan have mange maskintimer, men kræve få omstillinger, få kvalitetskontroller og meget lidt planlægning. Et specialprodukt i små serier kan have få maskintimer, men kræve mange designs, indkøbsordrer, omstillinger og forsendelser. Hvis alle indirekte omkostninger fordeles efter maskintimer, bliver standardproduktet typisk overcostet, mens specialproduktet undercostes. Den traditionelle model forveksler dermed høj produktionsvolumen med højt forbrug af støtteaktiviteter."},{"t":"Hvornår er ABC relevant?","b":"Activity-Based Costing er især relevant, når de indirekte omkostninger udgør en stor del af de samlede omkostninger, og når virksomhedens produkter, kunder eller processer er meget forskellige. Behovet er særligt stort ved. mange produktvarianter og kundetilpassede produkter. flere forskellige batchstørrelser. omfattende kvalitetskontrol, planlægning og vedligeholdelse. høje omkostninger til IT, udvikling og støttefunktioner. kunder med forskellige krav til levering og service. intens konkurrence og behov for præcis prissætning. ABC har mindre værdi, hvis virksomheden kun fremstiller ét ensartet produkt, hvis de indirekte omkostninger er små, eller hvis én simpel fordelingsnøgle allerede afspejler ressourceforbruget rimeligt."},{"t":"Tre retningslinjer for et forbedret omkostningssystem","b":"Et mere præcist omkostningssystem følger tre centrale principper. For det første bør virksomheden identificere så mange direkte omkostninger som økonomisk forsvarligt. Hvis en omkostning kan spores pålideligt til et produkt uden urimelige registreringsomkostninger, bør den ikke placeres i en bred indirekte pulje. For det andet bør virksomheden anvende flere og mere homogene indirekte omkostningspuljer. Omkostninger, der drives af forskellige aktiviteter, bør ikke samles i den samme pulje. For det tredje skal hver omkostningspulje have en fordelingsnøgle med en rimelig årsagssammenhæng. En cost driver bør ikke blot være let at måle. Driveren skal forklare, hvorfor omkostningerne opstår."},{"t":"ABC-systemets grundidé","b":"ABC tager udgangspunkt i, at produkter og andre omkostningsobjekter forbruger aktiviteter, og at aktiviteterne forbruger ressourcer: Ressourcer → aktiviteter → omkostningsobjekter. Løn, udstyr, bygninger og IT er ressourcer. Ressourcerne anvendes til aktiviteter som design, indkøb, maskinomstilling, kontrol og distribution. Produkter, kunder og ordrer trækker derefter på aktiviteterne. ABC fordeler derfor ikke blot omkostninger direkte fra en stor pulje til produkterne. Systemet identificerer først aktiviteterne og deres omkostninger. Derefter fordeles aktivitetsomkostningerne efter produkternes faktiske eller forventede forbrug af aktiviteterne."},{"t":"Omkostningshierarkiet","b":"ABC organiserer ofte aktiviteter i et omkostningshierarki med fire niveauer. Hierarkiet gør det tydeligt, hvad der udløser omkostningen. Enhedsniveau. Enhedsniveauomkostninger opstår, hver gang en enkelt enhed produceres eller leveres. Det kan være materialer, maskinenergi, stykbaseret kontrol og maskinslid. Hvis produktionen fordobles, vil omkostningerne på enhedsniveau normalt også omtrent fordobles. Batchniveau. Batchomkostninger opstår, hver gang en gruppe eller serie behandles, uanset hvor mange enheder batchen indeholder. Eksempler er maskinomstilling, indkøbsordre, produktionsplanlægning og forsendelse. En omstilling kan koste det samme, uanset om den efterfølgende serie består af 10 eller 10.000 enheder. Små batches har derfor højere batchomkostninger pr. enhed end store batches. Produktunderstøttende niveau. Produktunderstøttende omkostninger opstår for at gøre det muligt at fremstille og sælge en bestemt produkttype. Det kan være produktdesign, dokumentation, tekniske specifikationer, produktrelateret markedsføring og procesudvikling. Omkostningerne afhænger af antallet og kompleksiteten af produkttyper, ikke nødvendigvis af antallet af producerede enheder. Facilitetsniveau. Facilitetsunderstøttende omkostninger opretholder virksomhedens samlede produktionskapacitet. Eksempler er fabriksledelse, bygningsforsikring, sikkerhed, rengøring og generel administration. Disse omkostninger er svære at tildele produkter gennem en overbevisende årsagssammenhæng. En vilkårlig fordeling kan derfor give et falsk billede af produkternes omkostninger. Facilitetsomkostninger kan i nogle analyser holdes særskilt eller fordeles med tydelig oplysning om fordelingens begrænsninger."},{"t":"De syv trin i ABC","b":"ABC fordeler omkostninger ud fra princippet om, at omkostningsobjekter forbruger aktiviteter, og aktiviteter forbruger ressourcer. Beregningen gennemføres i syv sammenhængende trin. 1. Identificér omkostningsobjekterne. Først fastlægges det, hvad virksomheden ønsker at beregne omkostningerne for. Omkostningsobjektet kan eksempelvis være et produkt, en produktlinje, en ordre, en kunde eller en serviceydelse. Valget af omkostningsobjekt afhænger af den beslutning, beregningen skal understøtte. Hvis virksomheden vil vurdere produktpriser, er produkterne relevante omkostningsobjekter. Hvis virksomheden vil vurdere kunderentabilitet, skal kunderne i stedet være omkostningsobjekter. 2. Identificér og fordel de direkte omkostninger. Omkostninger, der direkte og økonomisk forsvarligt kan spores til omkostningsobjektet, henføres direkte. Det kan eksempelvis være direkte materialer, direkte løn eller andre ressourcer, der entydigt anvendes til et bestemt produkt. Direkte omkostninger skal ikke fordeles gennem aktivitetsbaserede fordelingsnøgler. Jo flere omkostninger der kan spores pålideligt, desto mindre er risikoen for vilkårlige fordelinger. Omkostninger bør dog kun spores direkte, når værdien af den ekstra præcision overstiger registreringsomkostningen. 3. Identificér de væsentlige aktiviteter. Virksomheden identificerer de aktiviteter, som skaber de indirekte omkostninger. Det kan eksempelvis være produktdesign, indkøb, maskinomstilling, produktionssupport, kvalitetskontrol, ordrebehandling og forsendelse. Aktiviteterne bør beskrives præcist og være relevante for virksomhedens ressourceforbrug. Der skal ikke nødvendigvis oprettes en særskilt aktivitet for hver enkelt arbejdsopgave. Opgaver med samme omkostningsadfærd kan samles, så modellen bliver anvendelig uden at blive unødigt kompleks. 4. Saml omkostningerne i aktivitetspuljer. De indirekte ressourceomkostninger fordeles til de aktiviteter, der forbruger ressourcerne. Omkostninger til medarbejdere, IT, bygninger og udstyr kan eksempelvis fordeles mellem design, omstilling, kvalitetskontrol og distribution. Hver aktivitet får dermed sin egen omkostningspulje. En aktivitetspulje bør være så homogen som muligt, hvilket betyder, at omkostningerne i puljen påvirkes af den samme eller en nært beslægtet faktor. Hvis omstillingsomkostninger og maskindrift drives af forskellige forhold, bør omkostningerne ikke placeres i samme pulje. Maskindrift kan afhænge af maskintimer, mens omstilling primært afhænger af antallet eller varigheden af omstillinger. 5. Vælg en cost driver for hver aktivitet. For hver aktivitet vælges en cost driver, som bedst forklarer, hvorfor aktivitetens omkostninger opstår."},{"t":"De syv trin i ABC (fortsat)","b":"Cost driveren skal både have en rimelig årsagssammenhæng med omkostningerne og kunne måles uden urimeligt store registreringsomkostninger. Eksempler på sammenhænge er. Omstillingsomkostninger kan drives af antal omstillinger eller omstillingstimer. Indkøbsomkostninger kan drives af antal indkøbsordrer. Kvalitetskontrol kan drives af antal kontroller eller kontroltimer. Forsendelsesplanlægning kan drives af antal forsendelser. Maskinrelateret produktionssupport kan drives af maskintimer. Antallet af aktiviteter er ikke nødvendigvis den bedste driver. Hvis aktiviteternes varighed eller kompleksitet varierer betydeligt, kan timer eller et kompleksitetsindeks give en mere præcis fordeling. 6. Beregn aktivitetsraten. Aktivitetsraten viser, hvor meget én enhed af aktivitetens cost driver koster: Aktivitetsrate=aktivitetspuljens samlede omkostninger divideret med samlet mængde af cost driveren. Hvis maskinomstillinger samlet koster 300.000 euro, og virksomheden forventer 2.000 omstillingstimer, bliver aktivitetsraten: 300.000 divideret med 2.000=150 euro pr. omstillingstime. Hvis forsendelsesplanlægning koster 81.000 euro og omfatter 200 forsendelser, bliver satsen: 81.000 divideret med 200=405 euro pr. forsendelse. Aktivitetsraten gør det muligt at beregne, hvor stor en del af aktivitetens omkostninger det enkelte produkt eller den enkelte kunde skal bære. 7. Fordel aktivitetsomkostningerne og beregn den samlede omkostning. Aktivitetsomkostningerne fordeles til omkostningsobjekterne ud fra deres faktiske eller forventede forbrug af aktiviteter: Fordelt aktivitetsomkostning=aktivitetsrate×omkostningsobjektets aktivitetsforbrug. Hvis et produkt kræver 300 omstillingstimer, og aktivitetsraten er 150 euro pr. time, fordeles følgende omstillingsomkostning til produktet: 300×150=45.000 euro. Denne beregning gentages for alle relevante aktiviteter. Derefter lægges de direkte og indirekte omkostninger sammen: Samlet omkostning=direkte omkostninger+fordelte aktivitetsomkostninger. Hvis den samlede produktomkostning ønskes pr. enhed, divideres med produktionsmængden. Enhedsomkostning=samlet produktomkostning divideret med antal producerede enheder. Resultatet viser dermed omkostningsobjektets samlede træk på virksomhedens ressourcer. Komplekse lavvolumenprodukter vil ofte få højere omkostninger end i en traditionel beregning, fordi ABC synliggør deres store forbrug af design, omstillinger, kontroller og andre støtteaktiviteter. Kort model til overblik. De syv trin kan huskes som følgende sammenhæng: Omkostningsobjekter → direkte omkostninger → aktiviteter → aktivitetspuljer → cost drivers → aktivitetsrater → samlede omkostninger. Mere præcist bevæger selve ressourcefordelingen sig således: Ressourcer → aktiviteter → omkostningsobjekter."},{"t":"De syv trin i ABC (fortsat)","b":"Ressourceomkostningerne samles først i aktiviteter. Aktivitetsomkostningerne fordeles derefter til produkter, kunder eller andre omkostningsobjekter efter deres forbrug af de valgte cost drivers."},{"t":"Linse-eksemplet: direkte omkostninger, aktivitetspuljer og rater","b":"Omkostningsobjekter. S3 (simpel linse, 60.000 stk.) og CL5 (kompleks linse, 15.000 stk.). Direkte omkostninger (S3 / CL5 / i alt): Direkte materialer (enhedsniveau): 1.125.000 / 675.000 / 1.800.000. Direkte løn (enhedsniveau). 600.000 / 195.000 / 795.000. Rengøring og vedligeholdelse (batchniveau). 120.000 / 150.000 / 270.000. I alt. 1.845.000 / 1.020.000 / 2.865.000. Aktiviteter, omkostningspuljer og aktivitetsrater (euro): Design (produktunderstøttende): 450.000/100 kvm=4.500 pr. kvm. Støbemaskine-setups (batchniveau). 300.000/2.000 setup-timer=150 pr. setup-time. Produktionssupport (enhedsniveau). 637.500/12.750 maskintimer=50 pr. maskintime. Forsendelsesplanlægning (batchniveau). 81.000/200 forsendelser=405 pr. forsendelse. Distribution (enhedsniveau). 391.500/67.500 kubikmeter=5,80 pr. kubikmeter. Administration (facilitetsniveau). 255.000/39.750 direkte løntimer=6,4151 pr. direkte løntime. Fordeling. cost driver-rate × aktivitetsforbrug. S3 bruger fx 30 af de 100 kvm design, dvs. 30×4.500=135.000 euro (Exhibit 11.3, panel B). Traditionel fordeling gav indirekte omkostninger på 30,00 euro pr. S3 og 39,00 euro pr. CL5 mod 19,23 og 64,07 euro med ABC."},{"t":"Resultatet af ABC-beregningen","b":"Efter allokering af aktiviteterne bliver de indirekte omkostninger for S3 1.153.953 euro, svarende til 19,23 euro pr. enhed. De samlede omkostninger pr. S3-linse bliver: Direkte materialer: 18,75 euroDirekte løn: 10,00 euroDirekte rengøring og vedligeholdelse: 2,00 euroIndirekte omkostninger: 19,23 euroSamlet enhedsomkostning: 49,98 euro. For CL5 bliver de indirekte omkostninger 961.047 euro, svarende til 64,07 euro pr. enhed. De samlede omkostninger pr. CL5-linse bliver: Direkte materialer: 45,00 euroDirekte løn: 13,00 euroDirekte rengøring og vedligeholdelse: 10,00 euroIndirekte omkostninger: 64,07 euroSamlet enhedsomkostning: 132,07 euro."},{"t":"ABC sammenlignet med traditionel fordeling","b":"Det traditionelle omkostningssystem beregner en samlet enhedsomkostning på 58,75 euro for S3 og 97 euro for CL5. ABC beregner derimod 49,98 euro for S3 og 132,07 euro for CL5. S3 er altså overcostet i det traditionelle system: 58,75-49,98=8,77 euro pr. enhed. CL5 er undercostet: 132,07-97,00=35,07 euro pr. enhed. Det simple højvolumenprodukt er blevet belastet med for mange indirekte omkostninger, mens det komplekse lavvolumenprodukt er blevet belastet med for få. CL5 kræver relativt mange designs, omstillinger, forsendelser og støtteaktiviteter, som den traditionelle volumenbaserede fordeling ikke opfanger. Konsekvensen kan være, at virksomheden prissætter S3 for højt og mister konkurrencedygtighed. Samtidig kan CL5 prissættes for lavt og fremstå mere rentabelt, end produktet faktisk er. Virksomheden kan derfor komme til at sælge mere af det produkt, der reelt giver den dårligste indtjening."},{"t":"Valg af cost driver","b":"En god cost driver skal have en troværdig årsagssammenhæng med omkostningerne. Driveren skal samtidig kunne måles med en acceptabel registreringsindsats. Der findes forskellige niveauer af præcision. Transaktionsdriver. En transaktionsdriver måler, hvor mange gange en aktivitet udføres. Det kan være antal designs, indkøbsordrer, omstillinger eller forsendelser. Ved designomkostninger på 6 mio. kr. og 30.000 designs bliver satsen: 6.000.000 divideret med 30.000=200 kr. pr. design. Metoden er enkel, men forudsætter, at de enkelte transaktioner kræver omtrent samme ressourceforbrug. Hvis nogle designs tager én time og andre ti timer, bliver antallet af designs en upræcis driver. Varighedsdriver. En varighedsdriver måler den tid, aktiviteten tager. Hvis 6 mio. kr. i designomkostninger vedrører 48.000 designtimer, bliver satsen: 6.000.000 divideret med 48.000=125 kr. pr. designtime. Et let design på én time koster dermed 125 kr., et mellemkomplekst design på to timer koster 250 kr., og et svært design på fire timer koster 500 kr. Varighedsdriveren er mere præcis end transaktionsdriveren, når aktiviteternes tidsforbrug varierer. Den kræver til gengæld registrering af tidsforbruget på de enkelte omkostningsobjekter. Direkte måling. Ved direkte måling registreres det faktiske forbrug af hver ressourcekategori for hvert omkostningsobjekt. Designomkostninger kan eksempelvis opdeles i løn, software, IT og brug af teknisk udstyr. Metoden kan være meget præcis, men er samtidig den mest data- og registreringskrævende. Det er ikke nødvendigvis økonomisk hensigtsmæssigt at opnå maksimal målepræcision, hvis informationen ikke ændrer virksomhedens beslutninger. Kompleksitetsindeks. Et kompleksitetsindeks forsøger at kombinere en relativt enkel registrering med forskelle i aktiviteternes kompleksitet. Design kan eksempelvis klassificeres som lette, mellemkomplekse og svære med vægtene 1, 2 og 4. Hvis virksomheden forventer 20.000 lette, 6.000 mellemkomplekse og 4.000 svære designs, bliver det samlede antal standardiserede ækvivalenter: 20.000×1+6.000×2+4.000×4=48.000 ækvivalenter. Ved samlede omkostninger på 6 mio. kr. bliver satsen. 6.000.000 divideret med 48.000=125 kr. pr. let ækvivalent. Standardomkostningerne bliver dermed 125 kr. for et let design, 250 kr. for et mellemkomplekst og 500 kr. for et svært. Metoden er mindre præcis end individuel tidsregistrering, men kræver færre data."},{"t":"Præcision og registreringsomkostninger","b":"Valget af driver indebærer en afvejning mellem præcision og omkostningen ved at indsamle data. En transaktionsdriver er billig og enkel, mens direkte måling kan være dyr og administrativt tung. Det mest detaljerede system er ikke automatisk det bedste. Et godt omkostningssystem skal være tilstrækkeligt præcist til de beslutninger, der skal træffes. En ekstra aktivitetsgruppe eller en mere avanceret driver er kun værdifuld, hvis den forbedrer beslutningsgrundlaget mere, end den øger systemets omkostninger og kompleksitet."},{"t":"Simpelt eksempel ved traditionel FC allokering:","b":"De 8,75m skal divideres ud med de direkte løntimer.5000·2+20000·2=500008750000 divideret med 50000=175pr. løntime ·2=350 pr. enhed for begge enheder da de bruger lige mange løntimer. Havde det været forskellige havde det bare været eks. 175 * 3."},{"t":"Activity-Based Management","b":"Activity-Based Management, ABM, anvender informationen fra ABC til aktivt at forbedre virksomhedens beslutninger og processer. ABC beregner, hvad aktiviteter og omkostningsobjekter koster. ABM spørger, hvorfor omkostningerne opstår, og hvad virksomheden kan gøre ved dem. ABC-information kan anvendes til at ændre priser, produktdesign, produktprogram, batchstørrelser og kundebetingelser. Virksomheden kan også forbedre interne processer, automatisere aktiviteter, reducere antallet af omstillinger eller eliminere aktiviteter, der ikke skaber værdi for kunden. En høj beregnet produktomkostning betyder ikke automatisk, at produktet bør nedlægges. Nogle omkostninger forsvinder ikke, selv om produktet fjernes. Beslutningen bør derfor fokusere på undgåelige fremtidige omkostninger, kapacitetsvirkninger, kundesammenhænge og strategiske konsekvenser."},{"t":"Værdiskabende og ikke-værdiskabende aktiviteter","b":"ABM kan opdele aktiviteter efter, om de skaber værdi set fra kundens perspektiv. En værdiskabende aktivitet ændrer produktet eller serviceydelsen på en måde, kunden efterspørger og er villig til at betale for. Ikke-værdiskabende aktiviteter skaber ikke direkte kundeværdi. Eksempler kan være ventetid, unødvendig transport, fejlretning, dobbeltregistrering og kontrol, der kun er nødvendig på grund af ustabile processer. Ikke-værdiskabende betyder ikke nødvendigvis, at aktiviteten straks kan fjernes. Myndighedskrav, sikkerhed og nødvendig kontrol kan være forretningsmæssigt nødvendige uden at skabe direkte kundeværdi. Formålet er at undersøge, om aktiviteten kan reduceres, forenkles eller udføres mere effektivt."},{"t":"ABC og afdelingsbaserede systemer","b":"Et afdelingsbaseret system bruger typisk én eller få omkostningspuljer pr. afdeling. En produktionsafdeling kan eksempelvis fordele samtlige indirekte omkostninger efter maskintimer. ABC går længere ved at opdele afdelingens omkostninger i aktiviteter. Omkostninger til omstilling fordeles efter omstillingstimer, kvalitetskontrol efter antal kontroller og maskindrift efter maskintimer. Opdelingen bør dog kun foretages, når aktivitetspuljerne er tilstrækkeligt homogene. En homogen pulje indeholder omkostninger, der påvirkes nogenlunde ens af den samme cost driver. Hvis to aktiviteter drives af forskellige forhold, bør de normalt ikke placeres i samme pulje."},{"t":"Kapacitet og uudnyttede ressourcer","b":"Et traditionelt ABC-system kan komme til at fordele alle ressourceomkostninger til produkter, selv om en del af kapaciteten ikke anvendes. Det kan overbelaste produkterne med omkostninger og skjule, at virksomheden har ledig kapacitet. Det er vigtigt at skelne mellem ressourceforbrug og ressourceforsyning. Medarbejderløn og maskinkapacitet kan være anskaffet på forhånd og kan derfor ikke straks reduceres, når aktivitetsniveauet falder. Hvis omkostningen ved uudnyttet kapacitet fordeles til de producerede enheder, stiger enhedsomkostningen, når volumen falder. Det kan føre til højere priser, lavere efterspørgsel og endnu lavere kapacitetsudnyttelse. Uudnyttet kapacitet bør derfor synliggøres særskilt, så ledelsen kan tage stilling til, om kapaciteten skal reduceres, anvendes på andre aktiviteter eller bevares af strategiske årsager."},{"t":"Implementering af ABC","b":"ABC kræver data om aktiviteter, tidsforbrug, antal transaktioner og omkostninger. Systemet kan derfor være ressourcekrævende at udvikle og vedligeholde. Hvis modellen bliver for detaljeret, kan registreringsarbejdet blive større end informationsværdien. Implementeringen kræver et klart formål. Medarbejderne skal forstå, hvilke problemer systemet skal løse, og hvordan oplysningerne skal anvendes. Topledelsens støtte er vigtig, fordi ABC ofte udfordrer eksisterende opfattelser af produkters, kunders og afdelingers rentabilitet. ABC kan også møde modstand, fordi systemet gør ressourceforbrug og ineffektivitet mere synligt. Produktansvarlige kan være modvillige, hvis deres produkter pludselig fremstår mindre rentable. Medarbejdere kan samtidig ændre deres registreringer, hvis data bruges mekanisk til individuel kontrol. Fagpersoner fra produktion, økonomi, salg, logistik og IT bør derfor involveres. Eksterne konsulenter kan bidrage med metodekendskab, men virksomheden skal selv sikre, at aktiviteter og sammenhænge afspejler den faktiske drift."},{"t":"Fordele og begrænsninger","b":"ABC giver større indsigt i omkostningernes årsager og kan forbedre prissætning, produktvalg, kundestyring og procesforbedring. Systemet er især nyttigt, når kompleksitet og indirekte omkostninger er høje. Begrænsningen er, at enhver model er en forenkling. Nogle omkostninger kan ikke fordeles gennem en klar årsagssammenhæng, og driverne bygger ofte på gennemsnit eller skøn. Et præcist historisk omkostningstal er heller ikke automatisk relevant for en fremtidig beslutning. Beslutninger bør normalt baseres på de omkostninger og indtægter, der ændrer sig som følge af beslutningen. ABC skal derfor betragtes som et beslutningsgrundlag, ikke som en automatisk beslutningsregel."},{"t":"Advarselstegn på et problematisk omkostningssystem","b":"Et traditionelt omkostningssystem kan være utilstrækkeligt, hvis virksomheden konsekvent vinder komplekse specialordrer, mens standardprodukter fremstår urentable. Det samme gælder, hvis kunderne accepterer prisstigninger på produkter, der ifølge kalkulationen allerede har meget lave avancer. Andre advarselstegn er, at konkurrenternes priser på standardprodukter virker umuligt lave, eller at produkter, som er vanskelige at fremstille, ser ekstraordinært lønsomme ud. Det kan tyde på, at simple højvolumenprodukter bærer en uforholdsmæssigt stor del af støtteomkostningerne, mens komplekse lavvolumenprodukter slipper for billigt. Forvridningen er typisk størst, når virksomheden både har høje indirekte omkostninger og stor produktdiversitet. Her vil én fælles volumenbaseret fordelingsnøgle sjældent kunne beskrive produkternes forskellige træk på virksomhedens aktiviteter."},{"t":"Samlet forståelse","b":"Traditionel omkostningsfordeling bruger få og ofte volumenbaserede fordelingsnøgler. Metoden er enkel, men kan give betydelig overcosting og undercosting i komplekse virksomheder. ABC opdeler de indirekte omkostninger i aktiviteter og fordeler dem ved hjælp af cost drivers, der afspejler årsagen til ressourceforbruget. Systemet synliggør især de omkostninger, der skabes af kompleksitet, små batches, kundetilpasning og støtteaktiviteter. ABM omsætter derefter informationen til handling gennem bedre priser, produktvalg, procesdesign, kapacitetsudnyttelse og kunderelationer. Den centrale værdi ligger derfor ikke alene i en mere detaljeret produktomkostning, men i en bedre forståelse af, hvilke aktiviteter der anvender virksomhedens ressourcer, og hvorfor de gør det. Noterne er udbygget med forklaringer, sammenhænge og regneeksempler fra materialet, men punktopstilling er begrænset, og gentagelser fra slides er samlet i mere sammenhængende afsnit."}]},{"n":10,"name":"L10 Budgettering","items":[{"t":"Introduktion til budgettering","b":"Forelæsning onsdag 21. oktober 2026 kl. 12–14 (Thomas Toldbod). Litteratur. Horngren kapitel 14 – Motivation, budgets and responsibility accounting. Lektionen introducerer, hvorfor virksomheder budgetterer, hvad et masterbudget består af, og hvordan det operationelle budget (driftsbudgettet) udarbejdes trin for trin med Wessex Engineering som gennemgående eksempel."},{"t":"Læringsmål","b":"Beskrive et masterbudget og forklare fordelene ved det. Beskrive hovedelementerne i et masterbudget. Forberede (udarbejde) det operationelle budget. Beskrive computerbaserede planlægningsmodeller (følsomhedsanalyse). Næste undervisningsgang. Kaizen costing og dets betydning for omkostningsledelse, aktivitetsbaseret budgettering, ansvarscentre og sammenhængen mellem ansvarscentre og regnskab/budget. Appendiks. likviditetsbudgettet."},{"t":"Hvorfor budgettere?","b":"Slides henviser til et studie af Niels Sandalgaard (2008) af danske virksomheder: Kun 6 % af de danske virksomheder har afskaffet budgettet. 83 % overvejer slet ikke at afskaffe budgettet. Pointen er, at der fortsat er et stort behov for budgettering, og at budgettet har en række fordele, som gennemgås i lektionen."},{"t":"Budget og budgettering","b":"Budget. et omfattende økonomisk overblik over virksomhedens planlagte aktiviteter. Budgettering. ”Ved budgettering forstås et periodisk valg af handlingsprogram ledsaget af en periodisk økonomisk konsekvensprognose” (Andersen & Rohde, Virksomhedens Økonomistyring). Budgettering er altså selve processen, mens budgettet er resultatet – den økonomiske konsekvensprognose af de valgte handlinger. Processen består af. alternative handlingsmuligheder → beregne alternativer → valg af handlinger → økonomisk konsekvensprognose (= budgettet) → kontrol. Slide 6: Budgettering er hele processen fra handlingsmuligheder til kontrol – budgettet er den økonomiske konsekvensprognose. Budgettering tvinger virksomheden til at. tænke frem i tid. kommunikere og koordinere. have et benchmark at måle sig op imod. Budgettet i styringsprocessen. Budgettet er bindeleddet mellem de overordnede planer og den daglige drift: målsætning → strategi → politikker → planer → budgettet → handling → registrering → rapportering. Budgettet oversætter planerne til tal, før der handles, og danner grundlag for registrering og rapportering bagefter. Eksamensrelevans. Du skal kunne forklare forskellen mellem. budget (resultatet – den økonomiske konsekvensprognose). budgettering (processen – det periodiske valg af handlingsprogram)."},{"t":"Budgetteringscyklussen","b":"Budgetteringscyklus. den tilbagevendende proces, hvor virksomheden planlægger, gennemfører og evaluerer sine aktiviteter i forhold til budgettet. Planlægning. Identificér organisationens målsætning og kortsigtede mål. Udvikl langsigtet strategi og kortsigtede planer. Udvikl masterbudgettet. Styring. Implementér/realisér planerne. Mål og evaluér præstationen i forhold til budgettet. Reevaluér målsætninger, mål, strategi og planer. Cyklussen er dermed både et planlægningsværktøj (de første tre trin) og et styringsværktøj (de sidste tre trin)."},{"t":"Budgettet som periodestyringsredskab","b":"Budgettet er et vigtigt periodestyringsredskab, fordi det understøtter: kapacitetsstyring og udjævning af sæsonudsving. adskillelse af beslutning og udførelse (fx en marketingkampagne). en struktureret beslutningsproces (hvad skal udføres, og hvornår). koordinering mellem funktioner. både en ex ante- og en ex post-funktion (styring før og evaluering efter). reevaluering af eksisterende og nye aktiviteter. performanceevaluering."},{"t":"Fordele ved budgetter","b":"Planlægning. budgetter nødvendiggør planlægning samt implementering af planerne. Præstationskriterier. budgetter skaber præstationskriterier, som resultater kan måles op imod. Koordination og kommunikation. budgetter fremmer koordination og kommunikation i organisationen. Budgetmålets sværhedsgrad. Grafen på sliden viser præstation (performance) som funktion af, hvor svært budgettet er – fra et let til et meget svært budget. Det budgetterede præstationsniveau stiger med sværhedsgraden, mens den faktiske præstation først stiger og derefter falder, når budgettet bliver for svært. Grafen markerer et ”expectations budget” og et ”aspirations budget”, og den faktiske præstation topper ved et budget af mellemhøj sværhedsgrad. Pointen er, at budgetmål skal være udfordrende, men ikke urealistiske, hvis de skal motivere. Slide 10: Fordele ved budgetter og sammenhængen mellem budgettets sværhedsgrad og præstation. Eksamensrelevans. Du skal kunne nævne de tre fordele ved budgetter (planlægning, præstationskriterier, koordination og kommunikation) og forklare, hvorfor et budget af mellemhøj sværhedsgrad giver den højeste faktiske præstation."},{"t":"Udfordringer ved budgettering","b":"Budgettering har også en række ulemper og udfordringer: ressourcekrævende. rigidt – ikke fleksibelt. datamanipulation. stridigheder imellem afdelinger. pres og stress på medarbejdere. gaming. kortsigtet værktøj. dilemmaer og suboptimering. Slides illustrerer rigiditetsproblemet med et citat af Jack Welch (CEO, General Electric): ”If the speed of change outside an organisation is faster than the speed of change within an organisation, eventually that organisation will wither and die…”. Et fastlåst årsbudget kan altså gøre det svært at reagere på ændringer i omgivelserne."},{"t":"Budgettyper og tidshorisonter","b":"Forskellige typer budgetter og planer har forskellige tidshorisonter: Strategisk plan: den længste planlægningshorisont. Sætter den overordnede retning og de overordnede mål for virksomheden og fører til den langsigtede plan. Langsigtet plan (long-range planning). indeholder de forventede økonomiske resultater for de næste 5–10 år og er koordineret med investeringsbudgettet. Investeringsbudget. detaljeret planlægning af udgifter til fysiske faciliteter, udstyr/maskiner, nye produkter og andre langsigtede investeringer. Masterbudget. sammenholder de kortsigtede og de langsigtede planer."},{"t":"Rullende budgetter","b":"Rullende budget. et budget, hvor der tilføjes en ekstra tidsperiode, når en tidsperiode er overstået. Planlægningshorisonten er altid den samme (fx hele tiden 12 måneder ”foran”). Budgettering bliver en kontinuerlig proces frem for en årlig proces. Kræver flere ressourcer. Eksamensrelevans. Rullende budgetter er et svar på kritikken af, at det traditionelle årsbudget er rigidt og kortsigtet. Du skal kunne forklare fordelen (altid samme horisont, løbende opdatering) og ulempen (mere ressourcekrævende)."},{"t":"Budgettet som performance management-system","b":"Tre organisatoriske problemer. Budgettet skal hjælpe organisationen med at håndtere tre organisatoriske problemer: Directional problem: medarbejderne skal vide, hvilken retning organisationen vil i. Topledelsen fastlægger langsigtede mål/strategi og finansielle mål, mellemlederne ”oversætter” strategien og skal opnå målene, og medarbejderne udfører arbejdet. Motivation problem. medarbejderne skal også ville arbejde mod målene. Slides citerer Frederick Taylor. ”Hardly a competent worker can be found who does not devote a considerable amount of time to studying just how slowly he can work and still convince his employer that he is going at a good pace.”. Information problem. ledelsen har brug for information om, hvordan det går, for at kunne styre. Styringscyklussen. Som performance management-system indgår budgettet i en cyklus: fastsættelse af mål (strategic management) → måling og sammenligning af resultater med mål (performance monitoring) → tilbagemelding af information om afvigelser (feedback) → korrektion af processen (learning). Slide 16: Budgettet som performance management-system – fra mål til læring. Ex ante og ex post information. Budgetsystemet leverer både ex ante-information (forskrifter – hvad der skal ske) og ex post-information (rapportering – hvad der skete). Feedback i økonomistyring kan desuden være formel eller uformel og kvantitativ eller kvalitativ (Pitkänen & Lukka, 2011). Budgettet hører til den formelle, kvantitative feedback: Kvantitativ. Kvalitativ. Formel. Salgs- og omkostningsbudget/-redskab; trivselsmålinger. MUS-samtaler. Uformel. En medarbejder bruger eget materiale til at holde styr på egne præstationer; leder giver medarbejder karakter for arbejde (uopfordret). Leders uopfordrede feedback på projektfremlæggelse; julekort fra chefen."},{"t":"Faste og variable omkostninger i budgettet","b":"Budgettet skal støtte planlægningen og koordineringen imellem enheder og fungere som styringsværktøj. I forhold til omkostninger og tidshorisont angiver budgettet både variable og faste omkostninger: De faste omkostninger er ofte blot en (korrigeret) gentagelse af historiske data. De variable omkostninger kan man ændre og justere på, da der er tale om en kortere tidshorisont. ABC (jf. Lektion 9) kan understøtte budgetter gennem nærmere analyse og definition af, hvilke omkostninger der kan og bør ændres, og som spiller en væsentlig rolle i forhold til fx ordreindtag."},{"t":"Masterbudgettet","b":"Masterbudget. en omfattende deklaration af ledelsens driftsplaner og finansielle planer for en given fremtidig periode (som regel ét år). Masterbudgettet er summeret i et sæt budgetterede finansielle regnskabsopgørelser. Det beskriver effekterne af både driftsmæssige beslutninger og finansieringsbeslutninger. Driftsmæssige beslutninger og finansieringsbeslutninger. Driftsmæssige beslutninger. handler primært om brugen af knappe ressourcer. Finansieringsbeslutninger. handler om, hvordan den kapital, der skal bruges til at opnå disse ressourcer, skaffes."},{"t":"Masterbudgettets elementer","b":"Masterbudgettet består af to overordnede typer af budget: Operationelle budgetter (driftsbudget): summerer aktivitetsniveauet inden for fx salg, indkøb og produktion. Driftsbudgettet svarer til den budgetterede resultatopgørelse. Finansielle budgetter. viser de forventede finansielle konsekvenser af aktiviteterne fra driftsbudgetterne på balanceposterne. Her er likviditetsbudgettet af afgørende betydning. Driftsbudget (budgetteret resultatopgørelse). Finansielt budget. Salgsbudgettet (revenue budget). Kapitalbudget (anlægskartotek og investeringer). Produktionsbudgettet (produktionsplanen) i enheder. Kontantbeholdning. Budget for direkte materialeindkøb. Balancebudget. Budget for direkte arbejde. Likviditetsbudget. CoGS-budget (vareforbrug). Budget for andre omkostninger (nonmanufacturing costs). Materielle og økonomiske handlinger. Sammenhængen mellem drifts- og finansielle budgetter kan forklares med virksomhedens materielle og økonomiske handlinger. De materielle handlinger (anskaffelse → forbrug → produktion → afsætning) har hver en økonomisk modpart (udgifter → omkostning → produktionens værdi → indtægter). Udgifter fører til udbetalinger, og indtægter fører til indbetalinger. Driftsbudgettet bygger på omkostninger og indtægter, mens likviditetsbudgettet bygger på ind- og udbetalinger (jf. udgift, omkostning og udbetaling i Lektion 2). Slide 21: Virksomhedens materielle og økonomiske handlinger. Eksamensrelevans. Du skal kunne. definere masterbudgettet. skelne mellem operationelle budgetter (driftsbudget) og finansielle budgetter. nævne delbudgetterne i hver del."},{"t":"Det operationelle budget","b":"Tidsperspektivet er typisk 12 måneder og læner sig normalt op ad kalenderåret (regnskabsåret), men der benyttes i stigende grad rullende budgetter – dvs. man forsøger hele tiden at have et 12-måneders budget ”foran”. Generelt læner det operationelle budget sig op ad resultatopgørelsen. Det afspejler de aktiviteter, der indgår i virksomheden i en given periode, og anvender dermed perioderegnskabet som grundlag. Trin i driftsbudgettet. Udarbejd omsætnings-/salgsbudgettet. Udarbejd produktionsbudgettet (antal enheder af produkter). Udarbejd materialeforbrugsbudgettet og indkøbsbudgettet. Udarbejd produktionens lønbudget. Udarbejd budgettet for IPO (indirekte produktionsomkostninger). Udarbejd budgettet for varelagre ultimo. Udarbejd produktionsomkostningsbudgettet (omkostninger ved solgte varer – COGS/vareforbrug). Udarbejd budgettet for periodeomkostninger (andre driftsomkostninger). Til sidst samles det hele i den budgetterede resultatopgørelse (”Trin 9” på slides)."},{"t":"Eksempel: Wessex Engineering","b":"Eksemplet fra bogen bruges til at gennemgå trinnene. Wessex Engineering producerer to produkter, Regular og Heavy-duty, som fremstilles af to typer råmateriale (legeringer/blandinger), 111 og 112. Trin 1: Salgsbudget (budgetteret omsætning). Trin 2: Produktionsbudget i enheder. Produktionen er ikke det samme som salget, fordi der skal tages højde for lagrene: Produktion=budgetteret salg+ønsket lager ultimo-lager primo. Bemærk forskellen. Regular sælges i 5.000 enheder, men der skal produceres 6.000, fordi lageret skal øges fra 100 til 1.100 enheder. For Heavy-duty er lageret uændret (50 primo og ultimo), så produktion = salg = 1.000. Slide 25: Trin 1
