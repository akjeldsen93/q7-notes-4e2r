vitetsomkostninger efter:", "options": ["Kun direkte løntimer", "Cost drivers med årsagssammenhæng", "Omsætning", "Lige fordeling"], "answer": 1, "explanation": "Fx antal omstillinger, designs, kontroller.", "id": "ØS-mc-069", "course": "ØS", "lecture": 9, "lectureName": "L9 ABC og ABM", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L9", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Budgettering er ifølge Andersen & Rohde:", "options": ["Den økonomiske konsekvensprognose", "Et periodisk valg af handlingsprogram ledsaget af en periodisk økonomisk konsekvensprognose", "Et regnskab", "En kontrolrapport"], "answer": 1, "explanation": "Budgettet er resultatet; budgettering er processen.", "id": "ØS-mc-070", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L10", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budget og budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Et R&D-center, hvor output ikke kan måles finansielt, er et:", "options": ["Standard omkostningscenter", "Discretionary omkostningscenter", "Profitcenter", "Investeringscenter"], "answer": 1, "explanation": "Ansvar for inputniveauet, ikke output.", "id": "ØS-mc-071", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L11", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Discretionary omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Hvilken post ses i resultatet men IKKE i likviditetsbudgettet?", "options": ["Afdrag på gæld", "Afskrivninger", "Kundeindbetalinger", "Lønudbetalinger"], "answer": 1, "explanation": "Afskrivninger er ikke-likvide.", "id": "ØS-mc-072", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L11", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Salgsvolumenvarians =", "options": ["Faktisk − fleksibelt budget", "Fleksibelt budget − statisk budget", "Faktisk − statisk budget", "(AP − SP) × AQ"], "answer": 1, "explanation": "Kaldes også planning varians.", "id": "ØS-mc-073", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L12", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Stof: AP 31, SP 30, AQ 22.200 m², SQ 20.000 m². Forbrugsvarians?", "options": ["22.200 U", "66.000 U", "66.600 U", "2.200 F"], "answer": 1, "explanation": "(22.200 − 20.000) × 30 = 66.000 U.", "id": "ØS-mc-074", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L12", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Variabel IPO: 4.500 faktiske MT, 4.000 budgetterede MT for faktisk output, sats €30, faktisk €29/MT. Efficiensvarians?", "options": ["€4.500 F", "€15.000 U", "€10.500 U", "€13.500 F"], "answer": 1, "explanation": "(4.500 − 4.000) × 30 = €15.000 U.", "id": "ØS-mc-075", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L13", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Fast IPO budget €276.000; sats €23 pr. jakke; faktisk output 10.000. Produktionsvolumenvarians?", "options": ["€46.000 U", "€9.000 U", "€23.000 F", "0"], "answer": 0, "explanation": "276.000 − 10.000 × 23 = €46.000 U.", "id": "ØS-mc-076", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L13", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Produktionsvolumenvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Indirekte produktionsomk. 120.000 kr., 4.000 maskintimer. Job A: DM 20.000, DL 8.000, 150 MT, salgspris 40.000. Beregn overheadsats, jobomkostning og bruttomargin.", "model": "Sats = 120.000/4.000 = 30 kr./MT. OH = 150 × 30 = 4.500. Jobomk. = 20.000 + 8.000 + 4.500 = 32.500. Bruttoavance 7.500; bruttomargin = 7.500/40.000 = 18,75 %.", "id": "ØS-sa-077", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L3", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Den seks-trins model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Ingen primo-WIP. 24.000 påbegyndt, 20.000 færdige, 4.000 i WIP ultimo (100 % mat., 25 % fremstilling). Materialer 72.000, fremstilling 42.000. Fordel omkostningerne.", "model": "Ækv.: mat. 24.000, fremst. 20.000 + 1.000 = 21.000. Pr. ækv.: mat. 3,00; fremst. 2,00. Færdige: 20.000 × 5 = 100.000. WIP: 4.000 × 3 + 1.000 × 2 = 14.000. I alt 114.000 ✓.", "id": "ØS-sa-078", "course": "ØS", "lecture": 4, "lectureName": "L4 Process-costing", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L4", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › De fem trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil, jf. 2024 ord.] HR 75 mio. (fordeles på medarbejdere), Vedl. 26 mio. (m²). ECON: 300 medarb., 1.300 m²; Jura: 400 medarb., 1.400 m². Vedl. har 25 medarb., HR 210 m². Fordel med (A) direkte metode og (B) trinvis metode med HR først.", "model": "A: HR → ECON 75·300/700 = 32,14; Jura 42,86. Vedl. → ECON 26·1.300/2.700 = 12,52; Jura 13,48. B: HR fordeles på Vedl./ECON/Jura (25/300/400 af 725): 2,59 / 31,03 / 41,38. Vedl. i alt 28,59 → ECON 13,76; Jura 14,82. ECON i alt allokeret 44,79; Jura 56,20 (≈101 mio.).", "id": "ØS-sa-079", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L5", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Allokering fra serviceafdelinger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Fællesomk. 60.000 kr. Ved split-off: A 4.000 enh. à 20 kr., B 2.000 enh. à 10 kr. Fordel efter (a) fysisk mængde og (b) salgsværdi ved split-off.", "model": "(a) A 4.000/6.000 × 60.000 = 40.000; B 20.000. (b) Salgsværdi A 80.000, B 20.000 (i alt 100.000): A 48.000; B 12.000.", "id": "ØS-sa-080", "course": "ØS", "lecture": 6, "lectureName": "L6 Fællesproduktion", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L6", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fordelingsmetoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Faste produktionsomk. 60.000, normalproduktion 10.000 enh., VC 30 kr./enh., pris 50. Produktion 10.000, salg 9.000, ingen primolager. Beregn forskel i resultat og lagerværdier.", "model": "Fast sats = 6 kr. Lager 1.000 enh. Regnskabsmetoden: lager 1.000 × 36 = 36.000; bidragsmetoden 1.000 × 30 = 30.000. Regnskabsmetoden viser 6.000 kr. højere resultat (1.000 × 6). Ingen volumenafvigelse (prod. = normal).", "id": "ØS-sa-081", "course": "ØS", "lecture": 7, "lectureName": "L7 Bidrags- og regnskabsmetoden", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L7", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Bidragsmetoden og regnskabsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Pris 70, VC 42, FC 84.000. Beregn (a) BE i enheder og kr., (b) salg for driftsresultat 14.000, (c) sikkerhedsmargin og operating leverage ved salg af 4.000 enheder.", "model": "DB 28, DG 40 %. (a) 3.000 enh.; 210.000 kr. (b) (84.000 + 14.000)/28 = 3.500 enh. (c) Sikkerhedsmargin 1.000 enh. = 25 %; DB 112.000, resultat 28.000 ⇒ operating leverage 4,0.", "id": "ØS-sa-082", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L8", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dresses by Mary", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Omstillingspulje 50.000 kr., 200 omstillinger. Produkt X: 30 serier à 1 omstilling, 1.500 enheder. Beregn cost driver rate og omstillingsomk. pr. enhed X.", "model": "Rate = 50.000/200 = 250 kr./omstilling. X: 30 × 250 = 7.500 kr. ⇒ 5 kr./enhed.", "id": "ØS-sa-083", "course": "ØS", "lecture": 9, "lectureName": "L9 ABC og ABM", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L9", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Kunder betaler 50 % i salgsmåneden, 27 % måneden efter, 20 % 2. måned efter (3 % tab). Salg: jan 100.000, feb 120.000, mar 80.000. Indbetalinger i marts?", "model": "0,50·80.000 + 0,27·120.000 + 0,20·100.000 = 40.000 + 32.400 + 20.000 = 92.400 kr.", "id": "ØS-sa-084", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L11", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget (Maui Diving)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] ABB: 200 kunder, 1 besøg/år hver, en sælger klarer 100 besøg, sælgerløn 200.000. Beregn ressourcebehov og omkostning pr. besøg.", "model": "200 besøg / 100 = 2 sælgere; pulje 400.000; pr. besøg 400.000/200 = 2.000 kr.", "id": "ØS-sa-085", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L11", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Activity-Based Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Budget: pris 180, VC 99, FC 710.000, 12.000 enh. Faktisk: 10.000 enh., resultat 25.000. Beregn statisk budgetresultat, fleksibelt budget og salgsvolumen-/fleksibelt budget-varians.", "model": "Statisk: 12.000 × 81 − 710.000 = 262.000. Fleksibelt: 10.000 × 81 − 710.000 = 100.000. Salgsvolumenvarians = 100.000 − 262.000 = 162.000 U. Fleksibelt budget-varians = 25.000 − 100.000 = 75.000 U. Samlet 237.000 U.", "id": "ØS-sa-086", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L12", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 1 og 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Materiale: SP 10 kr./kg, standard 0,48 kg/enh.; faktisk output 10.000 enh.; faktisk forbrug 5.000 kg à 12 kr. Beregn pris- og forbrugsvarians.", "model": "SQ = 4.800 kg. Pris = (12 − 10) × 5.000 = 10.000 U. Forbrug = (5.000 − 4.800) × 10 = 2.000 U. Samlet 12.000 U.", "id": "ØS-sa-087", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L12", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Eksamensstil] Fast IPO budget 276.000 (4.800 MT, 0,4 MT/jakke, 12.000 jakker); faktisk 285.000; faktisk output 10.000. Beregn spending- og produktionsvolumenvarians.", "model": "Sats 57,50/MT ⇒ 23 kr./jakke. Spending = 285.000 − 276.000 = 9.000 U. Allokeret = 10.000 × 23 = 230.000; volumenvarians = 276.000 − 230.000 = 46.000 U.", "id": "ØS-sa-088", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L13", "calc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Begrebsspørgsmål] Forklar forskelle og ligheder mellem management accounting og financial accounting.", "model": "Financial: eksternt, regelbaseret, historisk, hele virksomheden. Management: internt, tilpasset ledelsens behov, fremadrettet, finansielle og ikke-finansielle data, ingen lovkrav. Fælles: bygger på omkostningsregnskabet.", "id": "ØS-sa-089", "course": "ØS", "lecture": 1, "lectureName": "L1 Hvad er økonomistyring?", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L1", "open"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Finansielt regnskab vs. økonomistyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Begrebsspørgsmål] Hvad er et masterbudget, og hvilke delbudgetter består det af?", "model": "Sammenholder kortsigtede og langsigtede planer. Operationelt budget (salg, produktion, materialer, løn, IPO, slutlager, vareforbrug, øvrige omk., budgetteret resultatopgørelse) + finansielt budget (investerings-, likviditets-, balancebudget).", "id": "ØS-sa-090", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L10", "open"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Masterbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Begrebsspørgsmål] Hvad er forskellen mellem statisk budgetvarians og fleksibel budgetvarians?", "model": "Statisk: faktisk − statisk budget (niveau 1), blander volumen- og effektivitetseffekter. Fleksibel: faktisk − fleksibelt budget (budgettet genberegnet ved faktisk output), isolerer pris/effektivitet. Differencen er salgsvolumenvariansen.", "id": "ØS-sa-091", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L12", "open"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "[Begrebsspørgsmål] Forklar begrebet driftsmæssig gearing (operating leverage).", "model": "Forholdet mellem DB og driftsresultat. Høje faste omk. ⇒ høj gearing ⇒ resultatet ændres procentvis mere end salget (både op og ned) – højere risiko.", "id": "ØS-sa-092", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L8", "open"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Operating leverage", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}]}</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('data').textContent),M=DATA.meta,ITEMS=DATA.items,BYID={};ITEMS.forEach(i=>BYID[i.id]=i);
const KEY='eksamenstraener_v1';
let S=load();function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return s}catch(e){}return{cards:{},att:{},log:[],theme:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5;
// --- filter
function fill(){const fc=$('#fCourse');fc.innerHTML='<option value="">Alle fag</option>'+Object.keys(M.courses).map(c=>`<option value="${c}">${c} – ${esc(M.courses[c].name)}</option>`).join('');fc.value=S.fc||'';lec()}
function lec(){const c=$('#fCourse').value,fl=$('#fLec');let o='<option value="">Alle lektioner</option>';(c?[c]:Object.keys(M.lectures)).forEach(cc=>Object.entries(M.lectures[cc]).forEach(([l,n])=>o+=`<option value="${cc}|${l}">${c?'':cc+' '}${esc(n)}</option>`));fl.innerHTML=o;fl.value=S.fl||'';if(fl.value!==(S.fl||''))fl.value=''}
function pool(){const c=$('#fCourse').value,l=$('#fLec').value;return ITEMS.filter(i=>(!c||i.course===c)&&(!l||l===i.course+'|'+i.lecture))}
$('#fCourse').onchange=()=>{S.fc=$('#fCourse').value;S.fl='';lec();save();go(cur==='home'?'fc':cur)};$('#fLec').onchange=()=>{S.fl=$('#fLec').value;save();go(cur==='home'?'fc':cur)};
// --- theme
function theme(){const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}
$('#theme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();theme()};
// --- recording
function record(id,ok){const a=S.att[id]||(S.att[id]={c:0,n:0});a.n++;if(ok)a.c++;S.log.push([id,ok?1:0,Date.now()]);if(S.log.length>5000)S.log=S.log.slice(-5000);save()}
const KIND={begreb:'Begreb',model:'Model',metode:'Metode',def:'Definition',cloze:'Udfyld',app:'Anvendelse',mc:'Multiple choice',calc:'Beregning',open:'Kort svar',oral:'Mundtligt'};
function cv(c){return `--c:var(--${c})`}
function chips(i){return `<span class="chip c" style="${cv(i.course)}">${esc(i.course)}</span><span class="chip">${esc(i.lectureName)}</span><span class="chip">${KIND[i.kind]||i.kind}</span>`}
function src(i){return `<div class="src">Kilde: ${esc(i.source.file)} › ${esc(i.source.section)}</div>`}
// --- SM-2
function sm2(id,g){const q=[1,3,4,5][g],c=S.cards[id]||{ef:2.5,iv:0,reps:0,lapses:0};
 if(q<3){c.reps=0;c.iv=0;c.lapses++;c.due=Date.now()+10*60e3}else{c.reps++;c.iv=c.reps===1?1:c.reps===2?(q===5?4:3):Math.round(c.iv*c.ef*(q===3?0.8:q===5?1.3:1));c.due=Date.now()+c.iv*DAY}
 c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));S.cards[id]=c;record(id,g>0)}
let cur='home',fcQ=[],fcShow=false,fcTot=0;
const V={home:'Oversigt',fc:'Flashcards',quiz:'Quiz',exam:'Eksamen',weak:'Svage områder',stats:'Statistik',data:'Data'};
function nav(){$('#nav').innerHTML=Object.entries(V).map(([k,v])=>`<button data-v="${k}" class="${k===cur?'on':''}">${v}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v){if(v!==cur&&examT)stopExam();cur=v;nav();const m=$('#app');m.style.animation='none';m.offsetHeight;m.style.animation='';({home:vHome,fc:vFc,quiz:vQuiz,exam:vExam,weak:vWeak,stats:vStats,data:vData})[v]();scrollTo({top:0})}
function ring(p,label,c,big){return `<div class="ring${big?' big':''}" style="--p:${Math.round(p)};${c?cv(c):''}"><span>${label}</span></div>`}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function streak(){const days=new Set((S.log||[]).map(l=>dayKey(l[2])));let n=0,d=Date.now();if(!days.has(dayKey(d)))d-=DAY;while(days.has(dayKey(d))){n++;d-=DAY}return n}
function isDue(i){const c=S.cards[i.id];return c&&c.due<=Date.now()}
function vHome(){const today=(S.log||[]).filter(l=>dayKey(l[2])===dayKey(Date.now())).length,st=streak();
 const cards=ITEMS.filter(i=>i.type==='card'),seen=cards.filter(i=>S.cards[i.id]).length,tot=ITEMS.reduce((s,i)=>{const a=S.att[i.id];if(a){s.c+=a.c;s.n+=a.n}return s},{c:0,n:0});
 const weak=lecStats(ITEMS).filter(o=>o.n>0&&acc(o)<.8).sort((a,b)=>acc(a)-acc(b)).slice(0,4);
 $('#app').innerHTML=`<div class="box hero">${ring(cards.length?100*seen/cards.length:0,Math.round(cards.length?100*seen/cards.length:0)+'%<small>kort set</small>',null,true)}<div style="flex:1;min-width:220px"><h2>${st?'🔥 '+st+' dages streak':'Klar til at lære?'}</h2><div class="meta">${today?today+' gennemgange i dag – godt gået.':'Start dagens repetition for at holde din streak i live.'}</div>
 <div class="kpis"><div class="kpi"><b>${ITEMS.filter(isDue).length}</b><span>forfaldne kort</span></div><div class="kpi"><b>${seen}/${cards.length}</b><span>kort set</span></div><div class="kpi"><b>${tot.n?Math.round(100*tot.c/tot.n)+'%':'–'}</b><span>træfsikkerhed</span></div></div></div></div>
 <div class="grid">${Object.entries(M.courses).map(([c,v])=>{const it=ITEMS.filter(i=>i.course===c),cs=it.filter(i=>i.type==='card'),sn=cs.filter(i=>S.cards[i.id]).length,du=it.filter(isDue).length,nw=cs.length-sn;
  return `<div class="box course" style="${cv(c)}" data-c="${c}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tag">${c}</span>${ring(cs.length?100*sn/cs.length:0,Math.round(cs.length?100*sn/cs.length:0)+'%',c)}</div><h3 style="margin-top:14px">${esc(v.name)}</h3><div class="meta" style="min-height:42px">${esc(v.exam)}</div>
  <div class="row" style="margin-top:14px;gap:6px"><span class="chip c" style="${cv(c)}">${du} forfaldne</span><span class="chip">${nw} nye</span><span class="chip">${it.length-cs.length} spørgsmål</span></div></div>`}).join('')}</div>
 <div class="box"><div class="top"><h3 style="margin:0">Svage områder</h3><button id="gw">Træn nu →</button></div>${weak.length?weak.map(o=>`<div class="weak"><span class="dot" style="${cv(o.course)}"></span><div style="flex:1">${esc(o.course)} · ${esc(o.name)}<div class="bar" style="margin-top:6px"><i style="width:${acc(o)*100}%;background:${acc(o)<.6?'var(--bad)':'var(--warn)'}"></i></div></div><b>${Math.round(acc(o)*100)}%</b></div>`).join(''):'<p class="meta">Ingen svage områder endnu – lav et par quizzer, så finder appen dine svageste lektioner.</p>'}</div>`;
 document.querySelectorAll('.course').forEach(e=>e.onclick=()=>{S.fc=e.dataset.c;S.fl='';$('#fCourse').value=S.fc;lec();save();go('fc')});$('#gw').onclick=()=>go('weak')}
function dueCards(list){const now=Date.now(),cs=list.filter(i=>i.type==='card');const due=cs.filter(i=>S.cards[i.id]&&S.cards[i.id].due<=now).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);const nw=shuffle(cs.filter(i=>!S.cards[i.id])).slice(0,20);return due.concat(nw)}
function vFc(){fcQ=dueCards(pool());fcTot=fcQ.length;fcShow=false;rFc()}
function ivl(i,g){const c=Object.assign({ef:2.5,iv:0,reps:0},S.cards[i.id]),q=[1,3,4,5][g];if(q<3)return'10 min';const r=c.reps+1,iv=r===1?1:r===2?(q===5?4:3):Math.round(c.iv*c.ef*(q===3?.8:q===5?1.3:1));return iv+' d'}
function rFc(){const a=$('#app'),cs=pool().filter(i=>i.type==='card');if(!fcQ.length){const nx=cs.map(i=>S.cards[i.id]&&S.cards[i.id].due).filter(Boolean).sort((x,y)=>x-y)[0];a.innerHTML=`<div class="box empty"><div class="e">🎉</div><h2>Alt er repeteret</h2><p class="meta">${cs.length} kort i udvalget.${nx?' Næste kort forfalder '+new Date(nx).toLocaleString('da-DK',{weekday:'long',hour:'2-digit',minute:'2-digit'})+'.':''}</p><button class="pri" id="cram">Gennemgå alle alligevel</button></div>`;$('#cram').onclick=()=>{fcQ=shuffle(cs);fcTot=fcQ.length;rFc()};return}
 const i=fcQ[0],st=S.cards[i.id],done=fcTot-fcQ.length;
 a.innerHTML=`<div class="top" style="${cv(i.course)}"><div class="prog"><i style="width:${fcTot?100*done/fcTot:0}%"></i></div><span class="meta">${fcQ.length} tilbage</span></div>
 <div class="scene" style="${cv(i.course)}"><div class="flip${fcShow?' on':''}" id="flip"><div class="face"><div>${chips(i)}${st?'':'<span class="chip">Nyt</span>'}</div><div class="txt">${esc(i.front)}</div><div class="hint">Tryk eller mellemrum for at vende</div></div>
 <div class="face b"><div>${chips(i)}<div class="q">${esc(i.front)}</div></div><div class="txt">${esc(i.back)}</div>${src(i)}</div></div></div>
 <div class="grades" style="visibility:${fcShow?'visible':'hidden'}">${['Igen','Svær','God','Let'].map((n,g)=>`<button class="g${g}" data-g="${g}">${n}<small>${ivl(i,g)}</small></button>`).join('')}</div>`;
 fit();$('#flip').onclick=()=>{fcShow=!fcShow;$('#flip').classList.toggle('on',fcShow);$('.grades').style.visibility=fcShow?'visible':'hidden'};document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(+b.dataset.g))}
function fit(){const f=$('#flip');if(!f)return;let h=0;f.querySelectorAll('.face').forEach(x=>{x.style.position='relative';h=Math.max(h,x.scrollHeight);x.style.position=''});f.style.minHeight=Math.max(h,window.innerWidth<640?320:300)+'px'}
addEventListener('resize',fit);
function grade(g){const i=fcQ.shift();sm2(i.id,g);if(g===0)fcQ.splice(Math.min(3,fcQ.length),0,i);fcShow=false;rFc()}
document.addEventListener('keydown',e=>{if(cur!=='fc'||e.target.tagName==='TEXTAREA'||!fcQ.length)return;if(e.key===' '){e.preventDefault();$('#flip').click()}else if(fcShow&&'1234'.includes(e.key))grade(+e.key-1)});
function optsHtml(i){return i._o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCDEF'[k]}</span><span>${esc(i.options[o])}</span></button>`).join('')}
function qHtml(i){if(i.type==='mc')return `<div class="box" style="${cv(i.course)}"><div>${chips(i)}</div><h3 style="margin-top:8px">${esc(i.question)}</h3>${optsHtml(i)}<div id="fb"></div></div>`;
 return `<div class="box" style="${cv(i.course)}"><div>${chips(i)}</div><h3 style="margin-top:8px">${esc(i.question)}</h3><textarea id="ans" placeholder="Skriv dit svar eller dine beregninger …"></textarea><div class="row" style="margin-top:12px"><button class="pri" id="show">Vis modelsvar</button></div><div id="fb"></div></div>`}
function prep(i){if(i.type==='mc')i._o=shuffle(i.options.map((_,k)=>k));return i}
function bindQ(i,done){if(i.type==='mc'){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;const k=i._o[+b.dataset.k],ok=k===i.answer;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(i._o[+x.dataset.k]===i.answer)x.classList.add('right')});if(!ok)b.classList.add('wrong');record(i.id,ok);if(ok)qC++;$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Rigtigt!':'Ikke helt.'}</b> ${esc(i.explanation)}</div>`+src(i)+'<div class="row" style="margin-top:14px"><button class="pri" id="nx">Næste spørgsmål →</button></div>';$('#nx').onclick=done;$('#nx').focus({preventScroll:true})})}
 else $('#show').onclick=()=>{$('#show').parentNode.remove();$('#fb').innerHTML=`<div class="fb m"><b>Modelsvar</b><br>${esc(i.model)}</div>${src(i)}<p class="meta" style="margin-top:14px">Hvordan gik det?</p><div class="row"><button class="g0" id="no">Forkert / mangelfuldt</button><button class="g2" id="yes">Rigtigt</button></div>`;$('#no').onclick=()=>{record(i.id,false);done()};$('#yes').onclick=()=>{record(i.id,true);qC++;done()}}}
let qQ=[],qT,qN,qC,qTot;function vQuiz(list,title){qQ=shuffle((list||pool()).filter(i=>i.type!=='card'));qTot=qQ.length;qT=title||'Quiz';qN=0;qC=0;rQuiz()}
function rQuiz(){if(!qQ.length){const p=qN?100*qC/qN:0;$('#app').innerHTML=`<div class="box empty">${qN?`<div style="display:flex;justify-content:center;margin-bottom:12px">${ring(p,Math.round(p)+'%',null,true)}</div>`:'<div class="e">🤔</div>'}<h2>${esc(qT)} færdig</h2><p class="meta">${qN?qC+' af '+qN+' rigtige.':'Ingen spørgsmål i det valgte udvalg.'}</p><button class="pri" onclick="go(cur)">Prøv igen</button></div>`;return}
 const i=prep(qQ.shift());qN++;$('#app').innerHTML=`<div class="top" style="${cv(i.course)}"><div class="prog"><i style="width:${100*(qN-1)/qTot}%"></i></div><span class="meta">${qN}/${qTot} · ${qC} rigtige</span></div>`+qHtml(i);bindQ(i,rQuiz)}
let examT=null,ex=null;function stopExam(){clearInterval(examT);examT=null}
function vExam(){const p=pool().filter(i=>i.type!=='card');$('#app').innerHTML=`<div class="box"><h2>Eksamenssimulation</h2><p class="meta">Spørgsmålene trækkes fra det aktuelle filter (${p.length} tilgængelige). Facit og forklaringer vises først, når tiden er gået, eller du afslutter.</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:18px 0">${Object.entries(M.courses).map(([c,v])=>`<div class="kpi" style="${cv(c)}"><span class="chip c" style="${cv(c)}">${c}</span><div class="meta">${esc(v.exam)}</div></div>`).join('')}</div>
 <div class="row"><label class="f">Antal spørgsmål<select id="en"><option>5</option><option selected>10</option><option>20</option><option>30</option><option value="999">Alle</option></select></label><label class="f">Tid (minutter)<select id="em"><option>10</option><option selected>20</option><option>30</option><option>60</option><option>120</option><option>240</option></select></label></div><div class="row" style="margin-top:18px"><button class="pri" id="es">Start eksamen</button></div></div>`;
 $('#es').onclick=()=>{const qs=shuffle(p).slice(0,+$('#en').value).map(prep);if(!qs.length)return;ex={qs,i:0,res:[],end:Date.now()+(+$('#em').value)*60e3};examT=setInterval(tick,1000);rExam()}}
function tick(){const t=Math.max(0,ex.end-Date.now()),el=$('#tm');if(el){el.textContent=Math.floor(t/60e3)+':'+String(Math.floor(t/1e3)%60).padStart(2,'0');el.style.color=t<60e3?'var(--bad)':''}if(!t)finishExam()}
function rExam(){if(ex.i>=ex.qs.length)return finishExam();const i=ex.qs[ex.i];$('#app').innerHTML=`<div class="box row" style="justify-content:space-between;padding:16px 20px"><span class="timer" id="tm"></span><div class="prog" style="max-width:260px"><i style="width:${100*ex.i/ex.qs.length}%"></i></div><span class="meta">${ex.i+1}/${ex.qs.length}</span><button id="ab" style="flex:none">Afslut</button></div>`+
 `<div class="box" style="${cv(i.course)}"><div>${chips(i)}</div><h3 style="margin-top:8px">${esc(i.question)}</h3>`+(i.type==='mc'?optsHtml(i):`<textarea id="ans" placeholder="Dit svar …"></textarea><div class="row" style="margin-top:12px"><button class="pri" id="sv">Gem og næste →</button></div>`)+'</div>';tick();
 $('#ab').onclick=finishExam;if(i.type==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ex.res[ex.i]={ok:i._o[+b.dataset.k]===i.answer,pick:i._o[+b.dataset.k]};ex.i++;rExam()});else $('#sv').onclick=()=>{ex.res[ex.i]={txt:$('#ans').value};ex.i++;rExam()}}
function finishExam(){if(!ex)return;stopExam();const qs=ex.qs.slice(0,Math.max(ex.i,ex.res.length));let h='',sa=0,mc=0,ok=0;qs.forEach((i,k)=>{const r=ex.res[k]||{};if(i.type==='mc'){mc++;if(r.ok)ok++;record(i.id,!!r.ok);h+=`<div class="box" style="${cv(i.course)}"><div>${chips(i)}</div><h3 style="margin-top:8px">${r.ok?'✓':'✕'} ${esc(i.question)}</h3><div class="fb ${r.ok?'ok':'no'}"><b>Rigtigt svar:</b> ${esc(i.options[i.answer])}${r.pick!=null&&!r.ok?'<br><b>Dit svar:</b> '+esc(i.options[r.pick]):''}<br><span class="meta">${esc(i.explanation)}</span></div>${src(i)}</div>`}else{sa++;h+=`<div class="box" style="${cv(i.course)}"><div>${chips(i)}</div><h3 style="margin-top:8px">${esc(i.question)}</h3><p class="meta"><b>Dit svar:</b> ${esc(r.txt||'(intet)')}</p><div class="fb m"><b>Modelsvar</b><br>${esc(i.model)}</div>${src(i)}<div class="row" style="margin-top:12px"><button class="g0" data-sa="${k}" data-ok="0">Forkert</button><button class="g2" data-sa="${k}" data-ok="1">Rigtigt</button></div></div>`}});
 const p=mc?100*ok/mc:0;ex=null;$('#app').innerHTML=`<div class="box hero">${ring(p,mc?Math.round(p)+'%':'–',null,true)}<div style="flex:1"><h2>Eksamen afsluttet</h2><p class="meta">Multiple choice: ${ok}/${mc} rigtige.${sa?' '+sa+' åbne spørgsmål skal selvvurderes nedenfor.':''} Ubesvarede spørgsmål tæller ikke med.</p><button class="pri" onclick="go('exam')">Ny eksamen</button></div></div>`+h;
 document.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{record(qs[+b.dataset.sa].id,b.dataset.ok==='1');b.parentNode.innerHTML='<span class="meta">✓ Registreret</span>'})}
function lecStats(list){const m={};list.forEach(i=>{const k=i.course+'|'+i.lecture,o=m[k]||(m[k]={course:i.course,lecture:i.lecture,name:i.lectureName,items:0,c:0,n:0,due:0});o.items++;const a=S.att[i.id];if(a){o.c+=a.c;o.n+=a.n}if(isDue(i))o.due++});return Object.values(m)}
function acc(o){return o.n?o.c/o.n:null}
function vStats(){const P=pool(),ls=lecStats(P).sort((a,b)=>(acc(a)??2)-(acc(b)??2));
 const cs=Object.keys(M.courses).map(c=>{const it=P.filter(i=>i.course===c);if(!it.length)return'';const t=it.reduce((s,i)=>{const a=S.att[i.id];if(a){s.c+=a.c;s.n+=a.n}return s},{c:0,n:0}),p=t.n?100*t.c/t.n:0;return `<div class="box row" style="${cv(c)};flex-wrap:nowrap">${ring(p,t.n?Math.round(p)+'%':'–',c)}<div><h3 style="margin:0">${esc(M.courses[c].name)}</h3><div class="meta">${t.n} besvarelser · ${it.filter(i=>S.cards[i.id]).length}/${it.filter(i=>i.type==='card').length} kort set</div></div></div>`}).join('');
 $('#app').innerHTML=`<div class="grid">${cs}</div><div class="box"><h3>Lektioner – svagest først</h3><table><tr><th>Lektion</th><th>Elementer</th><th>Forsøg</th><th style="width:34%">Træfsikkerhed</th><th>Forfaldne</th></tr>${ls.map(o=>{const a=acc(o);return `<tr><td><span class="dot" style="${cv(o.course)}"></span>${esc(o.course)} · ${esc(o.name)}</td><td>${o.items}</td><td>${o.n}</td><td>${a==null?'<span class="meta">ingen data</span>':`<div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${a*100}%;background:${a<.6?'var(--bad)':a<.8?'var(--warn)':'var(--ok)'}"></i></div><b style="width:42px;text-align:right">${Math.round(a*100)}%</b></div>`}</td><td>${o.due}</td></tr>`}).join('')}</table></div>
 <div class="box"><h3>Huller i materialet</h3>${Object.entries(M.gaps).map(([c,g])=>`<p><span class="chip c" style="${cv(c)}">${c}</span>${esc(g)}</p>`).join('')}</div>`}
function vWeak(){const ls=lecStats(pool()).filter(o=>o.n>0).sort((a,b)=>acc(a)-acc(b)),weak=ls.filter(o=>acc(o)<.8).slice(0,3);
 if(!weak.length){$('#app').innerHTML=`<div class="box empty"><div class="e">${ls.length?'💪':'🎯'}</div><h2>Svage områder</h2><p class="meta">${ls.length?'Ingen lektioner under 80 % – flot! Fortsæt med quiz og flashcards.':'Ingen data endnu. Lav nogle quizzer eller flashcards, så finder appen dine svageste lektioner.'}</p><button class="pri" onclick="go('quiz')">Start en quiz</button></div>`;return}
 const keys=weak.map(o=>o.course+'|'+o.lecture),items=pool().filter(i=>keys.includes(i.course+'|'+i.lecture)),f=i=>{const x=S.att[i.id];return x?x.c/x.n:.5};items.sort((a,b)=>f(a)-f(b));
 $('#app').innerHTML=`<div class="box"><h2>Svage områder</h2><p class="meta">De lektioner, hvor din træfsikkerhed er lavest. Elementer du oftest svarer forkert på kommer først.</p>${weak.map(o=>`<div class="weak"><span class="dot" style="${cv(o.course)}"></span><div style="flex:1">${esc(o.course)} · ${esc(o.name)}<div class="bar" style="margin-top:6px"><i style="width:${acc(o)*100}%;background:${acc(o)<.6?'var(--bad)':'var(--warn)'}"></i></div></div><b>${Math.round(acc(o)*100)}%</b></div>`).join('')}<div class="row" style="margin-top:18px"><button class="pri" id="wq">Drill quiz (${items.filter(i=>i.type!=='card').length})</button><button id="wf">Drill flashcards (${items.filter(i=>i.type==='card').length})</button></div></div>`;
 $('#wq').onclick=()=>vQuiz(items,'Svage områder');$('#wf').onclick=()=>{fcQ=items.filter(i=>i.type==='card');fcTot=fcQ.length;fcShow=false;rFc()}}
// Data
function vData(){$('#app').innerHTML=`<div class="box"><h2>Eksport / import af fremskridt</h2><p class="meta">Fremskridt gemmes i browseren (localStorage) pr. kort-id, så det overlever nye versioner af indholdet. Eksportér for at flytte mellem browsere/enheder.</p><div class="row"><button class="pri" id="exp">Eksportér JSON</button><label class="row" style="flex:1"><input type="file" id="imp" accept=".json,application/json"></label><button id="rst" class="g0">Nulstil alt</button></div><p id="msg"></p></div>
<div class="box"><h3>Indhold</h3><p>Version ${esc(M.version)} · bygget ${esc(M.generated)} · ${ITEMS.length} elementer</p>${Object.keys(M.courses).map(c=>{const x=ITEMS.filter(i=>i.course===c);return `<p><b>${c}</b> – ${x.filter(i=>i.type==='card').length} kort, ${x.filter(i=>i.type==='mc').length} MC, ${x.filter(i=>i.type==='sa').length} kort svar/beregning</p>`}).join('')}</div>`;
 $('#exp').onclick=()=>{const b=new Blob([JSON.stringify({app:'eksamenstraener',version:M.version,exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='eksamenstraener-fremskridt-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()};
 $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),st=j.state||j;if(!st.cards)throw 0;if(confirm('Flet med nuværende fremskridt? (Annullér = erstat)')){Object.assign(S.cards,st.cards);for(const[k,v]of Object.entries(st.att||{})){const a=S.att[k]||{c:0,n:0};S.att[k]={c:a.c+v.c,n:a.n+v.n}}S.log=(S.log||[]).concat(st.log||[])}else S=Object.assign({cards:{},att:{},log:[]},st);save();$('#msg').textContent='✅ Importeret.'}catch(x){$('#msg').textContent='❌ Ugyldig fil.'}};r.readAsText(f)};
 $('#rst').onclick=()=>{if(confirm('Slet alt fremskridt?')){S={cards:{},att:{},log:[],theme:S.theme};save();vData()}}}
$('#ver').textContent='v'+M.version+' · '+M.generated;theme();fill();go('home');
</script></body></html>
