) → Targeting (vælg segmenter) → Positionering (ønsket plads i kundens bevidsthed vs. konkurrenter). Broen mellem strategi og marketingmix.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › STP-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model"]}, {"id": "MM-term-L3-008", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "Marketingmix (4 P'er)", "back": "Værktøjerne der omsætter strategien til handling: Product (hvad tilbydes), Price (hvad betaler kunden), Place (distribution), Promotion (kommunikation af værdien). Skal understøtte positioneringen.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Marketing Mix", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model"]}, {"id": "MM-term-L4-001", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Product Life Cycle (PLC)", "back": "Salg og profit gennem produktudvikling, introduktion, vækst, modning og nedgang; hver fase kræver forskellig strategi for 4P. Analyseværktøj, ikke prognose.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Product Life Cycle", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-002", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: introduktionsfasen", "back": "Lavt, langsomt voksende salg; høje omk. pr. kunde; lav/negativ profit; innovatører og tidlige adoptanter. Mål: kendskab og prøvekøb. Selektiv distribution, information/demonstration/PR.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-003", "course": "MM", "lecture": 4, "type": "card", "kind": "metode", "front": "Market-skimming pricing", "back": "Lancering til høj pris, der gradvist udnytter forskellige kunders betalingsvillighed. Relevant ved tydelig differentiering og kunder der vil betale for nyhed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "metode"]}, {"id": "MM-term-L4-004", "course": "MM", "lecture": 4, "type": "card", "kind": "metode", "front": "Market-penetration pricing", "back": "Lancering til relativt lav pris for hurtigt at vinde kunder og markedsandel. Relevant ved prisfølsomt marked og stordriftsfordele.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "metode"]}, {"id": "MM-term-L4-005", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: vækstfasen", "back": "Salget stiger hurtigt, omk. pr. kunde falder, profit vokser, flere konkurrenter. Mål: udbygge markedsandel (kvalitet, varianter, nye segmenter, bredere distribution, brandpræference). Valg mellem kortsigtet profit og langsigtet andel.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Vækstfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-006", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: modningsfasen", "back": "Væksten aftager, markedet mættes, intens konkurrence og profitpres. Mål: maksimere profit og forsvare andel via markedsmodifikation (nye brugere/anvendelser), produktmodifikation og modifikation af marketingmixet. Fastholdelse bliver centralt.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Modningsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-007", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: nedgangsfasen", "back": "Faldende salg og profit. Identificér svage produkter (profit, potentiale, strategisk betydning). Strategier: maintain, harvest (skær omk. for cash), repositionering, divest/udfasning.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Nedgangsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-008", "course": "MM", "lecture": 4, "type": "card", "kind": "begreb", "front": "Style, fashion og fad", "back": "Style: grundlæggende udtryksform over generationer. Fashion: aktuelt accepteret stil, vokser gradvist og falder. Fad: hurtig popularitet og brat fald.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Forskellige former for livscyklus", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "begreb"]}, {"id": "MM-term-L4-009", "course": "MM", "lecture": 4, "type": "card", "kind": "begreb", "front": "Konkurrencemæssig fordel", "back": "Opstår når virksomheden skaber større kundeværdi end konkurrenterne (lavere pris og/eller større fordele). Skal være relevant for kunderne, tydelig, troværdig, svær at kopiere og økonomisk forsvarlig.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Konkurrencemæssig fordel", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "begreb"]}, {"id": "MM-term-L4-010", "course": "MM", "lecture": 4, "type": "card", "kind": "metode", "front": "Konkurrentanalyse", "back": "Tre trin: identificér konkurrenterne, vurdér deres mål, strategier, styrker/svagheder og reaktioner, og beslut hvem der skal angribes eller undgås. Konkurrenter former også kundernes forventninger og spillereglerne.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Konkurrentanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "metode"]}, {"id": "MM-term-L4-011", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Porters generiske strategier", "back": "Omkostningslederskab (laveste omk. i branchen – lav pris er resultatet, ikke fordelen), differentiering (noget kunder opfatter som unikt; lykkes når betalingsvillighed > omk.), fokus (smalt segment/niche med omkostnings- eller differentieringsfokus).", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Porters generiske konkurrencestrategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-012", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Markedslederens strategier", "back": "Udvide det samlede marked (nye brugere, anvendelser, mere forbrug), beskytte markedsandelen og evt. øge den.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Markedslederens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-013", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Udfordrerens strategier", "back": "Vælg hvem der angribes (svag leder, svage lige store, små lokale). Frontalt angreb (efterligner modstanderens stærke sider – kræver ressourcer) eller flankeangreb (oversete segmenter/behov).", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Udfordrerens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-014", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Følger- og nichestrategier", "back": "Følger: stabil profit uden at udfordre lederen; lærer af lederen, men skal have en tydelig fordel. Niche: specialisering efter kundegruppe, geografi, produkt, service eller kanal → høje marginer; risiko for afhængighed (multiple niching).", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Markedsfølgerens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model"]}, {"id": "MM-term-L4-015", "course": "MM", "lecture": 4, "type": "card", "kind": "begreb", "front": "Priskrig", "back": "Sandsynlig ved få udbydere, homogene produkter og velinformerede kunder. Konsekvenser: lavere DB og profit, mindre investering i kvalitet/innovation, ringere service, markedsandele ofte uændrede.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Priskrige", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "begreb"]}, {"id": "MM-term-L5-001", "course": "MM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Forbrugeradfærd (B2C)", "back": "De processer og handlinger hvorigennem private forbrugere identificerer behov, søger information, vurderer alternativer, køber, anvender og vurderer produkter. Kan ikke forklares alene ud fra pris og funktion.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Forbrugeradfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "begreb"]}, {"id": "MM-term-L5-002", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Stimulus-respons-modellen (black box)", "back": "Marketingstimuli (4P) og øvrige stimuli (økonomi, teknologi, kultur, politik) → kundens black box (karakteristika + beslutningsproces) → reaktion (produkt/brand, hvor/hvornår, mængde, frekvens, genkøb/skift).", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › En simpel model for forbrugeradfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-003", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Kulturelle faktorer", "back": "Kultur (grundlæggende værdier lært via familie/institutioner), subkultur (mindre gruppe med fælles værdier) og social klasse (stabile grupper efter job, indkomst, uddannelse). Undgå stereotyper; kulturelle skift skaber nye behov.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Kulturelle faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-004", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Sociale faktorer", "back": "Medlemsgrupper, referencegrupper (sammenligningsgrundlag), aspirationsgrupper (man ønsker at tilhøre), familie (roller: initiativtager, påvirker, beslutningstager, køber, bruger), sociale roller/status og digitale fællesskaber/influencers.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Sociale faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-005", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Personlige faktorer", "back": "Beskæftigelse, økonomisk situation (købekraft), alder og livsstadie, livsstil, personlighed og selvopfattelse – påvirker behov, overvejede løsninger og betalingsvillighed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Personlige faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-006", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Psykologiske faktorer", "back": "Motivation (behov → motiv; Maslows hierarki), perception (selektiv opmærksomhed, forvrængning, fastholdelse), læring (ændret adfærd via erfaring og forstærkning) og overbevisninger/holdninger.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Psykologiske faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-007", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Maslows behovshierarki", "back": "Fysiologiske behov → sikkerhed → sociale behov → anerkendelse → selvrealisering. Mere basale behov kræver typisk en vis tilfredsstillelse først.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Motivation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-008", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Fire typer købsadfærd", "back": "Involvering × oplevede brandforskelle: kompleks (høj/store – læreproces viden → holdning → valg), dissonansreducerende (høj/få), variationssøgende (lav/store), vanemæssig (lav/få).", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Typer af købsadfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-009", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Købsprocessen", "back": "Behovserkendelse (forskel mellem faktisk og ønsket tilstand; push vs. pull) → informationssøgning → evaluering af alternativer → købsbeslutning → efterkøbsadfærd. Forenkling – faser kan springes over; erfaring påvirker alle faser.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Købsprocessen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L5-010", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Kunderejsen", "back": "Alle interaktioner med brandet fra første opmærksomhed til efter købet. Dynamisk, ikke-lineær, multikanal, kundecentrisk, socialt påvirket. Tre faser: før-køb, køb og efter-køb (Lemon & Verhoef).", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Kunderejsen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model"]}, {"id": "MM-term-L6-001", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "Dual processing (System 1/System 2)", "back": "System 1: hurtigt, automatisk, intuitivt, heuristikker, følelser, impulsivt. System 2: langsomt, bevidst, logisk, faktabaseret, vejer flere egenskaber. Bruges ofte samtidig; købets kompleksitet afgør hvilket dominerer (Kahneman).", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Forbrugerpsykologi og dual processing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model"]}, {"id": "MM-term-L6-002", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "Samson & Voyer (2012)", "back": "Ramme med dualitet i tre faser: overtalelse/holdningsændring (central/systematisk vs. perifer/heuristisk), evaluering/beslutning (reflektiv/analytisk vs. intuitiv/oplevelsesbaseret), købs-/forbrugeradfærd (reflektiv 'cool' vs. impulsiv 'hot').", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Overblik: dualitet i forbrugerpsykologi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model"]}, {"id": "MM-term-L6-003", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "ELM (Elaboration Likelihood Model)", "back": "To ruter til overtalelse. Central: høj involvering → fokus på argumenter og produktegenskaber → stærke, stabile holdninger. Perifer: lav involvering → perifere signaler, følelser, klassisk betingning → svage holdninger.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Overtalelse og holdningsændring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model"]}, {"id": "MM-term-L6-004", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "MAO-modellen", "back": "Effektiv informationsbearbejdning kræver Motivation, Ability (evne) og Opportunity (mulighed). Mangler én → heuristisk/perifer bearbejdning (Pelsmacker, 2022).", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › MAO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model"]}, {"id": "MM-term-L6-005", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "HSM (Heuristic-Systematic Model)", "back": "Minder om ELM, men systematisk og heuristisk bearbejdning kan foregå samtidig og påvirke hinanden.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › HSM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model"]}, {"id": "MM-term-L6-006", "course": "MM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Heuristikker", "back": "Mentale genveje i System 1 (Tversky & Kahneman) – hurtige vurderinger uden megen bearbejdning, der kan give bias.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Historien bag dual processing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "begreb"]}, {"id": "MM-term-L6-007", "course": "MM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Involvering", "back": "Graden af personlig relevans/risiko ved købet. Kobler ELM til de fire typer købsadfærd: høj involvering → central rute/System 2; lav → perifer rute/System 1.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Betydningen af involvering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "begreb"]}, {"id": "MM-term-L6-008", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "Forbrugerværdier (Schwartz)", "back": "Værdier = grundlæggende principper der guider valg på tværs af situationer. Schwartz: 10 basale værdier i fire overordnede områder; værdier er forbundet med affekt og forklarer, hvorfor forbrugere prioriterer bestemte brands.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Forbrugerværdier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model"]}, {"id": "MM-term-L7-001", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "B2B-myter", "back": "Lektionen afviser at B2B-køb er langt mere rationelle end B2C og at følelser ingen rolle spiller – usikkerhed, tillid og personlige hensyn betyder meget.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B adskiller sig mindre fra B2C", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb"]}, {"id": "MM-term-L7-002", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "Buying center", "back": "De personer der deltager i et B2B-køb – i snit 6,8 beslutningstagere. 80–90 % har en 'Day One'-liste, 90 % vælger fra den, 71 % starter digitalt, 10–15 berøringspunkter, sælgeren har ca. 5 % af tiden.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Nøgletal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb"]}, {"id": "MM-term-L7-003", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "B2B-købssituationer", "back": "Nykøb (typisk alle faser), modificeret genkøb og rutinemæssigt genkøb (springer ofte faser over). Den reelle proces er mere kompliceret end flowdiagrammet.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Den professionelle indkøbsproces", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb"]}, {"id": "MM-term-L7-004", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "Den professionelle indkøbsproces", "back": "Otte faser: problemerkendelse → generel behovsbeskrivelse → produktspecifikation → leverandørsøgning → indhentning af tilbud → leverandørvalg → ordrerutine → evaluering af leverandørens præstation.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Den professionelle indkøbsproces", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model"]}, {"id": "MM-term-L7-005", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "Lineær, kontinuerlig og forstærkende kunderejse", "back": "Lineær (Lemon & Verhoef 2016: før-køb, køb, efter-køb), kontinuerlig (Edelman & Singer 2015: loop frem for tragt), forstærkende (Siebert et al. 2020: loyalty loops vs. involvement spirals).", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Kunderejsen i B2B", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model"]}, {"id": "MM-term-L7-006", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "Loyalty loop vs. involvement spiral", "back": "Loyalty loop: bevidst førstekøb fulgt af strømlinede genkøb. Involvement spiral: hurtigt førstekøb fulgt af stigende involvering (Siebert et al., 2020).", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Den forstærkende kunderejse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model"]}, {"id": "MM-term-L7-007", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "PoP og PoD", "back": "Points of parity: essentielle værdielementer på niveau med næstbedste alternativ. Points of difference: overlegne/ekstraordinære elementer i forhold til næstbedste alternativ.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B elements of value", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb"]}, {"id": "MM-term-L7-008", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "B2B elements of value (Almquist et al., 2018)", "back": "Pyramide: table stakes (specifikationer, pris, regler, etik) → funktionel værdi (økonomisk, performance) → ease of doing business (produktivitet, adgang, relation, operationel, strategisk) → individuel værdi (karriere, personlig) → inspirerende værdi (vision, håb, socialt ansvar). Flere højværdielementer → højere NPS og genkøb.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B elements of value", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model"]}, {"id": "MM-term-L7-009", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "Hvad B2B-kunder efterspørger", "back": "74 % foretrækker personlig betjening frem for dobbelt så hurtig chatbot; 58 % ønsker valgmuligheder frem for den præcise løsning – læring, valgfrihed og relationer vægtes højt.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Hvad leder B2B-kunderne efter?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb"]}, {"id": "MM-term-L7-010", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "Moderne B2B marketing", "back": "Bevæger sig fra ren leadgenerering mod kundeoplevelser, relationer, engagement og værdiskabende indhold (kundecases, netværk, webinarer, en-til-en-samtaler).", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Udviklingen i B2B marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb"]}, {"id": "MM-term-L8-001", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Marketingmiljø", "back": "Aktører og kræfter der påvirker virksomhedens evne til at skabe værdi for kunderne – opdeles i mikro- og makromiljø (Kotler fig. 3.1 og 3.2).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketingmiljøet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-002", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Mikromiljøet", "back": "Aktører tæt på virksomheden: virksomheden selv, leverandører, marketingmellemled, konkurrenter, offentligheder (publics) og kunder.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Mikrofaktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model"]}, {"id": "MM-term-L8-003", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "PESTEL", "back": "Makromiljøets seks kræfter: Politiske (stabilitet, handels-/skattepolitik), Environment (klima, ressourcer), Sociale (demografi, værdier, CSR), Teknologiske (digitalisering, GAI), Economy (indkomst, rente, opsparing), Lovgivning (GDPR, markedsføringsloven).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › PESTEL", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model"]}, {"id": "MM-term-L8-004", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Fad, trend og megatrend", "back": "Fad: kortvarig, uden social/økonomisk/politisk betydning. Trend: retning med momentum og holdbarhed. Megatrend: store forandringer der tager lang tid at danne og påvirker længe.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Fad, trend og megatrend", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-005", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Proaktiv vs. reaktiv håndtering", "back": "Proaktiv: strategier der påvirker omgivelserne. Reaktiv: overvåg ændringer tæt og tilpas dig.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Håndtering af makrofaktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-006", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Big data", "back": "Enorme komplekse datasæt kendetegnet ved volume, velocity, variety og volatility. Problemet er at finde de rette data (information overload) og omsætte dem til indsigt.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Big data og behovet for MIS", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-007", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Customer insights", "back": "Ny indsigt i kunder og marked baseret på markedsføringsoplysninger – grundlaget for kundeværdi, engagement og relationer.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Big data og behovet for MIS", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-008", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Marketing Information System (MIS)", "back": "Mennesker og procedurer: vurdér informationsbehov → udvikl information fra interne databaser, marketing intelligence og marketing research → analysér og brug informationen (fig. 4.1).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › MIS", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model"]}, {"id": "MM-term-L8-009", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Marketing intelligence", "back": "Systematisk overvågning, indsamling og analyse af offentligt tilgængelig information om forbrugere, konkurrenter og miljøet. Kilder: salgsstyrke, værdikædepartnere, eksperter, social listening, messer, advisory boards, offentlige data, købt information, reviews.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing intelligence", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-010", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Marketing research", "back": "Formelle analyser af markedet ved dataindsamling for at forstå kunderne bedre; reducerer usikkerhed og risiko og giver input til strategier.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing research", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-011", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Marketing research-processen", "back": "1) Definér problem og formål (udforskende 'hvorfor/hvordan' vs. beskrivende/kausale 'hvor mange'), 2) forskningsplan (sekundære før primære data), 3) indsaml og analysér, 4) fortolk og rapportér.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing research-processen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model"]}, {"id": "MM-term-L8-012", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Primære vs. sekundære data", "back": "Sekundære: findes allerede (statistikker, rapporter, databaser) – hurtigere og billigere, afsøg først. Primære: indsamles til det konkrete formål.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Forskningsplan og dataindsamling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-013", "course": "MM", "lecture": 8, "type": "card", "kind": "metode", "front": "Dataindsamlingsmetoder", "back": "Observationer ((n)etnografi), kvalitative interviews (fokusgrupper, dybdeinterviews, laddering), surveys, adfærdsdata (scannerdata, big data) og eksperimenter (lab/online, eye-tracking, neuromarketing).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Indsamling og analyse af data", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "metode"]}, {"id": "MM-term-L8-014", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Datakvalitet: validitet og reliabilitet", "back": "Validitet (intern/ekstern): måler vi det, vi vil måle? Reliabilitet: er målingen pålidelig/gentagelig? Overvej også stikprøve (tilfældig vs. kvota/convenience), svarprocent og bias (social desirability).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Overvejelser om datakvalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb"]}, {"id": "MM-term-L8-015", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Brand funnel", "back": "Kendskab → prøvet → nyligt prøvet → lejlighedsvis bruger → fast bruger → mest brugt. Sammenlign brands for at se, hvor de taber kunder, og sæt ind dér.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Brand funnel", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model"]}, {"id": "MM-term-L9-001", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Kundedrevet marketingstrategi", "back": "At skabe værdi for målgruppen – virksomheden kan ikke være alt for alle og må vælge kunder og hvordan den skaber mest værdi for dem (STP).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › En kundedrevet marketingstrategi og STP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb"]}, {"id": "MM-term-L9-002", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Segmentering", "back": "At opdele markedet i mindre grupper med lignende behov, karakteristika eller købsadfærd. Formål: forstå behov bedre, tilpasse produkter, målrette marketing og bruge ressourcer strategisk.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Hvad er segmentering?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb"]}, {"id": "MM-term-L9-003", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Fire segmenteringskriterier", "back": "Geografisk (lande, regioner, klima), demografisk (alder, køn, livsstadie, indkomst, uddannelse – let at måle), psykografisk (livsstil, personlighed, værdier, holdninger), adfærdsmæssig (anledning, søgte fordele, bruger-status, bruger-rate, loyalitet). Kombineres ofte.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › 4 segmenteringskriterier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model"]}, {"id": "MM-term-L9-004", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Adfærdssegmentering", "back": "Opdeler efter adfærd ift. produktet: søgte fordele, bruger-status, bruger-rate, loyalitets-status og anledning – tæt knyttet til behov og motivation.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Adfærdsmæssig segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb"]}, {"id": "MM-term-L9-005", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "B2B-segmentering", "back": "Branche, virksomhedsstørrelse, geografisk placering, købsvolumen og specifikke behov.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Segmentering på B2B-markedet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb"]}, {"id": "MM-term-L9-006", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Krav til effektiv segmentering", "back": "Measurable (kan måles), Accessible (kan nås), Substantial (stort/profitabelt nok), Differentiable (reagerer forskelligt), Actionable (der kan laves effektive strategier).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Krav til effektiv segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model"]}, {"id": "MM-term-L9-007", "course": "MM", "lecture": 9, "type": "card", "kind": "metode", "front": "Evaluering af segmenter", "back": "Segmentets størrelse og vækst, segmentets attraktivitet (konkurrence, barrierer, risici) og virksomhedens ressourcer og mål (passer det til kompetencer og strategi?).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Hvordan evaluerer vi et segment?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "metode"]}, {"id": "MM-term-L9-008", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Market-targeting strategier", "back": "Fra bred til smal: udifferentieret/mass (ét tilbud til hele markedet), differentieret (flere segmenter med hvert sit tilbud), koncentreret/niche (ét eller få segmenter – ekspertise), mikromarketing (lokal eller individuel tilpasning).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Market-targeting strategies", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model"]}, {"id": "MM-term-L9-009", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Positionering", "back": "Hvordan virksomheden vil opfattes i kundernes bevidsthed i forhold til konkurrenterne; bygger på differentiering.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positionering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb"]}, {"id": "MM-term-L9-010", "course": "MM", "lecture": 9, "type": "card", "kind": "metode", "front": "Positioneringskort (perceptual map)", "back": "Viser hvordan kunder opfatter brands ift. hinanden på dimensioner som pris, kvalitet, innovation; bruges til at identificere konkurrenter og ledige positioner.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positioneringskort", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "metode"]}, {"id": "MM-term-L9-011", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Differentiering", "back": "At skabe forskelle i tilbuddet som kunder opfatter som værdifulde – via produkt, service, kanaler, medarbejdere eller image.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Differentiering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb"]}, {"id": "MM-term-L9-012", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Value proposition", "back": "Udtrykker positioneringen: hvilke fordele kunden får, til hvilken pris, og hvorfor ('hvorfor vælge os?'). Typer: more for more, more for the same, the same for less, less for much less, more for less.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Value proposition", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model"]}, {"id": "MM-term-L9-013", "course": "MM", "lecture": 9, "type": "card", "kind": "metode", "front": "Positioning statement", "back": "Formulering der sikrer klar og konsistent position: 'For (målgruppe) er (brand) en/et (produktkategori), der tilbyder (unik fordel).'", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positioning statement", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "metode"]}, {"id": "MM-term-L10-001", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Produktets tre niveauer", "back": "Kerneværdi for kunden (hvad køber kunden egentlig?) → det faktiske produkt (brand name, features, design, kvalitet, emballage) → det udvidede produkt (service, garanti, support). Eks.: iPad = underholdning, selvudtryk, produktivitet.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Branding – en central del af marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model"]}, {"id": "MM-term-L10-002", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand (AMA)", "back": "'A name, term, sign, symbol or design or a combination of these' der identificerer og differentierer fra konkurrenter. To funktioner: identificere og differentiere.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Hvad er et brand?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-003", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Fem brand elementer", "back": "Navn (ordbaserede, opfundne, ikke-ord/akronymer), term (fx 'Coke', 'LV'), tegn (verbale/visuelle/auditive signaler, fx 'I'm loving it'), symbol (logo/ikon) og design (former, farver, materialer).", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand elementer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model"]}, {"id": "MM-term-L10-004", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Store brandstrategiske beslutninger (fig. 8.5)", "back": "Brand positioning (attributes, benefits, beliefs/values), brand name selection, brand sponsorship (producent-, privat-, licens-, co-branding) og brand development (line extensions, brand extensions, multibrands, nye brands).", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Store brandstrategiske beslutninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model"]}, {"id": "MM-term-L10-005", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Branding", "back": "Den ledelsesmæssige proces, der skal føre til et stærkt brand. Landor: 'Products are produced in the factory, but brands are produced in the minds of the consumer.'", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand positionering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-006", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand equity", "back": "'The differential effect that knowing the brand name has on customer response to the product and its marketing.' Brandets værdi, bestemt af evnen til at fange præferencer og loyalitet. Tragt: awareness, associations, loyalty, perceived quality.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-007", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Fordele ved stærke brands", "back": "Virksomhed: finansielt aktiv, forudsigelige pengestrømme, bedre indtjening, magt over for detailhandlen, licenser og extensions. Forbruger: identifikation, mindre risiko, oplevet kvalitet, loyalitet, mindre prisfølsomhed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Værdien af brand equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-008", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Den økonomiske forklaring", "back": "Et brand reducerer risiko og informationsomk. for køberen. Brandet er et signal, hvis det er konsistent, klart og troværdigt. Branding betyder mest ved oplevet risiko og mindst ved mange søgekvaliteter.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Den økonomiske forklaring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model"]}, {"id": "MM-term-L10-009", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Søge-, erfarings- og tillidskvaliteter", "back": "Søge: kendt før købet. Erfaring: afsløres efter købet. Tillid: ukendt både før og efter købet.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Produktkvalitet og usikkerhed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-010", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Den psykologiske forklaring (Keller, 1993)", "back": "Brandet er symbol for køberens samlede erfaringer. Brand knowledge = brand awareness (recall + recognition) + brand image (associationer). Hukommelse som associativt netværk af noder og links med varierende styrke.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Den psykologiske forklaring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model"]}, {"id": "MM-term-L10-011", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand awareness", "back": "Evnen til at identificere brandet under forskellige forhold. Brand recall: genkalde med få anvisninger (med/uden hjælp). Brand recognition: bekræfte tidligere eksponering. Vigtigst ved lav involvering.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand awareness", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-012", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand image", "back": "Opfattelser af brandet afspejlet i associationer i hukommelsen. Typer: egenskaber (produkt-/ikke-produktrelaterede), fordele (funktionelle, oplevelsesmæssige, symbolske), holdninger. Dimensioner: valens, styrke, unikhed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand image", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-013", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Producentbrand vs. detailhandelsbrand", "back": "Branding kan ske på alle niveauer af værdikæden, hvis brandhaveren kan sikre klarhed og troværdighed (Lurpak vs. Coops Xtra Smör-Smør).", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Hvem skal brande?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "MM-term-L10-014", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand identitet vs. brand image", "back": "Identitet: hvordan virksomheden ønsker at positionere sig (afsenderens USP). Image: hvordan kunderne faktisk opfatter brandet. De er ikke nødvendigvis ens.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand positionering og brand identitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb"]}, {"id": "ØS-term-L1-001", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Økonomistyring (management accounting)", "back": "Internt ledelsesværktøj der leverer finansielle og ikke-finansielle informationer, så ledere træffer bedre beslutninger og når virksomhedens mål: beslutningsstøtte, strategi og planlægning, ressourcestyring, præstationsmåling.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Hvad er økonomistyring?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb"]}, {"id": "ØS-term-L1-002", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Finansielt regnskab vs. økonomistyring", "back": "Finansielt regnskab: eksternt og regelbaseret. Økonomistyring: internt og tilpasset ledelsens behov. Omkostningsregnskabet leverer information til begge.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Finansielt regnskab vs. økonomistyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb"]}, {"id": "ØS-term-L1-003", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Omkostningsstyring", "back": "Styring af omkostningerne gennem planlægning, kontrol og løbende omkostningsreduktion – typisk understøttet af ERP-systemer (SAP, Navision). En omkostning er en vurdering af ressourceforbrug, ikke en objektiv størrelse.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Omkostningsregnskab og omkostningsstyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb"]}, {"id": "ØS-term-L1-004", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Business partnering", "back": "Økonomifunktionen som strategisk samarbejdspartner frem for bogholder. Tre roller: hjælpe ledelsen med beslutninger, overvåge strategiske/operationelle mål, sikre overholdelse af regler.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Business Partnering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb"]}, {"id": "ØS-term-L1-005", "course": "ØS", "lecture": 1, "type": "card", "kind": "model", "front": "Fem hovedformål med økonomistyring", "back": "Strategi (langsigtede mål), ressourceallokering (produktmix, kundemix, priser), intern rapportering, omkostningskontrol (planlægge og styre aktiviteter) og præstationsmåling (medarbejdere, afdelinger, processer).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › De fem hovedformål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "model"]}, {"id": "ØS-term-L1-006", "course": "ØS", "lecture": 1, "type": "card", "kind": "model", "front": "Planlægning, kontrol og feedback", "back": "Planlægning: fastlæg mål → sammenlign alternativer → vælg bedste (budgettet = kvantitativ handlingsplan). Kontrol: mål resultater → sammenlign med budget → feedback → korrigér. Feedback: find årsager til afvigelser og lær fremadrettet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Planlægning, kontrol og beslutningstagning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "model"]}, {"id": "ØS-term-L1-007", "course": "ØS", "lecture": 1, "type": "card", "kind": "model", "front": "Tre roller i økonomistyringen", "back": "Opgørelse af resultater (er vi på rette vej?), fokusområde (hvad bør undersøges først?) og problemløsning (hvilket alternativ er bedst?).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Tre roller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "model"]}, {"id": "ØS-term-L1-008", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Cost–benefit-princippet", "back": "Et økonomistyringssystem skal skabe mere værdi end det koster – 'better to be roughly right than precisely wrong'. Information skal være beslutningsrelevant; adfærd er lige så vigtig som teknik.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Cost–Benefit princippet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb"]}, {"id": "ØS-term-L1-009", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Different costs for different purposes", "back": "Der findes ikke én rigtig omkostning – forskellige formål (pris, lager, kontrol, beslutning) kræver forskellige beregninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Centrale principper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb"]}, {"id": "ØS-term-L2-001", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omkostning", "back": "Værdien af de ressourcer, virksomheden forbruger for at opnå et bestemt mål (materialer, løn, husleje, energi, maskiner). Faktisk/historisk kostpris = reelt afholdte omkostninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-002", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Udgift, udbetaling og omkostning", "back": "Udgift: ved anskaffelse af ressourcen (køb af maskine). Udbetaling: når der betales. Omkostning: når ressourcen forbruges (afskrivninger på maskinen).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Udgift, omkostning og udbetaling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-003", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omkostningsobjekt (cost object)", "back": "Det man ønsker at kende omkostningen for: produkt, produktlinje, kunde, afdeling, marked, datterselskab. Valget afgør, om en omkostning er direkte eller indirekte.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Omkostningsobjekter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-004", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omkostningsakkumulering vs. -fordeling", "back": "Akkumulering: registrering/opsamling i regnskabssystemet. Fordeling: tildeling til et omkostningsobjekt – enten direkte sporing eller via fordelingsnøgler.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Omkostningsakkumulering og omkostningsfordeling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-005", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Direkte omkostning", "back": "Kan spores direkte til omkostningsobjektet på en økonomisk hensigtsmæssig måde (træ og glas i et vindue).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Direkte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-006", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Indirekte omkostning", "back": "Kan ikke spores direkte til objektet på en økonomisk hensigtsmæssig måde (fabrikschefens løn, husleje, rengøring). Fabrikschefens løn er direkte for fabrikken, indirekte for vinduet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Indirekte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-007", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Variable og faste omkostninger", "back": "Variable ændrer sig med aktiviteten (styr à 52 € × antal cykler). Faste ændrer sig ikke (fabriksleje 94.500 €) – kaldes kapacitetsomkostninger. Uafhængig af direkte/indirekte (fastansat produktionsmedarbejder: direkte men fast).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Variable og faste omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-008", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Cost driver", "back": "Den faktor der påvirker størrelsen af en omkostning – forklarer hvorfor den opstår (materialer → enheder, fragt → leverancer, el → maskintimer). Central i ABC.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Cost Drivers", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-009", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Relevant interval", "back": "Det aktivitetsinterval hvor faste omkostninger er faste (fx 1.000–5.000 cykler). Udenfor kræves flere lokaler/maskiner, og de faste omk. stiger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Relevant interval", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L2-010", "course": "ØS", "lecture": 2, "type": "card", "kind": "metode", "front": "Enhedsomkostning", "back": "Samlede omkostninger / antal producerede enheder. Varsomhed: den faste del pr. enhed falder med volumen, så enhedsomk. ved én mængde er misvisende ved en anden – brug samlede variable og faste omk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Enhedsomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "metode"]}, {"id": "ØS-term-L2-011", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kapitaliserede omkostninger (produktomkostninger) vs. periodeomkostninger", "back": "Kapitaliserede placeres på lageret og bliver omkostning (vareforbrug) når varen sælges. Periodeomkostninger udgiftsføres i den periode de afholdes (salg, administration).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Kapitaliserede omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb"]}, {"id": "ØS-term-L3-001", "course": "ØS", "lecture": 3, "type": "card", "kind": "model", "front": "Job-costing", "back": "Beregner omkostningen ved et specifikt job/projekt/ordre som selvstændigt omkostningsobjekt. Bruges når opgaver er forskellige (entreprenører, konsulenter, revision, specialproduktion) – til pris, lønsomhed, planlægning og kontrol.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "model"]}, {"id": "ØS-term-L3-002", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Cost tracing vs. cost allocation", "back": "Tracing: direkte omk. spores til jobbet. Allocation: indirekte omk. fordeles via fordelingsnøgle. Jo større andel der spores, desto mere præcis beregning.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Direkte og indirekte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb"]}, {"id": "ØS-term-L3-003", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Cost pool", "back": "En samling af indirekte omkostninger, der senere fordeles (fx produktions-overhead: el, husleje, vedligehold, produktionsledelse).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Cost Pool", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb"]}, {"id": "ØS-term-L3-004", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Cost allocation base", "back": "Fordelingsnøglen for indirekte omk. (maskintimer, arbejdstimer, materialeforbrug, enheder) – bør afspejle hvad der driver omkostningerne.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Cost Allocation Base", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb"]}, {"id": "ØS-term-L3-005", "course": "ØS", "lecture": 3, "type": "card", "kind": "metode", "front": "Seks-trins modellen (job-costing)", "back": "1) Identificér jobbet, 2) direkte omk. (DM, DL), 3) vælg fordelingsnøgle, 4) saml indirekte omk. i cost pool, 5) overheadsats = indirekte omk. / aktivitetsbase, 6) jobomk. = DM + DL + sats × jobbets forbrug.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Den seks-trins model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "metode"]}, {"id": "ØS-term-L3-006", "course": "ØS", "lecture": 3, "type": "card", "kind": "metode", "front": "Overheadsats", "back": "Indirekte omkostninger / aktivitetsbase. Eks.: 65.100 / 2.480 MT = 26,25 kr./MT; job med 500 MT får 13.125 kr.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Eksempel på job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "metode"]}, {"id": "ØS-term-L3-007", "course": "ØS", "lecture": 3, "type": "card", "kind": "metode", "front": "Bruttoavance og bruttomargin", "back": "Bruttoavance = omsætning − COGS (104.800 − 72.125 = 32.675). Bruttomargin = bruttoavance / omsætning (31,2 %) – andel tilbage efter vareomkostningerne.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Bruttoavance", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "metode"]}, {"id": "ØS-term-L3-008", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Faktisk vs. normal costing", "back": "Faktisk: reelle omk. og satser – præcist, men kendes først sent. Normal: faktiske direkte omk. + budgetteret overheadsats × faktisk forbrug – rettidigt; afvigelse (under/overabsorption) justeres ved periodens slut.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Faktiske omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb"]}, {"id": "ØS-term-L3-009", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Produktionsformer og kalkulationsmetode", "back": "Produktion efter ordre → job-costing; serieproduktion → kombination; masseproduktion af identiske varer → process-costing. Vestas: fra projektorienteret mod mere procesorienteret, havvindprojekter stadig job.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Produktionsformer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb"]}, {"id": "ØS-term-L4-001", "course": "ØS", "lecture": 4, "type": "card", "kind": "model", "front": "Process-costing", "back": "Enhedsomkostningen findes som gennemsnit af de samlede omkostninger over ens produkter, der behandles ensartet (bryggerier, cement, mursten). Kræver langt færre registreringer end job-costing; separat WIP-konto pr. afdeling.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Hvornår anvendes process-costing?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "model"]}, {"id": "ØS-term-L4-002", "course": "ØS", "lecture": 4, "type": "card", "kind": "model", "front": "De fem trin i process-costing", "back": "1) Fysiske enheder (primo-WIP + påbegyndt = færdige + WIP ultimo), 2) ækvivalente enheder pr. omkostningstype, 3) omk. pr. ækvivalent enhed, 4) samlede omk. at gøre rede for, 5) fordel til færdige/videreførte enheder og WIP ultimo.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › De fem trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "model"]}, {"id": "ØS-term-L4-003", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Ækvivalente enheder", "back": "Fysiske enheder × færdiggørelsesgrad – omregner WIP til færdige enheder. Graden kan være forskellig for materialer (fx 100 %) og fremstilling (fx 20 %). Snowdon: fremstilling 30.000 + 5.000 × 20 % = 31.000.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Ækvivalente enheder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode"]}, {"id": "ØS-term-L4-004", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Omkostning pr. ækvivalent enhed", "back": "Omkostninger for typen / ækvivalente enheder for typen (Snowdon: materialer 84.050/35.000 = 2,4014; fremstilling 62.000/31.000 = 2,00). Beregnes separat for materialer og fremstilling.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Snowdon Ltd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode"]}, {"id": "ØS-term-L4-005", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Vægtet gennemsnit (WA)", "back": "Gennemsnitlig enhedsomk. for alt udført arbejde uanset periode: (primo-WIP-omk. + periodens omk.) / alle ækvivalente enheder (færdige + WIP ultimo). Snowdon: materialer 86.400/36.000 = 2,40; fremstilling 67.200/32.000 = 2,10.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Vægtet gennemsnit (WA)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode"]}, {"id": "ØS-term-L4-006", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "FIFO (process-costing)", "back": "Først færdiggøres primo-WIP, derefter påbegyndes nye enheder. Ækv. enheder = arbejde for at færdiggøre primo-WIP + påbegyndt og afsluttet + WIP ultimo; kun periodens omk. indgår i satsen (fremstilling 62.000/31.400 = 1,975).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › FIFO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode"]}, {"id": "ØS-term-L4-007", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "WA vs. FIFO – forskel", "back": "Forskellen opstår når omk. pr. ækv. enhed i primo-WIP afviger fra periodens. WA blander gamle og nye priser (høje priser 'forurener' WIP/COGS længe); FIFO holder perioderne adskilt. Total at gøre rede for er ens (Snowdon 153.600).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Sammenligning af WA og FIFO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb"]}, {"id": "ØS-term-L4-008", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Kontrol i process-costing", "back": "Videreførte enheders omk. + WIP ultimo = omkostninger at gøre rede for (primo-WIP + periodens omk.).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Eksamensfokus", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode"]}, {"id": "ØS-term-L4-009", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "Standard costing i process-costing", "back": "Fast standardomk. pr. inputenhed for perioden (fx 74 kr. materialer, 54 kr. fremstilling pr. stk.) – stabil og forenkler beregningen; samme procedure som FIFO/WA.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Standard costing i process-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb"]}, {"id": "ØS-term-L4-010", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "Transferred-in costs", "back": "Omkostninger der følger med enhederne fra én afdeling til den næste (fx støberi → montage). Behandles som en ekstra omkostningstype i den modtagende afdeling (100 % færdige ved modtagelse).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Transferred-in costs", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb"]}, {"id": "ØS-term-L4-011", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "Bogføring i process-costing", "back": "WIP-konto pr. afdeling debiteres med materialer og fremstillingsomk.; færdige enheder overføres til næste afdelings WIP → færdigvarer → COGS; resten bliver i WIP ultimo.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Bogføring i process-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb"]}, {"id": "ØS-term-L5-001", "course": "ØS", "lecture": 5, "type": "card", "kind": "begreb", "front": "Omkostningsallokering", "back": "Fordeling af indirekte og fælles omkostninger mellem omkostningsobjekter via en allokeringsbase (medarbejdere, løntimer, maskintimer, m², ordrer). Skal være logisk, relevant og anvendelig for beslutningen – ikke 'objektivt korrekt'.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Omkostningsallokering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "begreb"]}, {"id": "ØS-term-L5-002", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Allokeringsrate", "back": "Allokeringsrate = omk. i puljen / samlet mængde af basen. Allokeret omk. = objektets forbrug af basen × raten.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Omkostningsallokering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode"]}, {"id": "ØS-term-L5-003", "course": "ØS", "lecture": 5, "type": "card", "kind": "model", "front": "Fire kriterier for valg af allokeringsbase", "back": "Årsag og virkning (stærkest), modtagne fordele (hvem har gavn), retfærdighed/rimelighed (kontrakter, subjektivt) og evnen til at bære omkostningen (svag sammenhæng med ressourceforbrug). I praksis mest de to første.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Kriterier for fordeling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "model"]}, {"id": "ØS-term-L5-004", "course": "ØS", "lecture": 5, "type": "card", "kind": "model", "front": "Fire formål med omkostningsallokering", "back": "Information til økonomiske beslutninger (pris, lønsomhed, outsourcing), motivation af ledere og medarbejdere, retfærdiggørelse og refusion (kontrakter), måling af indkomst og aktiver (lager, COGS).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Fire formål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "model"]}, {"id": "ØS-term-L5-005", "course": "ØS", "lecture": 5, "type": "card", "kind": "begreb", "front": "Fællesomkostninger (common costs)", "back": "Opstår når en ressource eller aktivitet understøtter flere omkostningsobjekter (hovedkontor, økonomi, HR).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Fællesomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "begreb"]}, {"id": "ØS-term-L5-006", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Single-rate-metoden", "back": "Faste og variable supportomk. i én pulje fordelt med én sats: budgetterede omk. / budgetteret mængde af basen (IT: 1.000.000/10.000 = 100 pr. time). Enkel, men skjuler forskellen på fast og variabel.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Single-rate-metoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode"]}, {"id": "ØS-term-L5-007", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Dual-rate-metoden", "back": "Variable omk. fordeles efter faktisk forbrug med variabel sats; faste omk. fordeles efter budgetteret/planlagt kapacitetsbehov. Giver bedre adfærd og kontrollerbarhed.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Dual-rate-metoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode"]}, {"id": "ØS-term-L5-008", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Direkte metode (serviceafdelinger)", "back": "Supportomk. fordeles kun til driftsafdelinger; ydelser mellem supportafdelinger ignoreres. Enkel, men mindst præcis.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Den direkte metode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode"]}, {"id": "ØS-term-L5-009", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Trinvis metode", "back": "Supportafdelinger fordeles i en rækkefølge (typisk den der yder mest til andre først); en fordelt afdeling modtager ikke senere omk. Delvis anerkendelse af gensidige ydelser.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Den trinvise metode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode"]}, {"id": "ØS-term-L5-010", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Reciprok metode", "back": "Fuld anerkendelse af gensidige ydelser mellem supportafdelinger via ligningssystem. Mest præcis, men mest kompleks. Kontrol: totale omk. før = efter allokering (allokering skaber ikke nye omk.).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Den reciprokke metode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode"]}, {"id": "ØS-term-L6-001", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Fællesproduktion", "back": "Én proces frembringer samtidig flere produkter (råmælk → fløde og skummetmælk; råolie → benzin, diesel). Fællesomkostningerne har ingen direkte årsagssammenhæng med det enkelte produkt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesproduktion", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb"]}, {"id": "ØS-term-L6-002", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Fællesomkostninger (joint costs)", "back": "Omkostningerne ved den fælles proces før produkterne bliver særskilt identificerbare – skal fordeles med en valgt metode.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb"]}, {"id": "ØS-term-L6-003", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Opsplitningspunkt (split-off point)", "back": "Tidspunktet/procestrinnet hvor produkterne bliver særskilt identificerbare; derefter kan de sælges, videreforarbejdes eller lagres.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Opsplitningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb"]}, {"id": "ØS-term-L6-004", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Separate omkostninger (separable costs)", "back": "Omkostninger efter opsplitningspunktet, som kan henføres til ét produkt (videreforarbejdning, emballage, kvalitetskontrol, distribution).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Separate omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb"]}, {"id": "ØS-term-L6-005", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Fællesprodukt, hovedprodukt, biprodukt, skrot", "back": "Klassificeres efter relativ salgsværdi: fællesprodukter har hver høj værdi; hovedprodukt klart størst; biprodukt lav værdi (kan ændre sig – valle); skrot meget lav; affald ingen/negativ værdi.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesprodukter, hovedprodukter og biprodukter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb"]}, {"id": "ØS-term-L6-006", "course
