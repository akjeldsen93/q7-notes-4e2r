.000 + 150.000 = 250.000 (125/enh.). B var undercostet – krydssubsidiering.", "level": "svaer", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 511, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "calc", "svaer"]}, {"id": "ØS-term-L10-001", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Budget vs. budgettering", "back": "Budget: omfattende økonomisk overblik over planlagte aktiviteter (den økonomiske konsekvensprognose). Budgettering: periodisk valg af handlingsprogram ledsaget af økonomisk konsekvensprognose (processen) – Andersen & Rohde.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budget og budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 512}, {"id": "ØS-term-L10-003", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Fordele ved budgetter", "back": "Planlægning (nødvendiggør planer og implementering), præstationskriterier (benchmark) og koordination/kommunikation. Mellemhøj sværhedsgrad giver højest faktisk præstation.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Fordele ved budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 513}, {"id": "ØS-term-L10-004", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Udfordringer ved budgettering", "back": "Ressourcekrævende, rigidt, datamanipulation, stridigheder mellem afdelinger, pres og stress, gaming, kortsigtet, suboptimering (Welch: forandring udefra hurtigere end indefra).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Udfordringer ved budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 514}, {"id": "ØS-term-L10-005", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Budgettyper og horisonter", "back": "Strategisk plan (længst) → langsigtet plan (5–10 år, koordineret med investeringsbudget) → investeringsbudget (faciliteter, maskiner, nye produkter) → masterbudget (forbinder kort og lang sigt).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budgettyper og tidshorisonter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 515}, {"id": "ØS-term-L10-006", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Rullende budget", "back": "Der tilføjes en ny periode, når en er overstået – altid samme horisont (fx 12 mdr.); kontinuerlig proces; svar på rigiditetskritikken, men mere ressourcekrævende.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Rullende budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 516}, {"id": "ØS-term-L10-011", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Padding / budgetary slack", "back": "Bevidst for lave indtægts- eller for høje omkostningsestimater, så budgettet bliver lettere at nå – svækker budgettet som planlægnings- og præstationsværktøj.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Padding og budgetary slack", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 517}, {"id": "ØS-term-L10-002", "course": "ØS", "lecture": 10, "type": "card", "kind": "model", "front": "Budgetteringscyklussen", "back": "Planlægning: mål → strategi og planer → masterbudget. Styring: realisér → mål og evaluér mod budget → reevaluér mål og planer.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budgetteringscyklussen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "model", "grund"], "level": "grund", "order": 518}, {"id": "ØS-term-L10-007", "course": "ØS", "lecture": 10, "type": "card", "kind": "model", "front": "Masterbudget", "back": "Driftsbudget (operationelt: salg, produktion, materialer, løn, IPO, slutlager, vareforbrug, øvrige omk. → budgetteret resultatopgørelse) + finansielle budgetter (investering, likviditet, budgetteret balance).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Masterbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "model", "grund"], "level": "grund", "order": 519}, {"id": "ØS-term-L10-014", "course": "ØS", "lecture": 10, "type": "card", "kind": "sammenligning", "front": "Statisk vs. rullende budget", "back": "Statisk: fast periode (fx kalenderår), horisonten skrumper. Rullende: en ny periode tilføjes, når én udløber – altid samme horisont, men mere ressourcekrævende.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Rullende budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 520, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "sammenligning", "grund"]}, {"id": "ØS-term-L10-008", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Salgsbudget", "back": "Budgetteret omsætning = forventet salg i enheder × pris. Udgangspunktet for alle øvrige budgetter – fejl forplanter sig.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Trin 1: Salgsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 521}, {"id": "ØS-term-L10-009", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Produktionsbudget", "back": "Produktion = budgetteret salg + ønsket lager ultimo − lager primo. Wessex: 5.000 + 1.100 − 100 = 6.000 Regular.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Trin 2: Produktionsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 522}, {"id": "ØS-term-L10-010", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Materialeforbrugs- og indkøbsbudget", "back": "Forbrug = produktion × materialer pr. enhed. Indkøb = forbrug + ønsket materialelager ultimo − primo; × pris.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Driftsbudgettet trin for trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 523}, {"id": "ØS-term-L10-012", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Følsomhedsanalyse i budgettering", "back": "Computerbaserede planlægningsmodeller beregner hvordan budgettet ændres, når forudsætninger (pris, volumen, omk.) ændres – 'hvad nu hvis'.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Computerbaserede planlægningsmodeller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 524}, {"id": "ØS-term-L10-013", "course": "ØS", "lecture": 10, "type": "card", "kind": "eksempel", "front": "Eksempel: produktionsbudget (Wessex)", "back": "Produktion = salg + ønsket lager ultimo − lager primo. Regular: 5.000 + 1.100 − 100 = 6.000. Heavy-duty: 1.000 + 50 − 50 = 1.000.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Produktionsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 525, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "eksempel", "eksamen"]}, {"question": "Budgettering er ifølge Andersen & Rohde:", "options": ["Den økonomiske konsekvensprognose", "Et periodisk valg af handlingsprogram ledsaget af en periodisk økonomisk konsekvensprognose", "Et regnskab", "En kontrolrapport"], "answer": 1, "explanation": "Budgettering = periodisk valg af handlingsprogram + økonomisk konsekvensprognose (processen). Forkert: konsekvensprognosen er budgettet (resultatet); regnskab og kontrolrapport er bagudrettede.", "id": "ØS-mc-070", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L10", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budget og budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 526}, {"question": "[Begrebsspørgsmål] Hvad er et masterbudget, og hvilke delbudgetter består det af?", "model": "Sammenholder kortsigtede og langsigtede planer. Operationelt budget (salg, produktion, materialer, løn, IPO, slutlager, vareforbrug, øvrige omk., budgetteret resultatopgørelse) + finansielt budget (investerings-, likviditets-, balancebudget).", "id": "ØS-sa-090", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L10", "open", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Masterbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 527}, {"id": "ØS-sa-101", "course": "ØS", "lecture": 10, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Salg 8.000 enh.; ønsket færdigvarelager ultimo 1.000, primo 600. 3 kg materiale pr. enhed; materialelager ultimo 2.000 kg, primo 1.500 kg; 15 kr./kg. Beregn produktion og materialeindkøb.", "model": "Produktion = 8.000 + 1.000 − 600 = 8.400. Forbrug = 25.200 kg. Indkøb = 25.200 + 2.000 − 1.500 = 25.700 kg × 15 = 385.500 kr.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 528, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "calc", "eksamen"]}, {"id": "ØS-term-L11-003", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Ansvarscenter", "back": "Organisationsenhed hvor lederen holdes ansvarlig for aktiviteten – 'en lille virksomhed i virksomheden'. Mål skal være specifikke, målbare og målkongruente.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 529}, {"id": "ØS-term-L11-009", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Kontrollabilitetsprincippet", "back": "Lederen holdes kun ansvarlig for omk. og forhold, vedkommende kan påvirke i perioden; ikke-kontrollerbare omk. ekskluderes. Hvem har bedst viden til at styre omkostningen?", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Kontrollabilitetsprincippet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 530}, {"id": "ØS-term-L11-010", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Fordele og ulemper ved ansvarscentre", "back": "+ lokal information, hurtigere respons, frigør topledelsen, mindre kompleksitet, træning af ledere, motivation. − suboptimering, lokale mål frem for globale, intern konkurrence, dobbeltfunktioner, svært at finde målkongruente mål.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Fordele og ulemper ved ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 531}, {"id": "ØS-term-L11-012", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Profit vs. likviditet", "back": "Betalingsbetingelser (faktura og betaling i forskellige måneder), afdrag på gæld (kun likviditet), afskrivninger (kun resultat). Man kan have profit og alligevel gå konkurs.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 532}, {"id": "ØS-term-L11-004", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Standard omkostningscenter", "back": "Output kan måles og inputkrav specificeres pr. enhed (produktion). Ansvar: effektivitet i at opfylde efterspørgsel og produktionsplan med kvalitet og rettidighed – ikke omsætning eller profit.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Standard omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 533}, {"id": "ØS-term-L11-005", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Discretionary omkostningscenter", "back": "Output kan ikke måles finansielt/svag input-output-sammenhæng (R&D, HR, support). Ansvar: inputniveauet; evalueres via benchmarking eller relativt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Discretionary omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 534}, {"id": "ØS-term-L11-006", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Omsætningscenter", "back": "Salgsafdelinger med ansvar for omsætning (hvis de sætter priser) eller mængde og mix. Risiko: 'volumensyge' uden hensyn til produktionsomk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Omsætningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 535}, {"id": "ØS-term-L11-007", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Profitcenter", "back": "Ansvar for omsætning og omkostninger (indkøb, produktion, salg), ikke investering og finansiering – fx en SBU, butik eller hotel.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Profitcenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 536}, {"id": "ØS-term-L11-008", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Investeringscenter", "back": "Profitansvar + investeringsansvar (aktiver), oftest ikke finansiering. Måles på afkastningsgrad (ROI) eller EVA.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Investeringscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 537}, {"id": "ØS-term-L11-014", "course": "ØS", "lecture": 11, "type": "card", "kind": "sammenligning", "front": "Profitcenter vs. investeringscenter", "back": "Profitcenter: ansvar for omsætning og omk. Investeringscenter: desuden ansvar for de investerede aktiver – måles på ROI eller EVA.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 538, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "sammenligning", "grund"]}, {"id": "ØS-term-L11-001", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Kaizen-budgettering", "back": "Indarbejder løbende forbedringer i de budgetterede tal gennem perioden (3,00 → 2,95 → 2,90 → 2,85 timer pr. enhed pr. kvartal).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Kaizen-budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode", "eksamen"], "level": "eksamen", "order": 539}, {"id": "ØS-term-L11-002", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Activity-Based Budgeting (ABB)", "back": "Stage 1 (ikke-finansielt): efterspørgsel efter objekter → aktiviteter → ressourcebehov (200 kunder × 1 besøg / 100 besøg pr. sælger = 2 sælgere). Stage 2 (finansielt): kroner på ressourcerne → omk. pr. aktivitet (400.000/200 = 2.000 kr. pr. besøg).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Activity-Based Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode", "eksamen"], "level": "eksamen", "order": 540}, {"id": "ØS-term-L11-011", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Likviditetsbudget", "back": "Forventede pengestrømme ind og ud af kassen pr. måned (underskud/overskud). Indbetalinger efter betalingsmønster (Maui: 50 % samme måned, 27 % næste, 20 % 2. måned, 3 % tab).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode", "eksamen"], "level": "eksamen", "order": 541}, {"id": "ØS-term-L11-013", "course": "ØS", "lecture": 11, "type": "card", "kind": "eksempel", "front": "Eksempel: likviditet – indbetalinger", "back": "Mønster 50/27/20 % (3 % tab). Marts = 0,50 × marts-salg + 0,27 × februar + 0,20 × januar. Salg 100.000/120.000/80.000 ⇒ 40.000 + 32.400 + 20.000 = 92.400.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 542, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "eksempel", "eksamen"]}, {"question": "Et R&D-center, hvor output ikke kan måles finansielt, er et:", "options": ["Standard omkostningscenter", "Discretionary omkostningscenter", "Profitcenter", "Investeringscenter"], "answer": 1, "explanation": "Discretionary omkostningscenter – output kan ikke måles finansielt, så der styres på inputniveau. Forkert: standardcenter kræver målbart output; profit- og investeringscentre har ansvar for omsætning.", "id": "ØS-mc-071", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L11", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Discretionary omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 543}, {"question": "Hvilken post ses i resultatet men IKKE i likviditetsbudgettet?", "options": ["Afdrag på gæld", "Afskrivninger", "Kundeindbetalinger", "Lønudbetalinger"], "answer": 1, "explanation": "Afskrivninger påvirker resultatet men er ingen betaling. Forkert: afdrag på gæld påvirker kun likviditeten; kundeindbetalinger og lønudbetalinger er betalinger.", "id": "ØS-mc-072", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L11", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 544}, {"question": "[Eksamensstil] Kunder betaler 50 % i salgsmåneden, 27 % måneden efter, 20 % 2. måned efter (3 % tab). Salg: jan 100.000, feb 120.000, mar 80.000. Indbetalinger i marts?", "model": "0,50·80.000 + 0,27·120.000 + 0,20·100.000 = 40.000 + 32.400 + 20.000 = 92.400 kr.", "id": "ØS-sa-084", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L11", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget (Maui Diving)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 545}, {"question": "[Eksamensstil] ABB: 200 kunder, 1 besøg/år hver, en sælger klarer 100 besøg, sælgerløn 200.000. Beregn ressourcebehov og omkostning pr. besøg.", "model": "200 besøg / 100 = 2 sælgere; pulje 400.000; pr. besøg 400.000/200 = 2.000 kr.", "id": "ØS-sa-085", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L11", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Activity-Based Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 546}, {"id": "ØS-term-L12-001", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Budgetopfølgning og varianser", "back": "Sammenligning af faktisk og planlagt; den overordnede afvigelse dekomponeres for at finde årsagen. F (fordelagtig) forbedrer, U (ufordelagtig) forværrer driftsresultatet ift. budget.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Budgetopfølgning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 547}, {"id": "ØS-term-L12-009", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Fortolkning af varianser", "back": "Årsager hænger sammen: billige materialer (F prisvarians) kan give U mængde- og timevarianser. Ufordelagtig løneffektivitet: dårlig træning, materialer, udstyr eller supervision. Placér ansvar hvor det kan påvirkes.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Fortolkning og ansvar", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 548}, {"id": "ØS-term-L12-010", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Effektivitet vs. efficiens", "back": "Effektivitet: i hvilken grad mål er opnået. Efficiens: input brugt for et givent output. Vægtes kun ét mål, optimeres det på bekostning af andre.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Fokus på mere end prisvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 549}, {"id": "ØS-term-L12-011", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Benchmarking og Beyond Budgeting", "back": "Benchmarking: sammenligning med interne enheder, branchen og konkurrenter. Beyond Budgeting (Hope & Fraser): relative mål og belønning, kontinuert planlægning, on-demand ressourcer, decentralisering.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Benchmarking og Beyond Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 550}, {"id": "ØS-term-L12-002", "course": "ØS", "lecture": 12, "type": "card", "kind": "model", "front": "Tre variansniveauer", "back": "Niveau 1: faktisk vs. statisk budget. Niveau 2: fleksibelt budget-varians + salgsvolumenvarians. Niveau 3: pris- og forbrugsvarians (DM, DL – og IPO i kap. 16).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Tre variansniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "model", "grund"], "level": "grund", "order": 551}, {"id": "ØS-term-L12-013", "course": "ØS", "lecture": 12, "type": "card", "kind": "sammenligning", "front": "Prisvarians vs. forbrugsvarians", "back": "Pris: (AP − SP) × AQ – betalte vi mere/mindre pr. enhed input? Typisk indkøb. Forbrug: (AQ − SQ) × SP – brugte vi mere/mindre input end tilladt for faktisk output? Typisk produktion.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 552, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "sammenligning", "grund"]}, {"id": "ØS-term-L12-003", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Statisk budget-varians (niveau 1)", "back": "Faktisk resultat − statisk budget (jakker: 25.000 − 262.000 = 237.000 U). Viser kun at der er en afvigelse.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 1", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 553}, {"id": "ØS-term-L12-004", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Fleksibelt budget", "back": "Budgettet genberegnet ved faktisk output: budgetpris × faktisk antal, budgetteret VC × faktisk antal, budgetterede FC (10.000 × 180 = 1,8 mio.; 10.000 × 99 = 990.000).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 554}, {"id": "ØS-term-L12-005", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Fleksibelt budget-varians", "back": "Faktisk − fleksibelt budget; viser pris- og effektivitetseffekter ved faktisk output (jakker: 75.000 U).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 555}, {"id": "ØS-term-L12-006", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Salgsvolumenvarians (planning varians)", "back": "Fleksibelt budget − statisk budget; effekten af at sælge et andet antal end budgetteret (162.000 U). Kontrol: 75.000 U + 162.000 U = 237.000 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 556}, {"id": "ØS-term-L12-007", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Prisvarians", "back": "(AP − SP) × AQ: faktisk inputpris − budgetteret pris, gange faktisk inputmængde. Stof: (31 − 30) × 22.200 = 22.200 U. Ved lagerændring beregnes den på indkøbt mængde.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 557}, {"id": "ØS-term-L12-008", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Forbrugsvarians (efficiens)", "back": "(AQ − SQ) × SP: faktisk mængde − tilladt mængde for faktisk output (SQ = output × standard), gange budgetpris. Stof: (22.200 − 20.000) × 30 = 66.000 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 558}, {"id": "ØS-term-L12-012", "course": "ØS", "lecture": 12, "type": "card", "kind": "eksempel", "front": "Eksempel: variansniveauer (jakker)", "back": "Niveau 1: 25.000 − 262.000 = 237.000 U. Niveau 2: fleksibelt budget 100.000 ⇒ fleksibelt budget-varians 75.000 U og salgsvolumenvarians 162.000 U. Niveau 3: DM pris 22.200 U, forbrug 66.000 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Tre variansniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 559, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "eksempel", "eksamen"]}, {"question": "Salgsvolumenvarians =", "options": ["Faktisk − fleksibelt budget", "Fleksibelt budget − statisk budget", "Faktisk − statisk budget", "(AP − SP) × AQ"], "answer": 1, "explanation": "Salgsvolumenvarians = fleksibelt − statisk budget. Forkert: faktisk − fleksibelt = fleksibelt budget-varians; faktisk − statisk = niveau 1; (AP − SP) × AQ = prisvarians.", "id": "ØS-mc-073", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L12", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 560}, {"question": "Stof: AP 31, SP 30, AQ 22.200 m², SQ 20.000 m². Forbrugsvarians?", "options": ["22.200 U", "66.000 U", "66.600 U", "2.200 F"], "answer": 1, "explanation": "(AQ − SQ) × SP = (22.200 − 20.000) × 30 = 66.000 U. Forkert: 22.200 U er prisvariansen; 66.600 bruger AP 31 i stedet for SP; 2.200 er mængdeforskellen uden kroner.", "id": "ØS-mc-074", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L12", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 561}, {"id": "ØS-mc-105", "course": "ØS", "lecture": 12, "type": "mc", "kind": "mc", "question": "Indkøbsafdelingen køber billigere, dårligere materialer. Hvilket mønster forventes?", "options": ["F prisvarians og U forbrugsvarians", "U prisvarians og F forbrugsvarians", "F begge", "Ingen effekt"], "answer": 0, "explanation": "Billigere input ⇒ fordelagtig prisvarians, men mere spild ⇒ ufordelagtig forbrugsvarians. Varianser hænger sammen og skal fortolkes samlet.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 562, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "mc", "eksamen"]}, {"question": "[Eksamensstil] Materiale: SP 10 kr./kg, standard 0,48 kg/enh.; faktisk output 10.000 enh.; faktisk forbrug 5.000 kg à 12 kr. Beregn pris- og forbrugsvarians.", "model": "SQ = 4.800 kg. Pris = (12 − 10) × 5.000 = 10.000 U. Forbrug = (5.000 − 4.800) × 10 = 2.000 U. Samlet 12.000 U.", "id": "ØS-sa-087", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L12", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 563}, {"question": "[Begrebsspørgsmål] Hvad er forskellen mellem statisk budgetvarians og fleksibel budgetvarians?", "model": "Statisk: faktisk − statisk budget (niveau 1), blander volumen- og effektivitetseffekter. Fleksibel: faktisk − fleksibelt budget (budgettet genberegnet ved faktisk output), isolerer pris/effektivitet. Differencen er salgsvolumenvariansen.", "id": "ØS-sa-091", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L12", "open", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 564}, {"id": "ØS-sa-102", "course": "ØS", "lecture": 12, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Standard 2 DLH pr. enhed à 200 kr. Output 1.000 enh. Faktisk 2.100 DLH à 190 kr. Beregn løn-pris- og effektivitetsvarians.", "model": "Pris = (190 − 200) × 2.100 = 21.000 F. Effektivitet = (2.100 − 2.000) × 200 = 20.000 U. Samlet 1.000 F.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 565, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "calc", "eksamen"]}, {"question": "[Eksamensstil] Budget: pris 180, VC 99, FC 710.000, 12.000 enh. Faktisk: 10.000 enh., resultat 25.000. Beregn statisk budgetresultat, fleksibelt budget og salgsvolumen-/fleksibelt budget-varians.", "model": "Statisk: 12.000 × 81 − 710.000 = 262.000. Fleksibelt: 10.000 × 81 − 710.000 = 100.000. Salgsvolumenvarians = 100.000 − 262.000 = 162.000 U. Fleksibelt budget-varians = 25.000 − 100.000 = 75.000 U. Samlet 237.000 U.", "id": "ØS-sa-086", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L12", "calc", "svaer"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 1 og 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "svaer", "order": 566}, {"id": "ØS-term-L13-001", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Variable og faste IPO", "back": "Variable indirekte produktionsomk. varierer med mængden (el, vand, maskinvedligehold, indirekte materialer). Faste varierer ikke (leasing, fabrikschefens løn, afskrivninger).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variable og faste IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb", "grund"], "level": "grund", "order": 567}, {"id": "ØS-term-L13-009", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Planlægning/kontrol vs. lagerværdiansættelse", "back": "Faste omk. planlægges og kontrolleres som kendte beløb. Allokerede faste omk. til lager er gjort variable for at beregne kostpris og kan ikke bruges til planlægning og kontrol.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Planlægning og kontrol vs. lagerværdiansættelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb", "grund"], "level": "grund", "order": 568}, {"id": "ØS-term-L13-008", "course": "ØS", "lecture": 13, "type": "card", "kind": "model", "front": "4- og 3-varians-analyse", "back": "4-varians: variabel IPO pris + efficiens; fast IPO spending + produktionsvolumen. 3-varians: r Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 572}, {"id": "ØS-term-L13-004", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: efficiensvarians", "back": "(Faktiske timer − budgetterede timer for faktisk output) × budgetsats = (4.500 − 4.000) × 30 = €15.000 U. Måler effektiviteten i brugen af fordelingsnøglen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 573}, {"id": "ØS-term-L13-005", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: prisvarians (spending)", "back": "(Faktisk sats − budgetsats) × faktiske timer = (29 − 30) × 4.500 = €4.500 F.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 574}, {"id": "ØS-term-L13-006", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Fast IPO: spending-varians", "back": "Faktisk − budgetteret (fleksibelt = statisk) fast IPO = 285.000 − 276.000 = €9.000 U. Faste omk. har aldrig efficiensvarians.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 575}, {"id": "ØS-term-L13-007", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Produktionsvolumenvarians", "back": "Budgetteret fast IPO − allokeret fast IPO (faktisk output × sats pr. enhed) = 276.000 − 10.000 × 23 = €46.000 U. Opstår kun for faste omk., fordi en fast pulje omregnes til en sats ved budgetteret kapacitet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Produktionsvolumenvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 576}, {"id": "ØS-term-L13-010", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Varianser i ABC (setup)", "back": "Fleksibelt budget: faktisk output / budgetteret seriestørrelse = antal setups × budgetterede timer pr. setup × sats (1.008 × 6 × 20 = 120.960). Pris = (21 − 20) × 6.750 = 6.750 U; efficiens = (6.750 − 6.048) × 20 = 14.040 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Varianser i ABC/ABB – setup", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 577}, {"id": "ØS-term-L13-013", "course": "ØS", "lecture": 13, "type": "card", "kind": "hvorfor", "front": "Hvorfor har faste IPO ingen efficiensvarians?", "back": "Faste omk. ændrer sig ikke med forbruget af fordelingsnøglen på kort sigt – det fleksible budget er lig det statiske, så der er kun spending- og produktionsvolumenvarians.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 578, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "hvorfor", "eksamen"]}, {"id": "ØS-term-L13-012", "course": "ØS", "lecture": 13, "type": "card", "kind": "eksempel", "front": "Eksempel: variabel IPO-varianser", "back": "Budget: 0,4 MT × €30 = €12/jakke. Faktisk 10.000 jakker, 4.500 MT à €29. Efficiens (4.500 − 4.000) × 30 = 15.000 U. Pris (29 − 30) × 4.500 = 4.500 F. Sum = fleksibelt budget-varians 10.500 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 579, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "eksempel", "eksamen"]}, {"question": "Variabel IPO: 4.500 faktiske MT, 4.000 budgetterede MT for faktisk output, sats €30, faktisk €29/MT. Efficiensvarians?", "options": ["€4.500 F", "€15.000 U", "€10.500 U", "€13.500 F"], "answer": 1, "explanation": "(4.500 − 4.000) × 30 = 15.000 U. Forkert: 4.500 F er prisvariansen (29 − 30) × 4.500; 10.500 U er fleksibelt budget-variansen; 13.500 F findes ikke.", "id": "ØS-mc-075", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L13", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 580}, {"question": "Fast IPO budget €276.000; sats €23 pr. jakke; faktisk output 10.000. Produktionsvolumenvarians?", "options": ["€46.000 U", "€9.000 U", "€23.000 F", "0"], "answer": 0, "explanation": "276.000 − 10.000 × 23 = 46.000 U. Forkert: 9.000 U er spending-variansen; 23.000 F er satsen × 1.000; faste omk. giver volumenvarians, når output ≠ budget.", "id": "ØS-mc-076", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L13", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Produktionsvolumenvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 581}, {"id": "ØS-sa-103", "course": "ØS", "lecture": 13, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Fast IPO budget 200.000 ved 10.000 MT (0,5 MT/enh., 20.000 enh.). Faktisk fast IPO 210.000; faktisk output 18.000. Beregn spending- og produktionsvolumenvarians.", "model": "Sats 20/MT ⇒ 10 kr./enh. Spending = 210.000 − 200.000 = 10.000 U. Allokeret = 18.000 × 10 = 180.000 ⇒ volumenvarians = 20.000 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 582, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "calc", "eksamen"]}, {"question": "[Eksamensstil] Fast IPO budget 276.000 (4.800 MT, 0,4 MT/jakke, 12.000 jakker); faktisk 285.000; faktisk output 10.000. Beregn spending- og produktionsvolumenvarians.", "model": "Sats 57,50/MT ⇒ 23 kr./jakke. Spending = 285.000 − 276.000 = 9.000 U. Allokeret = 10.000 × 23 = 230.000; volumenvarians = 276.000 − 230.000 = 46.000 U.", "id": "ØS-sa-088", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L13", "calc", "svaer"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "svaer", "order": 583}]}</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('data').textContent),M=DATA.meta,ITEMS=DATA.items,BYID={};ITEMS.forEach(i=>BYID[i.id]=i);
const KEY='eksamenstraener_v1';
let S=load();function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return s}catch(e){}return{cards:{},att:{},log:[],theme:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5;
// --- filter
function fill(){const fc=$('#fCourse');if(cur==='pod'){fc.innerHTML=`<option value="ØS">ØS – ${esc(M.courses['ØS'].name)}</option>`;fc.value='ØS'}else{fc.innerHTML='<option value="">Alle fag</option>'+Object.keys(M.courses).map(c=>`<option value="${c}">${c} – ${esc(M.courses[c].name)}</option>`).join('');fc.value=S.fc||''}lec()}
function lec(){const c=$('#fCourse').value,fl=$('#fLec');let o='<option value="">Alle lektioner</option>';(c?[c]:Object.keys(M.lectures)).forEach(cc=>Object.entries(M.lectures[cc]).forEach(([l,n])=>o+=`<option value="${cc}|${l}">${c?'':cc+' '}${esc(n)}</option>`));fl.innerHTML=o;fl.value=S.fl||'';if(fl.value!==(S.fl||''))fl.value=''}
function pool(){const c=$('#fCourse').value,l=$('#fLec').value;return ITEMS.filter(i=>(!c||i.course===c)&&(!l||l===i.course+'|'+i.lecture))}
$('#fCourse').onchange=()=>{S.fc=$('#fCourse').value;S.fl='';lec();save();go(cur==='home'?'fc':cur)};$('#fLec').onchange=()=>{S.fl=$('#fLec').value;save();go(cur==='home'?'fc':cur)};
// --- theme
function theme(){const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}
$('#theme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();theme()};
// --- recording
function record(id,ok){const a=S.att[id]||(S.att[id]={c:0,n:0});a.n++;if(ok)a.c++;S.log.push([id,ok?1:0,Date.now()]);if(S.log.length>5000)S.log=S.log.slice(-5000);save()}
const LEVEL={grund:'Grund',eksamen:'Eksamen',svaer:'Svær'};const KIND={eksempel:'Gennemregnet eksempel',sammenligning:'Sammenligning',hvorfor:'Hvorfor / hvornår',begreb:'Begreb',model:'Model',metode:'Metode',def:'Definition',cloze:'Udfyld',app:'Anvendelse',mc:'Multiple choice',calc:'Beregning',open:'Kort svar',oral:'Mundtligt'};
function cv(c){return `--c:var(--${c})`}
function chips(i){return `<span class="chip c" style="${cv(i.course)}">${esc(i.course)}</span><span class="chip">${esc(i.lectureName)}</span><span class="chip">${KIND[i.kind]||i.kind}</span>${i.level?`<span class="chip lv lv-${i.level}">${LEVEL[i.level]}</span>`:''}`}
function src(i){return `<div class="src">Kilde: ${esc(i.source.file)} › ${esc(i.source.section)}</div>`}
// --- SM-2
function sm2(id,g){const q=[1,3,4,5][g],c=S.cards[id]||{ef:2.5,iv:0,reps:0,lapses:0};
 if(q<3){c.reps=0;c.iv=0;c.lapses++;c.due=Date.now()+10*60e3}else{c.reps++;c.iv=c.reps===1?1:c.reps===2?(q===5?4:3):Math.round(c.iv*c.ef*(q===3?0.8:q===5?1.3:1));c.due=Date.now()+c.iv*DAY}
 c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));S.cards[id]=c;record(id,g>0)}
let cur='home',fcQ=[],fcShow=false,fcTot=0;
const V={home:'Oversigt',fc:'Flashcards',quiz:'Quiz',exam:'Eksamen',pod:'Podcast',weak:'Svage områder',stats:'Statistik',data:'Data'};
function nav(){$('#nav').innerHTML=Object.entries(V).map(([k,v])=>`<button data-v="${k}" class="${k===cur?'on':''}">${v}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v){if(v!==cur&&examT)stopExam();const leaving=cur==='pod'&&v!=='pod',entering=v==='pod'&&cur!=='pod';if(leaving)stopPod();if(leaving&&prePod){S.fc=prePod.fc;S.fl=prePod.fl;prePod=null;save()}if(entering){prePod={fc:S.fc||'',fl:S.fl||''};S.fc='ØS';if(!(S.fl||'').startsWith('ØS|'))S.fl='';save()}cur=v;if(entering||leaving)fill();nav();const m=$('#app');m.style.animation='none';m.offsetHeight;m.style.animation='';({home:vHome,fc:vFc,quiz:vQuiz,exam:vExam,pod:vPod,weak:vWeak,stats:vStats,data:vData})[v]();scrollTo({top:0})}
function ring(p,label,c,big){return `<div class="ring${big?' big':''}" style="--p:${Math.round(p)};${c?cv(c):''}"><span>${label}</span></div>`}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function streak(){const days=new Set((S.log||[]).map(l=>dayKey(l[2])));let n=0,d=Date.now();if(!days.has(dayKey(d)))d-=DAY;while(days.has(dayKey(d))){n++;d-=DAY}return n}

function danishVoice(){if(!window.speechSynthesis)return null;const vs=speechSynthesis.getVoices();return vs.find(v=>/^da/i.test(v.lang))||vs.find(v=>/dansk|danish/i.test(v.name))||null}
function hush(){podGen++;clearInterval(podKeep);podKeep=null;if(podTimer){clearTimeout(podTimer);podTimer=null}if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(err){}}}
function stopPod(){pod.playing=false;hush()}
function podSpeak(){hush();const gen=podGen;const ep=podAllEpisodes().find(e=>e.n===pod.lec);if(!ep||!ep.items[pod.idx]){pod.playing=false;renderPod();return}const text=podText(ep.items[pod.idx],pod.idx===0);if(!window.speechSynthesis){podTimer=setTimeout(()=>{if(gen===podGen&&pod.playing)podAdvance(1,false)},Math.max(2800,text.length*55/pod.rate));return}const parts=podChunk(text);let qi=0,retries=0;const step=()=>{if(gen!==podGen||!pod.playing)return;if(qi>=parts.length){podAdvance(1,false);return}const u=new SpeechSynthesisUtterance(parts[qi++]);u.lang='da-DK';u.rate=pod.rate;const voice=danishVoice();if(voice)u.voice=voice;let started=false;const t0=Date.now();u.onstart=()=>{started=true};u.onend=()=>{if(gen!==podGen||!pod.playing)return;if(!started&&Date.now()-t0<400){if(retries<1){retries++;qi--;setTimeout(()=>{if(gen===podGen&&pod.playing)step()},120);return}pod.playing=false;renderPod();return}retries=0;step()};u.onerror=e=>{if(gen!==podGen||!pod.playing)return;const err=(e&&e.error)||'';if(err==='canceled'||err==='interrupted')return;pod.playing=false;renderPod()};speechSynthesis.speak(u)};podTimer=setTimeout(()=>{if(gen===podGen&&pod.playing)step()},50);podKeep=setInterval(()=>{if(pod.playing&&speechSynthesis.speaking&&speechSynthesis.paused)speechSynthesis.resume()},8000)}
function podAdvance(dir,manual){const eps=manual?podEpisodes():(pod.all?podAllEpisodes():podAllEpisodes().filter(e=>e.n===pod.lec));if(!eps.length){stopPod();renderPod();return}let ei=eps.findIndex(e=>e.n===pod.lec);if(ei<0)ei=0;let ci=pod.idx+dir;if(ci>=eps[ei].items.length){if(ei+1<eps.length&&(manual||pod.all)){ei++;ci=0}else{pod.playing=false;pod.lec=eps[ei].n;pod.idx=Math.max(0,eps[ei].items.length-1);hush();renderPod();return}}else if(ci<0){if(ei>0){ei--;ci=eps[ei].items.length-1}else ci=0}pod.lec=eps[ei].n;pod.idx=ci;const cont=pod.playing;renderPod();if(cont)podSpeak()}
function podStart(n,all){if(all){S.fl='';save();const fl=$('#fLec');if(fl)fl.value=''}pod.lec=n;pod.idx=0;pod.all=!!all;pod.playing=true;renderPod();podSpeak()}
function podToggle(){if(pod.lec==null){const e=podEpisodes()[0];if(e)podStart(e.n,true);return}pod.playing=!pod.playing;if(pod.playing){renderPod();podSpeak()}else{hush();renderPod()}}
function podPick(n){if(pod.lec===n){podToggle();return}podStart(n,false)}
function rateSel(){return `<label class="f" style="flex:none;min-width:120px">Hastighed<select id="podRate">${[0.85,1,1.15,1.3,1.5].map(r=>`<option value="${r}"${Math.abs(pod.rate-r)<0.01?' selected':''}>${String(r).replace('.',',')}×</option>`).join('')}</select></label>`}
function renderPod(){const eps=podEpisodes(),all=podAllEpisodes(),ep=all.find(e=>e.n===pod.lec)||null,item=ep?ep.items[pod.idx]:null,v=item?podView(item):null;const now=item?`<div class="podnow" style="${cv('ØS')}"><div class="top"><div>${chips(item)}<span class="chip">${esc(v.k)}</span></div><span class="meta">${pod.idx+1}/${ep.items.length}</span></div><h3>${esc(v.t)}</h3><div class="row" style="margin:12px 0"><button id="podPrev" style="flex:none">Forrige</button><button class="pri" id="podToggle" style="flex:none">${pod.playing?'Pause':'Afspil'}</button><button id="podNext" style="flex:none">Næste</button>${rateSel()}</div><div class="prog" style="margin-bottom:14px"><i style="width:${Math.round(100*(pod.idx+1)/ep.items.length)}%"></i></div><div class="body">${esc(v.b)}</div>${src(item)}</div>`:`<div class="row" style="margin-top:4px"><button class="pri" id="podToggle">Afspil</button>${rateSel()}</div><p class="meta" style="margin:12px 0 0">Vælg en lektion herunder, eller afspil hele faget.</p>`;$('#app').innerHTML=`<div class="box" style="${cv('ØS')}"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="tag">ØS</span><div style="flex:1"><h2 style="margin:0">Podcast</h2><p class="meta" style="margin:4px 0 0">Kun økonomistyring. ${all.length} lektioner læses op på dansk — begreber, metoder, spørgsmål og modelsvar.</p></div></div><div class="row" style="margin-top:16px"><button class="pri" id="podAll">Afspil hele faget</button></div><div style="margin-top:16px">${now}</div></div><div class="box"><h3 style="margin-bottom:2px">Økonomistyring</h3><p class="meta" style="margin-top:0">Menuen indeholder kun dette fag.</p>${eps.map(e=>{const on=pod.lec===e.n;return `<div class="ep${on?' on':''}" data-lec="${e.n}"><button class="playb" type="button" aria-label="Afspil ${esc(e.name)}">${on&&pod.playing?'❚❚':e.n}</button><div style="flex:1;min-width:0"><b>${esc(e.name)}</b><div class="meta">${e.items.length} afsnit · ${fmtMin(podSecs(e.items))}</div></div></div>`}).join('')||'<p class="meta">Ingen lektioner i det valgte filter.</p>'}</div>`;const allBtn=$('#podAll');if(allBtn)allBtn.onclick=()=>{const e=podAllEpisodes()[0];if(e)podStart(e.n,true)};const tg=$('#podToggle');if(tg)tg.onclick=()=>podToggle();const pv=$('#podPrev');if(pv)pv.onclick=()=>podAdvance(-1,true);const nx=$('#podNext');if(nx)nx.onclick=()=>podAdvance(1,true);const rt=$('#podRate');if(rt)rt.onchange=()=>{pod.rate=+rt.value||1;S.podRate=pod.rate;save();if(pod.playing)podSpeak();else renderPod()};document.querySelectorAll('.ep').forEach(el=>{el.onclick=()=>podPick(+el.dataset.lec)});if(!window.speechSynthesis){const n=$('#app');const note=document.createElement('p');note.className='meta';note.textContent='Oplæsning er ikke tilgængelig i denne browser — du kan stadig bladre i afsnittene.';const host=n.querySelector('.podnow')||n.querySelector('.box');if(host)host.appendChild(note)}}
function vPod(){renderPod()}
if(window.speechSynthesis){speechSynthesis.getVoices()}

$('#ver').textContent='v'+M.version+' · '+M.generated;theme();fill();go('home');
