tid normalt være direkte omkostninger. Indirekte omkostninger kan ikke direkte knyttes til ét bestemt job og skal derfor fordeles. Typiske eksempler. Husleje. El. Forsikringer. Afskrivninger. Produktionsledelse. Administration. Disse omkostninger kaldes ofte samlet for overhead. Cost Pool. En cost pool er en samling af indirekte omkostninger, som senere skal fordeles. Eksempel. En produktions-overhead-pool kan indeholde: Elforbrug. Husleje. Vedligeholdelse. Produktionsledelse. Cost Allocation Base. En cost allocation base er den fordelingsnøgle, der anvendes til at fordele indirekte omkostninger. Det gælder for eksempel maskintimer, arbejdstimer, materialeforbrug og antal producerede enheder. Valget af fordelingsnøgle bør afspejle, hvad der driver omkostningerne."},{"t":"Direkte og indirekte omkostninger","b":"Direkte omkostninger registreres direkte på det enkelte job gennem cost tracing. Indirekte omkostninger fordeles til jobbet gennem cost allocation, hvor virksomheden anvender en fordelingsnøgle. Forskellen er vigtig. Direkte omkostninger spores. Indirekte omkostninger fordeles. De kan ikke entydigt ligges på en ting, eks. Husleje. Jo større andel af omkostningerne der kan spores direkte, desto mere præcis bliver omkostningsberegningen."},{"t":"Job-costing versus Process-costing","b":"Job-costing anvendes, når produkter eller tjenester er forskellige fra hinanden. Karakteristika. Hvert job er unikt. Omkostninger registreres separat. Høj grad af kundetilpasning. Det gælder for eksempel huse, skibe, konsulentprojekter, revisionsopgaver og process-costing anvendes ved masseproduktion af ens produkter. Karakteristika. Produkterne er standardiserede. Omkostninger samles for hele processen. Omkostninger fordeles på alle producerede enheder. Det gælder for eksempel bryggerier, fødevareproduktion, papirproduktion og cementproduktion."},{"t":"Produktionsformer","b":"Produktion efter ordre. Virksomheden producerer først, når kunden afgiver en ordre. Kendetegn. Høj grad af specialisering. Længere produktionstid. Hvert produkt kan være unikt. Job-costing er typisk den mest relevante metode. Serieproduktion. Virksomheden producerer produkter i serier. Kendetegn. Mange ens produkter. Produkter kan ændres mellem serier. Her kombineres ofte elementer fra både job-costing og process-costing. Masseproduktion. Virksomheden producerer store mængder identiske produkter. Kendetegn. Standardiserede processer. Meget højt volumen. Her anvendes typisk process-costing."},{"t":"Vestas som eksempel","b":"Udviklingen hos Vestas illustrerer, hvordan virksomheder kan bevæge sig mellem de to systemer. Historisk var produktionen mere projektorienteret, fordi mange løsninger var kundetilpassede. Med lean-principper, standardisering og flowproduktion er større dele af produktionen blevet mere procesorienterede. Store havvindmølleprojekter indeholder dog stadig elementer af job-costing, fordi de ofte tilpasses den enkelte kunde og lokation."},{"t":"Den seks-trins model for job-costing","b":"Trin 1: Identificer omkostningsobjektet. Det første skridt er at definere det job, som omkostningerne skal beregnes for. Eksempel. Job nr. 100. Trin 2: Identificer direkte omkostninger. Registrér alle direkte materialer og direkte lønomkostninger. Trin 3: Vælg fordelingsnøgle. Bestem hvilket aktivitetsmål der bedst forklarer forbruget af indirekte omkostninger. Eksempel. Maskintimer. Trin 4: Identificer indirekte omkostninger. Saml alle relevante indirekte omkostninger i en fælles cost pool. Trin 5: Beregn overheadsats. Beregn hvor stor overhead der skal fordeles pr. enhed aktivitet. Formel. Overheadsats=Indirekte omkostninger÷Aktivitetsbase. Trin 6: Beregn den samlede jobomkostning. Samlet jobomkostning beregnes som. Direkte materialer+Direkte løn+Tildelt overhead."},{"t":"Eksempel på job-costing","b":"Oplysninger. Job 100: Salgspris: 104.800 kr. Direkte materialer. 45.000 kr. Direkte løn. 14.000 kr. Maskintimer. 500. Virksomheden. Faktisk overhead: 65.100 kr. Samlede maskintimer. 2.480. Beregning af overheadsats. 65.100÷2.480=26,25 kr. pr. maskintime. Beregning af allokeret overhead. 500×26,25=13.125 kr. Samlet jobomkostning. 45.000+14.000+13.125=72.125 kr."},{"t":"Bruttoavance","b":"Beregning. Omsætning. 104.800 kr. Cost of Goods Sold (COGS). 72.125 kr. Bruttoavance. 104.800-72.125=32.675 kr. Bruttomargin. 32.675÷104.800=31,2 %. Bruttomarginen viser, hvor stor en andel af omsætningen der er tilbage efter vareomkostningerne er dækket."},{"t":"Faktiske omkostninger","b":"Ved faktisk omkostningsberegning anvendes de reelle omkostninger, der er opstået. Fordele. Høj præcision. Afspejler faktiske forhold. Ulemper. Oplysningerne er først tilgængelige efter periodens afslutning. Vanskeligt at anvende til løbende styring."},{"t":"Norm-costing","b":"Norm-costing anvender budgetterede satser i stedet for faktiske satser. Virksomheden beregner på forhånd en overheadsats baseret på forventede omkostninger og forventet aktivitetsniveau. Fordele. Hurtigere beregninger. Bedre mulighed for løbende styring. Giver mere stabile omkostningssatser. Ulemper. Kan afvige fra de faktiske omkostninger."},{"t":"Eksempel på norm-costing","b":"Budget. Overhead: 60.000 kr. Maskintimer. 2.400 timer. Budgetteret sats. 60.000÷2.400=25 kr. pr. maskintime. For Job 100: 500×25=12.500 kr. i overhead. Samlet jobomkostning. 45.000+14.000+12.500=71.500 kr. Norm-costing giver dermed en lidt lavere omkostning end beregningen baseret på faktiske overheadomkostninger."},{"t":"Hvorfor anvendes lange budgetperioder?","b":"Virksomheder anvender ofte et helt år som budgetperiode ved beregning af overheadsatser. Tællerproblemer. Den samlede overhead kan svinge betydeligt på kort sigt som følge af: Elpriser. Reparationer. Sæsonudsving. Nævnerproblemer. Aktivitetsniveauet kan variere over året. Det gælder for eksempel flere eller færre maskintimer, høj- og lavsæson og lange perioder giver derfor mere stabile satser."},{"t":"Job-costing i servicevirksomheder","b":"Job-costing er ikke begrænset til produktion. Servicevirksomheder bruger ofte metoden til at beregne omkostninger pr. kunde eller opgave. Det gælder for eksempel advokatfirmaer, revisionsfirmaer, konsulenthuse, hjemmepleje og her er arbejdslønnen ofte den vigtigste direkte omkostning."},{"t":"Carmen & Associates","b":"Budget. Direkte løn: 400.000 kr. Indirekte omkostninger. 96.000 kr. Direkte arbejdstimer. 16.000 timer. Direkte lønsats. 400.000÷16.000=25 kr. pr. time. Overheadsats. 96.000÷16.000=6 kr. pr. time. Patientforløb. Et patientforløb kræver 25 timers arbejde. Direkte løn. 25×25=625 kr. Indirekte omkostninger. 25×6=150 kr. Samlet omkostning. 625+150=775 kr."},{"t":"Kildedokumenter i job-costing","b":"Job Cost Sheet. Et centralt dokument der samler alle omkostninger for et bestemt job. Dokumentet anvendes til. Overvågning af omkostninger. Priskalkulation. Resultatmåling. Materialerekvisition. Dokument som registrerer materialeforbrug på et bestemt job. Arbejdstidsregistrering. Dokument som registrerer medarbejdernes tidsforbrug. Anvendes til. Lønberegning. Omkostningsregistrering. Efterkalkulation. I moderne virksomheder registreres oplysningerne ofte direkte i ERP-systemer."},{"t":"Omkostningernes bevægelse gennem produktionen","b":"Når materialer og løn anvendes på et job, registreres omkostningerne først som igangværende arbejde (Work in Process, WIP). Når jobbet færdiggøres, flyttes værdien til færdigvarelageret. Når kunden køber produktet, flyttes omkostningen fra færdigvarelageret til Cost of Goods Sold (COGS), hvor den indgår i resultatopgørelsen. Denne proces sikrer, at omkostninger først påvirker resultatet, når salget finder sted."},{"t":"Over- og underallokerede indirekte omkostninger","b":"Underallokering. Opstår når de faktiske indirekte omkostninger er større end de omkostninger, der er blevet fordelt til job. Faktisk overhead>Allokeret overhead. Virksomheden har dermed registreret for få omkostninger på sine jobs. Overallokering. Opstår når den fordelte overhead overstiger de faktiske overheadomkostninger. Allokeret overhead>Faktisk overhead. Virksomheden har dermed registreret for mange omkostninger på sine jobs."},{"t":"Årsager til afvigelser","b":"Tællerafvigelse. Opstår når de faktiske indirekte omkostninger afviger fra budgettet. Det gælder for eksempel højere energipriser, uforudsete vedligeholdelsesomkostninger og nævnerafvigelse. Opstår når aktivitetsniveauet afviger fra det budgetterede niveau. Det gælder for eksempel flere maskintimer end og færre maskintimer end."},{"t":"Håndtering af afvigelser","b":"Justeret allokeringssats. Alle jobs genberegnes ved hjælp af den faktiske overheadsats. Fordel. Mest præcis metode. Ulempe. Tidskrævende. Prorate-metoden. Afvigelsen fordeles mellem relevante lagerkonti og eventuelt Cost of Goods Sold. Fordel. Mere retvisende lager- og resultatværdier. Direkte afskrivning til Cost of Goods Sold. Hele afvigelsen overføres direkte til Cost of Goods Sold. Fordel. Enkel løsning. Ulempe. Mindre præcis."},{"t":"Vigtige formler","b":"Overheadsats. Indirekte omkostninger÷aktivitetsbase. Allokeret overhead. Overheadsats×aktivitet. Samlet jobomkostning. Direkte materialer+direkte løn+overhead. Bruttoavance. Omsætning − Cost of Goods Sold. Bruttomargin. Bruttoavance÷omsætning×100. Over-/underallokering. Faktisk overhead-allokeret overhead."},{"t":"Opgave 3.12","b":"Kategori. Gennemsnitlig løn. Gennemsnitlige personalegoder. Fakturerbar tid til kunder (timer). Ferie og sygefravær (timer). Professionel udvikling (timer). Ikke-fakturerbar tid pga. manglende efterspørgsel. Direktør. €140.000. €60.000. 1.600. 160. 240. 0. Partner. €105.000. €45.000. 1.600. 160. 240. 0. Associate. €60.000. €20.000. 1.600. 160. 240. 0. Assistant. €38.000. €12.000. 1.600. 160. 240. 0. Krav. 1. Beregn den budgetterede direkte omkostningssats for professionelt arbejde (løn og personalegoder) pr. time for. a) direktører140000+60000 divideret med 1600=125. b) partnere. 105000+45000 divideret med 1600=93,75. c) associates60000+20000 divideret med 1600=50. d) assistants38000+12000 divideret med 1600=31,25. Anvend budgetteret fakturerbar tid til kunder som nævner i beregningerne. 2. Gentag krav 1. Anvend summen af budgetteret fakturerbar tid, ferie- og sygefraværstid samt tid anvendt på professionel udvikling som nævner i beregningerne.a) direktører140000+60000 divideret med 1600+160+240=100. b) partnere. 105000+45000 divideret med 1600+160+240=75. c) associates60000+20000 divideret med 1600+160+240=40. d) assistants38000+12000 divideret med 1600+160+240=25. 3. Hvorfor er satserne forskellige mellem krav 1 og krav 2? Hvordan kan disse forskelle påvirke jobomkostningsberegningen hos Zimmermann GmbH? Satserne er forskellige fordi sygedage også har en omkostning for ZimmermannNår de skal beregne hvad det koster at lave et projekt med mandetimer, så skal de også huske sygedage og udviklingsdage, da medarbejderne også skal have løn under de perioder."}]},{"n":4,"name":"L4 Process-costing","items":[{"t":"Hvornår anvendes process-costing?","b":"Process-costing er en kalkulationsmetode, hvor enhedsomkostningen findes ved at følge de samlede omkostninger til ens produkter og fordele dem som et gennemsnit. Metoden bruges ved homogene produkter, der behandles ensartet, fx på bryggerier, papirmøller og cementfabrikker. Hver enhed antages at modtage samme mængde materialeomkostninger, direkte fremstillingsomkostninger og indirekte fremstillingsomkostninger. Forskellen til job-costing er, at process-costing bruger gennemsnittet til at beregne enhedsomkostninger. I praksis kræver process-costing derfor langt færre registreringer i produktionen, da man ikke registrerer på hvert jobkort. Til eftertanke (slides). Passer process-costing til Randers Tegl, som laver mursten? Hvad med Petersen Tegl, hvor produkterne er unikke fra gang til gang? Omkostningsflow. Direkte materialer, direkte løn og IPO → Afd. A → Afd. B → færdigvarelager → cost of goods sold (salg). Det fysiske vareflow følger samme vej som omkostningsregnskabet."},{"t":"Læringsmål","b":"forstå, hvornår man bør anvende process-costing. beskrive de 5 trin i process-costing. beregne og anvende ækvivalente enheder. bogføring i process-costing. anvende metoden vægtet gennemsnit (WA). anvende metoden FIFO (først ind, først ud). vise, hvordan standardomkostninger forenkler process-costing. anvende process-costing på transferred-in (overførte) omkostninger."},{"t":"De fem trin i process-costing","b":"Trin 1: Opgør antallet af fysiske enheder gennem processen. Trin 2: Beregn output i ækvivalente enheder. Trin 3: Beregn omkostning pr. ækvivalent enhed. Trin 4: Opsummér de samlede omkostninger, der skal gøres rede for. Trin 5: Fordel omkostningerne til færdiggjorte enheder og til enheder, der stadig er i arbejde (WIP)."},{"t":"Ækvivalente enheder","b":"Ækvivalente enheder er en metode til at beregne værdien af de producerede enheder ved at opgøre antallet af færdige enheder og omregne igangværende arbejde (WIP) til et antal færdige enheder afhængigt af færdiggørelsesgraden. Ækvivalente enheder=fysiske enheder×færdiggørelsesgrad. Færdiggørelsesgraden kan være forskellig for materialer og fremstilling. Eksempel. Murstenene er formet og står i ovnen (20 % bagt) – 100 % færdige mht. materialer, men kun 20 % mht. fremstilling."},{"t":"Eksempel: Snowdon Ltd uden primo-WIP","b":"Snowdon Ltd producerer skisportsudstyr. Ved periodens slutning er WIP-lageret 100 % færdigt mht. materialer og 20 % færdigt mht. fremstilling. Trin 1 – fysiske enheder: WIP primo 0 + opstartet 35.000 = 35.000 at gøre rede for. Afsluttet og videreført 30.000 + WIP ultimo 5.000 = 35.000. Trin 2 – ækvivalente enheder: Materialer 30.000+5.000×100 %=35.000. Fremstilling 30.000+5.000×20 %=31.000. Trin 3 – omkostning pr. ækvivalent enhed. Materialer 84.050 divideret med 35.000=2,4014. Fremstilling 62.000 divideret med 31.000=2,00. Trin 4 – omkostninger at gøre rede for: 84.050+62.000=146.050. Trin 5 – fordeling: Afsluttet og videreført 30.000×2,4014+2,00=132.043. WIP ultimo. materialer 5.000×2,4014=12.007 og fremstilling 1.000×2,00=2.000. I alt 146.050."},{"t":"Bogføring i process-costing","b":"Bogføringen er stort set den samme som i job-costing for materialer og fremstillingsomkostninger. Den væsentligste forskel er, at process-costing har en separat WIP-konto for hver afdeling frem for for hvert job. I Snowdon-eksemplet debiteres WIP (montageafdelingen) med materialer 84.050 og fremstillingsomkostninger 62.000. 132.043 overføres videre til næste afdeling (WIP Finishing) og derfra til færdigvarer og COGS, mens 14.007 står tilbage som WIP ultimo."},{"t":"Forskellen på FIFO og WA – intuition","b":"Eksempel. En virksomhed køber hver måned 50 stk. til 5 $, har 100 enheder i igangværende arbejde og sælger 50 stk. I februar og marts må den købe på det frie marked til 10 $ pr. stk., fordi leverandørens fabrik er brændt. FIFO. WIP stiger til 1.000 i marts og er tilbage på 500 i maj. COGS er 500 i marts og april og ellers 250. WA. WIP topper med 875 i marts og falder langsomt til 501 i november. COGS topper med 438 i marts og falder langsomt til 251. COGS i alt er ens under begge metoder (3.250). Pointen er, at de højere priser i to måneder »forurener« opgørelsen af WIP og COGS i lang tid, når man bruger WA."},{"t":"Vægtet gennemsnit (WA)","b":"WA-metoden (vægtet gennemsnit) beregner den gennemsnitlige enhedsomkostning for alt udført arbejde, uanset i hvilken periode enhederne blev påbegyndt. Omkostningen er summen af alle omkostninger på WIP-kontoen – både primo-WIP og periodens omkostninger – divideret med det samlede antal ækvivalente enheder færdiggjort til dato. Omkostningerne fordeles til ækvivalente enheder afsluttet og overført samt til ækvivalente enheder i WIP ultimo. Eksempel (Snowdon, montageafdelingen). WIP primo består af 1.000 enheder, 100 % færdige mht. materialer og 60 % mht. fremstilling, med omkostninger på materialer 2.350 og fremstilling 5.200. WIP ultimo er 5.000 enheder (100 % materialer, 20 % fremstilling). Trin 1: WIP primo 1.000 + påbegyndt 35.000 = 36.000. Færdiggjort og videreført 31.000 + WIP ultimo 5.000 = 36.000. Trin 2: Materialer 31.000+5.000=36.000. Fremstilling 31.000+1.000=32.000. Trin 3: Materialer 2.350+84.050 divideret med 36.000=86.400 divideret med 36.000=2,40. Fremstilling 5.200+62.000 divideret med 32.000=67.200 divideret med 32.000=2,10. Trin 4: WIP primo 7.550 + periodens omkostninger 146.050 = 153.600. Trin 5: Videreført 31.000×2,40+2,10=139.500. WIP ultimo. materialer 5.000×2,40=12.000 og fremstilling 1.000×2,10=2.100, i alt 14.100. Samlet 153.600."},{"t":"FIFO","b":"FIFO-metoden tildeler først omkostninger til de ækvivalente enheder, der skal til for at færdiggøre primo-WIP. Derefter påbegyndes nye enheder, hvoraf nogle færdiggøres og videreføres, mens andre forbliver i WIP ultimo. Metoden sikrer, at enhederne fra primo-WIP færdiggøres og videreføres først. Eksempel (samme data som WA). Trin 1: 36.000 fysiske enheder (som ved WA). Trin 2: Færdiggørelse af primo-WIP: materialer 0 og fremstilling 1.000×40 %=400 (40 %, fordi 60 % allerede var færdigt). Påbegyndt og afsluttet. 30.000 / 30.000. WIP ultimo. 5.000 / 1.000. I alt 35.000 (materialer) og 31.400 (fremstilling). Trin 3: Kun periodens omkostninger: materialer 84.050 divideret med 35.000=2,40 og fremstilling 62.000 divideret med 31.400=1,975. Trin 4: 7.550+84.050+62.000=153.600 (det samme som ved WA). Trin 5: Videreført fra primo-WIP 7.550 + tilført fremstilling 1.000×40 %×1,975=790, i alt 8.340. Fra indeværende periode 30.000×2,40+1,975=131.279 (slides bruger uafrundede satser). Videreført i alt 139.618. WIP ultimo. materialer 12.007 og fremstilling 5.000×20 %×1,975=1.975, i alt 13.982. Kontrol. 139.618+13.982=153.600."},{"t":"Sammenligning af WA og FIFO","b":"Videreførte enheder. WA 139.500, FIFO 139.618 (forskel +118). WIP ultimo. WA 14.100, FIFO 13.982 (forskel −118). Total at gøre rede for. 153.600 under begge metoder. I eksemplet er slutlageret ved WA 118 højere end ved FIFO. Det giver lavere COGS og dermed højere driftsresultat under WA end under FIFO. Forskellen opstår, når omkostningen pr. ækvivalent enhed i primo-WIP er forskellig fra omkostningen for arbejdet udført i indeværende periode."},{"t":"Standard costing i process-costing","b":"Standard costing betyder, at man fastsætter en standardomkostning pr. inputenhed for en periode. Den varierer ikke som de faktiske omkostninger og er derfor stabil. Standarder for, hvor store inputmængder et givent output kræver, er ofte relativt ligetil at fastlægge. Proceduren er den samme som ved FIFO og WA, blot med en fast omkostning pr. input – fx 74 kr. pr. stk. i materialeomkostninger og 54 kr. pr. stk. i fremstillingsomkostninger. Der er et regneeksempel på Brightspace."},{"t":"Transferred-in costs","b":"Transferred-in costs (overførte omkostninger) er de omkostninger, der følger med enhederne, når de overføres fra én afdeling til en anden, fx fra støberiet til montage hos Vestas. Principperne er de samme som før – de overførte omkostninger lægges blot til i den modtagende afdeling (fx fra Afd. A til Afd. B). Der er et regneeksempel på Brightspace."},{"t":"Eksamensfokus","b":"De fem trin og beregning af ækvivalente enheder. WA vs. FIFO. hvordan primo-WIP behandles, og hvorfor resultaterne afviger. Kontrol. videreført+WIP ultimo=omkostninger at gøre rede for. Opgave 4.22 (WA) og 4.23 (FIFO)."}]},{"n":5,"name":"L5 Omkostningsallokering","items":[{"t":"Omkostningsallokering","b":"Omkostningsallokering er processen, hvor indirekte og fælles omkostninger fordeles mellem forskellige omkostningsobjekter. Et omkostningsobjekt er det, virksomheden ønsker at kende omkostningen ved, f.eks. en division, fabrik, afdeling, aktivitet, serviceydelse, kunde, kontrakt eller et produkt. Direkte omkostninger kan normalt henføres direkte til et bestemt omkostningsobjekt. Hvis en medarbejder arbejder udelukkende i montageafdelingen, kan medarbejderens løn eksempelvis registreres direkte i denne afdeling. Indirekte omkostninger kan derimod ikke uden videre spores til ét bestemt omkostningsobjekt. Det gælder blandt andet omkostninger til HR, IT, vedligeholdelse, økonomiafdeling og hovedkontor. Disse omkostninger skal derfor fordeles ved hjælp af en allokeringsbase. En allokeringsbase er det mål, der anvendes til at fordele omkostningerne. Det gælder for eksempel antal medarbejdere, direkte lønomkostninger, antal arbejdstimer, maskintimer, areal i kvadratmeter, antal ordrer eller transaktioner, omsætning og anvendt kapacitet. Formålet er ikke nødvendigvis at finde én objektivt korrekt fordeling. Fordelingen skal i stedet være logisk, relevant og anvendelig i forhold til den beslutning, som oplysningerne skal understøtte. Den grundlæggende beregning er. Allokeringsrate=omkostninger i omkostningspuljen divideret med samlet mængde af allokeringsbasen. Den omkostning, som allokeres til et bestemt omkostningsobjekt, beregnes herefter som: Allokeret omkostning=omkostningsobjektets forbrug af allokeringsbasen×allokeringsraten."},{"t":"Kriterier for fordeling af omkostninger","b":"Der findes fire centrale kriterier for valg af allokeringsbase. Årsag og virkning. Virksomheden identificerer den faktor, som er årsag til, at omkostningen opstår. Det omkostningsobjekt, der forbruger ressourcen, skal dermed bære omkostningen. Hvis vedligeholdelsesomkostninger eksempelvis afhænger af antallet af maskintimer, bør maskintimer anvendes som allokeringsbase. Hvis HR-omkostninger hovedsageligt afhænger af antallet af medarbejdere eller lønomkostningerne i afdelingerne, kan disse størrelser anvendes som fordelingsgrundlag. Årsag og virkning er normalt det stærkeste kriterium, fordi det skaber den mest realistiske sammenhæng mellem ressourceforbrug og omkostninger. Det kan samtidig påvirke adfærden positivt, fordi en afdeling bliver opmærksom på, at et større ressourceforbrug medfører en større omkostning. Modtagne fordele. Omkostningerne fordeles efter, hvem der har fordel af den aktivitet eller service, som skaber omkostningen. Hvis en fælles reklamekampagne gavner flere produkter, kan omkostningerne eksempelvis fordeles efter produkternes forventede fordel af kampagnen. Kriteriet anvendes især, når der ikke findes en tydelig årsagssammenhæng. Udfordringen er, at den modtagne fordel ofte er vanskelig at måle præcist. Retfærdighed eller rimelighed. Fordelingen foretages ud fra en vurdering af, hvad der opfattes som rimeligt for de berørte parter. Kriteriet er særligt relevant ved offentlige kontrakter, prisregulering og aftaler, hvor omkostningsallokeringen bruges til at fastsætte en pris eller beregne refusion. Problemet er, at retfærdighed er subjektiv. Det, som én part betragter som rimeligt, kan opfattes som urimeligt af en anden. Evnen til at bære omkostningen. Omkostningerne fordeles efter omkostningsobjekternes økonomiske evne til at absorbere dem. Et produkt med høj omsætning eller stor indtjening kan derfor få tildelt en større andel af de fælles omkostninger. Metoden er relativt enkel, men har ofte en svag sammenhæng med det faktiske ressourceforbrug. Et profitabelt produkt kan blive belastet med store omkostninger, selv om produktet kun anvender få fælles ressourcer. Det kan give et misvisende billede af produktets reelle lønsomhed. I praksis er årsag og virkning samt modtagne fordele de mest anvendte kriterier."},{"t":"Fire formål med omkostningsallokering","b":"Information til økonomiske beslutninger. Allokering bruges til at beregne de samlede omkostninger ved produkter, kunder, serviceydelser, afdelinger og kontrakter. Oplysningerne kan blandt andet anvendes til. prisfastsættelse. produkt- og kundelønsomhed. outsourcingbeslutninger. kapacitetsbeslutninger. produktmix. videreførelse eller lukning af aktiviteter. budgettering og planlægning. Beslutningsformålet er afgørende for, hvilke omkostninger der bør medtages. Til langsigtet prisfastsættelse kan det være relevant at kende produktets fulde omkostninger. Ved en kortsigtet beslutning om en ekstra ordre er det derimod ofte de relevante, fremtidige meromkostninger, som er vigtigst. En allokeret fast omkostning er ikke nødvendigvis relevant for en bestemt beslutning. Motivation af ledere og medarbejdere. Allokering kan påvirke adfærden. Hvis en afdeling betaler for den service, den modtager fra en supportafdeling, får lederen et større incitament til at begrænse unødvendigt ressourceforbrug. Det kræver dog, at lederen forstår og accepterer fordelingsmetoden. Hvis lederen bliver belastet med omkostninger, som vedkommende ikke kan kontrollere, kan det skabe frustration og uhensigtsmæssige beslutninger. Retfærdiggørelse af omkostninger og beregning af refusion. Virksomheden kan have behov for at dokumentere omkostninger over for kunder, myndigheder eller kontraktpartnere. Det gælder især omkostningsbaserede kontrakter, hvor kunden skal refundere virksomhedens dokumenterede omkostninger. Her skal allokeringsreglerne være tydelige og aftalt på forhånd. Ellers kan der opstå konflikt om, hvilke omkostninger der må medtages, og hvordan de skal fordeles. Måling af indkomst og aktiver. Omkostningsallokering anvendes i den eksterne regnskabsrapportering til blandt andet at opgøre: varebeholdningens værdi. kostpris for solgte varer. periodens resultat. værdien af igangværende arbejder. indtjening på divisioner og segmenter. Produktionsrelaterede indirekte omkostninger skal typisk indgå i produktomkostningerne. Allokeringen påvirker derfor tidspunktet for, hvornår omkostningerne indregnes i resultatopgørelsen."},{"t":"Direkte omkostninger, indirekte omkostninger og fællesomkostninger","b":"Direkte omkostninger kan spores til et bestemt omkostningsobjekt på en økonomisk forsvarlig måde. Indirekte omkostninger vedrører flere omkostningsobjekter eller kan ikke spores direkte uden uforholdsmæssigt store registreringsomkostninger. Om en omkostning er direkte eller indirekte afhænger derfor af det valgte omkostningsobjekt. En afdelingsleders løn kan være direkte i forhold til afdelingen, men indirekte i forhold til de enkelte produkter, som afdelingen fremstiller. Fællesomkostninger opstår, når en ressource eller aktivitet understøtter flere omkostningsobjekter. Eksempler er hovedkontor, økonomiafdeling, HR og fælles IT-systemer. Fællesomkostninger kan fordeles, men fordelingen indeholder ofte et element af vurdering."},{"t":"Allokering gennem flere organisatoriske niveauer","b":"Omkostninger kan fordeles gennem flere niveauer i organisationen. Fælles omkostninger på virksomhedsniveau kan først fordeles til divisioner. Divisionernes omkostninger kan derefter fordeles til drifts- og supportafdelinger. Til sidst kan afdelingernes omkostninger fordeles til produkter, serviceydelser, kunder eller kontrakter. En mulig allokeringsrækkefølge er. Hovedkontorets omkostninger fordeles til divisioner. Divisionernes omkostninger fordeles til afdelinger. Supportafdelingernes omkostninger fordeles til driftsafdelinger. Driftsafdelingernes omkostninger fordeles til produkter eller serviceydelser. Hver allokering ændrer den omkostning, som senere skal fordeles. Valget af allokeringsbase på et tidligt niveau kan derfor påvirke produktomkostningerne gennem hele systemet."},{"t":"Controllability og ansvar","b":"Controllability-princippet betyder, at en leder primært bør vurderes på de omkostninger, som lederen kan påvirke eller kontrollere. Dette er særligt vigtigt i decentraliserede organisationer. Der findes tre overordnede tilgange til fællesomkostninger: Alle omkostninger allokeres for at synliggøre divisionernes fulde omkostninger. Ingen ukontrollerbare fællesomkostninger allokeres, fordi divisionslederen ikke kan påvirke dem. Kun de fællesomkostninger, hvor der findes en forståelig og accepteret sammenhæng, allokeres. Det kan være nyttigt at skelne mellem en divisions fulde omkostninger og de kontrollerbare omkostninger. De fulde omkostninger kan anvendes til langsigtet lønsomhed og prisfastsættelse, mens de kontrollerbare omkostninger er bedre ved præstationsvurdering."},{"t":"Omkostningspuljer og homogenitet","b":"En omkostningspulje, også kaldet en cost pool, er en samling af omkostninger, der fordeles ved hjælp af den samme allokeringsbase. En omkostningspulje er homogen, når omkostningerne i puljen har den samme eller nogenlunde samme sammenhæng med allokeringsbasen. Hvis omkostningerne har forskellige drivere, bør de normalt opdeles i flere puljer. Vedligeholdelsesomkostninger kan eksempelvis afhænge af maskintimer, mens HR-omkostninger kan afhænge af antal medarbejdere. Hvis de to omkostningsgrupper samles i én pulje og fordeles efter maskintimer, vil arbejdsintensive afdelinger muligvis få allokeret for lidt HR-omkostning, mens maskinintensive afdelinger får allokeret for meget. Flere homogene omkostningspuljer kan give større præcision, men øger samtidig systemets kompleksitet og registreringsomkostninger. Virksomheden skal derfor afveje præcision mod omkostningen ved at indsamle detaljerede data."},{"t":"Eksempel på fordeling af fællesomkostninger","b":"Sandy Corporation har to divisioner. Paris og Prag. Virksomheden har finansielle fællesomkostninger på 600.000 og fælles HR-omkostninger på 1.200.000. De finansielle omkostninger vedrører finansieringen af nye montageafdelinger. Investeringen er 4.000.000 i Paris og 2.000.000 i Prag. Den samlede investering er derfor 6.000.000. Fordelingsandelene bliver. Paris: 4.000.000 divideret med 6.000.000=2 divideret med 3. Prag. 2.000.000 divideret med 6.000.000=1 divideret med 3. De finansielle omkostninger fordeles dermed. Paris: 600.000×2 divideret med 3=400.000. Prag. 600.000×1 divideret med 3=200.000. HR-omkostningerne fordeles efter direkte lønomkostninger. Paris har direkte løn på 1.200.000, mens Prag har direkte løn på 1.800.000. Den samlede direkte løn er 3.000.000. Fordelingsandelene bliver. Paris: 1.200.000 divideret med 3.000.000=40 %. Prag. 1.800.000 divideret med 3.000.000=60 %. HR-omkostningerne fordeles dermed. Paris: 1.200.000×40 %=480.000. Prag. 1.200.000×60 %=720.000. Samlet allokering. Paris: 400.000+480.000=880.000. Prag. 200.000+720.000=920.000. Eksemplet viser, at forskellige omkostningspuljer bør anvende forskellige allokeringsbaser. Finansieringsomkostningerne fordeles efter investeringens størrelse, mens HR-omkostningerne fordeles efter en faktor, der forventes at afspejle efterspørgslen efter HR-ressourcer."},{"t":"Single-rate-metoden","b":"Ved single-rate-metoden samles en supportafdelings faste og variable omkostninger i én samlet omkostningspulje. Hele puljen fordeles ved hjælp af én allokeringsbase og én fælles sats. Formlen er. Single-rate=samlede budgetterede omkostninger divideret med budgetteret samlet mængde af allokeringsbasen. Hvis en IT-afdeling forventer samlede omkostninger på 1.000.000 og 10.000 supporttimer, bliver satsen: 1.000.000 divideret med 10.000=100 pr. supporttime. En afdeling, der anvender 2.000 timer, får dermed allokeret: 2.000×100=200.000. Fordelen er, at metoden er enkel og let at administrere. Ulempen er, at den ikke skelner mellem faste og variable omkostninger. Afdelingerne kan derfor få indtryk af, at alle omkostninger ændrer sig proportionalt med deres forbrug, selv om en betydelig del er faste omkostninger."},{"t":"Dual-rate-metoden","b":"Ved dual-rate-metoden opdeles omkostningerne i mindst to omkostningspuljer: en variabel omkostningspulje. en fast omkostningspulje. De variable omkostninger fordeles normalt efter det faktiske forbrug af service. De faste omkostninger fordeles ofte efter budgetteret forbrug, reserveret kapacitet eller langsigtet kapacitetsbehov. Den variable sats beregnes som. Variabel sats=budgetterede variable omkostninger divideret med budgetteret aktivitetsniveau. Den faste omkostning fordeles eksempelvis som. Afdelingens andel af faste omkostninger=afdelingens budgetterede kapacitetsbehov divideret med samlet budgetteret kapacitetsbehov×samlede faste omkostninger. Dual-rate-metoden giver et tydeligere billede af omkostningsadfærden. Den afdeling, der bruger mere service, bliver belastet med flere variable omkostninger, mens de faste omkostninger knyttes til den kapacitet, som virksomheden har stillet til rådighed. Metoden kan skabe bedre beslutningsgrundlag, fordi den reducerer risikoen for, at ledere opfatter faste omkostninger som variable. Den er dog mere kompliceret og kræver en troværdig opdeling i faste og variable omkostninger."},{"t":"Budgetterede og faktiske allokeringsrater","b":"En allokeringsrate kan beregnes på baggrund af enten budgetterede eller faktiske omkostninger og aktivitetsmængder. Ved en budgetteret rate fastsættes satsen inden periodens begyndelse: Budgetteret rate=budgetterede omkostninger divideret med budgetteret aktivitet. Fordelene er, at modtagerafdelingerne kender satsen på forhånd og kan budgettere med deres omkostninger. De bliver heller ikke direkte belastet af ineffektivitet eller uforudsete omkostninger i supportafdelingen. Ved en faktisk rate beregnes satsen efter periodens afslutning: Faktisk rate=faktiske omkostninger divideret med faktisk aktivitet. Den faktiske rate sikrer, at alle faktisk afholdte omkostninger fordeles, men kan skabe uheldige effekter. Hvis supportafdelingen er ineffektiv, overføres ineffektiviteten til modtagerafdelingerne. Desuden opstår en såkaldt death spiral, hvis et lavere faktisk aktivitetsniveau fører til en højere sats. Den højere sats kan få flere afdelinger til at reducere deres forbrug, hvilket igen øger satsen yderligere. Budgetterede rater giver derfor ofte bedre planlægning og ansvarlighed. Forskellen mellem budgetterede og faktiske omkostninger kan i stedet registreres som en særskilt afvigelse og placeres hos den enhed, der har ansvar for afvigelsen."},{"t":"Driftsafdelinger og supportafdelinger","b":"En driftsafdeling udfører aktiviteter, der direkte bidrager til virksomhedens produkter eller serviceydelser. I en produktionsvirksomhed kan montage og klargøring være driftsafdelinger. En supportafdeling, også kaldet en serviceafdeling, leverer interne ydelser til driftsafdelingerne og eventuelt til andre supportafdelinger. Det gælder for eksempel hR, iT, vedligeholdelse, økonomi, kantine, indkøb og intern transport. Supportafdelingernes omkostninger skal normalt fordeles til driftsafdelingerne, før driftsafdelingernes samlede omkostninger fordeles videre til produkter eller serviceydelser. Der findes tre centrale metoder. Den direkte metode. Den trinvise metode. Den reciprokke metode. Metoderne adskiller sig ved, hvordan de behandler de ydelser, som supportafdelinger leverer til hinanden."},{"t":"Datagrundlag i Sandy Corporation","b":"Paris-divisionen har to supportafdelinger og to driftsafdelinger: Vedligeholdelse. HR. Montage. Klargøring. Omkostninger før allokering. Vedligeholdelse: 300.000. HR. 2.160.000. Montage. 1.700.000. Klargøring. 900.000. Vedligeholdelse fordeles efter areal. Vedligeholdelse: 5.000 m². HR. 30.000 m². Montage. 110.000 m². Klargøring. 110.000 m². HR fordeles efter antal medarbejdere. Vedligeholdelse: 8. HR. 15. Montage. 48. Klargøring. 24. Det samlede omkostningsbeløb før og efter allokering skal være det samme: 300.000+2.160.000+1.700.000+900.000=5.060.000. Dette er en vigtig kontrolregel. Allokering skaber ikke nye omkostninger. Den flytter eksisterende omkostninger mellem afdelinger."},{"t":"Den direkte metode","b":"Den direkte metode fordeler supportafdelingernes omkostninger direkte til driftsafdelingerne. Ydelser mellem supportafdelingerne ignoreres. Vedligeholdelse fordeles kun mellem Montage og Klargøring. Begge bruger 110.000 m², så det relevante samlede areal er: 110.000+110.000=220.000 m². Fordelingen bliver. Montage: 110.000 divideret med 220.000×300.000=150.000. Klargøring. 110.000 divideret med 220.000×300.000=150.000. HR fordeles ligeledes kun til driftsafdelingerne. Det relevante antal medarbejdere er. 48+24=72 medarbejdere. Fordelingen bliver. Montage: 48 divideret med 72×2.160.000=1.440.000. Klargøring. 24 divideret med 72×2.160.000=720.000. Samlede omkostninger efter allokering. Montage: 1.700.000+150.000+1.440.000=3.290.000. Klargøring. 900.000+150.000+720.000=1.770.000. Kontrol. 3.290.000+1.770.000=5.060.000. Metoden er enkel og billig at anvende, men den ignorerer, at HR og Vedligeholdelse leverer ydelser til hinanden. Den er derfor mindre præcis, når udvekslingen mellem supportafdelingerne er betydelig."},{"t":"Den trinvise metode","b":"Den trinvise metode, også kaldet step-down-metoden eller den sekventielle metode, anerkender nogle af ydelserne mellem supportafdelingerne. Supportafdelingerne fordeles én ad gangen. Når en supportafdeling er fordelt, lukkes den. Den modtager derfor ikke efterfølgende omkostninger fra andre supportafdelinger. Resultatet afhænger dermed af den valgte fordelingsrækkefølge. Den afdeling, som fordeles først, kan vælges ud fra: den største procentdel af service leveret til andre supportafdelinger. det største beløb af service leveret til andre supportafdelinger. en på forhånd fastlagt organisatorisk rækkefølge. I eksemplet fordeles Vedligeholdelse først. Afdelingens ydelser fordeles til HR, Montage og Klargøring. Vedligeholdelsesafdelingens eget areal på 5.000 m² indgår ikke, så fordelingsgrundlaget er: 30.000+110.000+110.000=250.000 m². Fordelingsandelene bliver. HR: 30.000 divideret med 250.000=12 %. Montage. 110.000 divideret med 250.000=44 %. Klargøring. 110.000 divideret med 250.000=44 %. Fordeling af Vedligeholdelses omkostninger på 300.000: HR: 300.000×12 %=36.000. Montage. 300.000×44 %=132.000. Klargøring. 300.000×44 %=132.000. HR har herefter omkostninger på. 2.160.000+36.000=2.196.000. Vedligeholdelse er allerede lukket og får derfor ikke tildelt en andel af HR-omkostningerne. HR fordeles kun mellem Montage og Klargøring. Montage: 48 divideret med 72×2.196.000=1.464.000. Klargøring. 24 divideret med 72×2.196.000=732.000. Samlede omkostninger efter allokering. Montage: 1.700.000+132.000+1.464.000=3.296.000. Klargøring. 900.000+132.000+732.000=1.764.000. Kontrol. 3.296.000+1.764.000=5.060.000. Sammenlignet med den direkte metode får Montage 6.000 mere, mens Klargøring får 6.000 mindre. Forskellen skyldes, at den trinvise metode medregner Vedligeholdelses ydelse til HR. Metoden er mere præcis end den direkte metode, men kun en del af de gensidige ydelser medregnes. Resultatet påvirkes desuden af fordelingsrækkefølgen."},{"t":"Den reciprokke metode","b":"Den reciprokke metode medregner alle gensidige ydelser mellem supportafdelingerne. Det sker ved hjælp af samtidige ligninger. Vedligeholdelse modtager 10 % af HR’s ydelser, og HR modtager 12 % af Vedligeholdelses ydelser. De samlede gensidigt bestemte omkostninger opstilles derfor som: V=300.000+0,10HR. HR=2.160.000+0,12V. Indsættes HR-ligningen i ligningen for Vedligeholdelse, fås: V=300.000+0,10×2.160.000+0,12V. V=300.000+216.000+0,012V. 0,988V=516.000. V=522.267. HR’s samlede omkostning bliver. HR=2.160.000+0,12×522.267. HR=2.222.672. Beløbene 522.267 og 2.222.672 er supportafdelingernes fulde omkostninger inklusive de gensidige ydelser. De er derfor større end de oprindelige omkostninger. Det betyder ikke, at virksomheden har fået flere samlede omkostninger. En del af beløbene fordeles mellem supportafdelingerne, før restbeløbet placeres i driftsafdelingerne. Vedligeholdelse fordeles med 44 % til hver driftsafdeling: Montage: 522.267×44 %=229.797. Klargøring. 522.267×44 %=229.797. HR fordeles med 60 % til Montage og 30 % til Klargøring: Montage: 2.222.672×60 %=1.333.603. Klargøring. 2.222.672×30 %=666.802. Samlede omkostninger efter allokering. Montage: 1.700.000+229.797+1.333.603=3.263.400. Klargøring. 900.000+229.797+666.802=1.796.599. På grund af afrunding bliver totalen én krone lavere end 5.060.000. Med uafrundede tal stemmer den samlede omkostning. Den reciprokke metode er teoretisk mest præcis, fordi alle gensidige ydelser medregnes. Den kræver til gengæld flere beregninger og et bedre datagrundlag."},{"t":"Sammenligning af metoderne","b":"Den direkte metode ignorerer alle ydelser mellem supportafdelingerne. Den er enkel, men mindst præcis. Den trinvise metode medregner nogle ydelser mellem supportafdelingerne. Den er mere præcis, men afhænger af fordelingsrækkefølgen. Den reciprokke metode medregner alle gensidige ydelser. Den er mest præcis, men også mest kompleks. Resultaterne i eksemplet er. Direkte metode: Montage 3.290.000 og Klargøring 1.770.000. Trinvis metode. Montage 3.296.000 og Klargøring 1.764.000. Reciprok metode. Montage cirka 3.263.400 og Klargøring cirka 1.796.600. Den mest avancerede metode er ikke automatisk den bedste i praksis. Virksomheden skal vurdere, om den større præcision har betydning for priser, produktvalg, præstationsmåling eller kontrakter. Hvis ydelserne mellem supportafdelingerne er meget små, kan den direkte metode være tilstrækkelig."},{"t":"Stand-alone- og incremental-metoden","b":"Når fælles omkostninger skal fordeles mellem flere brugere, projekter eller produkter, kan virksomheden anvende stand-alone-metoden eller incremental-metoden. Stand-alone-metoden fordeler fællesomkostningen efter de omkostninger, som hver part ville have haft, hvis den havde anvendt ressourcen alene. Hvis to afdelinger hver for sig ville betale henholdsvis 60.000 og 40.000, mens den fælles løsning koster 80.000, bliver fordelingsandelene: Afdeling A: 60.000 divideret med 100.000=60 %. Afdeling B. 40.000 divideret med 100.000=40 %. Den fælles omkostning fordeles dermed. Afdeling A: 80.000×60 %=48.000. Afdeling B. 80.000×40 %=32.000. Metoden fordeler besparelsen proportionalt og opfattes ofte som rimelig. Incremental-metoden skelner mellem en primær bruger og en incremental bruger. Den primære bruger tildeles den omkostning, som brugeren ville have haft alene. Den efterfølgende bruger tildeles kun den ekstra omkostning, som opstår ved at inkludere denne bruger. Hvis A er primær bruger og ville have haft en omkostning på 60.000 alene, mens den fælles løsning koster 80.000, bliver fordelingen: A: 60.000. B: 80.000-60.000=20.000. Metoden kan skabe uenighed, fordi valget af primær bruger har stor betydning. Den primære bruger får ikke del i hele besparelsen ved den fælles løsning, mens den efterfølgende bruger kan få en betydelig fordel. Et kompromis kan være at beregne fordelingen med hver part som primær bruger og anvende gennemsnittet."},{"t":"Konsekvenser af en uhensigtsmæssig allokeringsbase","b":"En forkert eller upræcis allokeringsbase kan give omkostningsforvridning, hvor nogle omkostningsobjekter får allokeret for mange omkostninger, mens andre får for få. Det kan føre til. for høje priser på rentable produkter. for lave priser på omkostningstunge produkter. fejlagtig udfasning af profitable produkter. fortsat salg af produkter, som reelt giver underskud. forkert vurdering af kunder og kontrakter. uhensigtsmæssig outsourcing. konflikter mellem afdelinger. manipulation af aktiviteter for at undgå allokerede omkostninger. forkert præstationsvurdering af ledere. Hvis supportomkostninger eksempelvis fordeles efter antal medarbejdere, kan en afdeling få et incitament til at erstatte ansatte med eksterne konsulenter, selv om det øger virksomhedens samlede omkostninger. Afdelingen reducerer dermed sin allokerede omkostning, men virksomheden bliver ikke nødvendigvis mere effektiv. Allokeringsregler kan også påvirke kontrakter. Derfor bør kontrakter tydeligt angive. hvilke omkostningselementer der kan medregnes. hvilke allokeringsbaser der skal anvendes. om budgetterede eller faktiske satser anvendes. hvordan afvigelser skal behandles. hvordan fælles- og supportomkostninger fordeles. hvordan ændringer i aktiviteter eller kapacitet håndteres."},{"t":"Omkostningshierarkier","b":"Et omkostningshierarki opdeler omkostninger efter det niveau, hvor aktiviteterne udføres. Det hjælper ledelsen med at finde en allokeringsbase, der passer til den enkelte omkostnings årsag. Typiske niveauer er. Enhedsniveau: Aktiviteter udføres for hver produceret enhed. Eksempler er direkte materialer, energiforbrug og maskintid. Omkostningerne stiger typisk med antallet af producerede enheder. Batchniveau. Aktiviteter udføres for hver produktionsserie eller ordre, uanset hvor mange enheder serien indeholder. Eksempler er maskinomstilling, kvalitetskontrol af en batch og behandling af en indkøbsordre. Produkt- eller serviceniveau. Aktiviteter understøtter et bestemt produkt eller en bestemt service. Eksempler er produktdesign, vedligeholdelse af produktspecifikationer og produktspecifik markedsføring. Kunde- eller distributionskanalniveau. Aktiviteter udføres for bestemte kunder eller kundegrupper. Eksempler er kundebesøg, særlige leveringsaftaler og kundespecifik support. Virksomhedsniveau. Aktiviteter understøtter hele organisationen. Eksempler er direktion, revision, sikkerhed og dele af hovedkontorets økonomifunktion. Hierarkiet er vigtigt, fordi alle omkostninger ikke bør fordeles efter antal producerede enheder. En produktvariant, der fremstilles i mange små batches, kan eksempelvis skabe flere omstillingsomkostninger end et produkt, der fremstilles i få store batches, selv om de to produkter har samme samlede produktionsmængde."},{"t":"Fortolkning og anvendelse","b":"Allokerede omkostninger skal altid fortolkes med forsigtighed. En allokering viser, hvordan en omkostning er fordelt efter en valgt regel. Den viser ikke nødvendigvis, hvor meget virksomheden kan spare ved at reducere eller lukke et omkostningsobjekt. Hvis et produkt får allokeret 500.000 i fællesomkostninger, betyder det ikke automatisk, at virksomheden sparer 500.000 ved at udfase produktet. Fællesomkostningen kan fortsætte og efterfølgende blive fordelt på de resterende produkter. Ved beslutninger bør virksomheden derfor skelne mellem: direkte og indirekte omkostninger. faste og variable omkostninger. kontrollerbare og ukontrollerbare omkostninger. allokerede og undgåelige omkostninger. historiske og fremtidige omkostninger. relevante og irrelevante omkostninger. Omkostningsallokering er især nyttig til fuld omkostningsberegning, ansvarliggørelse, kontrakter og ekstern rapportering. Ved konkrete økonomiske beslutninger skal de allokerede omkostninger suppleres med en vurdering af, hvilke omkostninger der faktisk ændres som følge af beslutningen. Bemærkning. Den vedhæftede bog handler om Operations & Supply Chain Management og indeholder ikke kapitlet om omkostningsallokering, som PowerPointen henviser til. Noterne ovenfor er derfor bygget op efter PowerPointens indhold og suppleret med relevant økonomistyringsviden, men ikke med et tilsvarende kapitel fra den vedhæftede bog."},{"t":"Opgaver til Lektion 5","b":"Totale omk. 3.000.000€Totale kwh: 240.000kwhOmk. Pr. kwh = 3000000 divideret med 240000=12,5Allokeret til Iraklion 120000·12,5=1500000€Dual RateFixed cost deles med budgeteret omk. 30%·1000000=300000Variable omk. Deles med actual cost. 50%·2000000=1000000300.000 + 1.000.000 = 1.300.000."}]},{"n":6,"name":"L6 Fællesproduktion","items":[{"t":"Omkostningsfordeling ved fællesproduktion","b":"Fællesproduktion opstår, når én produktionsproces samtidig frembringer to eller flere produkter. Indtil produkterne bliver særskilt identificerbare, er det ikke muligt at spore produktionsomkostningerne direkte til det enkelte produkt. Omkostningerne frem til dette tidspunkt kaldes fællesomkostninger. Fællesomkostninger kan eksempelvis opstå ved. forarbejdning af råmælk til fløde og skummetmælk. raffinering af råolie til benzin, diesel og andre olieprodukter. forarbejdning af træ til forskellige træprodukter. slagtning og forarbejdning af dyr til forskellige kødprodukter. kemisk produktion, hvor én proces frembringer flere kemiske stoffer. køb og udvikling af et jordareal, som efterfølgende opdeles i flere byggegrunde. Det centrale problem er, at fællesomkostningerne ikke har en direkte årsagssammenhæng med et bestemt produkt. Produkterne fremstilles sammen, og virksomheden kan normalt ikke fremstille ét af produkterne uden samtidig at fremstille de andre. Fordelingen af fællesomkostninger bliver derfor en allokering og ikke en direkte sporing af omkostninger."},{"t":"Centrale begreber","b":"Fællesomkostninger, også kaldet joint costs, er omkostningerne ved en fælles produktionsproces, der samtidig frembringer flere produkter. Fællesomkostningerne afholdes før produkterne bliver særskilt identificerbare. De kan derfor ikke spores direkte til det enkelte produkt. Hvis råmælk anvendes til at fremstille både fløde og skummetmælk, er omkostningerne til blandt andet råmælk, arbejdskraft og maskiner frem til opsplitningen fællesomkostninger. Opsplitningspunkt. Opsplitningspunktet, også kaldet split-off point, er det tidspunkt i produktionsprocessen, hvor de enkelte produkter bliver særskilt identificerbare. Før opsplitningspunktet behandles produkterne som et samlet output af den fælles proces. Efter opsplitningspunktet kan virksomheden. sælge produkterne direkte. videreforarbejde et eller flere af produkterne. opbevare produkterne på lager. foretage produktspecifik kvalitetskontrol eller emballering. Opsplitningspunktet er ikke nødvendigvis et fysisk sted. Det kan være et bestemt tidspunkt eller procestrin, hvor de enkelte produkter kan identificeres og måles separat. Separate omkostninger, også kaldet separable costs, er de omkostninger, der opstår efter opsplitningspunktet, og som kan henføres til et bestemt produkt. Separate omkostninger kan eksempelvis være. videreforarbejdning. produktspecifik emballage. særlige materialer. produktspecifik arbejdskraft. yderligere kvalitetskontrol. produktspecifik distribution. Forskellen er derfor. Fællesomkostninger opstår før opsplitningspunktet. Separate omkostninger opstår efter opsplitningspunktet. Separate omkostninger kan normalt spores til det enkelte produkt. Fællesomkostninger skal derimod fordeles ved hjælp af en valgt fordelingsmetode."},{"t":"Fællesprodukter, hovedprodukter og biprodukter","b":"Resultaterne af en fælles produktionsproces kan klassificeres efter deres relative salgsværdi. Fællesprodukter, også kaldet joint products, er to eller flere produkter, der: fremkommer fra den samme produktionsproces. først bliver særskilt identificerbare ved opsplitningspunktet. hver især har en forholdsvis høj salgsværdi. Hvis både fløde og skummetmælk har væsentlig salgsværdi, kan begge klassificeres som fællesprodukter. Hovedprodukt. Et hovedprodukt er det produkt fra den fælles proces, der har klart størst salgsværdi. Hvis ét produkt har en høj salgsværdi, mens de øvrige har væsentligt lavere værdier, betragtes det værdifulde produkt som hovedproduktet. Biprodukt. Et biprodukt, også kaldet by-product, opstår som følge af produktionen af et hovedprodukt eller flere fællesprodukter, men har en relativt lav salgsværdi sammenlignet med de øvrige produkter. Et produkt er ikke nødvendigvis permanent klassificeret som et biprodukt. Klassifikationen afhænger af økonomiske forhold og kan ændre sig over tid. Hvis efterspørgslen, prisen eller mulighederne for videreforarbejdning stiger, kan et tidligere biprodukt udvikle sig til et hovedprodukt eller fællesprodukt. Valle fra osteproduktion illustrerer dette. Valle blev tidligere ofte betragtet som affald eller et lavværdiprodukt, men kan gennem videreforarbejdning omdannes til værdifulde proteiningredienser. Den økonomiske betydning kan dermed blive så stor, at betegnelsen biprodukt ikke længere er passende. Skrot og affald. Skrot har en meget begrænset salgsværdi, mens affald kan have ingen eller negativ værdi, hvis virksomheden skal betale for bortskaffelsen. Forskellen mellem fællesprodukt, biprodukt og skrot bygger dermed hovedsageligt på produkternes relative salgsværdier, ikke på deres fysiske mængder."},{"t":"Hvorfor fordeles fællesomkostninger?","b":"Fællesomkostninger kan ikke fordeles til produkterne ud fra en entydig årsagssammenhæng. Fordelingen foretages derfor hovedsageligt for at opfylde bestemte regnskabsmæssige, kontraktmæssige og juridiske formål. Lager og vareforbrug. Fællesomkostninger kan fordeles for at beregne. lagerværdien af fællesprodukterne. vareforbrug, også kaldet cost of goods sold eller COGS. periodens bruttofortjeneste og resultat. Hvis en del af produktionen ikke er solgt ved periodens udgang, skal en andel af produktionsomkostningerne normalt indregnes i lageret. Det kræver, at fællesomkostningerne fordeles mellem produkterne. Omkostningsgodtgørelse ved kontrakter. Ved visse kontrakter får virksomheden refunderet sine omkostninger eller beregner prisen ud fra dokumenterede omkostninger. Hvis flere produkter fremstilles i samme proces, skal virksomheden kunne dokumentere, hvordan fællesomkostningerne er fordelt. Forsikringsafregninger. Hvis produkter eller lagerbeholdninger ødelægges, kan forsikringsafregningen tage udgangspunkt i produkternes beregnede omkostninger. En fordeling af fællesomkostningerne kan derfor være nødvendig. Prisregulering. Regulerede virksomheder kan være nødt til at dokumentere omkostningerne ved bestemte produkter eller serviceydelser. Fællesomkostninger kan indgå i grundlaget for den pris, virksomheden må opkræve. Juridiske og økonomiske opgørelser. Fordeling kan også være nødvendig i forbindelse med: retssager. erstatningskrav. skatteberegninger. offentlige kontrakter. dokumentation af produktresultater. Intern lønsomhedsrapportering. Virksomheden kan fordele fællesomkostninger for at beregne et regnskabsmæssigt resultat for hvert produkt. Resultatet skal dog fortolkes forsigtigt, fordi det afhænger af den valgte allokeringsmetode. Et produkt kan fremstå profitabelt med én fordelingsmetode og mindre profitabelt med en anden, selv om virksomhedens samlede indtjening er uændret."},{"t":"Begrænsninger ved fordeling af fællesomkostninger","b":"Fordelingen ændrer ikke virksomhedens samlede omkostninger eller samlede resultat. Den bestemmer kun, hvordan fællesomkostningerne placeres mellem produkterne. Der findes normalt ikke én objektivt korrekt fordeling, fordi forskellige metoder bygger på forskellige antagelser: Salgsværdimetoden bygger på produkternes relative salgsværdier. Den fysiske metode bygger på mængder, vægt eller volumen. NRV-metoden bygger på estimerede salgsværdier og separate omkostninger. Den konstante bruttomarginmetode bygger på et krav om samme bruttomarginprocent. Allokeringen kan derfor være nødvendig til lager og rapportering uden samtidig at være relevant for ledelsens økonomiske beslutninger. Et eksempel er et jordareal, der købes og opdeles i ti byggegrunde. Anskaffelses- og byggemodningsomkostningerne vedrører området som helhed. En fordeling mellem de enkelte grunde kan foretages ud fra areal eller salgsværdi, men fordelingen vil altid bygge på et valgt princip. Den samlede lønsomhed kan vurderes mere sikkert end den præcise lønsomhed for hver grund."},{"t":"Metoder til fordeling af fællesomkostninger","b":"Der findes fire centrale metoder. Salgsværdi ved opsplitningspunktet. Fysisk målemetode. Estimeret nettorealisationsværdi, NRV. Konstant bruttomarginprocent-NRV. Metoderne kan opdeles i to hovedgrupper. Markedsbaserede metoder: salgsværdi ved opsplitningspunktet. estimeret NRV. konstant bruttomarginprocent-NRV. Fysisk baseret metode. fysisk måling af vægt, volumen, antal enheder eller lignende."},{"t":"Salgsværdi ved opsplitningspunktet","b":"Metoden sales value at split-off fordeler fællesomkostningerne efter produkternes relative salgsværdi ved opsplitningspunktet. Metoden anvendes, når produkterne kan sælges ved opsplitningspunktet, og der derfor findes en observerbar markedspris. Beregningsmetode. Produktets salgsværdi ved opsplitning=fysisk mængde×salgspris ved opsplitning. Produktets fordelingsandel=produktets salgsværdi divideret med samlet salgsværdi. Allokerede fællesomkostninger=samlede fællesomkostninger×fordelingsandel. Eksempel. En fælles proces har omkostninger på 400 og producerer: 100 liter fløde, der kan sælges for 2 pr. liter. 300 liter skummetmælk, der kan sælges for 1 pr. liter. Salgsværdi for fløde. 100×2=200. Salgsværdi for skummetmælk. 300×1=300. Samlet salgsværdi. 200+300=500. Flødens fordelingsandel. 200 divideret med 500=40 %. Skummetmælkens fordelingsandel. 300 divideret med 500=60 %. Fordelte fællesomkostninger. Fløde: 400×40 %=160. Skummetmælk. 400×60 %=240. Fællesomkostning pr. liter. Fløde: 160 divideret med 100=1,60 pr. liter. Skummetmælk. 240 divideret med 300=0,80 pr. liter. Metoden giver forskellige omkostninger pr. fysisk enhed, fordi produkternes salgsværdi er forskellig. Begrundelse for metoden. Metoden bygger på en benefits-received-tilgang. Et produkt med høj salgsværdi antages at have større fordel af den fælles proces og tildeles derfor en større andel af fællesomkostningerne. Fordelen er, at salgsværdi udtrykkes i en fælles måleenhed, uanset om produkterne er forskellige. Metoden tager samtidig hensyn til produkternes økonomiske værdi. Fordele og ulemper. Fordelene er. relativt enkel beregning. bygger på observerbare markedspriser. anvender en fælles økonomisk måleenhed. afspejler produkternes evne til at skabe omsætning. Ulemperne er. kræver en markedspris ved opsplitningspunktet. prisændringer kan ændre omkostningsfordelingen. viser ikke en reel årsagssammenhæng mellem produkt og omkostning. tager ikke hensyn til videreforarbejdningen efter opsplitningspunktet. Metoden bør normalt anvendes frem for NRV, når der findes pålidelige markedspriser ved opsplitningspunktet."},{"t":"Den fysiske målemetode","b":"Ved den fysiske målemetode fordeles fællesomkostningerne efter produkternes relative fysiske mængde ved opsplitningspunktet. Mulige måleenheder er. antal enheder. kilo. ton. liter. længde. volumen. energiindhold. Beregningsmetode. Produktets fordelingsandel=produktets fysiske mængde divideret med samlet fysisk mængde. Allokerede fællesomkostninger=samlede fællesomkostninger×fordelingsandel. Eksempel. Produktionen udgør. 100 liter fløde. 300 liter skummetmælk. samlet produktion. 400 liter. Flødens andel. 100 divideret med 400=25 %. Skummetmælkens andel. 300 divideret med 400=75 %. Fordelte fællesomkostninger. Fløde: 400×25 %=100. Skummetmælk. 400×75 %=300. Fællesomkostning pr. liter. Fløde: 100 divideret med 100=1 pr. liter. Skummetmælk. 300 divideret med 300=1 pr. liter. Når omkostningerne fordeles efter liter, får alle liter den samme andel af fællesomkostningerne. Fordele og ulemper. Fordelene er. enkel at forstå og beregne. kræver ikke markedspriser. kan bygge på objektive fysiske målinger. påvirkes ikke direkte af prisudsving. Ulemperne er. ignorerer produkternes indtjeningsevne og salgsværdi. kan give meget store omkostninger til produkter med høj volumen og lav værdi. kræver, at produkterne kan måles med en fælles fysisk enhed. bliver vanskelig at anvende, hvis produkterne har meget forskellige egenskaber. Hvis ét produkt har stor fysisk volumen, men lav markedsværdi, kan metoden få produktet til at fremstå urentabelt. Den fysiske metode er derfor ofte mindre relevant, når produkternes værdier er meget forskellige."},{"t":"Estimeret nettorealisationsværdi","b":"Nettorealisationsværdi, forkortet NRV, anvendes normalt, når produkterne ikke kan sælges ved opsplitningspunktet, eller når en pålidelig salgspris ved opsplitningspunktet ikke findes. NRV estimerer produktets værdi ved opsplitningspunktet ved at tage udgangspunkt i den endelige salgsværdi og trække de omkostninger fra, som afholdes efter opsplitningen. NRV ved opsplitningspunktet = endelig salgsværdi minus separate omkostninger. Fællesomkostningerne fordeles derefter i forhold til produkternes relative NRV. Beregningsmetode. Beregn den endelige salgsværdi for hvert produkt. Fratræk de separate omkostninger efter opsplitningspunktet. Beregn produktets NRV. Beregn produktets andel af den samlede NRV. Fordel fællesomkostningerne efter NRV-andelene. Eksempel. Den fælles proces har omkostninger på 400. Efter opsplitningspunktet videreforarbejdes produkterne til: 80 liter lækker fløde, der sælges for 6,25 pr. liter. 200 liter kondenseret mælk, der sælges for 5,50 pr. liter. De separate omkostninger er. Lækker fløde: 280. Kondenseret mælk. 520. Endelig salgsværdi for lækker fløde. 80×6,25=500. Endelig salgsværdi for kondenseret mælk. 200×5,50=1.100. NRV for lækker fløde. 500-280=220. NRV for kondenseret mælk. 1.100-520=580. Samlet NRV. 220+580=800. Fordelingsandele. Lækker fløde: 220 divideret med 800=27,5 %. Kondenseret mælk. 580 divideret med 800=72,5 %. Fordelte fællesomkostninger. Lækker fløde: 400×27,5 %=110. Kondenseret mælk. 400×72,5 %=290. Samlede produktomkostninger. Lækker fløde: 110+280=390. Kondenseret mælk. 290+520=810. Produktionsomkostning pr. liter. Lækker fløde: 390 divideret med 80=4,875 pr. liter. Kondenseret mælk. 810 divideret med 200=4,05 pr. liter. Fordele og ulemper. Fordelene er. kan bruges, når produkterne ikke kan sælges ved opsplitningspunktet. tager hensyn til produkternes endelige salgsværdi. tager hensyn til omkostningerne ved videreforarbejdning. giver et markedsbaseret estimat for værdien ved opsplitningspunktet. Ulemperne er. bygger på estimater frem for observerbare værdier. ændringer i fremtidige salgspriser påvirker fordelingen. ændringer i forventede separate omkostninger påvirker fordelingen. er mere kompleks end salgsværdi- og fysisk målemetoden. NRV er ikke nødvendigvis objektivt mere korrekt, men den kommer ofte tættere på produkternes økonomiske værdi, når der ikke findes en salgspris ved opsplitningspunktet."},{"t":"Konstant bruttomarginprocent-NRV","b":"Den konstante bruttomarginprocent-NRV-metode fordeler fællesomkostningerne, så alle fællesprodukter får den samme bruttomarginprocent. Metoden tager udgangspunkt i hele den fælles produktionsproces og arbejder baglæns fra den endelige salgsværdi. Beregningsmetode. Beregn den samlede endelige salgsværdi. Beregn de samlede omkostninger, som består af fællesomkostninger og separate omkostninger. Beregn den samlede bruttomargin. Beregn den fælles bruttomarginprocent. Beregn hvert produkts bruttomargin med den fælles procent. Beregn hvert produkts samlede vareforbrug. Fratræk produktets separate omkostninger. Det resterende beløb er produktets allokerede fællesomkostning. Eksempel. Endelig salgsværdi. Lækker fløde: 500. Kondenseret mælk. 1.100. Samlet salgsværdi. 1.600. Samlede omkostninger. Fællesomkostninger: 400. Separate omkostninger til lækker fløde. 280. Separate omkostninger til kondenseret mælk. 520. Samlede omkostninger. 1.200. Samlet bruttomargin. 1.600-1.200=400. Bruttomarginprocent. 400 divideret med 1.600=25 %. Bruttomargin for lækker fløde. 500×25 %=125. Samlede produktomkostninger for lækker fløde. 500-125=375. Allokerede fællesomkostninger til lækker fløde. 375-280=95. Bruttomargin for kondenseret mælk. 1.100×25 %=275. Samlede produktomkostninger for kondenseret mælk. 1.100-275=825. Allokerede fællesomkostninger til kondenseret mælk: 825-520=305. Kontrol. 95+305=400. Begge produkter får samme bruttomarginprocent på 25 %, men forskellige beløb i bruttomargin. Fortolkning. Metoden sikrer et ensartet regnskabsmæssigt afkast på tværs af produkterne. Det kan være nyttigt, hvis ledelsen ønsker at præsentere produkterne med samme bruttomarginprocent. Metoden kan dog skjule reelle økonomiske forskelle. Et produkt kan være langt dyrere at videreforarbejde end et andet, men metoden tvinger alligevel begge produkter til at have den samme marginprocent. I særlige tilfælde kan metoden give en negativ allokering af fællesomkostninger til et produkt. Det kan ske, hvis produktets separate omkostninger er så høje, at den ønskede fælles bruttomargin kun kan opnås ved at tildele produktet et negativt fællesomkostningsbeløb. Dette viser, at metoden er en matematisk allokeringsmodel og ikke en direkte måling af ressourceforbruget."},{"t":"Sammenligning af fordelingsmetoderne","b":"Salgsværdi ved opsplitningspunktet. Metoden er normalt mest hensigtsmæssig, når der findes en pålidelig markedspris ved opsplitningspunktet. Den er enkel og bygger på observerbare værdier, men tager ikke hensyn til senere videreforarbejdning. Fysisk målemetode. Metoden er enkel og uafhængig af markedspriser, men den ignorerer produkternes økonomiske værdi. Den kan derfor give stærkt forvrængede produktresultater, især når produkternes relative salgsværdier er meget forskellige. Estimeret NRV. Metoden er relevant, når der ikke findes en salgspris ved opsplitningspunktet. Den tager hensyn til både den endelige salgsværdi og de separate omkostninger, men bygger på estimater og er mere kompleks. Konstant bruttomarginprocent-NRV. Metoden giver samme bruttomarginprocent på alle produkter. Den kan være nyttig til bestemte rapporteringsformål, men resultatet kan være vanskeligt at fortolke økonomisk og kan i særlige tilfælde føre til negative allokeringer. En praktisk prioritering kan være. Brug salgsværdi ved opsplitningspunktet, hvis der findes pålidelige markedspriser. Brug estimeret NRV, hvis en salgspris ved opsplitningspunktet ikke findes. Brug konstant bruttomarginprocent, hvis ensartet produktmargin er et specifikt rapporteringsmål. Brug den fysiske metode, hvis markedsværdier ikke kan fastlægges, og en meningsfuld fælles fysisk måleenhed findes."},{"t":"Fordelingen påvirker produktresultatet","b":"Den valgte fordelingsmetode kan føre til forskellige omkostninger og bruttomarginer for det enkelte produkt. I eksemplet med fællesomkostninger på 400 bliver fordelingen: Salgsværdi ved opsplitning: 160 til fløde og 240 til skummetmælk. Fysisk måling. 100 til fløde og 300 til skummetmælk. Estimeret NRV efter videreforarbejdning. 110 til lækker fløde og 290 til kondenseret mælk. Konstant bruttomarginprocent. 95 til lækker fløde og 305 til kondenseret mælk. Virksomhedens samlede fællesomkostninger er fortsat 400 i alle tilfælde. Det er kun fordelingen mellem produkterne, der ændrer sig. Ledelsen bør derfor ikke antage, at et produkt er økonomisk dårligt, blot fordi det får et lille resultat efter allokering. Resultatet kan skyldes fordelingsmetoden og ikke produktets egentlige økonomiske bidrag."},{"t":"Sælg eller videreforarbejd","b":"Ved opsplitningspunktet skal virksomheden ofte beslutte, om et fællesprodukt skal: sælges med det samme. videreforarbejdes og derefter sælges. Dette er en relevant omkostningsbeslutning. Fællesomkostningerne er allerede afholdt eller uundgåelige på beslutningstidspunktet og er derfor irrelevante for valget. Beslutningen skal kun baseres på. den ekstra omsætning ved videreforarbejdning. de ekstra separate omkostninger ved videreforarbejdning. Ekstra resultat ved videreforarbejdning = ekstra salgsindtægt minus ekstra videreforarbejdningsomkostninger. Hvis resultatet er positivt, er videreforarbejdning økonomisk fordelagtig. Hvis resultatet er negativt, bør produktet som udgangspunkt sælges ved opsplitningspunktet. Beslutningseksempel. Antag, at et produkt kan sælges ved opsplitningspunktet for 300. Det kan videreforarbejdes for 80 og derefter sælges for 410. Ekstra salgsindtægt. 410-300=110. Ekstra videreforarbejdningsomkostning. 80. Ekstra resultat. 110-80=30. Produktet bør videreforarbejdes, fordi virksomhedens resultat forbedres med 30. Fællesomkostningen indgår ikke i beregningen. Den ændres ikke af valget og er derfor irrelevant."},{"t":"Hvorfor allokerede fællesomkostninger er irrelevante for beslutningen","b":"Antag, at produktet i det foregående eksempel har fået allokeret 200 i fællesomkostninger. De 200 skal ikke medtages, når virksomheden vælger mellem salg og videreforarbejdning. Fællesomkostningen. er afholdt for at frembringe alle produkterne. ændres ikke af beslutningen om det enkelte produkt. kan ikke undgås ved at vælge direkte salg frem for videreforarbejdning. Hvis virksomheden inkluderer allokerede fællesomkostninger, kan den komme til at afvise en videreforarbejdning, som reelt ville forbedre det samlede resultat. Det afgørende princip er. Kun fremtidige indtægter og omkostninger, som er forskellige mellem alternativerne, er relevante."},{"t":"Kapacitetsbegrænsninger og alternativ anvendelse","b":"En positiv differens mellem ekstra omsætning og ekstra omkostning betyder ikke altid, at videreforarbejdning automatisk bør gennemføres. Virksomheden skal også overveje. om der er tilstrækkelig produktionskapacitet. om videreforarbejdningen fortrænger en mere profitabel aktivitet. om der kræves nye investeringer. om der er tilstrækkelig efterspørgsel efter det videreforarbejdede produkt. om salgsprisen er realistisk. om der opstår yderligere kvalitets-, lager- eller distributionsomkostninger. Hvis en knap ressource anvendes, skal alternativomkostningen ved at bruge ressourcen også medtages. Den bedste løsning er den, der giver det højeste dækningsbidrag pr. enhed af den begrænsende faktor."},{"t":"Fællesomkostninger og intern præstationsmåling","b":"Fordelte fællesomkostninger bør anvendes forsigtigt ved vurdering af produktansvarlige og afdelingsledere. Hvis en leder ikke kan påvirke. den fælles proces. størrelsen af fællesomkostningerne. fordelingsmetoden. de øvrige fællesprodukters mængde eller salgsværdi. bør lederen ikke vurderes ukritisk på et produktresultat efter allokering af fællesomkostninger. Til præstationsmåling kan det være mere relevant at fokusere på: produktets omsætning. separate omkostninger. dækningsbidrag efter opsplitningspunktet. kvalitet og spild. udbytte fra videreforarbejdningen. kontrollerbare omkostninger. Det følger princippet om, at ledere primært bør vurderes på forhold, som de har mulighed for at påvirke."},{"t":"Regnskabsmæssig behandling af biprodukter","b":"Biprodukter har relativt lav salgsværdi, og virksomheder anvender derfor ofte en enklere regnskabsmæssig behandling end ved fællesprodukter. Der skal træffes to valg. Skal biproduktets værdi indregnes, når det produceres, eller først når det sælges? Skal værdien reducere hovedproduktets omkostninger eller indregnes som en særskilt indtægt? Det giver fire mulige metoder."},{"t":"Indregning ved produktion som reduktion af omkostninger","b":"Biproduktets forventede NRV indregnes, når biproduktet produceres. Værdien reducerer fællesomkostningerne eller hovedproduktets produktionsomkostninger. Nettofællesomkostning = samlede fællesomkostninger minus biproduktets NRV. Den resterende nettoomkostning fordeles derefter mellem hovedprodukterne. Metoden betyder, at biproduktets økonomiske værdi reducerer omkostningen ved den samlede produktion."},{"t":"Indregning ved produktion som særskilt indtægt","b":"Biproduktets forventede værdi indregnes ved produktionen og vises som en særskilt indtægt. Samtidig indregnes biproduktet som lager, hvis det endnu ikke er solgt. Metoden synliggør biproduktets indtjening, men kræver et pålideligt estimat af salgsværdi og eventuelle omkostninger frem til salg."},{"t":"Indregning ved salg som reduktion af omkostninger","b":"Biproduktets indtægt indregnes først, når biproduktet sælges. Salgsindtægten reducerer hovedproduktets produktionsomkostninger eller vareforbrug. Metoden er enkel, men kan føre til dårlig periodisering. Biproduktet kan være produceret i én periode og solgt i en anden, hvilket betyder, at omkostningsreduktionen indregnes senere end selve produktionen."},{"t":"Indregning ved salg som særskilt indtægt","b":"Biproduktets salgsindtægt indregnes først ved salget og vises som anden omsætning eller anden indtægt. Metoden er administrativt enkel, især når biproduktets værdi er uvæsentlig. Den giver dog ikke nødvendigvis det mest præcise billede af lager og perioderesultat."},{"t":"Valg af metode for biprodukter","b":"Valget afhænger blandt andet af. biproduktets salgsværdi. hvor væsentligt biproduktet er. om værdien kan estimeres pålideligt. om biproduktet opbevares på lager. hvor lang tid der går mellem produktion og salg. virksomhedens behov for præcis resultatmåling. gældende regnskabsregler. Hvis biproduktet har en meget lille værdi, kan indregning ved salg være tilstrækkelig. Hvis værdien er væsentlig, kan indregning ved produktion give et mere retvisende billede af lager og resultat. Hvis et biprodukts økonomiske betydning vokser markant, bør virksomheden overveje at omklassificere det til et fællesprodukt og anvende en egentlig fællesomkostningsfordeling."},{"t":"Usikkerhed og ændringer over tid","b":"Fordelingen af fællesomkostninger er følsom over for ændringer i: salgspriser. produktionsmængder. udbytte og spild. separate omkostninger. efterspørgsel. teknologiske muligheder for videreforarbejdning. biprodukters anvendelsesmuligheder. Særligt NRV-metoderne bygger på estimater. Hvis den forventede endelige salgspris eller videreforarbejdningsomkostning ændres, ændres både produktets NRV og dets andel af fællesomkostningerne. Virksomheden bør derfor anvende konsistente metoder fra periode til periode, men samtidig revurdere forudsætningerne, når markedsforhold eller produktionsprocesser ændrer sig."},{"t":"Typiske fejl i opgaver om fællesomkostninger","b":"At blande fælles og separate omkostninger sammen. Fællesomkostninger opstår før opsplitningspunktet. Separate omkostninger opstår efter opsplitningspunktet. Ved NRV-metoden trækkes de separate omkostninger fra den endelige salgsværdi for at estimere værdien ved opsplitningspunktet. At bruge slutproduktets salgsværdi direkte. Ved NRV-metoden må slutproduktets salgsværdi ikke anvendes direkte som fordelingsgrundlag. Separate omkostninger skal først trækkes fra. At glemme at gange pris med mængde. Fordelingsgrundlaget er produktets samlede salgsværdi og ikke blot salgsprisen pr. enhed. Samlet salgsværdi=antal enheder×pris pr. enhed. At inkludere fællesomkostninger i sælg-eller-videreforarbejd-beslutningen. Fællesomkostninger er irrelevante for denne beslutning, fordi de allerede er afholdt eller ikke ændres mellem alternativerne. At forveksle omkostningsfordeling med værdiskabelse. Et produkt skaber ikke nødvendigvis flere fællesomkostninger, blot fordi det tildeles en større andel efter salgsværdimetoden. Fordelingen er en regnskabsmæssig metode, ikke en måling af produktets faktiske forbrug før opsplitningen. At glemme kontrolberegningen. De allokerede fællesomkostninger skal altid summere til den samlede fællesomkostning: Summen af allokerede fællesomkostninger=samlede fællesomkostninger. Fordelingsandelene skal tilsvarende summere til 100 %."},{"t":"Fremgangsmåde ved beregningsopgaver","b":"En sikker fremgangsmåde er. Identificer fællesprocessen. Find opsplitningspunktet. Adskil fællesomkostninger fra separate omkostninger. Identificer produkter, mængder og salgsværdier. Afgør, hvilken fordelingsmetode opgaven kræver. Beregn fordelingsgrundlaget for hvert produkt. Beregn den samlede værdi af fordelingsgrundlaget. Beregn hvert produkts fordelingsandel. Gang fordelingsandelen med de samlede fællesomkostninger. Kontroller, at alle fordelte beløb tilsammen svarer til fællesomkostningerne. Tilføj eventuelle separate omkostninger, hvis den samlede produktomkostning skal beregnes. Divider med den endelige produktmængde, hvis omkostningen pr. enhed skal beregnes."},{"t":"Samlet forståelse","b":"Fællesomkostninger opstår, fordi flere produkter fremstilles i den samme proces frem til opsplitningspunktet. Efter opsplitningen kan produkterne identificeres særskilt, og efterfølgende omkostninger kan spores direkte til dem. Fordelingen af fællesomkostninger er især nødvendig til lageropgørelse, vareforbrug, kontrakter, forsikringsafregninger og regulatoriske formål. Fordelingen bør derimod anvendes forsigtigt til beslutninger og præstationsmålinger, fordi den ikke bygger på en entydig årsagssammenhæng. Salgsværdi ved opsplitningspunktet er normalt den mest direkte markedsbaserede metode, når en salgspris findes. NRV anvendes, når produkterne først kan sælges efter videreforarbejdning. Den konstante bruttomarginmetode giver samme marginprocent på alle produkter, mens den fysiske metode fordeler alene efter mængder. Ved beslutningen om salg eller videreforarbejdning er fællesomkostningerne irrelevante. Virksomheden skal udelukkende sammenligne den ekstra salgsindtægt med de ekstra omkostninger efter opsplitningspunktet. Biprodukter kan enten reducere hovedproduktets omkostninger eller indregnes som en særskilt indtægt. Hvis et biprodukts økonomiske værdi vokser, kan det blive nødvendigt at ændre klassifikationen og behandle det som et fællesprodukt."}]},{"n":7,"name":"L7 Bidragsmetoden og regnskabsmetoden","items":[{"t":"Formålet med forskellige lagerberegningsmetoder","b":"I en produktionsvirksomhed påvirker lageropgørelsen både balancen og resultatopgørelsen. Når nogle af de producerede varer ikke bliver solgt i samme periode, skal virksomheden afgøre, hvilke produktionsomkostninger der skal indgå i lagerværdien, og hvilke der straks skal omkostningsføres. De to centrale metoder er. Bidragsmetoden, også kaldet variable costing, hvor kun variable produktionsomkostninger indgår i lagerværdien. Regnskabsmetoden, også kaldet absorption costing eller full costing, hvor både variable og allokerede faste produktionsomkostninger indgår i lagerværdien. Den afgørende forskel mellem metoderne er derfor behandlingen af de faste produktionsomkostninger. Metoderne ændrer ikke virksomhedens faktiske indtægter, omkostninger eller pengestrømme. De ændrer tidspunktet for, hvornår de faste produktionsomkostninger indregnes i resultatopgørelsen."},{"t":"Omkostningernes behandling","b":"Under bidragsmetoden indgår alle variable produktionsomkostninger i produktets kostpris. Faste produktionsomkostninger behandles som periodeomkostninger og indregnes fuldt ud i resultatopgørelsen i den periode, hvor de afholdes. De bliver dermed ikke en del af lagerets værdi. Under regnskabsmetoden indgår både variable og faste produktionsomkostninger i produktets kostpris. De faste produktionsomkostninger fordeles på de producerede enheder. Den del, der knytter sig til usolgte varer, bliver stående som et aktiv i lagerbeholdningen og omkostningsføres først, når varerne sælges. Ikke-produktionsrelaterede omkostninger, eksempelvis markedsføring, produktudvikling, administration og salgsomkostninger, behandles normalt som periodeomkostninger under begge metoder. Det gælder både deres variable og faste dele. Forskellen kan sammenfattes således. Bidragsmetodens lagerkostpris: Variable direkte materialer+variabel direkte løn+variable indirekte produktionsomkostninger. Regnskabsmetodens lagerkostpris. Variable produktionsomkostninger+allokerede faste produktionsomkostninger."},{"t":"Resultatopgørelsens opbygning","b":"Bidragsmetoden opdeler omkostninger efter deres adfærd, altså om de er variable eller faste. Resultatopgørelsen opbygges omkring dækningsbidraget: Omsætning− variable produktionsomkostninger for solgte varer− variable salgs- og distributionsomkostninger= dækningsbidrag− faste produktionsomkostninger− øvrige faste omkostninger= driftsresultat. Dækningsbidraget viser, hvor meget salget bidrager med til at dække kapacitetsomkostningerne og derefter skabe overskud. Bidragsmetoden er derfor særlig anvendelig til intern beslutningsstøtte, kortsigtet planlægning og analyser af sammenhængen mellem aktivitet, omkostninger og resultat. Regnskabsmetoden opdeler i højere grad omkostningerne efter funktion. Resultatopgørelsen opbygges omkring bruttoresultatet: Omsætning− vareforbrug− eventuel ugunstig produktionsvolumenafvigelse= bruttoresultat− salgs-, distributions- og administrationsomkostninger= driftsresultat. Bruttoresultatet og dækningsbidraget er dermed ikke det samme. Bruttoresultatet er beregnet efter fradrag af både variable og allokerede faste produktionsomkostninger i de solgte varer. Dækningsbidraget er derimod beregnet efter fradrag af alle variable omkostninger, herunder variable ikke-produktionsomkostninger."},{"t":"Fredonia Fixtures – grunddata","b":"Fredonia Fixtures anvendes til at illustrere forskellen mellem metoderne. Virksomheden har følgende enhedsomkostninger. Salgsprisen er 71 kr. pr. enhed. Direkte materialer udgør 4 kr., direkte løn 21 kr. og variable indirekte produktionsomkostninger 24 kr. De samlede variable produktion
