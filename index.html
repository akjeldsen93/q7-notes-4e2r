 0,3. Sidste forecast Fₜ₋₁ = 90, sidste efterspørgsel Dₜ₋₁ = 100. Nyt forecast?", "model": "Fₜ = 0,3·100 + 0,7·90 = 30 + 63 = 93.", "id": "OM-sa-091", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L9", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Simpel eksponentiel udjævning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 134}, {"question": "Efterspørgsel de seneste tre uger: 10, 12, 14. Forecast for næste uge med naiv metode og MA(3)?", "model": "Naiv: 14. MA(3): (10+12+14)/3 = 12.", "id": "OM-sa-092", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L9", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Naiv forecasting og glidende gennemsnit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 135}, {"id": "OM-sa-103", "course": "OM", "lecture": 9, "type": "sa", "kind": "calc", "question": "[Øvelse] Efterspørgsel: 100, 110, 130. Beregn forecast for næste periode med MA(3) og WMA(2) med vægte 0,6/0,4.", "model": "MA(3) = (100+110+130)/3 = 113,3. WMA(2) = 0,6·130 + 0,4·110 = 122. WMA reagerer mere på den seneste stigning.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 136, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "calc", "eksamen"]}, {"id": "OM-term-L10-001", "course": "OM", "lecture": 10, "type": "card", "kind": "begreb", "front": "S&OP (aggregate planning)", "back": "Taktisk, tværfunktionel proces der integrerer salg/marketing med produktion, kapacitet og forsyningskæde til én fælles realistisk plan. Produktfamilieniveau, måned for måned, 12–24 måneders horisont, månedlig opdatering.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Hvad er S&OP?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "begreb", "grund"], "level": "grund", "order": 137}, {"id": "OM-term-L10-002", "course": "OM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Hvorfor S&OP skaber værdi", "back": "Omsætter prognoser til ressourcebehov, afslører kapacitetsproblemer i tide, koordinerer salg/produktion/finans og skaber én fælles realistisk plan. Planen træffer ikke beslutningerne – ledelsen gør.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Hvorfor skaber S&OP værdi?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "begreb", "grund"], "level": "grund", "order": 138}, {"id": "OM-term-L10-003", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Planlægningshierarkiet", "back": "Strategisk (flere år: faciliteter, teknologi, store kapacitetsinvesteringer, make-or-buy) → taktisk/S&OP (måneder: medarbejdere, skift, lager, overarbejde, underleverandører) → detaljeret planlægning og kontrol (timer–uger: ordrer, maskinplaner, sekvensering).", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Planlægningshierarkiet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model", "grund"], "level": "grund", "order": 139}, {"id": "OM-term-L10-004", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Top-down S&OP", "back": "Én samlet aggregeret salgsprognose + planlægningsværdier → ressourcebehov → alternative planer → sammenlign. Velegnet når produktmixet er stabilt og ressourcebehovet ens. Enkel, men gennemsnit kan skjule forskelle.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Top-down-planlægning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model", "grund"], "level": "grund", "order": 140}, {"id": "OM-term-L10-005", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Bottom-up S&OP", "back": "Ressourcebehov beregnes pr. produkt-/servicelinje og lægges sammen. Bruges når mixet ændrer sig, ressourcekrav er forskellige, eller bestemte ressourcer kan blive flaskehalse.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Bottom-up-planlægning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model", "grund"], "level": "grund", "order": 141}, {"id": "OM-term-L10-010", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Level production", "back": "Konstant arbejdsstyrke og regulær produktion; lageret absorberer forskellen mellem produktion og efterspørgsel. + stabil bemanding, ingen ansættelses-/afskedigelsesomk. − lager- og ukuransomk.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Level production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model", "grund"], "level": "grund", "order": 142}, {"id": "OM-term-L10-011", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Chase production", "back": "Produktionen følger efterspørgslen (ansættelser/afskedigelser, overarbejde, vikarer, underleverandører). + minimalt lager. − oplæringsomk., lavere produktivitet/kvalitet, utrygge medarbejdere. Velegnet når output ikke kan lagerføres.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Chase production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model", "grund"], "level": "grund", "order": 143}, {"id": "OM-term-L10-012", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Mixed production", "back": "Kombinerer level og chase: stabil grundbemanding + lager, overarbejde eller vikarer i spidser. Mere fleksibel end level, mere stabil end chase, men mere kompleks at lave og kommunikere. Den billigste beregnede plan er ikke nødvendigvis bedst i praksis.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Mixed production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model", "grund"], "level": "grund", "order": 144}, {"id": "OM-term-L10-015", "course": "OM", "lecture": 10, "type": "card", "kind": "sammenligning", "front": "Level vs. chase", "back": "Level: konstant arbejdsstyrke, lageret absorberer udsving – lageromk. Chase: produktionen følger efterspørgslen – ansættelses-/afskedigelses- og overtidsomk., minimalt lager. Mixed kombinerer.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Planstrategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 145, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "sammenligning", "grund"]}, {"id": "OM-term-L10-016", "course": "OM", "lecture": 10, "type": "card", "kind": "sammenligning", "front": "Top-down vs. bottom-up S&OP", "back": "Top-down: én aggregeret prognose × gennemsnitlig planlægningsværdi – enkel, kræver stabilt mix. Bottom-up: ressourcebehov pr. linje lægges sammen – nødvendig ved skiftende mix eller flaskehalse.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Top-down og bottom-up", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 146, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "sammenligning", "grund"]}, {"id": "OM-term-L10-006", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Planlægningsværdi", "back": "Historisk/analytisk værdi til at omregne salg til ressourcer (timer, maskintimer, materialer, omk. pr. enhed). Ved stabilt mix: vægtet gennemsnit = Σ(andel × ressourceforbrug), fx 0,4·2 + 0,4·3 + 0,2·4 = 2,8 t.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Planlægningsværdier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode", "eksamen"], "level": "eksamen", "order": 147}, {"id": "OM-term-L10-007", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Arbejdstimer og medarbejderbehov", "back": "Arbejdstimer = prognosticeret salg × timer pr. enhed (750 × 20 = 15.000). Medarbejderbehov = timer / timer pr. medarbejder (15.000/160 = 93,75) – teoretisk; overvej afrunding, overarbejde, fravær, oplæring.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Fra salgsprognose til ressourcebehov", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode", "eksamen"], "level": "eksamen", "order": 148}, {"id": "OM-term-L10-008", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Regulær produktion", "back": "RP = antal medarbejdere × timer pr. medarbejder / timer pr. enhed. Eks.: 105 × 160 / 20 = 840 enheder/måned.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Beregning af regulær produktion", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode", "eksamen"], "level": "eksamen", "order": 149}, {"id": "OM-term-L10-009", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Lagerligningen", "back": "EIₜ = EIₜ₋₁ + RPₜ + OPₜ − Sₜ (lager ultimo = primo + regulær + overarbejdsproduktion − salg). Ultimo i én måned er primo i den næste; negativt lager = restordrer/tabt salg.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Lagerligningen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode", "eksamen"], "level": "eksamen", "order": 150}, {"id": "OM-term-L10-013", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Omkostninger ved en S&OP-plan", "back": "Summér regulær produktion, overarbejde, lagerhold, restordrer, ansættelser og afskedigelser pr. måned; sammenlign planerne – og vurdér også ikke-økonomiske konsekvenser.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Sammenligning af planer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode", "eksamen"], "level": "eksamen", "order": 151}, {"id": "OM-term-L10-014", "course": "OM", "lecture": 10, "type": "card", "kind": "eksempel", "front": "Eksempel: level-plan trin for trin", "back": "1) Samlet efterspørgsel ± ønsket ændring i lager. 2) Del med antal måneder = konstant produktion. 3) Omregn til medarbejdere (timer/enhed ÷ timer/medarbejder). 4) Ansæt/afskedig i måned 1. 5) Lagerligningen måned for måned – tjek ikke-negativt. 6) Summér omk.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Level production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 152, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "eksempel", "eksamen"]}, {"question": "Produktmixet ændrer sig væsentligt, og produkterne har forskellige ressourcekrav. Hvilken S&OP-tilgang?", "options": ["Top-down", "Bottom-up", "Level", "Ingen af dem"], "answer": 1, "explanation": "Bottom-up, fordi ressourcebehovet skal beregnes pr. linje, når mixet ændrer sig. Forkert: top-down kræver stabilt mix; level er en planstrategi, ikke en beregningstilgang.", "id": "OM-mc-078", "course": "OM", "lecture": 10, "lectureName": "L10 Sales and Operations Planning", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L10", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Valg mellem top-down og bottom-up", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 153}, {"question": "Hvilken plan holder lageret på et minimum?", "options": ["Level", "Chase", "Mixed", "Lead"], "answer": 1, "explanation": "Chase følger efterspørgslen, så lageret holdes minimalt. Forkert: level bygger lager op; mixed bruger delvist lager; lead er en kapacitetsstrategi.", "id": "OM-mc-079", "course": "OM", "lecture": 10, "lectureName": "L10 Sales and Operations Planning", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L10", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Chase", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 154}, {"id": "OM-mc-112", "course": "OM", "lecture": 10, "type": "mc", "kind": "mc", "question": "En virksomhed producerer frisk mad, der ikke kan lagerføres, og kan let hyre vikarer. Hvilken plan?", "options": ["Level", "Chase", "Lead", "Lag"], "answer": 1, "explanation": "Chase passer, når output ikke kan lagerføres og kapaciteten kan ændres billigt. Forkert: level kræver lager; lead/lag er langsigtede kapacitetsstrategier.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 155, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "mc", "eksamen"]}, {"id": "OM-sa-105", "course": "OM", "lecture": 10, "type": "sa", "kind": "calc", "question": "[Øvelse] Forecast 1.200 enheder; 6 timer pr. enhed; 160 timer pr. medarbejder pr. måned. Medarbejderbehov? Lager primo 100, RP 840, OP 50, salg 900 – lager ultimo?", "model": "Timer = 7.200 ⇒ 7.200/160 = 45 medarbejdere. EI = 100 + 840 + 50 − 900 = 90.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 156, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "calc", "eksamen"]}, {"id": "OM-term-L11-001", "course": "OM", "lecture": 11, "type": "card", "kind": "begreb", "front": "Optimering", "back": "At vælge den bedst mulige beslutning blandt de realistiske muligheder givet begrænsede ressourcer. »Bedst« defineres af objektfunktionen (profit, omk., tid, emissioner …).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Hvad er optimering?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "begreb", "grund"], "level": "grund", "order": 157}, {"id": "OM-term-L11-005", "course": "OM", "lecture": 11, "type": "card", "kind": "begreb", "front": "LP-antagelser", "back": "Proportionalitet (bidrag/forbrug ∝ aktivitet), additivitet (forbrug lægges sammen, ingen samspil), delelighed (brøkværdier tilladt – ellers heltal). Ikke-lineært: xy, x², x/y, pris × mængde når begge er variable.", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Antagelser bag LP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "begreb", "grund"], "level": "grund", "order": 158}, {"id": "OM-term-L11-006", "course": "OM", "lecture": 11, "type": "card", "kind": "begreb", "front": "Brugbart område", "back": "Mængden af løsninger der opfylder alle bibetingelser inkl. fortegn. Grafisk: tegn grænselinjen (skæring med akserne) og test et punkt, fx (0,0).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Det brugbare område", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "begreb", "grund"], "level": "grund", "order": 159}, {"id": "OM-term-L11-002", "course": "OM", "lecture": 11, "type": "card", "kind": "model", "front": "Lineær programmering (LP)", "back": "Optimeringsmetode hvor objektfunktion og alle bibetingelser er lineære. Bruges til produktmix, ressourcefordeling, produktion pr. periode, lager og omkostningsminimering.", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Lineær programmering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "model", "grund"], "level": "grund", "order": 160}, {"id": "OM-term-L11-003", "course": "OM", "lecture": 11, "type": "card", "kind": "model", "front": "LP-modellens fire byggesten", "back": "Inputdata (kendte tal – må ikke ændres af Solver), beslutningsvariable (med enhed og periode), objektfunktion (max/min) og bibetingelser (kapacitet, efterspørgsel, ikke-negativitet).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Modellens fire byggesten", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "model", "grund"], "level": "grund", "order": 161}, {"id": "OM-term-L11-004", "course": "OM", "lecture": 11, "type": "card", "kind": "metode", "front": "Fra virksomhedsbeskrivelse til LP", "back": "Ord først: beslutning → variable med enheder → mål → krav i ord → bibetingelser → fortegn. Hver bibetingelse skal kunne læses som en forretningssætning (x + 2y ≤ 40 = højst 40 forberedelsestimer).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Fra virksomhedsbeskrivelse til matematisk model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "metode", "eksamen"], "level": "eksamen", "order": 162}, {"id": "OM-term-L11-007", "course": "OM", "lecture": 11, "type": "card", "kind": "metode", "front": "Hjørnepunktsmetoden", "back": "Har LP et endeligt optimum, ligger mindst én optimal løsning i et hjørnepunkt. Beregn objektfunktionen i hvert hjørne (bageri: (0,0)=0, (25,0)=750, (20,10)=1.100, (0,20)=1.000).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Hjørnepunkter og optimum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "metode", "eksamen"], "level": "eksamen", "order": 163}, {"id": "OM-term-L11-008", "course": "OM", "lecture": 11, "type": "card", "kind": "metode", "front": "Excel Solver-opsætning", "back": "Objektcelle = SUMPRODUCT(koefficienter; variable), variable celler, bibetingelser (venstreside ≤/≥ højreside), ikke-negative variable, Simplex LP. Kontrollér resultatet og tolk bindende bibetingelser.", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Excel Solver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "metode", "eksamen"], "level": "eksamen", "order": 164}, {"id": "OM-term-L11-009", "course": "OM", "lecture": 11, "type": "card", "kind": "eksempel", "front": "Eksempel: grafisk LP-løsning", "back": "Bageri: max 30x + 50y; x + 2y ≤ 40; 2x + y ≤ 50. 1) Tegn linjer via akseskæringer (40,0)/(0,20) og (25,0)/(0,50). 2) Find hjørner: (0,0), (25,0), (20,10), (0,20). 3) z i hvert: 0, 750, 1.100, 1.000. 4) Optimum (20,10).", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Hjørnepunktsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 165, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "eksempel", "eksamen"]}, {"id": "OM-term-L11-010", "course": "OM", "lecture": 11, "type": "card", "kind": "hvorfor", "front": "Hvorfor ligger LP-optimum i et hjørne?", "back": "Objektfunktionen er lineær, så z vokser i én retning; man kan altid bevæge sig langs en kant til en bedre eller lige god værdi, indtil et hjørne af det brugbare område nås.", "level": "svaer", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Hjørnepunktsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 166, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "hvorfor", "svaer"]}, {"question": "Delelighed betyder:", "options": ["Variable må antage brøkværdier", "Bidrag er proportionale", "Forbrug lægges sammen", "Alle bibetingelser binder"], "answer": 0, "explanation": "Delelighed: variable må antage brøkværdier. Forkert: 'proportionale bidrag' er proportionalitet; 'forbrug lægges sammen' er additivitet; bindende bibetingelser er ikke en antagelse.", "id": "OM-mc-081", "course": "OM", "lecture": 11, "lectureName": "L11 Lineær programmering og Solver", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L11", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Antagelser bag LP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 167}, {"question": "Bagerimodel: max 30x+50y; x+2y≤40; 2x+y≤50. Optimal løsning?", "options": ["(25,0)", "(0,20)", "(20,10)", "(10,10)"], "answer": 2, "explanation": "Hjørnepunkter: (0,0)=0, (25,0)=750, (20,10)=1.100, (0,20)=1.000 ⇒ (20,10). Forkert: (25,0) og (0,20) er hjørner med lavere z; (10,10) er inde i området (z = 800).", "id": "OM-mc-080", "course": "OM", "lecture": 11, "lectureName": "L11 Lineær programmering og Solver", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L11", "mc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Bagerieksemplet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 168}, {"question": "Formulér bagerimodellen (standard 30 kr., deluxe 50 kr.; forberedelse x+2y ≤ 40; emballage 2x+y ≤ 50) i ord og matematik, og forklar hvordan den sættes op i Excel Solver.", "model": "Variable: x, y = antal standard-/deluxeæsker næste uge. Max z = 30x + 50y. s.t. x+2y ≤ 40 (forberedelsestimer), 2x+y ≤ 50 (emballage), x,y ≥ 0. Solver: objektcelle = SUMPRODUCT(DB; variable), variable celler, bibetingelser venstreside ≤ kapacitet, 'Make unconstrained variables non-negative', Simplex LP. Optimum (20,10), z = 1.100; begge bibetingelser bindende.", "id": "OM-sa-093", "course": "OM", "lecture": 11, "lectureName": "L11 Lineær programmering og Solver", "type": "sa", "kind": "open", "tags": ["OM", "OM-L11", "open", "svaer"], "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Bagerieksemplet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "svaer", "order": 169}, {"id": "OM-term-L12-001", "course": "OM", "lecture": 12, "type": "card", "kind": "begreb", "front": "Bindende bibetingelse og restkapacitet", "back": "Bindende: hele kapaciteten bruges i optimum (venstreside = højreside). Restkapacitet (slack): forskellen mellem kapacitet og forbrug – her er ressourcen ikke begrænsende.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Eksamensfokus", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "begreb", "grund"], "level": "grund", "order": 170}, {"id": "OM-term-L12-008", "course": "OM", "lecture": 12, "type": "card", "kind": "begreb", "front": "Heltalsoptimering", "back": "Når variable skal være hele tal (medarbejdere, både) eller binære (ja/nej-beslutninger) – lineær heltalsoptimering i Solver.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Læringsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "begreb", "grund"], "level": "grund", "order": 171}, {"id": "OM-term-L12-002", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "Joint Production (case)", "back": "LP-case: x₁, x₂ = antal timer proces 1 og 2 kører; fire begrænsninger; max dækningsbidrag. Optimum: proces 1 i 40 timer, proces 2 i 15 timer, DB 23.850 kr.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Joint Production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model", "grund"], "level": "grund", "order": 172}, {"id": "OM-term-L12-003", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "Multi-period inventory model", "back": "Pᵢ (normaltid), Oᵢ (overarbejde), Iᵢ (lager ultimo) pr. kvartal; lagerbalance Iᵢ = Iᵢ₋₁ + Pᵢ + Oᵢ − Dᵢ og øvre grænse på normaltid. Sejlbåde: min. omk. 78,45 mio. kr.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Multi-period inventory model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model", "grund"], "level": "grund", "order": 173}, {"id": "OM-term-L12-004", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "Binær variabel (The Metal Company)", "back": "zᵢ ∈ {0,1} = 1 hvis der produceres i uge i. Kobles til den øvre grænse på Pᵢ (Pᵢ ≤ grænse·zᵢ), så en fast omk. ved at producere kun betales i uger med produktion. 15 variable, 10 begrænsninger. Optimum 66.050 kr.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › The Metal Company", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model", "grund"], "level": "grund", "order": 174}, {"id": "OM-term-L12-005", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "S&OP-LP: inputdata og variable", "back": "Input: Sₜ (forecast), πᴺ, πᴼ, πᴵ, πᴴ, πᴸ (omk. normaltid, overtid, lager, ansættelse, afskedigelse), τᴾ (tid pr. produkt), τᵂ (tid pr. medarbejder), Pmax, γ (maks. overtid som andel), Î og Ŵ. Variable: Hₜ, Lₜ, Wₜ, RPₜ, OPₜ, Iₜ.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 1–2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model", "grund"], "level": "grund", "order": 175}, {"id": "OM-term-L12-006", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "S&OP-LP: objektfunktion", "back": "min πᴺΣRPₜ + πᴼΣOPₜ + πᴵΣIₜ + πᴴΣHₜ + πᴸΣLₜ. Andre mål mulige: min lager, backorder eller udsving i arbejdsstyrken – valget ændrer den optimale plan.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model", "grund"], "level": "grund", "order": 176}, {"id": "OM-term-L12-007", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "S&OP-LP: begrænsninger", "back": "Wₜ = Wₜ₋₁ + Hₜ − Lₜ (W₀ = Ŵ); RPₜ = (τᵂ/τᴾ)·Wₜ; OPₜ ≤ γ·RPₜ; Iₜ = Iₜ₋₁ + RPₜ + OPₜ − Sₜ (I₀ = Î); RPₜ ≤ Pmax; I_T ≥ Î, W_T ≥ Ŵ; alle ≥ 0.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 4", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model", "grund"], "level": "grund", "order": 177}, {"id": "OM-term-L12-011", "course": "OM", "lecture": 12, "type": "card", "kind": "begreb", "front": "Skyggepris", "back": "Hvor meget objektfunktionen forbedres, hvis højresiden af en bibetingelse øges med én enhed. Ikke-bindende bibetingelser har skyggepris 0 (Nordisk Havemøbler: I(t) ≤ 1.500 ændrer intet).", "level": "eksamen", "source": {"file": "Operations Management Opgavehæfte.docx", "section": "Opgavehæfte T6 › Nordisk Havemøbler", "path": "/workspace/OM/Tutorials/Operations Management Opgavehæfte.docx"}, "order": 178, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "begreb", "eksamen"]}, {"id": "OM-term-L12-010", "course": "OM", "lecture": 12, "type": "card", "kind": "sammenligning", "front": "Bindende vs. ikke-bindende bibetingelse", "back": "Bindende: venstreside = højreside i optimum – mere af ressourcen kan forbedre z. Ikke-bindende: restkapacitet (slack) > 0 – mere af ressourcen hjælper ikke.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Følsomhed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 179, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "sammenligning", "eksamen"]}, {"id": "OM-term-L12-009", "course": "OM", "lecture": 12, "type": "card", "kind": "hvorfor", "front": "Hvorfor binær variabel (Metal Company)?", "back": "En fast omkostning ved at producere i en uge kan ikke modelleres lineært. zᵢ ∈ {0,1} og Pᵢ ≤ grænse·zᵢ sikrer, at produktion kun er mulig, når den faste omkostning betales.", "level": "svaer", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › The Metal Company", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 180, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "hvorfor", "svaer"]}, {"id": "OM-term-L12-012", "course": "OM", "lecture": 12, "type": "card", "kind": "hvorfor", "front": "Hvordan tvinges level/chase i en S&OP-LP?", "back": "Level: tilføj Wₜ = Wₜ₋₁ (ingen ændringer efter start). Chase: tilføj produktion = efterspørgsel (Iₜ = Iₜ₋₁). Ekstra begrænsninger kan aldrig give lavere omk. end det frie optimum (37,8 mio. vs. chase 38,46 og level 38,16 mio.).", "level": "svaer", "source": {"file": "Operations Management Opgavehæfte.docx", "section": "Opgavehæfte T6 › Nordisk Havemøbler", "path": "/workspace/OM/Tutorials/Operations Management Opgavehæfte.docx"}, "order": 181, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "hvorfor", "svaer"]}, {"question": "Hvilken ligning er arbejdsstyrkebalancen?", "options": ["Iₜ = Iₜ₋₁ + RPₜ + OPₜ − Sₜ", "Wₜ = Wₜ₋₁ + Hₜ − Lₜ", "OPₜ ≤ γ·RPₜ", "RPₜ ≤ Pmax"], "answer": 1, "explanation": "Wₜ = Wₜ₋₁ + Hₜ − Lₜ (W₀ = Ŵ). Forkert: Iₜ-ligningen er lagerbalancen; OPₜ ≤ γ·RPₜ er overtidsgrænsen; RPₜ ≤ Pmax er kapacitetsgrænsen.", "id": "OM-mc-082", "course": "OM", "lecture": 12, "lectureName": "L12 LP og optimering af S&OP", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L12", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 4", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 182}, {"question": "Opstil S&OP-LP-modellen: variable, objektfunktion og begrænsninger.", "model": "Variable: Hₜ, Lₜ, Wₜ, RPₜ, OPₜ, Iₜ. Min πᴺΣRP + πᴼΣOP + πᴵΣI + πᴴΣH + πᴸΣL. s.t. Wₜ = Wₜ₋₁ + Hₜ − Lₜ; RPₜ = (τᵂ/τᴾ)Wₜ; OPₜ ≤ γRPₜ; Iₜ = Iₜ₋₁ + RPₜ + OPₜ − Sₜ; RPₜ ≤ Pmax; I_T ≥ Î, W_T ≥ Ŵ; alle ≥ 0.", "id": "OM-sa-094", "course": "OM", "lecture": 12, "lectureName": "L12 LP og optimering af S&OP", "type": "sa", "kind": "open", "tags": ["OM", "OM-L12", "open", "svaer"], "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Del 2: Optimering af S&OP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "svaer", "order": 183}, {"id": "OM-sa-106", "course": "OM", "lecture": 12, "type": "sa", "kind": "open", "question": "[Excel, jf. Nordisk Havemøbler] Hvordan opstilles S&OP-LP'en i Excel, og hvordan undersøger du level- og chase-planer?", "model": "Én kolonne pr. måned: input øverst, beslutningsvariable H, L, O (og W, P, I som formler/variable). Objektcelle = SUMPRODUCT af omk. og variable. Bibetingelser: arbejdsstyrkebalance, P = 20W, O ≤ 0,2P, lagerbalance, slutlager ≥ 200, ≥ 0. Optimum 37,8 mio. (mixed). Level: Wₜ = Wₜ₋₁ ⇒ 38,16 mio.; chase: P = D ⇒ 38,46 mio. Er Solvers resultat bedre end optimum, mangler en begrænsning.", "level": "svaer", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 184, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "open", "svaer"]}, {"id": "OM-term-L13-001", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lager (APICS)", "back": "Beholdninger der understøtter produktion (råvarer, WIP), støtteaktiviteter (MRO) og kundeservice (færdigvarer, reservedele). Lageret absorberer forskelle i mængde, timing, sted og usikkerhed mellem indgående og udgående flow.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Hvad er lager – og hvorfor?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb", "grund"], "level": "grund", "order": 185}, {"id": "OM-term-L13-002", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lagerafvejningen", "back": "For lidt lager: tabt salg/restordrer, ventetid, produktionsstop, hasteordrer. For meget: kapitalbinding, plads, svind, forældelse, skjulte procesproblemer. Mål = balance, ikke minimering.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lager skaber service, men binder ressourcer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb", "grund"], "level": "grund", "order": 186}, {"id": "OM-term-L13-003", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lagertyper", "back": "Cykluslager (partivise indkøb), sikkerhedslager (usikker efterspørgsel/leveringstid), sæson-/udjævningslager (kendte spidser), spekulationslager (forventede prisstigninger), transportlager (varer undervejs).", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lagertyper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb", "grund"], "level": "grund", "order": 187}, {"id": "OM-term-L13-005", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lager-KPI'er", "back": "Service: fillrate, restordreandel. Kapital: lageromsætningshastighed, lagerdage. Planlægning: forecastnøjagtighed, leverandørpålidelighed. Data/spild: lagerpræcision, ukurans. Ofte leading mål – et balanceret sæt reducerer suboptimering.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lager-KPI'er og strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb", "grund"], "level": "grund", "order": 188}, {"id": "OM-term-L13-012", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "SKU", "back": "Stock-keeping unit: en entydigt specificeret lagervare (funktion, model, størrelse, farve, lokation).", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › ABC-klassifikation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb", "grund"], "level": "grund", "order": 189}, {"id": "OM-term-L13-006", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Valg af lagerstyringsmodel", "back": "Fire spørgsmål: uafhængig eller afhængig efterspørgsel (afhængig → MRP)? Kendt eller usikker efterspørgsel/leveringstid? Stationært behov? Kontinuert overvågning eller kun faste tidspunkter?", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Fire spørgsmål til valg af styringsmodel", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model", "grund"], "level": "grund", "order": 190}, {"id": "OM-term-L13-007", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Periodisk review (RP, R)", "back": "Lagerpositionen kontrolleres hver RP periode; bestil Q = R − I (op til genopfyldningsniveau R). Enkelt, ordrer kan kombineres, status kun nødvendig ved review – men kræver mere sikkerhedslager. Eks. RP = 14, R = 970, SS = 70, L = 4.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Periodisk review", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model", "grund"], "level": "grund", "order": 191}, {"id": "OM-term-L13-008", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Kontinuert review (ROP, Q)", "back": "Lagerpositionen overvåges løbende; når den når ordrepunktet ROP, bestilles fast mængde Q. Varierende ordreintervaller, kræver pålidelig registrering, men mindre sikkerhedslager. Eks. ROP = 300, Q = 800, SS = 100.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Kontinuert review", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model", "grund"], "level": "grund", "order": 192}, {"id": "OM-term-L13-009", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "To-kasse-system", "back": "Når første kasse er tom, bestilles; anden kasse dækker forbruget i leveringstiden. Simpel variant af kontinuert review.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Oversigt over lagerstyringsmodeller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model", "grund"], "level": "grund", "order": 193}, {"id": "OM-term-L13-015", "course": "OM", "lecture": 13, "type": "card", "kind": "sammenligning", "front": "Periodisk vs. kontinuert review", "back": "Periodisk (RP, R): fast interval, varierende mængde Q = R − I; enkel, ordrer kan kombineres, men større sikkerhedslager. Kontinuert (ROP, Q): fast mængde, varierende interval; mindre sikkerhedslager, kræver løbende registrering.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lagerstyringsmodeller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 194, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "sammenligning", "grund"]}, {"id": "OM-term-L13-022", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Bullwhip-effekten", "back": "Ordrevariationen vokser opstrøms (detail → distributør → fabrik → leverandør), selvom slutefterspørgslen er stabil. Årsager: ordre-batching, synkroniserede ordrer, kampagner/forward buying og reaktiv bestilling.", "level": "eksamen", "source": {"file": "Operations Management Opgavehæfte.docx", "section": "Opgavehæfte T9 › NordicHome", "path": "/workspace/OM/Tutorials/Operations Management Opgavehæfte.docx"}, "order": 195, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb", "eksamen"]}, {"id": "OM-term-L13-023", "course": "OM", "lecture": 13, "type": "card", "kind": "hvorfor", "front": "Modtræk mod bullwhip", "back": "Informationsdeling, fælles planlægning og forecasting, mindre og hyppigere ordrer, mindre batches, stabile priser og VMI. Målet er balance mellem ordrestabilitet, lageromk. og service – ikke kun lav ordrevarians.", "level": "eksamen", "source": {"file": "Operations Management Opgavehæfte.docx", "section": "Opgavehæfte T9 › NordicHome", "path": "/workspace/OM/Tutorials/Operations Management Opgavehæfte.docx"}, "order": 196, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "hvorfor", "eksamen"]}, {"id": "OM-term-L13-019", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Newsvendor (single-period lager)", "back": "Én ordre før sæsonen; overskud har lav/ingen værdi. 1) Target service level SLT = C_shortage/(C_shortage + C_excess) (fra (1−p)·Cs = p·Ce). 2) Target stocking point = den mængde, hvor P(efterspørgsel ≤ Q) ≥ SLT.", "level": "eksamen", "source": {"file": "Operations & Supply Chain Management (lærebog) + Opgavehæfte OM", "section": "Operations & Supply Chain Management kap. 11 / Opgavehæfte T7–T8", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Bøger/Operations_Supply_Chain_Management.pdf"}, "order": 197, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model", "eksamen"]}, {"id": "OM-term-L13-004", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Lagerniveau og lagerposition", "back": "Lagerniveau = fysisk lager − restordrer. Lagerposition = lagerniveau + åbne ordrer. Ved bestilling stiger positionen straks; niveauet først ved levering.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Måling af lager", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"], "level": "eksamen", "order": 198}, {"id": "OM-term-L13-010", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Traditionel ABC-analyse", "back": "aᵢ = Dᵢ · vᵢ (årlig efterspørgsel × enhedsværdi). Sortér faldende, beregn kumuleret andel af SKU'er og forbrugsværdi, fastlæg grænser (tommelfinger: 20 % af varerne = 80 % af værdien). A-varer styres tættest.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Klassisk/traditionel ABC-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"], "level": "eksamen", "order": 199}, {"id": "OM-term-L13-011", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Multikriterie ABC-analyse", "back": "Rangerer varer på flere kriterier (forbrugsværdi, kritikalitet, leveringstid, erstatningsmulighed). Hvert kriterium normaliseres til 0–100, samlet score = vægtet sum. Kritikalitet kan løfte en vare med lav forbrugsværdi til A.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Multikriterie ABC-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"], "level": "eksamen", "order": 200}, {"id": "OM-term-L13-013", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Normalisering i multikriterie-ABC", "back": "rᵢⱼ = 100·(xᵢⱼ − minⱼ)/(maxⱼ − minⱼ). Vend tælleren (maxⱼ − xᵢⱼ), hvis lav værdi = høj prioritet. Kvalitative kriterier: 0/50/100. Samlet score = SUMPRODUCT(vægte; scorer).", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Multikriterie ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 201, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"]}, {"id": "OM-term-L13-016", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "EOQ (Economic Order Quantity)", "back": "EOQ = √(2DS/H). D = årlig efterspørgsel, S = omk. pr. ordre, H = lageromk. pr. enhed pr. år. Minimerer bestillings- + lageromk.; ved EOQ er de to lige store.", "level": "eksamen", "source": {"file": "Operations & Supply Chain Management (lærebog) + Opgavehæfte OM", "section": "Operations & Supply Chain Management kap. 11 / Opgavehæfte T7–T8", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Bøger/Operations_Supply_Chain_Management.pdf"}, "order": 202, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"]}, {"id": "OM-term-L13-017", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Totale lageromk. ved ordrestørrelse Q", "back": "TC = (Q/2)·H + (D/Q)·S. Gennemsnitligt lager Q/2 (+ SS ved sikkerhedslager). Bruges til at sammenligne alternative ordrestørrelser med EOQ (Sunset restaurant).", "level": "eksamen", "source": {"file": "Operations & Supply Chain Management (lærebog) + Opgavehæfte OM", "section": "Operations & Supply Chain Management kap. 11 / Opgavehæfte T7–T8", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Bøger/Operations_Supply_Chain_Management.pdf"}, "order": 203, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"]}, {"id": "OM-term-L13-018", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Genbestillingspunkt (ROP)", "back": "ROP = d·L + SS: forbrug i leveringstiden plus sikkerhedslager. d = efterspørgsel pr. periode, L = leveringstid. Ved ROP afgives ordren på Q.", "level": "eksamen", "source": {"file": "Operations & Supply Chain Management (lærebog) + Opgavehæfte OM", "section": "Operations & Supply Chain Management kap. 11 / Opgavehæfte T7–T8", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Bøger/Operations_Supply_Chain_Management.pdf"}, "order": 204, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode", "eksamen"]}, {"id": "OM-term-L13-021", "course": "OM", "lecture": 13, "type": "card", "kind": "hvorfor", "front": "Hvorfor er SLT højt, når manglen er dyr?", "back": "SLT = Cs/(Cs + Ce): jo større tabt fortjeneste ved mangel i forhold til tab på overskud, desto højere sandsynlighed for at dække efterspørgslen er det værd at købe.", "level": "eksamen", "source": {"file": "Operations & Supply Chain Management (lærebog) + Opgavehæfte OM", "section": "Operations & Supply Chain Management kap. 11 / Opgavehæfte T7–T8", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Bøger/Operations_Supply_Chain_Management.pdf"}, "order": 205, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "hvorfor", "eksamen"]}, {"id": "OM-term-L13-014", "course": "OM", "lecture": 13, "type": "card", "kind": "eksempel", "front": "Eksempel: traditionel ABC-analyse", "back": "1) aᵢ = Dᵢ·vᵢ for hver vare. 2) Sortér faldende. 3) Beregn kumuleret % af varer og % af forbrugsværdi. 4) Sæt grenser (ca. 20 % varer ≈ 80 % værdi = A). 5) A styres tættest.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › ABC-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 206, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "eksempel", "eksamen"]}, {"id": "OM-term-L13-020", "course": "OM", "lecture": 13, "type": "card", "kind": "eksempel", "front": "Eksempel: newsvendor (studiebøger)", "back": "Pris 50 $, trykomk. 12 $, overskud skrottes. Cs = 50 − 12 = 38; Ce = 12. SLT = 38/50 = 76 %. Stiger trykomk. til 24 $: Cs = 26, Ce = 24 ⇒ SLT = 52 % ⇒ der bestilles færre.", "level": "eksamen", "source": {"file": "Operations & Supply Chain Management (lærebog) + Opgavehæfte OM", "section": "Operations & Supply Chain Management kap. 11 / Opgavehæfte T7–T8", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Bøger/Operations_Supply_Chain_Management.pdf"}, "order": 207, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "eksempel", "eksamen"]}, {"question": "Lager opbygget før en kendt højsæson er:", "options": ["Cykluslager", "Sikkerhedslager", "Sæson-/udjævningslager", "Spekulationslager"], "answer": 2, "explanation": "Sæson-/udjævningslager opbygges før kendte spidser. Forkert: cykluslager skyldes partivise indkøb; sikkerhedslager dækker usikkerhed; spekulationslager skyldes forventede prisstigninger.", "id": "OM-mc-084", "course": "OM", "lecture": 13, "lectureName": "L13 Lagerstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L13", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lagertyper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 208}, {"question": "Fysisk lager 300, restordrer 50, åbne ordrer 200. Lagerposition?", "options": ["250", "450", "500", "550"], "answer": 1, "explanation": "Niveau = 300 − 50 = 250; position = 250 + 200 = 450. Forkert: 250 er lagerniveauet; 500 glemmer restordrerne; 550 lægger restordrer til.", "id": "OM-mc-083", "course": "OM", "lecture": 13, "lectureName": "L13 Lagerstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L13", "mc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Måling af lager", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 209}, {"id": "OM-mc-111", "course": "OM", "lecture": 13, "type": "mc", "kind": "mc", "question": "En vare har D = 2.000/år, S = 100, H = 4. Hvad er EOQ?", "options": ["≈ 224", "≈ 316", "1.000", "≈ 100"], "answer": 1, "explanation": "EOQ = √(2·2.000·100/4) = √100.000 ≈ 316. Forkert: 224 = √50.000 (glemmer faktor 2); 1.000 = D/2; 100 = S.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 210, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "mc", "eksamen"]}, {"id": "OM-sa-108", "course": "OM", "lecture": 13, "type": "sa", "kind": "calc", "question": "[Øvelse] Forbrug 40 enh./dag, leveringstid 5 dage, sikkerhedslager 60. ROP?", "model": "ROP = 40·5 + 60 = 260 enheder.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 211, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "calc", "grund"]}, {"question": "Forklar hvorfor lagerstyring ikke handler om at minimere lageret, og nævn balancerede lager-KPI'er.", "model": "Lager skaber service men binder kapital – målet er balance. KPI'er: service (fillrate, restordreandel), kapital (lageromsætningshastighed, lagerdage), planlægning (forecastnøjagtighed, leverandørpålidelighed), data/spild (lagerpræcision, ukurans).", "id": "OM-sa-096", "course": "OM", "lecture": 13, "lectureName": "L13 Lagerstyring", "type": "sa", "kind": "open", "tags": ["OM", "OM-L13", "open", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lager-KPI'er og strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 212}, {"id": "OM-sa-107", "course": "OM", "lecture": 13, "type": "sa", "kind": "calc", "question": "[Øvelse] D = 12.000 enh./år, S = 300 kr./ordre, H = 5 kr./enh./år. Beregn EOQ og de årlige bestillings- og lageromk.", "model": "EOQ = √(2·12.000·300/5) = √1.440.000 = 1.200. Bestilling: 12.000/1.200 = 10 ordrer × 300 = 3.000. Lager: 1.200/2 × 5 = 3.000. I alt 6.000 kr. (lige store ved EOQ).", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 213, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "calc", "eksamen"]}, {"id": "OM-sa-109", "course": "OM", "lecture": 13, "type": "sa", "kind": "calc", "question": "[Øvelse] Sæsonvare: pris 80, indkøb 30, overskud sælges til 10. Beregn target service level.", "model": "Cs = 80 − 30 = 50; Ce = 30 − 10 = 20. SLT = 50/70 ≈ 71,4 %. Bestil den mængde, hvor den kumulerede sandsynlighed for efterspørgslen når 71,4 %.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 214, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "calc", "eksamen"]}, {"id": "OM-sa-110", "course": "OM", "lecture": 13, "type": "sa", "kind": "calc", "question": "[Øvelse] Multikriterie-ABC: forbrugsværdi 50 (min 10, max 90); leveringstid 4 dage (min 2, max 10, lang leveringstid = høj prioritet); kritikalitet 'høj'. Vægte 0,5/0,2/0,3. Samlet score?", "model": "Forbrugsværdi: 100·(50−10)/80 = 50. Leveringstid: 100·(4−2)/8 = 25. Kritikalitet høj = 100. Score = 0,5·50 + 0,2·25 + 0,3·100 = 60.", "level": "svaer", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 215, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "calc", "svaer"]}, {"id": "MM-term-L2-001", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeværdi", "back": "Kundens egen vurdering af oplevede fordele (kvalitet, service, bekvemmelighed, status) mod oplevede omkostninger (pris, tid, energi, risiko, besvær). Kunden vælger tilbuddet med højest oplevet værdi.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 216}, {"id": "MM-term-L2-005", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundetilfredshed", "back": "Hvor tilfreds kunden er efter købet – sammenligning af forventninger før købet med oplevet resultat. Forventninger formes af reklamer, erfaringer, familie/venner, SoMe og anmeldelser.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundetilfredshed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 217}, {"id": "MM-term-L2-008", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omnichannel-marketing", "back": "Kommunikation gennem mange kontaktpunkter (butik, web, SoMe, apps, kundeservice); kunden forventer en sammenhængende oplevelse på tværs.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Det moderne marketinglandskab", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 218}, {"id": "MM-term-L2-009", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Transactional marketing", "back": "Fokus på den enkelte transaktion: produkt, pris, salg og kortsigtede resultater.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Transactional Marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 219}, {"id": "MM-term-L2-010", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Relationship marketing", "back": "Fokus på langsigtede, gensidigt fordelagtige relationer: loyalitet, fastholdelse og langsigtet profitabilitet – kunden som langsigtet ressource.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Relationship Marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 220}, {"id": "MM-term-L2-011", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "CRM", "back": "Customer Relationship Management: at opbygge, udvikle og vedligeholde profitable kunderelationer via kundedata, analyse af adfærd, segmentering, relationsopbygning og personlig kommunikation.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › CRM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 221}, {"id": "MM-term-L2-012", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeprofitabilitet", "back": "Kunder bidrager forskelligt: analysér omsætning, omkostninger, dækningsbidrag og fremtidigt potentiale. Høj omsætning ≠ mest profitabel.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeprofitabilitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 222}, {"id": "MM-term-L2-014", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Customer Equity", "back": "Den samlede værdi af kundebasen = summen af alle kunders CLV. Høj customer equity: mange loyale kunder, stærke relationer, høj fremtidig indtjening.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Customer Equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 223}, {"id": "MM-term-L2-015", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeloyalitet (adfærd vs. holdning)", "back": "Villighed til at fortsætte relationen. Adfærdsbaseret: hvad kunden gør (genkøb, frekvens, fastholdelse). Holdningsbaseret: hvad kunden føler (tillid, tilknytning, præference, commitment). Tilfredshed alene er ikke nok – også skifteomk., vaner, konkurrence.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeloyalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 224}, {"id": "MM-term-L2-016", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeengagement", "back": "Når kunder aktivt involverer sig ud over købet: anbefalinger, SoMe, anmeldelser, brand communities, deling af indhold. Kæde: kundeværdi → tilfredshed → tillid/commitment → loyalitet → engagement.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeengagement", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"], "level": "grund", "order": 225}, {"id": "MM-term-L2-017", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeværdi skabes hos kunden", "back": "Værdien bestemmes af kundens vurdering, ikke af virksomheden alene – samme produkt kan have forskellig værdi for forskellige kunder.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 226, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb", "grund"]}, {"id": "MM-term-L2-002", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Fire typer kundeværdi", "back": "Funktionel (løser problemet – driftssikker bil), emotionel (tryghed, glæde, stolthed), ekspressiv (hvad produktet signalerer om kunden – luksus, miljøvenligt) og omkostningsværdi (penge, tid, risiko, indsats).", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Typer af kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model", "grund"], "level": "grund", "order": 227}, {"id": "MM-term-L2-003", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Produkt-dominerende logik", "back": "Værdi ligger primært i selve produktet og skabes gennem produktion, design, udvikling og kvalitet; kunden modtager værdien via produktets egenskaber.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Produkt-dominerende logik", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model", "grund"], "level": "grund", "order": 228}, {"id": "MM-term-L2-004", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Service-dominerende logik", "back": "Værdi opstår først, når kunden anvender produktet; virksomhedens opgave er at hjælpe kunden med at skabe værdi (fitness-app giver værdi når den bruges).", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Service-dominerende logik", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model", "grund"], "level": "grund", "order": 229}, {"id": "MM-term-L2-006", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Expectation Confirmation Theory", "back": "Oplevelse < forventning → utilfredshed; = forventning → tilfredshed; > forventning → høj tilfredshed. Virksomheden skal både styre forventningerne og levere oplevelsen.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Expectation Confirmation Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model", "grund"], "level": "grund", "order": 230}, {"id": "MM-term-L2-018", "course": "MM", "lecture": 2, "type": "card", "kind": "sammenligning", "front": "Produkt- vs. service-dominerende logik", "back": "Produkt-dominerende: værdien ligger i produktet og skabes i produktionen. Service-dominerende: værdien opstår først, når kunden bruger produktet – virksomheden hjælper kunden med at skabe værdi.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Værdilogikker", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 231, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "sammenligning", "grund"]}, {"id": "MM-term-L2-019", "course": "MM", "lecture": 2, "type": "card", "kind": "sammenligning", "front": "Transactional vs. relationship marketing", "back": "Transactional: fokus på den enkelte handel, pris og kortsigtet salg. Relationship: langsigtede, gensidigt fordelagtige relationer, loyalitet og fastholdelse.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Relationship marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 232, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "sammenligning", "grund"]}, {"id": "MM-term-L2-007", "course": "MM", "lecture": 2, "type": "card", "kind": "metode", "front": "Måling af kundetilfredshed", "back": "Direkte (spørgeskemaer, interviews, fokusgrupper), indirekte (genkøb, frafald, klager, henvendelser), eksterne (mystery shopping, anmeldelser, markedsundersøgelser). Kun værdifuldt hvis man handler: analysér, prioritér, implementér, følg op.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Måling af kundetilfredshed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "metode", "eksamen"], "level": "eksamen", "order": 233}, {"id": "MM-term-L2-013", "course": "MM", "lecture": 2, "type": "card", "kind": "metode", "front": "Customer Lifetime Value (CLV)", "back": "Den samlede værdi en kunde forventes at skabe gennem hele forholdet; drives af varighed, købsfrekvens, mængde og profit pr. køb. Bruges til at vurdere, hvor meget det er værd at investere i at tiltrække og fastholde kunden.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › CLV", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "metode", "eksamen"], "level": "eksamen", "order": 234}, {"id": "MM-term-L2-020", "course": "MM", "lecture": 2, "type": "card", "kind": "hvorfor", "front": "Hvorfor er tilfredshed ikke nok for loyalitet?", "back": "Loyalitet afhænger også af tillid, commitment, skifteomkostninger, vaner og konkurrenternes tilbud – en tilfreds kunde kan skifte, en utilfreds kan blive af vane.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeloyalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 235, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "hvorfor", "eksamen"]}, {"question": "En kunde sammenligner sine forventninger med oplevelsen og bliver utilfreds. Hvilken teori?", "options": ["Service-dominerende logik", "Expectation Confirmation Theory", "ELM", "CLV"], "answer": 1, "explanation": "Expectation Confirmation Theory: oplevelse < forventning ⇒ utilfredshed. Forkert: S-D-logik handler om værdi i brug; ELM om overtalelsesruter; CLV om kundens livstidsværdi.", "id": "MM-mc-060", "course": "MM", "lecture": 2, "lectureName": "L2 Kundeværdi", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L2", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Expectation Confirmation Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 236}, {"question": "Hvordan skaber jeres case-virksomhed kundeværdi? Brug oplevede fordele/omkostninger og typerne af kundeværdi.", "model": "Definér kundeværdi som fordele vs. omkostninger (pris, tid, risiko, besvær). Gennemgå funktionel, emotionel, ekspressiv og omkostningsværdi med konkrete eksempler fra casen. Kobl til tilfredshed (ECT), loyalitet og CLV. (Jf. Case 1 Apple: kundeværdi.)", "id": "MM-sa-078", "course": "MM", "lecture": 2, "lectureName": "L2 Kundeværdi", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L2", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 237}, {"question": "Diskutér sammenhængen mellem kundetilfredshed og loyalitet. Er tilfredshed nok?", "model": "Tilfredshed øger sandsynligheden for loyalitet, men loyalitet afhænger også af tillid, commitment, relationer, skifteomkostninger, konkurrence og vaner. Skel mellem adfærds- og holdningsbaseret loyalitet. Relationship marketing og CRM som redskaber.", "id": "MM-sa-079", "course": "MM", "lecture": 2, "lectureName": "L2 Kundeværdi", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L2", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Sammenhæng mellem tilfredshed og loyalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 238}, {"id": "MM-sa-088", "course": "MM", "lecture": 2, "type": "sa", "kind": "oral", "question": "[Mundtlig] Hvordan kan jeres case-virksomhed øge customer equity? Brug CLV og loyalitet.", "model": "CLV drives af varighed, købsfrekvens, mængde og profit pr. køb – customer equity = summen. Tiltag: fastholdelse (CRM, relationship marketing), mersalg, prioritering af profitable kunder (kundeprofitabilitet), engagement. Skel mellem adfærds- og holdningsloyalitet; tilfredshed alene er ikke nok.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 239, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "oral", "eksamen"]}, {"id": "MM-term-L3-001", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Strategisk planlægning", "back": "Skaber sammenhæng mellem virksomhedens ressourcer og markedets muligheder (strategisk fit). Niveauer: årlige, langsigtede og strategiske planer. Marketing er en strategisk funktion med kunden i centrum.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Strategisk planlægning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb", "grund"], "level": "grund", "order": 240}, {"id": "MM-term-L3-002", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Markedsorienteret mission", "back": "Virksomhedens formål formuleret ud fra kundebehov frem for produkter (produkter ændrer sig, behov består). Besvarer: Hvem er kunden? Hvilken værdi skaber vi? Hvilket problem løser vi?", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Mission", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb", "grund"], "level": "grund", "order": 241}, {"id": "MM-term-L3-003", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Business portfolio", "back": "Virksomhedens samlede forretninger/produkter. Porteføljeanalyse placerer begrænsede ressourcer (kapital, tid, ledelsesopmærksomhed) hvor de skaber mest værdi: investere, nedprioritere eller afvikle.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Business Portfolio", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb", "grund"], "level": "grund", "order": 242}, {"id": "MM-term-L3-004", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "SBU", "back": "Strategic Business Unit: selvstændig del (brand, produkt, division) med egne konkurrenter, eget marked og egen strategi – enheden i porteføljeanalyser.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › SBU", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb", "grund"], "level": "grund", "order": 243}, {"id": "MM-term-L3-005", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "BCG-matricen", "back": "Akser: markedsvækst × relativ markedsandel. Stars (høj/høj – investér), Cash Cows (lav vækst/høj andel – finansierer andre), Question Marks (høj vækst/lav andel – usikre), Dogs (lav/lav – afvikling). Strategier: build, hold, harvest, divest.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model", "grund"], "level": "grund", "order": 244}, {"id": "MM-term-L3-006", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "Ansoffs vækstmatrice", "back": "Eksisterende/nye produkter × eksisterende/nye markeder: markedspenetrering (lav risiko), markedsudvikling (moderat), produktudvikling (moderat-høj), diversifikation (høj). Jo længere fra nuværende forretning, desto større risiko.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Ansoffs vækstmatrice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model", "grund"], "level": "grund", "order": 245}, {"id": "MM-term-L3-007", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "STP", "back": "Segmentering (opdel markedet) → Targeting (vælg segmenter) → Positionering (ønsket plads i kundens bevidsthed vs. konkurrenter). Broen mellem strategi og marketingmix.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › STP-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model", "grund"], "level": "grund", "order": 246}, {"id": "MM-term-L3-008", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "Marketingmix (4 P'er)", "back": "Værktøjerne der omsætter strategien til handling: Product (hvad tilbydes), Price (hvad betaler kunden), Place (distribution), Promotion (kommunikation af værdien). Skal understøtte positioneringen.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Marketing Mix", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model", "grund"], "level": "grund", "order": 247}, {"id": "MM-term-L3-009", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "BCG-matricens begrænsninger", "back": "Forenkler virkeligheden, markedsvækst og relativ andel er svære at måle, og den fokuserer på nutiden frem for fremtidige muligheder.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 248, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb", "eksamen"]}, {"id": "MM-term-L3-010", "course": "MM", "lecture": 3, "type": "card", "kind": "sammenligning", "front": "BCG vs. Ansoff", "back": "BCG: vurderer eksisterende SBU'er (vækst × andel) → hvor skal ressourcerne hen. Ansoff: vælger vækstretning (produkter × markeder) → hvordan skal vi vokse, og med hvilken risiko.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Porteføljeværktøjer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 249, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "sammenligning", "eksamen"]}, {"question": "En SBU med høj markedsvækst og lav relativ markedsandel er en:", "options": ["Star", "Cash Cow", "Question Mark", "Dog"], "answer": 2, "explanation": "Question Mark: høj vækst, lav andel – kræver beslutning om at investere eller frasælge. Forkert: Star = høj/høj; Cash Cow = lav vækst/høj andel; Dog = lav/lav.", "id": "MM-mc-062", "course": "MM", "lecture": 3, "lectureName": "L3 Strategisk planlægning", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L3", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 250}, {"question": "Nye produkter til nye markeder er i Ansoff:", "options": ["Markedspenetrering", "Markedsudvikling", "Produktudvikling", "Diversifikation"], "answer": 3, "explanation": "Diversifikation = nye produkter på nye markeder (højest risiko). Forkert: penetrering = eksisterende/eksisterende; markedsudvikling = eksisterende produkter på nye markeder; produktudvikling = nye produkter på eksisterende markeder.", "id": "MM-mc-063", "course": "MM", "lecture": 3, "lectureName": "L3 Strategisk planlægning", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L3", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Ansoffs vækstmatrice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 251}, {"question": "Placér virksomhedens forretningsområder i BCG-matricen og foreslå en vækststrategi med Ansoff.", "model": "Definér SBU'er, placér efter markedsvækst og relativ markedsandel; anbefal build/hold/harvest/divest; Cash Cows finansierer Stars/QM. Vælg Ansoff-felt og diskutér risiko. Nævn BCG's begrænsninger.", "id": "MM-sa-080", "course": "MM", "lecture": 3, "lectureName": "L3 Strategisk planlægning", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L3", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG og Ansoff", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 252}, {"id": "MM-sa-089", "course": "MM", "lecture": 3, "type": "sa", "kind": "oral", "question": "[Mundtlig] Formulér en markedsorienteret mission for jeres case og forklar forskellen til en produktorienteret.", "model": "Markedsorienteret: ud fra kundebehov (hvem er kunden, hvilken værdi, hvilket problem løser vi) – holder når produkterne skifter. Produktorienteret: beskriver hvad vi laver. Kobl til strategisk fit og porteføljen.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 253, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "oral", "eksamen"]}, {"id": "MM-term-L4-008", "course": "MM", "lecture": 4, "type": "card", "kind": "begreb", "front": "Style, fashion og fad", "back": "Style: grundlæggende udtryksform over generationer. Fashion: aktuelt accepteret stil, vokser gradvist og falder. Fad: hurtig popularitet og brat fald.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Forskellige former for livscyklus", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "begreb", "grund"], "level": "grund", "order": 254}, {"id": "MM-term-L4-009", "course": "MM", "lecture": 4, "type": "card", "kind": "begreb", "front": "Konkurrencemæssig fordel", "back": "Opstår når virksomheden skaber større kundeværdi end konkurrenterne (lavere pris og/eller større fordele). Skal være relevant for kunderne, tydelig, troværdig, svær at kopiere og økonomisk forsvarlig.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Konkurrencemæssig fordel", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "begreb", "grund"], "level": "grund", "order": 255}, {"id": "MM-term-L4-015", "course": "MM", "lecture": 4, "type": "card", "kind": "begreb", "front": "Priskrig", "back": "Sandsynlig ved få udbydere, homogene produkter og velinformerede kunder. Konsekvenser: lavere DB og profit, mindre investering i kvalitet/innovation, ringere service, markedsandele ofte uændrede.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Priskrige", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "begreb", "grund"], "level": "grund", "order": 256}, {"id": "MM-term-L4-001", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Product Life Cycle (PLC)", "back": "Salg og profit gennem produktudvikling, introduktion, vækst, modning og nedgang; hver fase kræver forskellig strategi for 4P. Analyseværktøj, ikke prognose.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Product Life Cycle", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 257}, {"id": "MM-term-L4-002", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: introduktionsfasen", "back":
