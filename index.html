.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-right:auto}.logo b{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#a855f7);display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 4px 12px var(--accs)}

rations Management.docx"}, "lectureName": "L1 Intro til OM", "tags": ["OM", "OM-L1", "model"]}, {"id": "OM-term-L1-008", "course": "OM", "lecture": 1, "type": "card", "kind": "begreb", "front": "Fire performancemål", "back": "Omkostninger (lave produktions-, transport-, lageromk. → lav pris), kvalitet (funktionalitet, overensstemmelse, pålidelighed), tid (hurtig og sikker levering) og fleksibilitet (nye produkter, ændrede mængder, varianter, kundetilpasning).", "source": {"file": "Operations Management.docx", "section": "Lektion 1 › Performancemål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L1 Intro til OM", "tags": ["OM", "OM-L1", "begreb"]}, {"id": "OM-term-L2-001", "course": "OM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Strategisk fit (procesvalg)", "back": "Sammenhængen mellem markedskrav, produktkarakteristika og proceskapabiliteter. Før procesvalg: hvilke fysiske krav stiller produktet, hvor ens er produkterne, hvor stor er volumen, hvor sker kundetilpasningen? Intet procesvalg er bedst på alle mål.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Strategisk fit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "begreb"]}, {"id": "OM-term-L2-002", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Job Shop", "back": "Meget lav volumen, meget høj variation, generalister og funktionelt layout (fx specialmaskiner). Fleksibel, men høje enhedsomkostninger.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-003", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Batchproduktion", "back": "Lav-middel volumen, middel-høj variation; produktion i partier, der kræver omstillinger.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-004", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Produktionslinje", "back": "Høj volumen, lav variation, specialiserede ressourcer og produktbaseret layout (fx bilproduktion).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-005", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Kontinuert produktion", "back": "Meget høj volumen, meget lav variation, kapitalintensiv med tæt koblede processer (fx olieraffinering).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-006", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Fast position", "back": "Produktet flyttes ikke – ressourcerne flyttes til produktet (fx skibsbygning).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Fast position", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-007", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Gruppeteknologi og cellulært layout", "back": "Produkter med lignende procesbehov samles i produktfamilier; ressourcerne organiseres i celler efter familiens dominerende flow (familie A → celle A). En hybridproces.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Hybridprocesser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-008", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Produkt-proces-matricen", "back": "Kobler volumen/standardisering med procesvalg: lav volumen + høj variation → Job Shop; mellem → Batch; høj volumen + lav variation → linje/kontinuert. Mismatch giver høje enhedsomk., dyre omstillinger, lange leveringstider og dårlig respons.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Produkt-proces-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-009", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Kundetilpasningspunkt (ETO/MTO/ATO/MTS)", "back": "Hvor kundeordren kommer ind: ETO (design efter ordre), MTO (produktion efter ordre), ATO (montage efter ordre), MTS (produktion før ordre). Tidligt punkt: høj fleksibilitet, lang leveringstid, høje omk. Sent: kort leveringstid, lave omk., begrænset fleksibilitet.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundetilpasningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-010", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Tre servicedimensioner", "back": "1) Servicepakken (forhold mellem fysiske og immaterielle elementer), 2) kundetilpasning (hvor meget servicen ændres fra kunde til kunde), 3) kundekontakt (interaktionens omfang).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Serviceprocesser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-011", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Kundeintroduceret variabilitet (Frei)", "back": "Fem typer: ankomst-, anmodnings-, kapacitets- (evne til selvbetjening), indsats- og subjektiv præferencevariabilitet. Håndteres ved segmentering, målrettet markedsføring, automatisering og standardisering af dele af servicen.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundeintroduceret variabilitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-012", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Service blueprinting", "back": "Forbinder kundeoplevelsen med driften: kundehandlinger → front-room (synlige aktiviteter, direkte kontakt) → back-room (usynlig intern drift) → støtteprocesser (bemanding, IT). Grænser: kontaktlinje og synlighedslinje.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Service Blueprinting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model"]}, {"id": "OM-term-L2-013", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Takttid", "back": "Takttid = tilgængelig produktionstid / efterspørgsel. Den maksimalt tilladte tid mellem to færdige enheder. Eks.: 3.600 s / 60 enh. = 60 s.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode"]}, {"id": "OM-term-L2-014", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Minimum antal stationer (Wmin)", "back": "Wmin = samlet arbejdstid / takttid, rundes altid op. Eks.: 180 s / 60 s = 3 stationer.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode"]}, {"id": "OM-term-L2-015", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Linjeafbalancering", "back": "Tildel opgaver til stationer: mål = opfylde outputkrav, minimere spildtid, få stationer, jævn fordeling. Heuristik: vælg længste kvalificerede opgave, overhold præcedens, hold stationstid ≤ takttid. Cyklustid = største stationsbelastning (flaskehalsen bestemmer kapaciteten). Ser bort fra kvalitet, variation og ergonomi.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Linjeafbalancering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode"]}, {"id": "OM-term-L2-016", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Belastningsfunktion (funktionelt layout)", "back": "L = Σ(Nij × Dij), Nij = antal ture mellem afdeling i og j, Dij = afstand. Placér afdelinger med stort flow tæt og centralt; test ombytninger. Heuristik, fordi antal layout = N!. Eks.: byt B og C → 1.900 → 1.400 tur-meter (≈26 %).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Funktionelt layout", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode"]}, {"id": "OM-term-L3-001", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Performance measurement vs. performance management", "back": "Measurement: den tekniske proces – registrere data, beregne indikatorer, rapportere. Management: bruge målingerne til at påvirke adfærd og beslutninger og understøtte strategien. Målinger er ikke neutrale – de signalerer, hvad der er vigtigt.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Præstationsmåling og præstationsledelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-002", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Lagging indikator", "back": "Viser resultatet af tidligere handlinger; bagudskuende (fx ROI, kundetilfredshed efter levering, punktlighed sidste kvartal).", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading og lagging indikatorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-003", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Leading indikator", "back": "Peger på fremtidig performance; måler aktiviteter og drivere og kan forebygge problemer (fx medarbejdertræning, forecastnøjagtighed, gennemført vedligehold). Skaber grundlaget for senere lagging-resultater.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading og lagging indikatorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-004", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "KPI'er på ledelsesniveauer", "back": "Strategisk (direktion/bestyrelse, år: markedsandel, samlet punktlighed, ROI), taktisk (afdelingsledere, måneder: lageromsætning, leveringspræcision), operationelt (teamledere, dage/realtid: maskinudnyttelse, fejlrate). Den rigtige KPI afhænger af, hvem der beslutter.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › KPI'er på forskellige ledelsesniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-005", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Agency Theory", "back": "Antager at medarbejdere og ledelse har forskellige interesser → fokus på kontrol, overvågning, incitamenter og bonus via målbare KPI'er.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Agency Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model"]}, {"id": "OM-term-L3-006", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Stewardship Theory", "back": "Antager at medarbejdere ønsker at bidrage → fokus på faglig stolthed, udvikling og indre motivation; målesystemer som støtte til læring frem for kontrol.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Stewardship Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model"]}, {"id": "OM-term-L3-007", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Balanced Scorecard (BSC)", "back": "Udvider fokus ud over finans med fire perspektiver: finansielt (værdi for ejerne), kunde (hvordan oplever kunderne os?), interne processer (hvad skal vi være dygtige til?), læring og vækst (hvordan udvikler vi os?). Logik: mission → strategi → objectives → KPI'er → targets → initiatives.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Balanced Scorecard", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model"]}, {"id": "OM-term-L3-008", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Strategy map", "back": "Viser forventede årsag-virkningssammenhænge: læring og vækst → interne processer → kundeværdi → finansielle resultater. Virksomhedens teori om værdiskabelse – hypoteser der løbende testes.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Strategy Map", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model"]}, {"id": "OM-term-L3-009", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Objectives, KPI'er, targets, initiatives", "back": "Objective: hvad vi vil opnå (fx reducere fejl). KPI: hvordan det måles. Target: det konkrete niveau/deadline. Initiative: projektet/handlingen, der skal nå målet – vælges først når målene er defineret.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Fra strategi til handling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-010", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Gaming og suboptimering", "back": "En måling forbedres på kort sigt uden at den samlede performance forbedres (fx udskudt vedligehold for at nå produktionsmål). Undgås med balancerede mål og kombination af objektiv og subjektiv evaluering.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Gaming og suboptimering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-011", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Objektiv vs. subjektiv præstationsevaluering", "back": "Objektiv: målbare data (omsætning, fejlrate) – let at sammenligne, mindre bias, opleves retfærdig; men tunnelsyn og fanger ikke alle bidrag. Subjektiv: lederens vurdering – helhedsforståelse, særlige forhold, usynlige bidrag; men risiko for favorisering, bias og lav konsistens. Holistisk tilgang kombinerer.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Objektiv og subjektiv præstationsevaluering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb"]}, {"id": "OM-term-L3-012", "course": "OM", "lecture": 3, "type": "card", "kind": "metode", "front": "Root Cause Analysis", "back": "Når en KPI udvikler sig negativt, findes den bagvedliggende årsag – strategiske problemer brydes ned til operationelle årsager (fx faldende punktlighed: leverandørpålidelighed, vedligehold, responstid, fejlrapportering). »Det man måler, styrer man.«", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Root Cause Analysis", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "metode"]}, {"id": "OM-term-L5-001", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Kapacitet", "back": "Evnen til at producere et bestemt output inden for en given periode (mængde + tid). For lidt kapacitet: ventetid, forsinkelser, mistet salg. For meget: høje faste omk. og lav udnyttelse.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Kapacitetsbegrebet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb"]}, {"id": "OM-term-L5-002", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Input- vs. outputbaseret kapacitetsmål", "back": "Output (biler vasket/time, liter/dag) ved standardiserede produkter. Input (fakturerbare timer, hotelværelser, sengepladser) ved kundetilpassede ydelser.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Input- og outputbaserede kapacitetsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb"]}, {"id": "OM-term-L5-003", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Teoretisk vs. normeret kapacitet", "back": "Teoretisk: maks. output under ideelle forhold (ingen nedbrud, pauser, omstilling, spild). Normeret: realistisk langsigtet niveau inkl. planlagt vedligehold, pauser, omstillinger og forventet spild.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Teoretisk og normeret kapacitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb"]}, {"id": "OM-term-L5-004", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Flaskehals / svageste led", "back": "Det trin med mindst kapacitet bestemmer hele kædens output – også hos leverandører og distributører. Eks.: store ovne hjælper ikke, hvis pakningen er langsom.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Faktorer der begrænser kapaciteten", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb"]}, {"id": "OM-term-L5-005", "course": "OM", "lecture": 5, "type": "card", "kind": "model", "front": "Lead-strategi", "back": "Kapaciteten udvides før efterspørgslen opstår. + høj leveringsevne, vinde markedsandele. − ledig kapacitet, høje faste omk., kapital bindes før indtægter. Relevant når mangel er dyr eller kapacitet tager lang tid.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Lead-strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "model"]}, {"id": "OM-term-L5-006", "course": "OM", "lecture": 5, "type": "card", "kind": "model", "front": "Lag-strategi", "back": "Kapaciteten udvides først når efterspørgslen er realiseret. + høj udnyttelse, lav risiko for ledig kapacitet. − risiko for kapacitetsmangel, tabt salg og længere leveringstid.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Lag-strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "model"]}, {"id": "OM-term-L5-007", "course": "OM", "lecture": 5, "type": "card", "kind": "model", "front": "Match-strategi", "back": "Kombinerer elementer fra lead og lag. Valg af kapacitetsstrategi afhænger af efterspørgselsusikkerhed, leveringstid på ny kapacitet, omk. ved over- vs. underkapacitet, finansiel styrke, konkurrence og mulighed for at udvide i små trin.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Match-strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "model"]}, {"id": "OM-term-L5-008", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Indifferenspunkt", "back": "Aktivitetsniveau hvor to alternativer har samme totalomk.: FC₁ + VC₁·X = FC₂ + VC₂·X ⇒ X = (FC₂ − FC₁)/(VC₁ − VC₂). Eks. spot 1.800X vs. kontrakt 60.000 + 750X ⇒ X ≈ 57 leveringer.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Indifferenspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode"]}, {"id": "OM-term-L5-009", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Break-even (kapacitet)", "back": "Viser hvornår indtægterne dækker omkostningerne: X = FC / (indtægt pr. enhed − VC). Bruges til at vurdere, om et kapacitetsalternativ er rentabelt (fx DB 2.500 kr. pr. levering i Vestjysk Møbelfragt).", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Break-even", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode"]}, {"id": "OM-term-L5-010", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Læringskurve", "back": "Tₙ = T₁·nᵇ, b = ln(læringsprocent)/ln(2). Tₙ = tid for enhed n, T₁ = tid for første enhed. Ved 80 % falder tiden til 80 % hver gang kumuleret produktion fordobles. Øger effektiv kapacitet uden flere ressourcer.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Læringskurver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode"]}, {"id": "OM-term-L5-011", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Forventet værdi", "back": "EV = Σ(sandsynlighed × udfald). Bruges ved usikker efterspørgsel til at sammenligne kapacitetsalternativer – suppleres med risikovurdering.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Forventet værdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode"]}, {"id": "OM-term-L5-012", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Beslutningstræ", "back": "Tegnes fra venstre mod højre: beslutningspunkter (kvadrat) og udfaldspunkter (cirkel, sandsynligheder summer til 100 %). Løses ved baglæns induktion: beregn EV i udfaldspunkter, vælg bedste gren i beslutningspunkter. Suppleres med kvalitative vurderinger.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Beslutningstræer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode"]}, {"id": "OM-term-L6-001", "course": "OM", "lecture": 6, "type": "card", "kind": "model", "front": "Køteori – antagelser", "back": "Lukkede formler (6.6–6.11) kræver: Poisson-ankomster, eksponentialfordelt servicetid, én kanal og én fase, FCFS, uendelig population og steady state.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Køteoriens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "model"]}, {"id": "OM-term-L6-002", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Udnyttelsesgrad ρ", "back": "ρ = λ/µ, λ = ankomstrate, µ = servicerate. Eks. 4/6 ≈ 66,7 %. Når λ → µ, vokser ventetiden kraftigt.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode"]}, {"id": "OM-term-L6-003", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Køformler (én kanal)", "back": "CS = λ/(µ−λ) (antal i systemet); TS = 1/(µ−λ) (tid i systemet); TW = λ/(µ(µ−λ)) (ventetid i kø); CW = λ²/(µ(µ−λ)) (antal i kø).", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode"]}, {"id": "OM-term-L6-004", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Littles lov", "back": "I = R · T: antal i systemet = gennemløbsrate × gennemløbstid. Gælder altid, uanset fordelinger – bruges som tjek på simulationsresultater (CW = R·TW, CS = R·TS).", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Littles lov som tjek", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode"]}, {"id": "OM-term-L6-005", "course": "OM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Steady state", "back": "Tilstanden hvor gennemsnitlige ankomster pr. tidsenhed = gennemsnitlige afgange; her gælder Littles lov og køformlerne.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Køteoriens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "begreb"]}, {"id": "OM-term-L6-006", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Monte Carlo-simulation af kø (Excel)", "back": "Trin 1 deterministisk (faste tider → ingen kø), trin 2 stokastisk (=-15*LN(RAND()), =-10*LN(RAND())), trin 3 ≥100 kunder pr. run + Data Table med ≥50 replikationer. Starttid = MAX(ankomst; forrige sluttid). Bruges når formlernes antagelser ikke holder.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Simulation i tre trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode"]}, {"id": "OM-term-L6-007", "course": "OM", "lecture": 6, "type": "card", "kind": "model", "front": "Theory of Constraints", "back": "»Elevate the constraint«: en lille forbedring ved flaskehalsen slår langt hårdere igennem end forbedringer andre steder (pollenfilter 14 → 11 min halverer køen).", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Kapacitetsbeslutning: flaskehals i serie", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "model"]}, {"id": "OM-term-L6-008", "course": "OM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Gennemsnit skjuler risiko (Martingale)", "back": "At dimensionere efter gennemsnitlig efterspørgsel kan se fornuftigt ud, men bryde sammen når variationen rammer – simulation afslører den risiko.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Når gennemsnittet ser trygt ud", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "begreb"]}, {"id": "OM-term-L8-001", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Forecast", "back": "Et estimat af fremtidige værdier: Fₜ₊ₕ|ₜ = E(Dₜ₊ₕ | Iₜ) – forventet værdi h perioder frem givet informationen Iₜ. Svarer på »hvad kan forventes«, ikke »hvad bør vi gøre«.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Forecasting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb"]}, {"id": "OM-term-L8-002", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Efterspørgsels-, udbuds- og prisforecast", "back": "Efterspørgsel: driver produktion, lager, bemanding, transport. Udbud: tilgængelighed af råvarer, komponenter, arbejdskraft. Pris: salgspriser, råvarer, energi, valuta – påvirker timing af beslutninger.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Hvad forecastes?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb"]}, {"id": "OM-term-L8-003", "course": "OM", "lecture": 8, "type": "card", "kind": "model", "front": "De fire love om forecasting", "back": "1) Forecasts er næsten altid forkerte (mål fejl, opdatér). 2) Kortsigtede er mere præcise. 3) Grupper/aggregater er mere præcise (men mindre detaljerede). 4) Forecast ikke det, der kan beregnes (afhængig efterspørgsel).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › De fire love om forecasting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "model"]}, {"id": "OM-term-L8-004", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Uafhængig vs. afhængig efterspørgsel", "back": "Uafhængig: skabes af kunderne og skal forecastes. Afhængig: følger af en produktionsplan og kan beregnes (1.000 enh. × 4 komp. = 4.000).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Lov 4", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb"]}, {"id": "OM-term-L8-005", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "Kvalitative forecastmetoder", "back": "Bruges når data mangler/ikke er repræsentative (nye produkter): panel consensus, Delphi (anonyme runder med feedback), market survey (spørgeskema/interview), life cycle analogy (sammenlign med lignende produkt), build-up (regioner/sælgere summeres – risiko for optimisme).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Kvalitative metoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L8-006", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Tidsseriemodel vs. kausal model", "back": "Tidsserie: fremtid estimeres ud fra tidligere observationer og tid. Kausal: variablen forklares af andre variable (fx pris, kampagner).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Kvantitative metoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb"]}, {"id": "OM-term-L8-007", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Tidsseriens komponenter", "back": "Niveau, trend (langsigtet op/ned), sæsonvariation (gentager sig med faste intervaller), konjunkturvariation (længere økonomiske bevægelser) og tilfældig variation.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Kvantitative metoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb"]}, {"id": "OM-term-L8-008", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "Forecastfejl (FE)", "back": "FEᵢ = Dᵢ − Fᵢ. Positiv = forecastet for lavt (underforecast); negativ = for højt. Definitionen skal bruges konsekvent.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Forecastfejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L8-009", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "MFE (Mean Forecast Error)", "back": "MFE = ΣFEᵢ / n. Måler bias: positiv = systematisk underforecasting, negativ = overforecasting. MFE ≈ 0 betyder ikke præcision, fordi fejl kan udligne hinanden.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Mean Forecast Error", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L8-010", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "MAD (Mean Absolute Deviation)", "back": "MAD = Σ|FEᵢ| / n. Typisk fejl i samme enhed som data. God til at sammenligne modeller for samme produkt og koble til lager/kapacitet; dårlig på tværs af produkter med forskellig størrelse.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Mean Absolute Deviation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L8-011", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "MAPE", "back": "MAPE = (100/n)·Σ|FEᵢ/Dᵢ|. Fejl i procent – sammenlignelig på tværs af produkter. Kan ikke beregnes hvis Dᵢ = 0 (erstat fx med 0,01), og små værdier giver ekstreme %.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Mean Absolute Percentage Error", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L8-012", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "SSE og RMSE", "back": "SSE = ΣFEᵢ²; RMSE = √(SSE/n). Kvadrering straffer store fejl hårdt – relevant når store fejl er dyre; følsom for ekstreme observationer. Skal være så lav som mulig.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › SSE og RMSE", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L8-013", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "Tracking signal", "back": "TS = kumulativ forecastfejl / MAD. Overvåger bias over tid; kontrolgrænse typisk −4 ≤ TS ≤ +4. Udenfor → modellen beskriver ikke længere udviklingen (trendskifte, ændret marked).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Tracking signal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode"]}, {"id": "OM-term-L9-001", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Naiv forecastmodel", "back": "Fₜ₊₁ = Dₜ – seneste observation er forecast. Simpel og hurtig; vigtig baseline som andre modeller skal slå. Kopierer støj og reagerer altid forsinket.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Naiv forecasting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode"]}, {"id": "OM-term-L9-002", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Glidende gennemsnit MA(n)", "back": "Fₜ = (Dₜ₋₁ + … + Dₜ₋ₙ)/n. Udjævner tilfældig variation: stort n = stabilt men langsomt; lille n = hurtigt men følger støj. Ligger bagefter ved trend. Kræver n observationer.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Glidende gennemsnit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode"]}, {"id": "OM-term-L9-003", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Simpel eksponentiel udjævning (SES)", "back": "Fₜ = αDₜ₋₁ + (1−α)Fₜ₋₁, 0 ≤ α ≤ 1. Høj α = responsiv; lav α = mere udjævning. Alle observationer får vægt, faldende eksponentielt. Egnet ved stabilt niveau uden trend/sæson.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Simpel eksponentiel udjævning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode"]}, {"id": "OM-term-L9-004", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Holts metode", "back": "Udvider SES med trend: opdaterer både niveau lₜ og trend bₜ. Forecast = lₜ + h·bₜ.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode"]}, {"id": "OM-term-L9-005", "course": "OM", "lecture": 9, "type": "card", "kind": "model", "front": "Holt-Winters (additiv)", "back": "Fₜ₊₁ = lₜ + bₜ + sₜ₊₁₋ₘ. Opdatering: lₜ = α(Dₜ − sₜ₋ₘ) + (1−α)(lₜ₋₁ + bₜ₋₁); bₜ = β(lₜ − lₜ₋₁) + (1−β)bₜ₋₁; sₜ = γ(Dₜ − lₜ) + (1−γ)sₜ₋ₘ. m = perioder pr. sæson (52 uger). Parametre vælges ved at minimere fejl.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters: de tre opdateringer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "model"]}, {"id": "OM-term-L9-006", "course": "OM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Additiv vs. multiplikativ sæson", "back": "Additiv: sæsonudsvinget er omtrent lige stort i absolutte enheder (Heartz: ca. 110). Multiplikativ: udsvinget vokser/falder med niveauet.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "begreb"]}, {"id": "OM-term-L9-007", "course": "OM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Validering og overfitting", "back": "Den model, der passer bedst historisk, er ikke nødvendigvis bedst fremad. Opdel i træningssæt (vælg model/parametre) og valideringssæt (test på usete data) – Heartz: tilpasset år 1–3, valideret år 4. Sammenlign modeller på samme perioder.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Validering og overfitting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "begreb"]}, {"id": "OM-term-L9-008", "course": "OM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Systematiske fejl", "back": "Fejl bør være tilfældige. Ligger modellen konsekvent lavt i opgang og højt i nedgang, mangler den en struktur (fx sæson) – løsningen er en anden model, ikke blot nye parametre.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Systematiske fejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "begreb"]}, {"id": "OM-term-L9-009", "course": "OM", "lecture": 9, "type": "card", "kind": "model", "front": "Forecasting som beslutningsproces", "back": "Forstå data og beslutningsproblem → opstil kandidatmodeller → evaluér fejl → validér på nye data → vælg model ud fra beslutningens konsekvenser → overvåg løbende. Mere kompleksitet er kun værd, hvis det giver bedre beslutninger.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Forecasting som beslutningsproces", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "model"]}, {"id": "OM-term-L10-001", "course": "OM", "lecture": 10, "type": "card", "kind": "begreb", "front": "S&OP (aggregate planning)", "back": "Taktisk, tværfunktionel proces der integrerer salg/marketing med produktion, kapacitet og forsyningskæde til én fælles realistisk plan. Produktfamilieniveau, måned for måned, 12–24 måneders horisont, månedlig opdatering.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Hvad er S&OP?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "begreb"]}, {"id": "OM-term-L10-002", "course": "OM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Hvorfor S&OP skaber værdi", "back": "Omsætter prognoser til ressourcebehov, koordinerer funktioner, afslører kapacitetsproblemer i tide, reducerer konflikter (salg/produktion/finans), skaber fælles forventninger og balancerer omk., leveringsevne og fleksibilitet. Træffer ikke beslutningerne automatisk.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Hvorfor skaber S&OP værdi?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "begreb"]}, {"id": "OM-term-L10-003", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Planlægningshierarkiet", "back": "Strategisk (flere år: faciliteter, teknologi, store kapacitetsinvesteringer, make-or-buy) → taktisk/S&OP (måneder: medarbejdere, skift, lager, overarbejde, underleverandører) → detaljeret planlægning og kontrol (timer–uger: ordrer, maskinplaner, sekvensering).", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Planlægningshierarkiet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model"]}, {"id": "OM-term-L10-004", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Top-down S&OP", "back": "Én samlet aggregeret salgsprognose + planlægningsværdier → ressourcebehov → alternative planer → sammenlign. Velegnet når produktmixet er stabilt og ressourcebehovet ens. Enkel, men gennemsnit kan skjule forskelle.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Top-down-planlægning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model"]}, {"id": "OM-term-L10-005", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Bottom-up S&OP", "back": "Ressourcebehov beregnes pr. produkt-/servicelinje og lægges sammen. Bruges når mixet ændrer sig, ressourcekrav er forskellige, eller bestemte ressourcer kan blive flaskehalse.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Bottom-up-planlægning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model"]}, {"id": "OM-term-L10-006", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Planlægningsværdi", "back": "Historisk/analytisk værdi til at omregne salg til ressourcer (timer, maskintimer, materialer, omk. pr. enhed). Ved stabilt mix: vægtet gennemsnit = Σ(andel × ressourceforbrug), fx 0,4·2 + 0,4·3 + 0,2·4 = 2,8 t.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Planlægningsværdier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode"]}, {"id": "OM-term-L10-007", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Arbejdstimer og medarbejderbehov", "back": "Arbejdstimer = prognosticeret salg × timer pr. enhed (750 × 20 = 15.000). Medarbejderbehov = timer / timer pr. medarbejder (15.000/160 = 93,75) – teoretisk; overvej afrunding, overarbejde, fravær, oplæring.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Fra salgsprognose til ressourcebehov", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode"]}, {"id": "OM-term-L10-008", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Regulær produktion", "back": "RP = antal medarbejdere × timer pr. medarbejder / timer pr. enhed. Eks.: 105 × 160 / 20 = 840 enheder/måned.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Beregning af regulær produktion", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode"]}, {"id": "OM-term-L10-009", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Lagerligningen", "back": "EIₜ = EIₜ₋₁ + RPₜ + OPₜ − Sₜ (lager ultimo = primo + regulær + overarbejdsproduktion − salg). Ultimo i én måned er primo i den næste; negativt lager = restordrer/tabt salg.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Lagerligningen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode"]}, {"id": "OM-term-L10-010", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Level production", "back": "Konstant arbejdsstyrke og regulær produktion; lageret absorberer forskellen. Fremgang: samlet efterspørgsel ± ønsket start/slutlager → gennemsnitlig produktion → konstant arbejdsstyrke → ansættelser/afskedigelser → lager måned for måned (ikke negativt) → omk. + stabil bemanding; − lager- og ukuransomk.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Level production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model"]}, {"id": "OM-term-L10-011", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Chase production", "back": "Produktionen følger efterspørgslen via ansættelser/afskedigelser, varierende arbejdstid, overarbejde, vikarer, underleverandører. + minimalt lager. − oplæringsomk., lavere produktivitet/kvalitet, usikre medarbejdere. Velegnet når output ikke kan lagerføres og kapacitet kan ændres billigt.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Chase production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model"]}, {"id": "OM-term-L10-012", "course": "OM", "lecture": 10, "type": "card", "kind": "model", "front": "Mixed production", "back": "Kombinerer level og chase: stabil grundbemanding + lager, overarbejde eller vikarer i spidser. Mere fleksibel end level, mere stabil end chase, men mere kompleks at lave og kommunikere. Den billigste beregnede plan er ikke nødvendigvis bedst i praksis.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Mixed production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "model"]}, {"id": "OM-term-L10-013", "course": "OM", "lecture": 10, "type": "card", "kind": "metode", "front": "Omkostninger ved en S&OP-plan", "back": "Summér regulær produktion, overarbejde, lagerhold, restordrer, ansættelser og afskedigelser pr. måned; sammenlign planerne – og vurdér også ikke-økonomiske konsekvenser.", "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Sammenligning af planer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L10 Sales and Operations Planning", "tags": ["OM", "OM-L10", "metode"]}, {"id": "OM-term-L11-001", "course": "OM", "lecture": 11, "type": "card", "kind": "begreb", "front": "Optimering", "back": "At vælge den bedst mulige beslutning blandt de realistiske muligheder givet begrænsede ressourcer. »Bedst« defineres af objektfunktionen (profit, omk., tid, emissioner …).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Hvad er optimering?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "begreb"]}, {"id": "OM-term-L11-002", "course": "OM", "lecture": 11, "type": "card", "kind": "model", "front": "Lineær programmering (LP)", "back": "Optimeringsmetode hvor objektfunktion og alle bibetingelser er lineære. Bruges til produktmix, ressourcefordeling, produktion pr. periode, lager og omkostningsminimering.", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Lineær programmering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "model"]}, {"id": "OM-term-L11-003", "course": "OM", "lecture": 11, "type": "card", "kind": "model", "front": "LP-modellens fire byggesten", "back": "Inputdata (kendte tal – må ikke ændres af Solver), beslutningsvariable (med enhed og periode), objektfunktion (max/min) og bibetingelser (kapacitet, efterspørgsel, ikke-negativitet).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Modellens fire byggesten", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "model"]}, {"id": "OM-term-L11-004", "course": "OM", "lecture": 11, "type": "card", "kind": "metode", "front": "Fra virksomhedsbeskrivelse til LP", "back": "Ord først: beslutning → variable med enheder → mål → krav i ord → bibetingelser → fortegn. Hver bibetingelse skal kunne læses som en forretningssætning (x + 2y ≤ 40 = højst 40 forberedelsestimer).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Fra virksomhedsbeskrivelse til matematisk model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "metode"]}, {"id": "OM-term-L11-005", "course": "OM", "lecture": 11, "type": "card", "kind": "begreb", "front": "LP-antagelser", "back": "Proportionalitet (bidrag/forbrug ∝ aktivitet), additivitet (forbrug lægges sammen, ingen samspil), delelighed (brøkværdier tilladt – ellers heltal). Ikke-lineært: xy, x², x/y, pris × mængde når begge er variable.", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Antagelser bag LP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "begreb"]}, {"id": "OM-term-L11-006", "course": "OM", "lecture": 11, "type": "card", "kind": "begreb", "front": "Brugbart område", "back": "Mængden af løsninger der opfylder alle bibetingelser inkl. fortegn. Grafisk: tegn grænselinjen (skæring med akserne) og test et punkt, fx (0,0).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Det brugbare område", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "begreb"]}, {"id": "OM-term-L11-007", "course": "OM", "lecture": 11, "type": "card", "kind": "metode", "front": "Hjørnepunktsmetoden", "back": "Har LP et endeligt optimum, ligger mindst én optimal løsning i et hjørnepunkt. Beregn objektfunktionen i hvert hjørne (bageri: (0,0)=0, (25,0)=750, (20,10)=1.100, (0,20)=1.000).", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Hjørnepunkter og optimum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "metode"]}, {"id": "OM-term-L11-008", "course": "OM", "lecture": 11, "type": "card", "kind": "metode", "front": "Excel Solver-opsætning", "back": "Objektcelle = SUMPRODUCT(koefficienter; variable), variable celler, bibetingelser (venstreside ≤/≥ højreside), ikke-negative variable, Simplex LP. Kontrollér resultatet og tolk bindende bibetingelser.", "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Excel Solver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L11 Lineær programmering og Solver", "tags": ["OM", "OM-L11", "metode"]}, {"id": "OM-term-L12-001", "course": "OM", "lecture": 12, "type": "card", "kind": "begreb", "front": "Bindende bibetingelse og restkapacitet", "back": "Bindende: hele kapaciteten bruges i optimum (venstreside = højreside). Restkapacitet (slack): forskellen mellem kapacitet og forbrug – her er ressourcen ikke begrænsende.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Eksamensfokus", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "begreb"]}, {"id": "OM-term-L12-002", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "Joint Production (case)", "back": "Variable x₁, x₂ = timer proces 1 og 2 kører; fire begrænsninger. Optimum: 40 og 15 timer, DB 23.850 kr.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Joint Production", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model"]}, {"id": "OM-term-L12-003", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "Multi-period inventory model", "back": "Pᵢ (normaltid), Oᵢ (overarbejde), Iᵢ (lager ultimo) pr. kvartal; lagerbalance Iᵢ = Iᵢ₋₁ + Pᵢ + Oᵢ − Dᵢ og øvre grænse på normaltid. Sejlbåde: min. omk. 78,45 mio. kr.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Multi-period inventory model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model"]}, {"id": "OM-term-L12-004", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "Binær variabel (The Metal Company)", "back": "zᵢ ∈ {0,1} = 1 hvis der produceres i uge i. Kobles til den øvre grænse på Pᵢ (Pᵢ ≤ grænse·zᵢ), så en fast omk. ved at producere kun betales i uger med produktion. 15 variable, 10 begrænsninger. Optimum 66.050 kr.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › The Metal Company", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model"]}, {"id": "OM-term-L12-005", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "S&OP-LP: inputdata og variable", "back": "Input: Sₜ (forecast), πᴺ, πᴼ, πᴵ, πᴴ, πᴸ (omk. normaltid, overtid, lager, ansættelse, afskedigelse), τᴾ (tid pr. produkt), τᵂ (tid pr. medarbejder), Pmax, γ (maks. overtid som andel), Î og Ŵ. Variable: Hₜ, Lₜ, Wₜ, RPₜ, OPₜ, Iₜ.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 1–2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model"]}, {"id": "OM-term-L12-006", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "S&OP-LP: objektfunktion", "back": "min πᴺΣRPₜ + πᴼΣOPₜ + πᴵΣIₜ + πᴴΣHₜ + πᴸΣLₜ. Andre mål mulige: min lager, backorder eller udsving i arbejdsstyrken – valget ændrer den optimale plan.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model"]}, {"id": "OM-term-L12-007", "course": "OM", "lecture": 12, "type": "card", "kind": "model", "front": "S&OP-LP: begrænsninger", "back": "Wₜ = Wₜ₋₁ + Hₜ − Lₜ (W₀ = Ŵ); RPₜ = (τᵂ/τᴾ)·Wₜ; OPₜ ≤ γ·RPₜ; Iₜ = Iₜ₋₁ + RPₜ + OPₜ − Sₜ (I₀ = Î); RPₜ ≤ Pmax; I_T ≥ Î, W_T ≥ Ŵ; alle ≥ 0.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 4", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "model"]}, {"id": "OM-term-L12-008", "course": "OM", "lecture": 12, "type": "card", "kind": "begreb", "front": "Heltalsoptimering", "back": "Når variable skal være hele tal (medarbejdere, både) eller binære (ja/nej-beslutninger) – lineær heltalsoptimering i Solver.", "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Læringsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L12 LP og optimering af S&OP", "tags": ["OM", "OM-L12", "begreb"]}, {"id": "OM-term-L13-001", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lager (APICS)", "back": "Beholdninger der understøtter produktion (råvarer, WIP), støtteaktiviteter (MRO) og kundeservice (færdigvarer, reservedele). Lageret absorberer forskelle i mængde, timing, sted og usikkerhed mellem indgående og udgående flow.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Hvad er lager – og hvorfor?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb"]}, {"id": "OM-term-L13-002", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lagerafvejningen", "back": "For lidt lager: tabt salg/restordrer, ventetid, produktionsstop, hasteordrer. For meget: kapitalbinding, plads, svind, forældelse, skjulte procesproblemer. Mål = balance, ikke minimering.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lager skaber service, men binder ressourcer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb"]}, {"id": "OM-term-L13-003", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lagertyper", "back": "Cykluslager (partivise indkøb), sikkerhedslager (usikker efterspørgsel/leveringstid), sæson-/udjævningslager (kendte spidser), spekulationslager (forventede prisstigninger), transportlager (varer undervejs).", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lagertyper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb"]}, {"id": "OM-term-L13-004", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Lagerniveau og lagerposition", "back": "Lagerniveau = fysisk lager − restordrer. Lagerposition = lagerniveau + åbne ordrer. Ved bestilling stiger positionen straks; niveauet først ved levering.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Måling af lager", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode"]}, {"id": "OM-term-L13-005", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "Lager-KPI'er", "back": "Service: fillrate, restordreandel. Kapital: lageromsætningshastighed, lagerdage. Planlægning: forecastnøjagtighed, leverandørpålidelighed. Data/spild: lagerpræcision, ukurans. Ofte leading mål – et balanceret sæt reducerer suboptimering.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lager-KPI'er og strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb"]}, {"id": "OM-term-L13-006", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Valg af lagerstyringsmodel", "back": "Fire spørgsmål: uafhængig eller afhængig efterspørgsel (afhængig → MRP)? Kendt eller usikker efterspørgsel/leveringstid? Stationært behov? Kontinuert overvågning eller kun faste tidspunkter?", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Fire spørgsmål til valg af styringsmodel", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model"]}, {"id": "OM-term-L13-007", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Periodisk review (RP, R)", "back": "Lagerpositionen kontrolleres hver RP periode; bestil Q = R − I (op til genopfyldningsniveau R). Enkelt, ordrer kan kombineres, status kun nødvendig ved review – men kræver mere sikkerhedslager. Eks. RP = 14, R = 970, SS = 70, L = 4.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Periodisk review", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model"]}, {"id": "OM-term-L13-008", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "Kontinuert review (ROP, Q)", "back": "Lagerpositionen overvåges løbende; når den når ordrepunktet ROP, bestilles fast mængde Q. Varierende ordreintervaller, kræver pålidelig registrering, men mindre sikkerhedslager. Eks. ROP = 300, Q = 800, SS = 100.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Kontinuert review", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model"]}, {"id": "OM-term-L13-009", "course": "OM", "lecture": 13, "type": "card", "kind": "model", "front": "To-kasse-system", "back": "Når første kasse er tom, bestilles; anden kasse dækker forbruget i leveringstiden. Simpel variant af kontinuert review.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Oversigt over lagerstyringsmodeller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "model"]}, {"id": "OM-term-L13-010", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Traditionel ABC-analyse", "back": "aᵢ = Dᵢ · vᵢ (årlig efterspørgsel × enhedsværdi). Sortér faldende, beregn kumuleret andel af SKU'er og forbrugsværdi, fastlæg grænser (tommelfinger: 20 % af varerne = 80 % af værdien). A-varer styres tættest.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Klassisk/traditionel ABC-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode"]}, {"id": "OM-term-L13-011", "course": "OM", "lecture": 13, "type": "card", "kind": "metode", "front": "Multikriterie ABC-analyse", "back": "Flere kriterier (forbrugsværdi, kritikalitet, leveringstid, erstatningsmulighed). Normalisér hvert til 0–100: rᵢⱼ = 100·(xᵢⱼ − min)/(max − min) (vend tæller hvis lav værdi = høj prioritet); kvalitative: 0/50/100. Samlet score = vægtet sum (SUMPRODUCT). Kritikalitet kan overtrumfe lav forbrugsværdi.", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Multikriterie ABC-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "metode"]}, {"id": "OM-term-L13-012", "course": "OM", "lecture": 13, "type": "card", "kind": "begreb", "front": "SKU", "back": "Stock-keeping unit: en entydigt specificeret lagervare (funktion, model, størrelse, farve, lokation).", "source": {"file": "Operations Management.docx", "section": "Lektion 13 › ABC-klassifikation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L13 Lagerstyring", "tags": ["OM", "OM-L13", "begreb"]}, {"id": "MM-term-L2-001", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeværdi", "back": "Den værdi kunden oplever ved et produkt/service – opstår gennem kundens vurdering, ikke af virksomheden alene. Afvejning af oplevede fordele (kvalitet, service, funktionalitet, bekvemmelighed, status, relationer) mod oplevede omk. (pris, tid, energi, risiko, besvær, usikkerhed). Kunden vælger tilbuddet med højest oplevet værdi.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-002", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Fire typer kundeværdi", "back": "Funktionel (løser problemet – driftssikker bil), emotionel (tryghed, glæde, stolthed), ekspressiv (hvad produktet signalerer om kunden – luksus, miljøvenligt) og omkostningsværdi (penge, tid, risiko, indsats).", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Typer af kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model"]}, {"id": "MM-term-L2-003", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Produkt-dominerende logik", "back": "Værdi ligger primært i selve produktet og skabes gennem produktion, design, udvikling og kvalitet; kunden modtager værdien via produktets egenskaber.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Produkt-dominerende logik", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model"]}, {"id": "MM-term-L2-004", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Service-dominerende logik", "back": "Værdi opstår først, når kunden anvender produktet; virksomhedens opgave er at hjælpe kunden med at skabe værdi (fitness-app giver værdi når den bruges).", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Service-dominerende logik", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model"]}, {"id": "MM-term-L2-005", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundetilfredshed", "back": "Hvor tilfreds kunden er efter købet – sammenligning af forventninger før købet med oplevet resultat. Forventninger formes af reklamer, erfaringer, familie/venner, SoMe og anmeldelser.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundetilfredshed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-006", "course": "MM", "lecture": 2, "type": "card", "kind": "model", "front": "Expectation Confirmation Theory", "back": "Oplevelse < forventning → utilfredshed; = forventning → tilfredshed; > forventning → høj tilfredshed. Virksomheden skal både styre forventningerne og levere oplevelsen.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Expectation Confirmation Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "model"]}, {"id": "MM-term-L2-007", "course": "MM", "lecture": 2, "type": "card", "kind": "metode", "front": "Måling af kundetilfredshed", "back": "Direkte (spørgeskemaer, interviews, fokusgrupper), indirekte (genkøb, frafald, klager, henvendelser), eksterne (mystery shopping, anmeldelser, markedsundersøgelser). Kun værdifuldt hvis man handler: analysér, prioritér, implementér, følg op.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Måling af kundetilfredshed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "metode"]}, {"id": "MM-term-L2-008", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omnichannel-marketing", "back": "Kommunikation gennem mange kontaktpunkter (butik, web, SoMe, apps, kundeservice); kunden forventer en sammenhængende oplevelse på tværs.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Det moderne marketinglandskab", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-009", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Transactional marketing", "back": "Fokus på den enkelte transaktion: produkt, pris, salg og kortsigtede resultater.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Transactional Marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-010", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Relationship marketing", "back": "Fokus på langsigtede, gensidigt fordelagtige relationer: loyalitet, fastholdelse og langsigtet profitabilitet – kunden som langsigtet ressource.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Relationship Marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-011", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "CRM", "back": "Customer Relationship Management: at opbygge, udvikle og vedligeholde profitable kunderelationer via kundedata, analyse af adfærd, segmentering, relationsopbygning og personlig kommunikation.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › CRM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-012", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeprofitabilitet", "back": "Kunder bidrager forskelligt: analysér omsætning, omkostninger, dækningsbidrag og fremtidigt potentiale. Høj omsætning ≠ mest profitabel.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeprofitabilitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-013", "course": "MM", "lecture": 2, "type": "card", "kind": "metode", "front": "Customer Lifetime Value (CLV)", "back": "Den samlede værdi en kunde forventes at skabe gennem hele forholdet; drives af varighed, købsfrekvens, mængde og profit pr. køb. Bruges til at vurdere, hvor meget det er værd at investere i at tiltrække og fastholde kunden.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › CLV", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "metode"]}, {"id": "MM-term-L2-014", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Customer Equity", "back": "Den samlede værdi af kundebasen = summen af alle kunders CLV. Høj customer equity: mange loyale kunder, stærke relationer, høj fremtidig indtjening.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Customer Equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-015", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeloyalitet (adfærd vs. holdning)", "back": "Villighed til at fortsætte relationen. Adfærdsbaseret: hvad kunden gør (genkøb, frekvens, fastholdelse). Holdningsbaseret: hvad kunden føler (tillid, tilknytning, præference, commitment). Tilfredshed alene er ikke nok – også skifteomk., vaner, konkurrence.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeloyalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L2-016", "course": "MM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kundeengagement", "back": "Når kunder aktivt involverer sig ud over købet: anbefalinger, SoMe, anmeldelser, brand communities, deling af indhold. Kæde: kundeværdi → tilfredshed → tillid/commitment → loyalitet → engagement.", "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeengagement", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L2 Kundeværdi", "tags": ["MM", "MM-L2", "begreb"]}, {"id": "MM-term-L3-001", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Strategisk planlægning", "back": "Skaber sammenhæng mellem virksomhedens ressourcer og markedets muligheder (strategisk fit). Niveauer: årlige, langsigtede og strategiske planer. Marketing er en strategisk funktion med kunden i centrum.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Strategisk planlægning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb"]}, {"id": "MM-term-L3-002", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Markedsorienteret mission", "back": "Virksomhedens formål formuleret ud fra kundebehov frem for produkter (produkter ændrer sig, behov består). Besvarer: Hvem er kunden? Hvilken værdi skaber vi? Hvilket problem løser vi?", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Mission", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb"]}, {"id": "MM-term-L3-003", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Business portfolio", "back": "Virksomhedens samlede forretninger/produkter. Porteføljeanalyse placerer begrænsede ressourcer (kapital, tid, ledelsesopmærksomhed) hvor de skaber mest værdi: investere, nedprioritere eller afvikle.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Business Portfolio", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb"]}, {"id": "MM-term-L3-004", "course": "MM", "lecture": 3, "type": "card", "kind": "begreb", "front": "SBU", "back": "Strategic Business Unit: selvstændig del (brand, produkt, division) med egne konkurrenter, eget marked og egen strategi – enheden i porteføljeanalyser.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › SBU", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "begreb"]}, {"id": "MM-term-L3-005", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "BCG-matricen", "back": "Akser: markedsvækst og relativ markedsandel. Stars (høj/høj: kræver investering, fremtidige cash cows), Cash Cows (lav vækst/høj andel: overskud der finansierer andre), Question Marks (høj vækst/lav andel: usikre), Dogs (lav/lav: afvikling). Valg: Build, Hold, Harvest, Divest. Svagheder: forenkler, svært at måle, nutidsfokus.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model"]}, {"id": "MM-term-L3-006", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "Ansoffs vækstmatrice", "back": "Eksisterende/nye produkter × eksisterende/nye markeder: markedspenetrering (lav risiko), markedsudvikling (moderat), produktudvikling (moderat-høj), diversifikation (høj). Jo længere fra nuværende forretning, desto større risiko.", "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Ansoffs vækstmatrice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L3 Strategisk planlægning", "tags": ["MM", "MM-L3", "model"]}, {"id": "MM-term-L3-007", "course": "MM", "lecture": 3, "type": "card", "kind": "model", "front": "STP", "back": "Segmentering (opdel markedet
