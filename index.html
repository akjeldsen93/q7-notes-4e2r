0/enh.), B 100.000 (50/enh.). ABC: 2.000/omstilling, 600/kontrol ⇒ A 20.000 + 30.000 = 50.000 (5/enh.); B 100.000 + 150.000 = 250.000 (125/enh.). B var undercostet – krydssubsidiering.", "level": "svaer", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 511, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "calc", "svaer"]}, {"id": "ØS-term-L10-001", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Budget vs. budgettering", "back": "Budget: omfattende økonomisk overblik over planlagte aktiviteter (den økonomiske konsekvensprognose). Budgettering: periodisk valg af handlingsprogram ledsaget af økonomisk konsekvensprognose (processen) – Andersen & Rohde.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budget og budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 512}, {"id": "ØS-term-L10-003", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Fordele ved budgetter", "back": "Planlægning (nødvendiggør planer og implementering), præstationskriterier (benchmark) og koordination/kommunikation. Mellemhøj sværhedsgrad giver højest faktisk præstation.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Fordele ved budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 513}, {"id": "ØS-term-L10-004", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Udfordringer ved budgettering", "back": "Ressourcekrævende, rigidt, datamanipulation, stridigheder mellem afdelinger, pres og stress, gaming, kortsigtet, suboptimering (Welch: forandring udefra hurtigere end indefra).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Udfordringer ved budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 514}, {"id": "ØS-term-L10-005", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Budgettyper og horisonter", "back": "Strategisk plan (længst) → langsigtet plan (5–10 år, koordineret med investeringsbudget) → investeringsbudget (faciliteter, maskiner, nye produkter) → masterbudget (forbinder kort og lang sigt).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budgettyper og tidshorisonter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 515}, {"id": "ØS-term-L10-006", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Rullende budget", "back": "Der tilføjes en ny periode, når en er overstået – altid samme horisont (fx 12 mdr.); kontinuerlig proces; svar på rigiditetskritikken, men mere ressourcekrævende.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Rullende budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 516}, {"id": "ØS-term-L10-011", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Padding / budgetary slack", "back": "Bevidst for lave indtægts- eller for høje omkostningsestimater, så budgettet bliver lettere at nå – svækker budgettet som planlægnings- og præstationsværktøj.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Padding og budgetary slack", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb", "grund"], "level": "grund", "order": 517}, {"id": "ØS-term-L10-002", "course": "ØS", "lecture": 10, "type": "card", "kind": "model", "front": "Budgetteringscyklussen", "back": "Planlægning: mål → strategi og planer → masterbudget. Styring: realisér → mål og evaluér mod budget → reevaluér mål og planer.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budgetteringscyklussen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "model", "grund"], "level": "grund", "order": 518}, {"id": "ØS-term-L10-007", "course": "ØS", "lecture": 10, "type": "card", "kind": "model", "front": "Masterbudget", "back": "Driftsbudget (operationelt: salg, produktion, materialer, løn, IPO, slutlager, vareforbrug, øvrige omk. → budgetteret resultatopgørelse) + finansielle budgetter (investering, likviditet, budgetteret balance).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Masterbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "model", "grund"], "level": "grund", "order": 519}, {"id": "ØS-term-L10-014", "course": "ØS", "lecture": 10, "type": "card", "kind": "sammenligning", "front": "Statisk vs. rullende budget", "back": "Statisk: fast periode (fx kalenderår), horisonten skrumper. Rullende: en ny periode tilføjes, når én udløber – altid samme horisont, men mere ressourcekrævende.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Rullende budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 520, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "sammenligning", "grund"]}, {"id": "ØS-term-L10-008", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Salgsbudget", "back": "Budgetteret omsætning = forventet salg i enheder × pris. Udgangspunktet for alle øvrige budgetter – fejl forplanter sig.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Trin 1: Salgsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 521}, {"id": "ØS-term-L10-009", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Produktionsbudget", "back": "Produktion = budgetteret salg + ønsket lager ultimo − lager primo. Wessex: 5.000 + 1.100 − 100 = 6.000 Regular.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Trin 2: Produktionsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 522}, {"id": "ØS-term-L10-010", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Materialeforbrugs- og indkøbsbudget", "back": "Forbrug = produktion × materialer pr. enhed. Indkøb = forbrug + ønsket materialelager ultimo − primo; × pris.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Driftsbudgettet trin for trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 523}, {"id": "ØS-term-L10-012", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Følsomhedsanalyse i budgettering", "back": "Computerbaserede planlægningsmodeller beregner hvordan budgettet ændres, når forudsætninger (pris, volumen, omk.) ændres – 'hvad nu hvis'.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Computerbaserede planlægningsmodeller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode", "eksamen"], "level": "eksamen", "order": 524}, {"id": "ØS-term-L10-013", "course": "ØS", "lecture": 10, "type": "card", "kind": "eksempel", "front": "Eksempel: produktionsbudget (Wessex)", "back": "Produktion = salg + ønsket lager ultimo − lager primo. Regular: 5.000 + 1.100 − 100 = 6.000. Heavy-duty: 1.000 + 50 − 50 = 1.000.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Produktionsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 525, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "eksempel", "eksamen"]}, {"question": "Budgettering er ifølge Andersen & Rohde:", "options": ["Den økonomiske konsekvensprognose", "Et periodisk valg af handlingsprogram ledsaget af en periodisk økonomisk konsekvensprognose", "Et regnskab", "En kontrolrapport"], "answer": 1, "explanation": "Budgettering = periodisk valg af handlingsprogram + økonomisk konsekvensprognose (processen). Forkert: konsekvensprognosen er budgettet (resultatet); regnskab og kontrolrapport er bagudrettede.", "id": "ØS-mc-070", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L10", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budget og budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 526}, {"question": "[Begrebsspørgsmål] Hvad er et masterbudget, og hvilke delbudgetter består det af?", "model": "Sammenholder kortsigtede og langsigtede planer. Operationelt budget (salg, produktion, materialer, løn, IPO, slutlager, vareforbrug, øvrige omk., budgetteret resultatopgørelse) + finansielt budget (investerings-, likviditets-, balancebudget).", "id": "ØS-sa-090", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L10", "open", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Masterbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 527}, {"id": "ØS-sa-101", "course": "ØS", "lecture": 10, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Salg 8.000 enh.; ønsket færdigvarelager ultimo 1.000, primo 600. 3 kg materiale pr. enhed; materialelager ultimo 2.000 kg, primo 1.500 kg; 15 kr./kg. Beregn produktion og materialeindkøb.", "model": "Produktion = 8.000 + 1.000 − 600 = 8.400. Forbrug = 25.200 kg. Indkøb = 25.200 + 2.000 − 1.500 = 25.700 kg × 15 = 385.500 kr.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 528, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "calc", "eksamen"]}, {"id": "ØS-term-L11-003", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Ansvarscenter", "back": "Organisationsenhed hvor lederen holdes ansvarlig for aktiviteten – 'en lille virksomhed i virksomheden'. Mål skal være specifikke, målbare og målkongruente.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 529}, {"id": "ØS-term-L11-009", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Kontrollabilitetsprincippet", "back": "Lederen holdes kun ansvarlig for omk. og forhold, vedkommende kan påvirke i perioden; ikke-kontrollerbare omk. ekskluderes. Hvem har bedst viden til at styre omkostningen?", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Kontrollabilitetsprincippet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 530}, {"id": "ØS-term-L11-010", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Fordele og ulemper ved ansvarscentre", "back": "+ lokal information, hurtigere respons, frigør topledelsen, mindre kompleksitet, træning af ledere, motivation. − suboptimering, lokale mål frem for globale, intern konkurrence, dobbeltfunktioner, svært at finde målkongruente mål.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Fordele og ulemper ved ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 531}, {"id": "ØS-term-L11-012", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Profit vs. likviditet", "back": "Betalingsbetingelser (faktura og betaling i forskellige måneder), afdrag på gæld (kun likviditet), afskrivninger (kun resultat). Man kan have profit og alligevel gå konkurs.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb", "grund"], "level": "grund", "order": 532}, {"id": "ØS-term-L11-004", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Standard omkostningscenter", "back": "Output kan måles og inputkrav specificeres pr. enhed (produktion). Ansvar: effektivitet i at opfylde efterspørgsel og produktionsplan med kvalitet og rettidighed – ikke omsætning eller profit.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Standard omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 533}, {"id": "ØS-term-L11-005", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Discretionary omkostningscenter", "back": "Output kan ikke måles finansielt/svag input-output-sammenhæng (R&D, HR, support). Ansvar: inputniveauet; evalueres via benchmarking eller relativt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Discretionary omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 534}, {"id": "ØS-term-L11-006", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Omsætningscenter", "back": "Salgsafdelinger med ansvar for omsætning (hvis de sætter priser) eller mængde og mix. Risiko: 'volumensyge' uden hensyn til produktionsomk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Omsætningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 535}, {"id": "ØS-term-L11-007", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Profitcenter", "back": "Ansvar for omsætning og omkostninger (indkøb, produktion, salg), ikke investering og finansiering – fx en SBU, butik eller hotel.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Profitcenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 536}, {"id": "ØS-term-L11-008", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Investeringscenter", "back": "Profitansvar + investeringsansvar (aktiver), oftest ikke finansiering. Måles på afkastningsgrad (ROI) eller EVA.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Investeringscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model", "grund"], "level": "grund", "order": 537}, {"id": "ØS-term-L11-014", "course": "ØS", "lecture": 11, "type": "card", "kind": "sammenligning", "front": "Profitcenter vs. investeringscenter", "back": "Profitcenter: ansvar for omsætning og omk. Investeringscenter: desuden ansvar for de investerede aktiver – måles på ROI eller EVA.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 538, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "sammenligning", "grund"]}, {"id": "ØS-term-L11-001", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Kaizen-budgettering", "back": "Indarbejder løbende forbedringer i de budgetterede tal gennem perioden (3,00 → 2,95 → 2,90 → 2,85 timer pr. enhed pr. kvartal).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Kaizen-budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode", "eksamen"], "level": "eksamen", "order": 539}, {"id": "ØS-term-L11-002", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Activity-Based Budgeting (ABB)", "back": "Stage 1 (ikke-finansielt): efterspørgsel efter objekter → aktiviteter → ressourcebehov (200 kunder × 1 besøg / 100 besøg pr. sælger = 2 sælgere). Stage 2 (finansielt): kroner på ressourcerne → omk. pr. aktivitet (400.000/200 = 2.000 kr. pr. besøg).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Activity-Based Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode", "eksamen"], "level": "eksamen", "order": 540}, {"id": "ØS-term-L11-011", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Likviditetsbudget", "back": "Forventede pengestrømme ind og ud af kassen pr. måned (underskud/overskud). Indbetalinger efter betalingsmønster (Maui: 50 % samme måned, 27 % næste, 20 % 2. måned, 3 % tab).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode", "eksamen"], "level": "eksamen", "order": 541}, {"id": "ØS-term-L11-013", "course": "ØS", "lecture": 11, "type": "card", "kind": "eksempel", "front": "Eksempel: likviditet – indbetalinger", "back": "Mønster 50/27/20 % (3 % tab). Marts = 0,50 × marts-salg + 0,27 × februar + 0,20 × januar. Salg 100.000/120.000/80.000 ⇒ 40.000 + 32.400 + 20.000 = 92.400.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 542, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "eksempel", "eksamen"]}, {"question": "Et R&D-center, hvor output ikke kan måles finansielt, er et:", "options": ["Standard omkostningscenter", "Discretionary omkostningscenter", "Profitcenter", "Investeringscenter"], "answer": 1, "explanation": "Discretionary omkostningscenter – output kan ikke måles finansielt, så der styres på inputniveau. Forkert: standardcenter kræver målbart output; profit- og investeringscentre har ansvar for omsætning.", "id": "ØS-mc-071", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L11", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Discretionary omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 543}, {"question": "Hvilken post ses i resultatet men IKKE i likviditetsbudgettet?", "options": ["Afdrag på gæld", "Afskrivninger", "Kundeindbetalinger", "Lønudbetalinger"], "answer": 1, "explanation": "Afskrivninger påvirker resultatet men er ingen betaling. Forkert: afdrag på gæld påvirker kun likviditeten; kundeindbetalinger og lønudbetalinger er betalinger.", "id": "ØS-mc-072", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L11", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 544}, {"question": "[Eksamensstil] Kunder betaler 50 % i salgsmåneden, 27 % måneden efter, 20 % 2. måned efter (3 % tab). Salg: jan 100.000, feb 120.000, mar 80.000. Indbetalinger i marts?", "model": "0,50·80.000 + 0,27·120.000 + 0,20·100.000 = 40.000 + 32.400 + 20.000 = 92.400 kr.", "id": "ØS-sa-084", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L11", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget (Maui Diving)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 545}, {"question": "[Eksamensstil] ABB: 200 kunder, 1 besøg/år hver, en sælger klarer 100 besøg, sælgerløn 200.000. Beregn ressourcebehov og omkostning pr. besøg.", "model": "200 besøg / 100 = 2 sælgere; pulje 400.000; pr. besøg 400.000/200 = 2.000 kr.", "id": "ØS-sa-085", "course": "ØS", "lecture": 11, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L11", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Activity-Based Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 546}, {"id": "ØS-term-L12-001", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Budgetopfølgning og varianser", "back": "Sammenligning af faktisk og planlagt; den overordnede afvigelse dekomponeres for at finde årsagen. F (fordelagtig) forbedrer, U (ufordelagtig) forværrer driftsresultatet ift. budget.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Budgetopfølgning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 547}, {"id": "ØS-term-L12-009", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Fortolkning af varianser", "back": "Årsager hænger sammen: billige materialer (F prisvarians) kan give U mængde- og timevarianser. Ufordelagtig løneffektivitet: dårlig træning, materialer, udstyr eller supervision. Placér ansvar hvor det kan påvirkes.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Fortolkning og ansvar", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 548}, {"id": "ØS-term-L12-010", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Effektivitet vs. efficiens", "back": "Effektivitet: i hvilken grad mål er opnået. Efficiens: input brugt for et givent output. Vægtes kun ét mål, optimeres det på bekostning af andre.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Fokus på mere end prisvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 549}, {"id": "ØS-term-L12-011", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Benchmarking og Beyond Budgeting", "back": "Benchmarking: sammenligning med interne enheder, branchen og konkurrenter. Beyond Budgeting (Hope & Fraser): relative mål og belønning, kontinuert planlægning, on-demand ressourcer, decentralisering.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Benchmarking og Beyond Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb", "grund"], "level": "grund", "order": 550}, {"id": "ØS-term-L12-002", "course": "ØS", "lecture": 12, "type": "card", "kind": "model", "front": "Tre variansniveauer", "back": "Niveau 1: faktisk vs. statisk budget. Niveau 2: fleksibelt budget-varians + salgsvolumenvarians. Niveau 3: pris- og forbrugsvarians (DM, DL – og IPO i kap. 16).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Tre variansniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "model", "grund"], "level": "grund", "order": 551}, {"id": "ØS-term-L12-013", "course": "ØS", "lecture": 12, "type": "card", "kind": "sammenligning", "front": "Prisvarians vs. forbrugsvarians", "back": "Pris: (AP − SP) × AQ – betalte vi mere/mindre pr. enhed input? Typisk indkøb. Forbrug: (AQ − SQ) × SP – brugte vi mere/mindre input end tilladt for faktisk output? Typisk produktion.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 552, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "sammenligning", "grund"]}, {"id": "ØS-term-L12-003", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Statisk budget-varians (niveau 1)", "back": "Faktisk resultat − statisk budget (jakker: 25.000 − 262.000 = 237.000 U). Viser kun at der er en afvigelse.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 1", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 553}, {"id": "ØS-term-L12-004", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Fleksibelt budget", "back": "Budgettet genberegnet ved faktisk output: budgetpris × faktisk antal, budgetteret VC × faktisk antal, budgetterede FC (10.000 × 180 = 1,8 mio.; 10.000 × 99 = 990.000).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 554}, {"id": "ØS-term-L12-005", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Fleksibelt budget-varians", "back": "Faktisk − fleksibelt budget; viser pris- og effektivitetseffekter ved faktisk output (jakker: 75.000 U).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 555}, {"id": "ØS-term-L12-006", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Salgsvolumenvarians (planning varians)", "back": "Fleksibelt budget − statisk budget; effekten af at sælge et andet antal end budgetteret (162.000 U). Kontrol: 75.000 U + 162.000 U = 237.000 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 556}, {"id": "ØS-term-L12-007", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Prisvarians", "back": "(AP − SP) × AQ: faktisk inputpris − budgetteret pris, gange faktisk inputmængde. Stof: (31 − 30) × 22.200 = 22.200 U. Ved lagerændring beregnes den på indkøbt mængde.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 557}, {"id": "ØS-term-L12-008", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Forbrugsvarians (efficiens)", "back": "(AQ − SQ) × SP: faktisk mængde − tilladt mængde for faktisk output (SQ = output × standard), gange budgetpris. Stof: (22.200 − 20.000) × 30 = 66.000 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode", "eksamen"], "level": "eksamen", "order": 558}, {"id": "ØS-term-L12-012", "course": "ØS", "lecture": 12, "type": "card", "kind": "eksempel", "front": "Eksempel: variansniveauer (jakker)", "back": "Niveau 1: 25.000 − 262.000 = 237.000 U. Niveau 2: fleksibelt budget 100.000 ⇒ fleksibelt budget-varians 75.000 U og salgsvolumenvarians 162.000 U. Niveau 3: DM pris 22.200 U, forbrug 66.000 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Tre variansniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 559, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "eksempel", "eksamen"]}, {"question": "Salgsvolumenvarians =", "options": ["Faktisk − fleksibelt budget", "Fleksibelt budget − statisk budget", "Faktisk − statisk budget", "(AP − SP) × AQ"], "answer": 1, "explanation": "Salgsvolumenvarians = fleksibelt − statisk budget. Forkert: faktisk − fleksibelt = fleksibelt budget-varians; faktisk − statisk = niveau 1; (AP − SP) × AQ = prisvarians.", "id": "ØS-mc-073", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L12", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 560}, {"question": "Stof: AP 31, SP 30, AQ 22.200 m², SQ 20.000 m². Forbrugsvarians?", "options": ["22.200 U", "66.000 U", "66.600 U", "2.200 F"], "answer": 1, "explanation": "(AQ − SQ) × SP = (22.200 − 20.000) × 30 = 66.000 U. Forkert: 22.200 U er prisvariansen; 66.600 bruger AP 31 i stedet for SP; 2.200 er mængdeforskellen uden kroner.", "id": "ØS-mc-074", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L12", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 561}, {"id": "ØS-mc-105", "course": "ØS", "lecture": 12, "type": "mc", "kind": "mc", "question": "Indkøbsafdelingen køber billigere, dårligere materialer. Hvilket mønster forventes?", "options": ["F prisvarians og U forbrugsvarians", "U prisvarians og F forbrugsvarians", "F begge", "Ingen effekt"], "answer": 0, "explanation": "Billigere input ⇒ fordelagtig prisvarians, men mere spild ⇒ ufordelagtig forbrugsvarians. Varianser hænger sammen og skal fortolkes samlet.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 562, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "mc", "eksamen"]}, {"question": "[Eksamensstil] Materiale: SP 10 kr./kg, standard 0,48 kg/enh.; faktisk output 10.000 enh.; faktisk forbrug 5.000 kg à 12 kr. Beregn pris- og forbrugsvarians.", "model": "SQ = 4.800 kg. Pris = (12 − 10) × 5.000 = 10.000 U. Forbrug = (5.000 − 4.800) × 10 = 2.000 U. Samlet 12.000 U.", "id": "ØS-sa-087", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L12", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 563}, {"question": "[Begrebsspørgsmål] Hvad er forskellen mellem statisk budgetvarians og fleksibel budgetvarians?", "model": "Statisk: faktisk − statisk budget (niveau 1), blander volumen- og effektivitetseffekter. Fleksibel: faktisk − fleksibelt budget (budgettet genberegnet ved faktisk output), isolerer pris/effektivitet. Differencen er salgsvolumenvariansen.", "id": "ØS-sa-091", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L12", "open", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 564}, {"id": "ØS-sa-102", "course": "ØS", "lecture": 12, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Standard 2 DLH pr. enhed à 200 kr. Output 1.000 enh. Faktisk 2.100 DLH à 190 kr. Beregn løn-pris- og effektivitetsvarians.", "model": "Pris = (190 − 200) × 2.100 = 21.000 F. Effektivitet = (2.100 − 2.000) × 200 = 20.000 U. Samlet 1.000 F.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 565, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "calc", "eksamen"]}, {"question": "[Eksamensstil] Budget: pris 180, VC 99, FC 710.000, 12.000 enh. Faktisk: 10.000 enh., resultat 25.000. Beregn statisk budgetresultat, fleksibelt budget og salgsvolumen-/fleksibelt budget-varians.", "model": "Statisk: 12.000 × 81 − 710.000 = 262.000. Fleksibelt: 10.000 × 81 − 710.000 = 100.000. Salgsvolumenvarians = 100.000 − 262.000 = 162.000 U. Fleksibelt budget-varians = 25.000 − 100.000 = 75.000 U. Samlet 237.000 U.", "id": "ØS-sa-086", "course": "ØS", "lecture": 12, "lectureName": "L12 Variansanalyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L12", "calc", "svaer"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 1 og 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "svaer", "order": 566}, {"id": "ØS-term-L13-001", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Variable og faste IPO", "back": "Variable indirekte produktionsomk. varierer med mængden (el, vand, maskinvedligehold, indirekte materialer). Faste varierer ikke (leasing, fabrikschefens løn, afskrivninger).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variable og faste IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb", "grund"], "level": "grund", "order": 567}, {"id": "ØS-term-L13-009", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Planlægning/kontrol vs. lagerværdiansættelse", "back": "Faste omk. planlægges og kontrolleres som kendte beløb. Allokerede faste omk. til lager er gjort variable for at beregne kostpris og kan ikke bruges til planlægning og kontrol.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Planlægning og kontrol vs. lagerværdiansættelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb", "grund"], "level": "grund", "order": 568}, {"id": "ØS-term-L13-008", "course": "ØS", "lecture": 13, "type": "card", "kind": "model", "front": "4- og 3-varians-analyse", "back": "4-varians: variabel IPO pris + efficiens; fast IPO spending + produktionsvolumen. 3-varians: spending (variabel pris + fast spending), efficiens og produktionsvolumen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Integreret variansanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "model", "grund"], "level": "grund", "order": 569}, {"id": "ØS-term-L13-011", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Total IPO-varians", "back": "Total IPO-varians = fleksibelt budget-varians (variabel + fast) + produktionsvolumenvarians. Jakker: 19.500 U + 46.000 U = 65.500 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Integreret variansanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 570, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb", "eksamen"]}, {"id": "ØS-term-L13-002", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Budgetteret IPO-sats", "back": "Tre trin: vælg periode → vælg fordelingsnøgle (aktiviteten omk. varierer med, fx maskintimer) → beregn rate pr. aktivitetsenhed. Eks. 0,4 MT × €30 = €12 pr. jakke; fast: €276.000/4.800 MT = €57,50.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Budgetteret variabel IPO-sats", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 571}, {"id": "ØS-term-L13-003", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: fleksibelt budget-varians", "back": "Faktisk variabel IPO − (faktisk output × budgetteret MT pr. enhed × sats): 130.500 − 120.000 = €10.500 U. Salgsvolumenvarians: 120.000 − 144.000 = €24.000 F.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 572}, {"id": "ØS-term-L13-004", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: efficiensvarians", "back": "(Faktiske timer − budgetterede timer for faktisk output) × budgetsats = (4.500 − 4.000) × 30 = €15.000 U. Måler effektiviteten i brugen af fordelingsnøglen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 573}, {"id": "ØS-term-L13-005", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: prisvarians (spending)", "back": "(Faktisk sats − budgetsats) × faktiske timer = (29 − 30) × 4.500 = €4.500 F.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 574}, {"id": "ØS-term-L13-006", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Fast IPO: spending-varians", "back": "Faktisk − budgetteret (fleksibelt = statisk) fast IPO = 285.000 − 276.000 = €9.000 U. Faste omk. har aldrig efficiensvarians.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 575}, {"id": "ØS-term-L13-007", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Produktionsvolumenvarians", "back": "Budgetteret fast IPO − allokeret fast IPO (faktisk output × sats pr. enhed) = 276.000 − 10.000 × 23 = €46.000 U. Opstår kun for faste omk., fordi en fast pulje omregnes til en sats ved budgetteret kapacitet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Produktionsvolumenvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 576}, {"id": "ØS-term-L13-010", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Varianser i ABC (setup)", "back": "Fleksibelt budget: faktisk output / budgetteret seriestørrelse = antal setups × budgetterede timer pr. setup × sats (1.008 × 6 × 20 = 120.960). Pris = (21 − 20) × 6.750 = 6.750 U; efficiens = (6.750 − 6.048) × 20 = 14.040 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Varianser i ABC/ABB – setup", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode", "eksamen"], "level": "eksamen", "order": 577}, {"id": "ØS-term-L13-013", "course": "ØS", "lecture": 13, "type": "card", "kind": "hvorfor", "front": "Hvorfor har faste IPO ingen efficiensvarians?", "back": "Faste omk. ændrer sig ikke med forbruget af fordelingsnøglen på kort sigt – det fleksible budget er lig det statiske, så der er kun spending- og produktionsvolumenvarians.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 578, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "hvorfor", "eksamen"]}, {"id": "ØS-term-L13-012", "course": "ØS", "lecture": 13, "type": "card", "kind": "eksempel", "front": "Eksempel: variabel IPO-varianser", "back": "Budget: 0,4 MT × €30 = €12/jakke. Faktisk 10.000 jakker, 4.500 MT à €29. Efficiens (4.500 − 4.000) × 30 = 15.000 U. Pris (29 − 30) × 4.500 = 4.500 F. Sum = fleksibelt budget-varians 10.500 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 579, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "eksempel", "eksamen"]}, {"question": "Variabel IPO: 4.500 faktiske MT, 4.000 budgetterede MT for faktisk output, sats €30, faktisk €29/MT. Efficiensvarians?", "options": ["€4.500 F", "€15.000 U", "€10.500 U", "€13.500 F"], "answer": 1, "explanation": "(4.500 − 4.000) × 30 = 15.000 U. Forkert: 4.500 F er prisvariansen (29 − 30) × 4.500; 10.500 U er fleksibelt budget-variansen; 13.500 F findes ikke.", "id": "ØS-mc-075", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L13", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 580}, {"question": "Fast IPO budget €276.000; sats €23 pr. jakke; faktisk output 10.000. Produktionsvolumenvarians?", "options": ["€46.000 U", "€9.000 U", "€23.000 F", "0"], "answer": 0, "explanation": "276.000 − 10.000 × 23 = 46.000 U. Forkert: 9.000 U er spending-variansen; 23.000 F er satsen × 1.000; faste omk. giver volumenvarians, når output ≠ budget.", "id": "ØS-mc-076", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L13", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Produktionsvolumenvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 581}, {"id": "ØS-sa-103", "course": "ØS", "lecture": 13, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Fast IPO budget 200.000 ved 10.000 MT (0,5 MT/enh., 20.000 enh.). Faktisk fast IPO 210.000; faktisk output 18.000. Beregn spending- og produktionsvolumenvarians.", "model": "Sats 20/MT ⇒ 10 kr./enh. Spending = 210.000 − 200.000 = 10.000 U. Allokeret = 18.000 × 10 = 180.000 ⇒ volumenvarians = 20.000 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 582, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "calc", "eksamen"]}, {"question": "[Eksamensstil] Fast IPO budget 276.000 (4.800 MT, 0,4 MT/jakke, 12.000 jakker); faktisk 285.000; faktisk output 10.000. Beregn spending- og produktionsvolumenvarians.", "model": "Sats 57,50/MT ⇒ 23 kr./jakke. Spending = 285.000 − 276.000 = 9.000 U. Allokeret = 10.000 × 23 = 230.000; volumenvarians = 276.000 − 230.000 = 46.000 U.", "id": "ØS-sa-088", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L13", "calc", "svaer"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "svaer", "order": 583}, {"id": "ØS-sup-L1-01", "course": "ØS", "lecture": 1, "lectureName": "L1 Hvad er økonomistyring?", "type": "card", "kind": "sammenligning", "level": "grund", "front": "Omkostningsregnskab vs. omkostningsstyring", "back": "Omkostningsregnskabet leverer information til både det finansielle regnskab og økonomistyringen. En omkostning er en vurdering af ressourceforbrug, ikke en objektiv størrelse. Omkostningsstyring er selve styringen: planlægning, kontrol og løbende reduktion, ofte via ERP (SAP, Navision).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Omkostningsregnskab og omkostningsstyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L1", "sammenligning", "grund", "supplement"], "order": 392, "skipPod": true}, {"id": "ØS-sup-L1-02", "course": "ØS", "lecture": 1, "lectureName": "L1 Hvad er økonomistyring?", "type": "card", "kind": "begreb", "level": "grund", "front": "Nøgleområder og fremtidens økonomistyring", "back": "Syv områder: kundefokus, tid, kvalitet, omkostninger, innovation, kontinuerlige forbedringer samt værdikæde og supply chain. Retningen er tværfunktionelle organisationer, fleksibel produktion, nichemarkeder og flere ikke-finansielle mål. Digitalisering (BI, fx Power BI, og automatiseret bogføring) flytter tiden fra registrering til analyse. Økonomifunktionen går fra bogholder til business partner.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Nøgleområder i moderne økonomistyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L1", "begreb", "grund", "supplement"], "order": 393, "skipPod": true}, {"id": "ØS-sup-L2-01", "course": "ØS", "lecture": 2, "lectureName": "L2 Omkostninger", "type": "card", "kind": "model", "level": "grund", "front": "Tre lagre og lagerflow", "back": "Råvarelager (endnu ikke brugt) → WIP (under fremstilling) → færdigvarelager → COGS ved salg. Kapitaliserede omkostninger (direkte materialer, direkte løn, IPO) ligger på lageret, indtil varen sælges. Periodeomkostninger (marketing, administration, HR, salg – SG&A) går direkte i resultatopgørelsen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › De tre lagertyper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L2", "model", "grund", "supplement"], "order": 406, "skipPod": true}, {"id": "ØS-sup-L2-02", "course": "ØS", "lecture": 2, "lectureName": "L2 Omkostninger", "type": "card", "kind": "metode", "level": "eksamen", "front": "Materialeforbrug, COGM og COGS", "back": "Materialeforbrug = primo råvarer + indkøb − ultimo råvarer. Produktionsomkostninger = direkte materialer + direkte løn + indirekte fremstillingsomkostninger. COGM = primo WIP + produktionsomkostninger − ultimo WIP. COGS = primo færdigvarer + COGM − ultimo færdigvarer. COGM er værdien af det, der færdiggøres. COGS er værdien af det, der sælges, og indgår i resultatopgørelsen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Cost of Goods Manufactured (COGM)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L2", "metode", "eksamen", "supplement"], "order": 407, "skipPod": true}, {"id": "ØS-sup-L2-03", "course": "ØS", "lecture": 2, "lectureName": "L2 Omkostninger", "type": "sa", "kind": "calc", "level": "eksamen", "question": "COGM er 21.300. Direkte materialer 12.000, direkte løn 5.000, primo WIP 800 og ultimo WIP 3.000. Find de indirekte fremstillingsomkostninger.", "model": "COGM = primo WIP + DM + DL + IPO − ultimo WIP. 21.300 = 800 + 12.000 + 5.000 + IPO − 3.000 = 14.800 + IPO. IPO = 21.300 − 14.800 = 6.500.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Cost of Goods Manufactured (COGM)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L2", "calc", "eksamen", "supplement"], "order": 408, "skipPod": true}, {"id": "ØS-sup-L2-04", "course": "ØS", "lecture": 2, "lectureName": "L2 Omkostninger", "type": "sa", "kind": "calc", "level": "eksamen", "question": "COGM er 18.000, og færdigvarelageret primo er 4.000. Omsætningen er 32.000, og bruttoavancen er 11.300. Find COGS og færdigvarelageret ultimo.", "model": "COGS = omsætning − bruttoavance = 32.000 − 11.300 = 20.700. Varer til rådighed = 4.000 + 18.000 = 22.000. Ultimo færdigvarer = 22.000 − 20.700 = 1.300.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Cost of Goods Sold (COGS)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L2", "calc", "eksamen", "supplement"], "order": 409, "skipPod": true}, {"id": "ØS-sup-L3-01", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "card", "kind": "begreb", "level": "grund", "front": "Kildedokumenter i job-costing", "back": "Job cost sheet samler alle omkostninger på jobbet og bruges til overvågning, pris og resultat. Materialerekvisition registrerer materialeforbrug på jobbet. Arbejdstidsregistrering registrerer timer til løn, omkostning og efterkalkulation. I praksis ligger det i ERP. Flow: omkostninger rammer først WIP, så færdigvarer, og først COGS når kunden køber.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Kildedokumenter i job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L3", "begreb", "grund", "supplement"], "order": 420, "skipPod": true}, {"id": "ØS-sup-L3-02", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "card", "kind": "model", "level": "eksamen", "front": "Tæller- og nævnerafvigelse", "back": "Underallokering: faktisk overhead > fordelt overhead. Overallokering: fordelt > faktisk. Tællerafvigelse: de faktiske indirekte omkostninger afviger fra budget (el, reparationer). Nævnerafvigelse: aktiviteten afviger fra budget (flere eller færre maskintimer). Et helt år som budgetperiode dæmper begge udsving og giver en mere stabil sats.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Årsager til afvigelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L3", "model", "eksamen", "supplement"], "order": 421, "skipPod": true}, {"id": "ØS-sup-L3-03", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "card", "kind": "metode", "level": "eksamen", "front": "Tre måder at lukke over-/underallokering", "back": "1) Justeret allokeringssats: alle jobs genberegnes med den faktiske sats. Mest præcis, mest tidskrævende. 2) Prorate: afvigelsen fordeles på WIP, færdigvarer og COGS. Mere retvisende lager og resultat. 3) Hele afvigelsen direkte på COGS. Enklest, mindst præcis.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Håndtering af afvigelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L3", "metode", "eksamen", "supplement"], "order": 422, "skipPod": true}, {"id": "ØS-sup-L3-04", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "sa", "kind": "calc", "level": "eksamen", "question": "Carmen & Associates budgetterer direkte løn 400.000, indirekte omkostninger 96.000 og 16.000 direkte timer. Et patientforløb tager 25 timer. Find direkte lønsats, overheadsats og samlet omkostning.", "model": "Direkte lønsats = 400.000 / 16.000 = 25 pr. time. Overheadsats = 96.000 / 16.000 = 6 pr. time. Direkte løn 25 × 25 = 625. Overhead 25 × 6 = 150. Samlet omkostning = 775.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Carmen & Associates", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L3", "calc", "eksamen", "supplement"], "order": 423, "skipPod": true}, {"id": "ØS-sup-L3-05", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "sa", "kind": "calc", "level": "eksamen", "question": "En direktør koster 140.000 i løn og 60.000 i personalegoder. Fakturerbar tid er 1.600 timer. Ferie og sygefravær er 160 timer, og professionel udvikling er 240 timer. Beregn den direkte sats med kun fakturerbare timer og med alle tre tidsarter. Hvorfor er satserne forskellige?", "model": "Løn og goder = 200.000. Kun fakturerbare timer: 200.000 / 1.600 = 125 pr. time. Med ferie og udvikling: 1.600 + 160 + 240 = 2.000 timer, så 200.000 / 2.000 = 100 pr. time. Forskellen er, at ferie, sygdom og udvikling også er en lønomkostning. Den høje sats lægger hele lønnen på de timer, kunden faktureres. Den lave sats spreder lønnen, så den ikke-fakturerbare tid skal dækkes et andet sted, typisk i overhead. Valget af nævner ændrer jobomkostningen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Opgave 3.12", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L3", "calc", "eksamen", "supplement"], "order": 424, "skipPod": true}, {"id": "ØS-sup-L5-01", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "card", "kind": "begreb", "level": "eksamen", "front": "Homogen omkostningspulje", "back": "En cost pool er homogen, når omkostningerne i puljen har nogenlunde samme sammenhæng med allokeringsbasen. Vedligeholdelse (maskintimer) og HR (antal medarbejdere) må ikke ligge i samme pulje og fordeles efter maskintimer. Så får maskintunge afdelinger for meget HR, og arbejdstunge for lidt. Flere puljer giver mere præcision, men koster mere at registrere.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Omkostningspuljer og homogenitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L5", "begreb", "eksamen", "supplement"], "order": 453, "skipPod": true}, {"id": "ØS-sup-L5-02", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "card", "kind": "sammenligning", "level": "eksamen", "front": "Stand-alone vs. incremental", "back": "Stand-alone fordeler fællesomkostningen efter, hvad hver part ville betale alene. A alene 60.000, B alene 40.000, fælles løsning 80.000: A får 60 % = 48.000, B får 40 % = 32.000. Besparelsen deles proportionalt. Incremental udpeger en primær bruger, som bærer sin stand-alone-omkostning. Resten er den ekstra brugers meromkostning: A 60.000 og B 20.000. Hvem der er primær, afgør fordelingen. Kompromis: gennemsnit af begge rækkefølger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Stand-alone- og incremental-metoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L5", "sammenligning", "eksamen", "supplement"], "order": 454, "skipPod": true}, {"id": "ØS-sup-L5-03", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "card", "kind": "hvorfor", "level": "eksamen", "front": "Death spiral ved faktisk allokeringsrate", "back": "Budgetteret rate = budgetterede omkostninger / budgetteret aktivitet. Modtagerne kender satsen og arver ikke supportafdelingens ineffektivitet. Faktisk rate = faktiske omkostninger / faktisk aktivitet fordeler alt, men hvis aktiviteten falder, stiger satsen. Dyrere intern service får afdelingerne til at købe mindre, så satsen stiger igen. Det er death spiral. Afvigelsen bør ligge hos den, der har ansvaret, ikke smøres ud via en faktisk sats.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Budgetterede og faktiske allokeringsrater", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L5", "hvorfor", "eksamen", "supplement"], "order": 455, "skipPod": true}, {"id": "ØS-sup-L6-01", "course": "ØS", "lecture": 6, "lectureName": "L6 Fællesproduktion", "type": "card", "kind": "hvorfor", "level": "eksamen", "front": "Negativ fællesomkostning ved konstant bruttomargin", "back": "Konstant bruttomarginprocent tvinger alle fællesprodukter til samme bruttomarginprocent. Hvis et produkts separate omkostninger er meget høje, kan det kun lade sig gøre ved at tildele produktet en negativ fællesomkostning. Det er en matematisk allokering, ikke et mål for ressourceforbrug. Brug metoden kun, når ens margin er et rapporteringskrav. Ellers: salgsværdi ved split-off, hvis der er en markedspris, og ellers NRV.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Konstant bruttomarginprocent-NRV", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L6", "hvorfor", "eksamen", "supplement"], "order": 469, "skipPod": true}, {"id": "ØS-sup-L8-01", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "sa", "kind": "calc", "level": "eksamen", "question": "Mary sælger kjoler til 70 med variable omkostninger 42 og faste omkostninger 84.000. Leverandøren sænker indkøbsprisen med 7 pr. kjole mod 30.000 ekstra i fast betaling. Find indifferenspunktet, og sig hvornår den nye aftale er bedst.", "model": "Nyt DB = 28 + 7 = 35. Nye faste omkostninger = 114.000. Sæt resultaterne lig hinanden: 28Q − 84.000 = 35Q − 114.000. 30.000 = 7Q. Q = 4.286 kjoler. Over 4.286 er den nye aftale bedst (højere DB, men højere gearing og højere break-even: 114.000 / 35 ≈ 3.257 mod 84.000 / 28 = 3.000).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Omkostningsplanlægning og valg af omkostningsstruktur", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L8", "calc", "eksamen", "supplement"], "order": 499, "skipPod": true}, {"id": "ØS-sup-L8-02", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "sa", "kind": "calc", "level": "eksamen", "question": "Mary kan sælge 4.000 kjoler, men kapaciteten er 3.500. Udvidelsen koster 6.000. DB er 28 pr. kjole. Skal hun udvide, og hvor mange ekstra kjoler skal der mindst til?", "model": "500 ekstra kjoler giver 500 × 28 = 14.000 i DB. Fratrukket 6.000 er fordelen 8.000, så udvidelsen er fordelagtig, hvis de 500 kan sælges, og der ikke er andre relevante omkostninger. Nulpunktet er 6.000 / 28 ≈ 214,3, altså mindst 215 ekstra kjoler.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Eksempel: kapacitetsudvidelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L8", "calc", "eksamen", "supplement"], "order": 500, "skipPod": true}, {"id": "ØS-sup-L9-01", "course": "ØS", "lecture": 9, "lectureName": "L9 ABC og ABM", "type": "card", "kind": "model", "level": "eksamen", "front": "Transaktions-, varigheds- og kompleksitetsdriver", "back": "Transaktionsdriver: antal gange aktiviteten sker. 6.000.000 / 30.000 designs = 200 pr. design. Den antager, at hvert design koster det samme. Varighedsdriver: 6.000.000 / 48.000 timer = 125 pr. time, så et design på 4 timer koster 500. Kompleksitetsindeks med vægte 1, 2 og 4: 20.000 lette + 6.000 mellem × 2 + 4.000 svære × 4 = 48.000 ækvivalenter, igen 125 pr. ækvivalent. Mere præcision koster mere registrering. Vælg den driver, der ændrer beslutningen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Valg af cost driver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L9", "model", "eksamen", "supplement"], "order": 512, "skipPod": true}, {"id": "ØS-sup-L9-02", "course": "ØS", "lecture": 9, "lectureName": "L9 ABC og ABM", "type": "card", "kind": "hvorfor", "level": "eksamen", "front": "Advarselstegn og uudnyttet kapacitet", "back": "Systemet er skævt, hvis virksomheden vinder de komplekse specialordrer, mens standardprodukter ser urentable ud, eller hvis konkurrenternes priser på standardvarer virker umuligt lave. Så bærer højvolumenprodukterne støtteomkostningerne. Fordel ikke uudnyttet kapacitet ud på de enheder, der blev lavet. Ellers stiger enhedsomkostningen, når volumen falder, prisen sættes op, og efterspørgslen falder yderligere. Vis ledig kapacitet for sig.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Kapacitet og uudnyttede ressourcer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L9", "hvorfor", "eksamen", "supplement"], "order": 513, "skipPod": true}, {"id": "ØS-sup-L10-01", "course": "ØS", "lecture": 10, "lectureName": "L10 Budgettering", "type": "card", "kind": "eksempel", "level": "eksamen", "front": "Wessex: små ændringer, store udsving", "back": "Masterbudget: driftsresultat 486.000 (Regular 5.000 à 600, Heavy-duty 1.000 à 800, materiale 7 og 10). 3 % lavere salgspriser giver 386.250, et fald på 21 %. 4 % lavere salgsmængde giver 438.273, et fald på 10 %. 5 % dyrere materialer giver 448.380, et fald på ca. 9 %. Prisen er den mest følsomme af de tre forudsætninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Finansiel planlægning og følsomhedsanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L10", "eksempel", "eksamen", "supplement"], "order": 529, "skipPod": true}, {"id": "ØS-sup-L13-01", "course": "ØS", "lecture": 13, "lectureName": "L13 Variansanalyse – IPO", "type": "card", "kind": "hvorfor", "level": "eksamen", "front": "Fejl i bogens IPO-tal", "back": "Slides gør opmærksom på fejl i bogen, som ikke skal læres. I kapitel 16 er den statiske budgetvarians og den fleksible budgetvarians for variabel IPO forkerte (s. 493). Den statiske budgetvarians for fast IPO er forkert (s. 498). Produktionsvolumenvariansen bruger 10,4, hvor det skal være 0,4 timer pr. jakke (s. 500). Regn ud fra standarden: 0,40 maskintimer pr. jakke og satsen fra de budgetterede timer, ikke fra bogens trykfejl.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "tags": ["ØS", "ØS-L13", "hvorfor", "eksamen", "supplement"], "order": 584, "skipPod": true}]}</script><script type="application/json" id="pod">[{"n":1,"name":"L1 Hvad er økonomistyring?","items":[{"t":"Hvad er økonomistyring?","b":"Økonomistyring (Management Accounting) er et internt ledelsesværktøj, som leverer både finansielle og ikke-finansielle informationer, så ledere kan træffe bedre beslutninger og opnå virksomhedens mål. Formålet er at. Understøtte beslutningstagning. Hjælpe med strategi og planlægning. Styre ressourcer effektivt. Måle og forbedre virksomhedens præstation."},{"t":"Finansielt regnskab vs. økonomistyring","b":"Finansielt regnskab. Økonomistyring. Eksterne interessenter. Interne ledere. Lovgivning og regnskabsregler. Beslutningsrelevant information. Historiske data. Fortid, nutid og fremtid. Standardiseret rapportering. Fleksibel rapportering. Husk. Finansielt regnskab er regelbaseret, mens økonomistyring er tilpasset ledelsens behov."},{"t":"Omkostningsregnskab og omkostningsstyring","b":"Omkostningsregnskab. Leverer information til både finansielt regnskab og økonomistyring. En omkostning er en vurdering af ressourceforbrug – ikke nødvendigvis en objektiv størrelse. Omkostningsstyring. Handler om at styre virksomhedens omkostninger gennem: Planlægning. Kontrol. Løbende omkostningsreduktion. Typisk understøttet af ERP-systemer som SAP eller Navision."},{"t":"Business Partnering","b":"Den moderne økonomifunktion er en strategisk samarbejdspartner frem for blot en bogholder. Økonomifunktionens tre roller. Hjælpe ledelsen med beslutninger. Overvåge strategiske og operationelle mål. Sikre overholdelse af regler og standarder. Business Partnering. Økonomi arbejder aktivt sammen med resten af organisationen for at skabe værdi."},{"t":"De fem hovedformål med økonomistyring","b":"Strategi – formulere langsigtede mål og planer. Ressourceallokering – vælge produktmix, kundemix og prissætning. Intern rapportering – levere rapporter til ledelsen. Omkostningskontrol – planlægge og styre aktiviteter. Præstationsmåling – evaluere medarbejdere, afdelinger og processer."},{"t":"Planlægning, kontrol og beslutningstagning","b":"Planlægning består af tre trin. Fastlæg mål. Sammenlign alternativer. Vælg den bedste løsning. Det vigtigste værktøj er budgettet, som er en kvantitativ handlingsplan for fremtiden. Kontrol betyder at sikre, at planen bliver gennemført ved at: Måle resultater. Sammenligne med budget. Give feedback. Foretage korrigerende handlinger. Sammenhæng."},{"t":"Feedback","b":"Feedback bruges til at lære af de opnåede resultater. Processen er. Mål de faktiske resultater. Sammenlign med budgettet. Find årsager til afvigelser. Træf bedre beslutninger fremadrettet. Vigtig pointe. Økonomistyring handler om løbende forbedring – ikke kun registrering af tal."},{"t":"Tre roller i økonomistyringen","b":"1. Opgørelse af resultater. Spørgsmål. Er vi på rette vej? Fokus er at måle præstationer og sammenligne med målsætninger. 2. Fokusområde. Spørgsmål. Hvilke problemer eller muligheder bør undersøges først? Prioriterer de områder med størst økonomisk betydning. 3. Problemløsning. Spørgsmål. Hvilket alternativ er bedst? Anvender analyser til at vælge den mest fordelagtige løsning."},{"t":"Cost–Benefit princippet","b":"“It is better to be roughly right than precisely wrong.”. Et økonomistyringssystem skal skabe mere værdi end det koster. Centrale principper. Information skal være beslutningsrelevant. Menneskelig adfærd er lige så vigtig som teknik. Der findes ikke én rigtig omkostning – forskellige formål kræver forskellige beregninger. Husk sætningen. Different costs for different purposes."},{"t":"Nøgleområder i moderne økonomistyring","b":"Område. Betydning. Kundefokus. Skabe værdi for kunden. Tid. Hurtigere processer. Kvalitet. Reducere fejl og øge værdi. Omkostninger. Effektiv ressourceudnyttelse. Innovation. Udvikle nye produkter og løsninger. Kontinuerlige forbedringer. Løbende optimering. Værdikæde & Supply Chain. Samarbejde på tværs af virksomheder."},{"t":"Fremtidens økonomistyring","b":"Virksomheder bevæger sig mod:. Tværfunktionelle organisationer. Fleksibel produktion. Nichemarkeder. Flere ikke-finansielle målinger. Digitalisering og AI. Hurtigere beslutninger. Business Intelligence (fx Power BI). Automatiseret bogføring. Mere tid til analyse og strategisk arbejde. Konklusion. Økonomifunktionen udvikler sig fra registrering af tal til aktiv værdiskabelse."}]},{"n":2,"name":"L2 Omkostninger","items":[{"t":"Omkostninger","b":"En omkostning er værdien af de ressourcer, en virksomhed forbruger for at opnå et bestemt mål. Det gælder for eksempel materialer, arbejdskraft, husleje, energi, maskiner og administration. Det er vigtigt at skelne mellem udgift og omkostning. En udgift opstår ved anskaffelsen af en ressource, mens en omkostning opstår, når ressourcen faktisk forbruges. En faktisk kostpris er de omkostninger, virksomheden reelt har afholdt. Disse kaldes også historiske omkostninger. Eksamensrelevans. Du skal kunne forklare forskellen mellem. Udgift. Omkostning. Udbetaling."},{"t":"Omkostningsobjekter (Cost Objects)","b":"Et omkostningsobjekt er det, man ønsker at måle omkostningerne på. Spørgsmålet er. \"Hvad ønsker virksomheden at kende omkostningen for?\". Eksempler på omkostningsobjekter. Et produkt. En produktlinje. En kunde. En afdeling. Et marked. Et datterselskab. Eksempel. I en vinduesfabrik kan følgende være omkostningsobjekter: Ét vindue. Træ/alu-vinduer som produktgruppe. Hele fabrikken. Eksamensrelevans. Valget af omkostningsobjekt er afgørende, fordi det påvirker, om en omkostning klassificeres som direkte eller indirekte."},{"t":"Omkostningsakkumulering og omkostningsfordeling","b":"Omkostningsakkumulering er registrering og opsamling af omkostninger i virksomhedens regnskabssystem. Det gælder for eksempel materialeforbrug, løn og husleje. Omkostningsfordeling er fordelingen af de opsamlede omkostninger til et omkostningsobjekt. Der findes to metoder. Sporing af omkostninger direkte til omkostningsobjektet. Fordeling af omkostninger ved hjælp af fordelingsnøgler. Eksamensrelevans. Du skal kunne forklare forskellen mellem. At registrere omkostninger. At tildele omkostninger til et omkostningsobjekt."},{"t":"Direkte og indirekte omkostninger","b":"Denne klassifikation fokuserer på sammenhængen mellem omkostningen og omkostningsobjektet. Direkte omkostninger kan spores direkte til et bestemt omkostningsobjekt. Det gælder for eksempel træ i et vindue, glas i et vindue og materialer til et bestemt produkt. Hvis omkostningen kan måles direkte på produktet, betragtes den som direkte. Indirekte omkostninger kan ikke spores direkte til et bestemt omkostningsobjekt på en økonomisk hensigtsmæssig måde. Det gælder for eksempel fabrikschefens løn, husleje, rengøring, fælles energiforbrug og vigtig pointe. Om en omkostning er direkte eller indirekte afhænger af omkostningsobjektet. Eksempel. Fabrikschefens løn er: Direkte i forhold til fabrikken. Indirekte i forhold til det enkelte vindue. Det afhænger af hvad omkostningsobjektet er, for at kunne sige hvad der direkte og indirekte omkostninger. Hvad påvirker klassifikationen?. Omkostningens størrelse. Muligheden for at registrere forbruget. Praktiske forhold i virksomheden. Eksamensrelevans. Du skal kunne. Identificere direkte omkostninger. Identificere indirekte omkostninger. Forklare hvorfor den samme omkostning kan ændre klassifikation."},{"t":"Variable og faste omkostninger","b":"Denne klassifikation handler om omkostningers adfærd ved ændringer i aktivitet. Variable omkostninger ændrer sig i takt med aktivitetsniveauet. Jo større produktion, desto højere samlede variable omkostninger. Eksempel. Et cykelstyr koster 52 € pr. cykel. Ved produktion af 1.000 cykler: 52×1.000=52.000 €. Ved produktion af 3.500 cykler: 52×3.500=182.000 €. Variable omkostninger følger altså produktionen. Faste omkostninger ændrer sig ikke, selvom aktivitetsniveauet ændrer sig. Eksempel. Leasing af fabrik: 94.500 €. Denne omkostning er den samme, uanset om virksomheden producerer 1.000 eller 3.500 cykler. Derfor kaldes faste omkostninger ofte kapacitetsomkostninger. Eksamensrelevans. Du skal kunne forklare. Hvorfor variable omkostninger følger aktivitetsniveauet. Hvorfor faste omkostninger er uafhængige af aktivitetsniveauet."},{"t":"Sammenhæng mellem direkte/indirekte og variable/faste omkostninger","b":"Det er to forskellige klassifikationer. Mange studerende forveksler dem. Direkte omkostninger er ofte variable, men ikke altid. Eksempel. En fastansat produktionsmedarbejder hos Toyota kan være en direkte omkostning, men samtidig fast. Indirekte omkostninger er ofte faste, men ikke altid. Eksempel. Overtidsbetaling kan være indirekte og samtidig variabel. Eksamensrelevans. Du skal kunne forklare, hvorfor de to klassifikationer ikke er det samme."},{"t":"Cost Drivers (Omkostningsdrivere)","b":"En cost driver er den faktor, som påvirker størrelsen af en omkostning. En cost driver forklarer altså, hvorfor en omkostning opstår eller ændrer sig. Eksempel. For cykelstyr er cost driveren. Antal producerede cykler. Jo flere cykler virksomheden producerer, jo flere styr skal den købe. Det gælder for eksempel materialeforbrug → antal producerede enheder, fragtomkostninger → antal leverancer, elforbrug → maskintimer og kundeservice → antal kunder. Eksamensrelevans. Cost drivers bliver meget centrale senere i ABC-kalkulation og omkostningsstyring."},{"t":"Relevant interval (Relevant Range)","b":"Faste omkostninger er kun faste inden for et bestemt aktivitetsinterval. Dette kaldes det relevante interval. Eksempel. Antag at fabrikslejen på 94.500 € gælder mellem: 1.000 og 5.000 cykler. Hvis virksomheden ønsker at producere mere end 5.000 cykler, skal den muligvis: Leje flere lokaler. Købe flere maskiner. Ansætte flere medarbejdere. Så stiger de faste omkostninger. Eksamensrelevans. Vigtig formulering. Faste omkostninger er kun faste inden for det relevante interval."},{"t":"Enhedsomkostninger","b":"Enhedsomkostningen er den gennemsnitlige omkostning pr. produceret enhed. Den beregnes som. Samlede omkostninger divideret med antal producerede enheder. Eksempel ved 1.000 cykler. Variable omkostninger. 52.000 €. Faste omkostninger. 94.500 €. Samlede omkostninger. 146.500 €. Enhedsomkostning. 146.500 divideret med 1.000=146,50 €. Eksempel ved 600 cykler. Variable omkostninger. 31.200 €. Faste omkostninger. 94.500 €. Samlede omkostninger. 125.700 €. Enhedsomkostning. 125.700 divideret med 600=209,50 €. Eksempel ved 3.500 cykler. Variable omkostninger. 182.000 €. Faste omkostninger. 94.500 €. Samlede omkostninger. 276.500 €. Enhedsomkostning. 276.500 divideret med 3.500=79,00 €."},{"t":"Hvorfor skal enhedsomkostninger bruges med forsigtighed?","b":"Enhedsomkostningen ændrer sig, når produktionsvolumen ændrer sig. Årsagen er de faste omkostninger. Fast omkostning pr. cykel. Ved 600 cykler: 94.500 divideret med 600=157,50 €. Ved 1.000 cykler: 94.500 divideret med 1.000=94,50 €. Ved 3.500 cykler: 94.500 divideret med 3.500=27,00 €. Jo flere enheder der produceres, jo flere enheder spredes de faste omkostninger ud på. Hovedpointe. Ledere bør fokusere på. Samlede omkostninger. Variable omkostninger. Dækningsbidrag. fremfor ukritisk at anvende enhedsomkostninger. Eksamensrelevans. Dette er en af de vigtigste pointer i hele kapitel 2."},{"t":"Dækningsbidrag","b":"Dækningsbidraget viser, hvor meget der er tilbage til at dække de faste omkostninger efter betaling af de variable omkostninger. Eksempel. Omsætning. 500.000 €. Variable omkostninger. 182.000 €. Dækningsbidrag. 500.000-182.000=318.000 €. Kapacitetsomkostninger. 94.500 €. Resultat. 318.000-94.500=223.500 €. Eksamensrelevans. Dækningsbidrag bliver centralt i senere kapitler om prisfastsættelse og beslutningsstøtte."},{"t":"Udgift, omkostning og udbetaling","b":"Disse tre begreber må ikke forveksles. Udgift. Opstår når virksomheden anskaffer en ressource. Det gælder for eksempel køb af en maskine, udbetaling, opstår når virksomheden betaler, omkostning, opstår når ressourcen forbruges og eksempel. Maskinen købes i 2026: Købet skaber en udgift. Betalingen skaber en udbetaling. Brug af maskinen skaber omkostninger via afskrivninger. Eksamensrelevans. Meget klassisk teorispørgsmål."},{"t":"Kapitaliserede omkostninger","b":"Kapitaliserede omkostninger placeres på lageret og bliver derfor ikke straks en omkostning i resultatopgørelsen. Omfatter. Direkte materialer. Direkte løn. Indirekte fremstillingsomkostninger. Forløb. Produktion → Lager → Salg → Resultatopgørelse. Først når varen sælges, bliver omkostningen registreret som Cost of Goods Sold. Eksamensrelevans. Du skal kunne forklare forskellen mellem lagerføring og omkostningsføring."},{"t":"Periodeomkostninger","b":"Periodeomkostninger kapitaliseres ikke. De registreres direkte i resultatopgørelsen. Det gælder for eksempel marketing, administration, hR, ledelseslønninger og salgsomkostninger. I mange virksomheder kaldes disse SG&A-omkostninger (Selling, General and Administrative Expenses)."},{"t":"De tre lagertyper","b":"Produktionsvirksomheder arbejder typisk med tre lagre. Råvarelager. Materialer der endnu ikke er brugt i produktionen. Det gælder for eksempel træ, metal, glas, work in Progress (WIP) og varer under fremstilling. Produktionen er startet, men varen er endnu ikke færdig. Færdigvarelager. Varer der er færdigproducerede men endnu ikke solgt. Eksamensrelevans. Du skal kunne forklare, hvordan varer bevæger sig gennem de tre lagre."},{"t":"Lagerflow","b":"Lagerflowet i en produktionsvirksomhed. Råvarelager. Work in Progress (WIP). Færdigvarelager. Cost of Goods Sold (COGS). Dette flow er et af de vigtigste begreber i kapitlet."},{"t":"Materialeforbrug","b":"Anvendes til at beregne hvor mange materialer der faktisk er brugt. Beregning. Primo råvarelager+Indkøb-Ultimo råvarelager. Eksempel. 50.000+180.000-30.000=200.000 €."},{"t":"Produktionsomkostninger","b":"Produktionsomkostninger består af. Direkte materialer. Direkte løn. Indirekte fremstillingsomkostninger. Eksempel. 200.000+105.500+194.500=500.000 €."},{"t":"Cost of Goods Manufactured (COGM)","b":"Viser værdien af de varer, der færdigproduceres i perioden. Beregning. Primo WIP + Produktionsomkostninger − Ultimo WIP. Eksempel. 30.000+500.000-35.000=495.000 €. Eksamensrelevans. Du skal kunne beregne COGM uden hjælpemidler."},{"t":"Cost of Goods Sold (COGS)","b":"Viser omkostningen ved de varer, der faktisk er blevet solgt. Beregning. Primo færdigvarelager+COGM-Ultimo færdigvarelager. Eksempel. 10.000+495.000-15.000=490.000 €. Eksamensrelevans. COGS indgår direkte i resultatopgørelsen og er derfor meget vigtigt."},{"t":"Hovedpointer fra lektionen","b":"Et omkostningsobjekt er det, man ønsker at måle omkostninger på. Direkte og indirekte omkostninger afhænger af omkostningsobjektet. Variable omkostninger følger aktivitetsniveauet. Faste omkostninger er kun faste inden for det relevante interval. Cost drivers forklarer, hvorfor omkostninger opstår. Enhedsomkostninger kan være misvisende ved ændringer i volumen. Kapitaliserede omkostninger placeres først på lageret. Varer bevæger sig gennem råvarelager, WIP, færdigvarelager og til sidst COGS. Du skal kunne beregne materialeforbrug, produktionsomkostninger, COGM og COGS. Cost of goods made:Direkte materialer. 8000Direkte løn Omk: 3000Indirekte man. Cost. 7000. Ultimo færdigvarelager:COGM 18000Finished goods primo: 4000A = 22.000 - BCost of goods sold:Omsætning: 32.000Gross margin: 11.300COGS: 20.700C - Gross marginRevenue - COGS = 11.800D - Indirect manufacturing costCOGM: 21.300COGM = 12000 + 5000 + IMC + 800 - 3000COGM = 14800 + IMCIMC / D = 6500."}]},{"n":3,"name":"L3 Job-costing","items":[{"t":"Job-costing","b":"Job-costing er en metode til at beregne omkostningerne ved et specifikt job, projekt, kundeopgave eller produkt. Hvert job behandles som et selvstændigt omkostningsobjekt, så virksomheden kan se præcis, hvad det koster at udføre opgaven. Metoden anvendes særligt i virksomheder, hvor opgaver ikke er ens fra gang til gang. Det gælder for eksempel entreprenørvirksomheder, konsulentvirksomheder, advokatkontorer, revisionsvirksomheder og specialproduktion. Formålet er at kunne. Beregne den faktiske omkostning ved et job. Fastsætte korrekte salgspriser. Måle lønsomhed på ordrer og kunder. Understøtte planlægning og kontrol."},{"t":"Centrale begreber","b":"Omkostningsobjekt. Et omkostningsobjekt er det, man ønsker at måle omkostninger på. Eksempler. Et produkt. En ordre. Et projekt. En kunde. En afdeling. Alle omkostninger registreres eller fordeles med henblik på at beregne omkostningen ved dette objekt. Direkte omkostninger kan uden væsentlige problemer henføres direkte til et bestemt omkostningsobjekt. Typiske eksempler. Direkte materialer. Direkte arbejdsløn. I en bilreparation vil reservedele og mekanikerens arbejds
