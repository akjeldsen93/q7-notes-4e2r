": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Formål med at fordele fællesomkostninger", "back": "Lagerværdi og COGS, omkostningsgodtgørelse ved kontrakter, forsikringsafregninger, prisregulering, juridiske/skattemæssige opgørelser – ikke til interne økonomiske beslutninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Hvorfor fordeles fællesomkostninger?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb"]}, {"id": "ØS-term-L6-007", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Salgsværdi ved opsplitningspunktet", "back": "Andel = (mængde × salgspris ved split-off) / samlet salgsværdi; allokeret = fællesomk. × andel. Kræver markedspris ved split-off.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Salgsværdi ved opsplitningspunktet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode"]}, {"id": "ØS-term-L6-008", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Fysisk målemetode", "back": "Fordeler efter fysisk mængde (vægt, volumen, antal). Enkel, men ignorerer at produkterne har meget forskellig værdi.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fysisk målemetode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode"]}, {"id": "ØS-term-L6-009", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Estimeret NRV-metode", "back": "NRV = endelig salgsværdi − separate omkostninger efter split-off. Fællesomk. fordeles efter relativ NRV. Bruges når produkter videreforarbejdes og ikke har pris ved split-off.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Estimeret nettorealisationsværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode"]}, {"id": "ØS-term-L6-010", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Konstant bruttomarginprocent-NRV", "back": "Fællesomk. fordeles så alle produkter får samme bruttomarginprocent: samlet bruttomargin % → bruttomargin pr. produkt → træk separate omk. fra → resten er fællesomk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Konstant bruttomarginprocent-NRV", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode"]}, {"id": "ØS-term-L7-001", "course": "ØS", "lecture": 7, "type": "card", "kind": "model", "front": "Bidragsmetoden (variable costing)", "back": "Kun variable produktionsomk. (DM + DL + variable IPO) indgår i lagerværdien; faste produktionsomk. er periodeomk. Resultatopgørelse: omsætning − variable omk. = DB − faste omk. = driftsresultat. God til intern beslutningsstøtte og CVP.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Bidragsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "model"]}, {"id": "ØS-term-L7-002", "course": "ØS", "lecture": 7, "type": "card", "kind": "model", "front": "Regnskabsmetoden (absorption/full costing)", "back": "Både variable og allokerede faste produktionsomk. indgår i lagerværdien. Resultatopgørelse: omsætning − vareforbrug ± produktionsvolumenafvigelse = bruttoresultat − salgs-/adm.omk. = driftsresultat. Krævet eksternt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Regnskabsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "model"]}, {"id": "ØS-term-L7-003", "course": "ØS", "lecture": 7, "type": "card", "kind": "begreb", "front": "Dækningsbidrag vs. bruttoresultat", "back": "DB = omsætning − alle variable omk. (adfærdsopdelt). Bruttoresultat = omsætning − vareforbrug inkl. allokerede faste produktionsomk. (funktionsopdelt).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Resultatopgørelsens opbygning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "begreb"]}, {"id": "ØS-term-L7-004", "course": "ØS", "lecture": 7, "type": "card", "kind": "metode", "front": "Fast produktionsomkostningssats", "back": "Budgetterede faste produktionsomk. / normalproduktion (Fredonia: 54.000/12.000 = 4,50 kr.). Kostpris regnskabsmetoden = VC + sats (49 + 4,50 = 53,50).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Fredonia Fixtures", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "metode"]}, {"id": "ØS-term-L7-005", "course": "ØS", "lecture": 7, "type": "card", "kind": "metode", "front": "Produktionsvolumenafvigelse (regnskabsmetoden)", "back": "(Normalproduktion − faktisk produktion) × fast sats. Fredonia år 1: (12.000 − 10.000) × 4,50 = 9.000 U, fratrækkes bruttoresultatet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Regnskabsmetoden i år 1", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "metode"]}, {"id": "ØS-term-L7-006", "course": "ØS", "lecture": 7, "type": "card", "kind": "metode", "front": "Resultatforskel mellem metoderne", "back": "Resultat (regnskab) − resultat (bidrag) = lagerændring i enheder × fast sats. Lageropbygning → regnskabsmetoden højest; lagernedbringelse → bidragsmetoden højest. Metoderne ændrer kun timing, ikke pengestrømme.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › År 1 og år 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "metode"]}, {"id": "ØS-term-L7-007", "course": "ØS", "lecture": 7, "type": "card", "kind": "begreb", "front": "Lageropbygning (incitament)", "back": "Under regnskabsmetoden kan ledere øge resultatet ved at producere mere end der sælges, fordi faste omk. parkeres i lageret. Bidragsmetoden fjerner dette incitament.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Lageropbygning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "begreb"]}, {"id": "ØS-term-L8-001", "course": "ØS", "lecture": 8, "type": "card", "kind": "model", "front": "CVP-analyse", "back": "Cost-Volume-Profit: sammenhængen mellem salgsvolumen, indtægter, omk. og resultat. Svarer på: hvor meget skal sælges for at gå i nul / nå mål-profit, og hvordan påvirker pris, VC og FC resultatet? Kortsigtet planlægningsværktøj.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Formålet med CVP-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "model"]}, {"id": "ØS-term-L8-002", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Dækningsbidrag og dækningsgrad", "back": "DB pr. enhed = pris − VC pr. enhed (70 − 42 = 28). DG = DB / omsætning (40 %). DB dækker først faste omk., derefter overskud.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dækningsbidrag", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L8-003", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Break-even-punkt", "back": "BE (enheder) = faste omk. / DB pr. enhed (84.000/28 = 3.000 kjoler). BE (kr.) = faste omk. / DG (210.000).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Break-even", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L8-004", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Mål-resultat (target operating income)", "back": "Enheder = (faste omk. + ønsket driftsresultat) / DB pr. enhed. Eks. (84.000 + 14.000)/28 = 3.500. Efter skat: ønsket resultat før skat = ønsket resultat efter skat / (1 − skattesats).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Target operating income", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L8-005", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Sikkerhedsmargin og sikkerhedsgrad", "back": "Sikkerhedsmargin = forventet salg − BE-salg (enheder eller kr.). Sikkerhedsgrad = sikkerhedsmargin / forventet omsætning (Mary: 200 kjoler = 14.000 £ = 6,25 %). Lille margin = høj driftsrisiko.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Sikkerhedsmargin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L8-006", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Driftsmæssig gearing (operating leverage)", "back": "Grad = samlet DB / driftsresultat (98.000/14.000 = 7,0 ⇒ 1 % salgsændring ≈ 7 % resultatændring). Høje faste og lave variable omk. = høj gearing og høj risiko.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Driftsmæssig gearing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L8-007", "course": "ØS", "lecture": 8, "type": "card", "kind": "model", "front": "CVP-antagelser", "back": "Omk. kan opdeles i variable/faste, lineær omsætning og omk., konstant pris og enhedsomk., konstant produktmix, ingen tidsværdi af penge, kun volumen ændrer sig, produktion = salg – alt inden for det relevante interval.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › CVP-modellens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "model"]}, {"id": "ØS-term-L8-008", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Følsomhedsanalyse", "back": "Hvordan ændres resultatet når volumen, pris, VC eller FC ændres? Basisscenarie vs. optimistisk/forventet/pessimistisk; fokus på ændringer – poster der er ens i alle alternativer påvirker ikke valget.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Følsomhedsanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L8-009", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "CVP med flere produkter", "back": "Brug vægtet gennemsnitligt DB efter salgsmix (eller DB pr. 'pakke'); BE gælder kun ved konstant mix – ændres mixet, ændres BE.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › CVP-modellens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode"]}, {"id": "ØS-term-L9-001", "course": "ØS", "lecture": 9, "type": "card", "kind": "begreb", "front": "Overcosting og undercosting", "back": "Over: objektet belastes med flere omk. end det forbruger (ser dyrere ud). Under: færre (ser mere rentabelt ud). Giver krydssubsidiering – for høje priser på standardprodukter, for lave på specialprodukter.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Overcosting og undercosting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "begreb"]}, {"id": "ØS-term-L9-002", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Traditionel omkostningsfordeling", "back": "Én eller få store puljer fordelt med volumenbaserede nøgler (løntimer, maskintimer). Misvisende når produkter varierer i volumen og kompleksitet – standardprodukter overcostes, specialprodukter undercostes.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Traditionel omkostningsfordeling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model"]}, {"id": "ØS-term-L9-003", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Activity-Based Costing (ABC)", "back": "Ressourcer → aktiviteter → omkostningsobjekter: produkter forbruger aktiviteter, aktiviteter forbruger ressourcer. Flere homogene aktivitetspuljer med cost drivers der har årsagssammenhæng. Relevant ved store indirekte omk. og forskelligartede produkter/kunder.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC-systemets grundidé", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model"]}, {"id": "ØS-term-L9-004", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Tre retningslinjer for forbedret omkostningssystem", "back": "1) Spor så mange direkte omk. som økonomisk forsvarligt, 2) flere og mere homogene indirekte puljer, 3) hver pulje en fordelingsnøgle med rimelig årsagssammenhæng.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Tre retningslinjer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model"]}, {"id": "ØS-term-L9-005", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Omkostningshierarki", "back": "Enhedsniveau (pr. enhed: materialer, maskintid), batchniveau (pr. serie: omstilling, batchkontrol), produkt-/serviceniveau (design, specifikationer), kunde-/kanalniveau (kundebesøg, særlige leveringer), facilitets-/virksomhedsniveau (fabriksledelse, forsikring – svære at fordele).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Omkostningshierarkier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model"]}, {"id": "ØS-term-L9-006", "course": "ØS", "lecture": 9, "type": "card", "kind": "metode", "front": "De syv trin i ABC", "back": "Definér omkostningsobjekter → identificér direkte omk. → vælg aktiviteter og cost drivers → beregn aktivitetspuljernes omk. → beregn cost driver rate (pulje / samlet driver) → fordel til objekter (rate × forbrug) → summér direkte og fordelte omk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › De syv trin i ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "metode"]}, {"id": "ØS-term-L9-007", "course": "ØS", "lecture": 9, "type": "card", "kind": "metode", "front": "Cost driver rate", "back": "Aktivitetspuljens omk. / samlet mængde af cost driveren (fx omstillingsomk. / antal omstillinger). Objektets andel = rate × objektets forbrug af driveren.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Omkostningssats", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "metode"]}, {"id": "ØS-term-L9-008", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Activity-Based Management (ABM)", "back": "Bruger ABC-information aktivt: ABC beregner hvad aktiviteter koster, ABM spørger hvorfor. Ændre priser, produktdesign, sortiment, batchstørrelser, kundebetingelser; automatisere og reducere omstillinger. Høj produktomk. ≠ nedlæg automatisk (nogle omk. forsvinder ikke).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Activity-Based Management", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model"]}, {"id": "ØS-term-L10-001", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Budget vs. budgettering", "back": "Budget: omfattende økonomisk overblik over planlagte aktiviteter (den økonomiske konsekvensprognose). Budgettering: periodisk valg af handlingsprogram ledsaget af økonomisk konsekvensprognose (processen) – Andersen & Rohde.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budget og budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb"]}, {"id": "ØS-term-L10-002", "course": "ØS", "lecture": 10, "type": "card", "kind": "model", "front": "Budgetteringscyklussen", "back": "Planlægning: mål → strategi og planer → masterbudget. Styring: realisér → mål og evaluér mod budget → reevaluér mål og planer.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budgetteringscyklussen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "model"]}, {"id": "ØS-term-L10-003", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Fordele ved budgetter", "back": "Planlægning (nødvendiggør planer og implementering), præstationskriterier (benchmark) og koordination/kommunikation. Mellemhøj sværhedsgrad giver højest faktisk præstation.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Fordele ved budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb"]}, {"id": "ØS-term-L10-004", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Udfordringer ved budgettering", "back": "Ressourcekrævende, rigidt, datamanipulation, stridigheder mellem afdelinger, pres og stress, gaming, kortsigtet, suboptimering (Welch: forandring udefra hurtigere end indefra).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Udfordringer ved budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb"]}, {"id": "ØS-term-L10-005", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Budgettyper og horisonter", "back": "Strategisk plan (længst) → langsigtet plan (5–10 år, koordineret med investeringsbudget) → investeringsbudget (faciliteter, maskiner, nye produkter) → masterbudget (forbinder kort og lang sigt).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Budgettyper og tidshorisonter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb"]}, {"id": "ØS-term-L10-006", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Rullende budget", "back": "Der tilføjes en ny periode, når en er overstået – altid samme horisont (fx 12 mdr.); kontinuerlig proces; svar på rigiditetskritikken, men mere ressourcekrævende.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Rullende budgetter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb"]}, {"id": "ØS-term-L10-007", "course": "ØS", "lecture": 10, "type": "card", "kind": "model", "front": "Masterbudget", "back": "Driftsbudget (operationelt: salg, produktion, materialer, løn, IPO, slutlager, vareforbrug, øvrige omk. → budgetteret resultatopgørelse) + finansielle budgetter (investering, likviditet, budgetteret balance).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Masterbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "model"]}, {"id": "ØS-term-L10-008", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Salgsbudget", "back": "Budgetteret omsætning = forventet salg i enheder × pris. Udgangspunktet for alle øvrige budgetter – fejl forplanter sig.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Trin 1: Salgsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode"]}, {"id": "ØS-term-L10-009", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Produktionsbudget", "back": "Produktion = budgetteret salg + ønsket lager ultimo − lager primo. Wessex: 5.000 + 1.100 − 100 = 6.000 Regular.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Trin 2: Produktionsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode"]}, {"id": "ØS-term-L10-010", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Materialeforbrugs- og indkøbsbudget", "back": "Forbrug = produktion × materialer pr. enhed. Indkøb = forbrug + ønsket materialelager ultimo − primo; × pris.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Driftsbudgettet trin for trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode"]}, {"id": "ØS-term-L10-011", "course": "ØS", "lecture": 10, "type": "card", "kind": "begreb", "front": "Padding / budgetary slack", "back": "Bevidst for lave indtægts- eller for høje omkostningsestimater, så budgettet bliver lettere at nå – svækker budgettet som planlægnings- og præstationsværktøj.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Padding og budgetary slack", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "begreb"]}, {"id": "ØS-term-L10-012", "course": "ØS", "lecture": 10, "type": "card", "kind": "metode", "front": "Følsomhedsanalyse i budgettering", "back": "Computerbaserede planlægningsmodeller beregner hvordan budgettet ændres, når forudsætninger (pris, volumen, omk.) ændres – 'hvad nu hvis'.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 10 › Computerbaserede planlægningsmodeller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L10 Budgettering", "tags": ["ØS", "ØS-L10", "metode"]}, {"id": "ØS-term-L11-001", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Kaizen-budgettering", "back": "Indarbejder løbende forbedringer i de budgetterede tal gennem perioden (3,00 → 2,95 → 2,90 → 2,85 timer pr. enhed pr. kvartal).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Kaizen-budgettering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode"]}, {"id": "ØS-term-L11-002", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Activity-Based Budgeting (ABB)", "back": "Stage 1 (ikke-finansielt): efterspørgsel efter objekter → aktiviteter → ressourcebehov (200 kunder × 1 besøg / 100 besøg pr. sælger = 2 sælgere). Stage 2 (finansielt): kroner på ressourcerne → omk. pr. aktivitet (400.000/200 = 2.000 kr. pr. besøg).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Activity-Based Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode"]}, {"id": "ØS-term-L11-003", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Ansvarscenter", "back": "Organisationsenhed hvor lederen holdes ansvarlig for aktiviteten – 'en lille virksomhed i virksomheden'. Mål skal være specifikke, målbare og målkongruente.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb"]}, {"id": "ØS-term-L11-004", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Standard omkostningscenter", "back": "Output kan måles og inputkrav specificeres pr. enhed (produktion). Ansvar: effektivitet i at opfylde efterspørgsel og produktionsplan med kvalitet og rettidighed – ikke omsætning eller profit.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Standard omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model"]}, {"id": "ØS-term-L11-005", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Discretionary omkostningscenter", "back": "Output kan ikke måles finansielt/svag input-output-sammenhæng (R&D, HR, support). Ansvar: inputniveauet; evalueres via benchmarking eller relativt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Discretionary omkostningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model"]}, {"id": "ØS-term-L11-006", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Omsætningscenter", "back": "Salgsafdelinger med ansvar for omsætning (hvis de sætter priser) eller mængde og mix. Risiko: 'volumensyge' uden hensyn til produktionsomk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Omsætningscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model"]}, {"id": "ØS-term-L11-007", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Profitcenter", "back": "Ansvar for omsætning og omkostninger (indkøb, produktion, salg), ikke investering og finansiering – fx en SBU, butik eller hotel.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Profitcenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model"]}, {"id": "ØS-term-L11-008", "course": "ØS", "lecture": 11, "type": "card", "kind": "model", "front": "Investeringscenter", "back": "Profitansvar + investeringsansvar (aktiver), oftest ikke finansiering. Måles på afkastningsgrad (ROI) eller EVA.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Investeringscenter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "model"]}, {"id": "ØS-term-L11-009", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Kontrollabilitetsprincippet", "back": "Lederen holdes kun ansvarlig for omk. og forhold, vedkommende kan påvirke i perioden; ikke-kontrollerbare omk. ekskluderes. Hvem har bedst viden til at styre omkostningen?", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Kontrollabilitetsprincippet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb"]}, {"id": "ØS-term-L11-010", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Fordele og ulemper ved ansvarscentre", "back": "+ lokal information, hurtigere respons, frigør topledelsen, mindre kompleksitet, træning af ledere, motivation. − suboptimering, lokale mål frem for globale, intern konkurrence, dobbeltfunktioner, svært at finde målkongruente mål.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Fordele og ulemper ved ansvarscentre", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb"]}, {"id": "ØS-term-L11-011", "course": "ØS", "lecture": 11, "type": "card", "kind": "metode", "front": "Likviditetsbudget", "back": "Forventede pengestrømme ind og ud af kassen pr. måned (underskud/overskud). Indbetalinger efter betalingsmønster (Maui: 50 % samme måned, 27 % næste, 20 % 2. måned, 3 % tab).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "metode"]}, {"id": "ØS-term-L11-012", "course": "ØS", "lecture": 11, "type": "card", "kind": "begreb", "front": "Profit vs. likviditet", "back": "Betalingsbetingelser (faktura og betaling i forskellige måneder), afdrag på gæld (kun likviditet), afskrivninger (kun resultat). Man kan have profit og alligevel gå konkurs.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 11 › Likviditetsbudget", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L11 Kaizen, ABB, ansvarscentre, likviditet", "tags": ["ØS", "ØS-L11", "begreb"]}, {"id": "ØS-term-L12-001", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Budgetopfølgning og varianser", "back": "Sammenligning af faktisk og planlagt; den overordnede afvigelse dekomponeres for at finde årsagen. F (fordelagtig) forbedrer, U (ufordelagtig) forværrer driftsresultatet ift. budget.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Budgetopfølgning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb"]}, {"id": "ØS-term-L12-002", "course": "ØS", "lecture": 12, "type": "card", "kind": "model", "front": "Tre variansniveauer", "back": "Niveau 1: faktisk vs. statisk budget. Niveau 2: fleksibelt budget-varians + salgsvolumenvarians. Niveau 3: pris- og forbrugsvarians (DM, DL – og IPO i kap. 16).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Tre variansniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "model"]}, {"id": "ØS-term-L12-003", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Statisk budget-varians (niveau 1)", "back": "Faktisk resultat − statisk budget (jakker: 25.000 − 262.000 = 237.000 U). Viser kun at der er en afvigelse.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 1", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode"]}, {"id": "ØS-term-L12-004", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Fleksibelt budget", "back": "Budgettet genberegnet ved faktisk output: budgetpris × faktisk antal, budgetteret VC × faktisk antal, budgetterede FC (10.000 × 180 = 1,8 mio.; 10.000 × 99 = 990.000).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode"]}, {"id": "ØS-term-L12-005", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Fleksibelt budget-varians", "back": "Faktisk − fleksibelt budget; viser pris- og effektivitetseffekter ved faktisk output (jakker: 75.000 U).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode"]}, {"id": "ØS-term-L12-006", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Salgsvolumenvarians (planning varians)", "back": "Fleksibelt budget − statisk budget; effekten af at sælge et andet antal end budgetteret (162.000 U). Kontrol: 75.000 U + 162.000 U = 237.000 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode"]}, {"id": "ØS-term-L12-007", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Prisvarians", "back": "(AP − SP) × AQ: faktisk inputpris − budgetteret pris, gange faktisk inputmængde. Stof: (31 − 30) × 22.200 = 22.200 U. Ved lagerændring beregnes den på indkøbt mængde.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode"]}, {"id": "ØS-term-L12-008", "course": "ØS", "lecture": 12, "type": "card", "kind": "metode", "front": "Forbrugsvarians (efficiens)", "back": "(AQ − SQ) × SP: faktisk mængde − tilladt mængde for faktisk output (SQ = output × standard), gange budgetpris. Stof: (22.200 − 20.000) × 30 = 66.000 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "metode"]}, {"id": "ØS-term-L12-009", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Fortolkning af varianser", "back": "Årsager hænger sammen: billige materialer (F prisvarians) kan give U mængde- og timevarianser. Ufordelagtig løneffektivitet: dårlig træning, materialer, udstyr eller supervision. Placér ansvar hvor det kan påvirkes.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Fortolkning og ansvar", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb"]}, {"id": "ØS-term-L12-010", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Effektivitet vs. efficiens", "back": "Effektivitet: i hvilken grad mål er opnået. Efficiens: input brugt for et givent output. Vægtes kun ét mål, optimeres det på bekostning af andre.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Fokus på mere end prisvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb"]}, {"id": "ØS-term-L12-011", "course": "ØS", "lecture": 12, "type": "card", "kind": "begreb", "front": "Benchmarking og Beyond Budgeting", "back": "Benchmarking: sammenligning med interne enheder, branchen og konkurrenter. Beyond Budgeting (Hope & Fraser): relative mål og belønning, kontinuert planlægning, on-demand ressourcer, decentralisering.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 12 › Benchmarking og Beyond Budgeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L12 Variansanalyse", "tags": ["ØS", "ØS-L12", "begreb"]}, {"id": "ØS-term-L13-001", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Variable og faste IPO", "back": "Variable indirekte produktionsomk. varierer med mængden (el, vand, maskinvedligehold, indirekte materialer). Faste varierer ikke (leasing, fabrikschefens løn, afskrivninger).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variable og faste IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb"]}, {"id": "ØS-term-L13-002", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Budgetteret IPO-sats", "back": "Tre trin: vælg periode → vælg fordelingsnøgle (aktiviteten omk. varierer med, fx maskintimer) → beregn rate pr. aktivitetsenhed. Eks. 0,4 MT × €30 = €12 pr. jakke; fast: €276.000/4.800 MT = €57,50.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Budgetteret variabel IPO-sats", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"id": "ØS-term-L13-003", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: fleksibelt budget-varians", "back": "Faktisk variabel IPO − (faktisk output × budgetteret MT pr. enhed × sats): 130.500 − 120.000 = €10.500 U. Salgsvolumenvarians: 120.000 − 144.000 = €24.000 F.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"id": "ØS-term-L13-004", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: efficiensvarians", "back": "(Faktiske timer − budgetterede timer for faktisk output) × budgetsats = (4.500 − 4.000) × 30 = €15.000 U. Måler effektiviteten i brugen af fordelingsnøglen.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"id": "ØS-term-L13-005", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Variabel IPO: prisvarians (spending)", "back": "(Faktisk sats − budgetsats) × faktiske timer = (29 − 30) × 4.500 = €4.500 F.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Variabel IPO – niveau 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"id": "ØS-term-L13-006", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Fast IPO: spending-varians", "back": "Faktisk − budgetteret (fleksibelt = statisk) fast IPO = 285.000 − 276.000 = €9.000 U. Faste omk. har aldrig efficiensvarians.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Fast IPO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"id": "ØS-term-L13-007", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Produktionsvolumenvarians", "back": "Budgetteret fast IPO − allokeret fast IPO (faktisk output × sats pr. enhed) = 276.000 − 10.000 × 23 = €46.000 U. Opstår kun for faste omk., fordi en fast pulje omregnes til en sats ved budgetteret kapacitet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Produktionsvolumenvarians", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"id": "ØS-term-L13-008", "course": "ØS", "lecture": 13, "type": "card", "kind": "model", "front": "4- og 3-varians-analyse", "back": "4-varians: variabel IPO pris + efficiens; fast IPO spending + produktionsvolumen. 3-varians: kombineret pris (spending), efficiens og produktionsvolumen. Total IPO-varians = fleksibelt budget-varians + volumenvarians (19.500 + 46.000 = 65.500 U).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Integreret variansanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "model"]}, {"id": "ØS-term-L13-009", "course": "ØS", "lecture": 13, "type": "card", "kind": "begreb", "front": "Planlægning/kontrol vs. lagerværdiansættelse", "back": "Faste omk. planlægges og kontrolleres som kendte beløb. Allokerede faste omk. til lager er gjort variable for at beregne kostpris og kan ikke bruges til planlægning og kontrol.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Planlægning og kontrol vs. lagerværdiansættelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "begreb"]}, {"id": "ØS-term-L13-010", "course": "ØS", "lecture": 13, "type": "card", "kind": "metode", "front": "Varianser i ABC (setup)", "back": "Fleksibelt budget: faktisk output / budgetteret seriestørrelse = antal setups × budgetterede timer pr. setup × sats (1.008 × 6 × 20 = 120.960). Pris = (21 − 20) × 6.750 = 6.750 U; efficiens = (6.750 − 6.048) × 20 = 14.040 U.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 13 › Varianser i ABC/ABB – setup", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L13 Variansanalyse – IPO", "tags": ["ØS", "ØS-L13", "metode"]}, {"question": "Hvilken proces passer bedst til olieraffinering?", "options": ["Job Shop", "Batch", "Kontinuert produktion", "Fast position"], "answer": 2, "explanation": "Meget høj volumen, meget lav variation, kapitalintensiv og tæt koblede processer.", "id": "OM-mc-064", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L2", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kontinuert produktion", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "En konfigurerbar computer, hvor kundeordren aktiverer montage, er et eksempel på:", "options": ["MTS", "ATO", "MTO", "ETO"], "answer": 1, "explanation": "Assemble-to-Order: kundeordre aktiverer montage.", "id": "OM-mc-065", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L2", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundetilpasningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Samlet arbejdstid 180 s, produktionstid 3.600 s, efterspørgsel 60 enheder. Minimum antal stationer?", "options": ["2", "3", "4", "6"], "answer": 1, "explanation": "Takttid = 3600/60 = 60 s; Wmin = 180/60 = 3.", "id": "OM-mc-066", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L2", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Eksempel på linjeafbalancering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilken er en leading indikator?", "options": ["ROI", "Kundetilfredshed efter levering", "Gennemført vedligeholdelse", "Punktlighed i sidste kvartal"], "answer": 2, "explanation": "Leading indikatorer måler aktiviteter/drivere og peger fremad.", "id": "OM-mc-067", "course": "OM", "lecture": 3, "lectureName": "L3 Præstationsmåling og ledelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L3", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading indikatorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Medarbejderuddannelse hører i BSC til perspektivet:", "options": ["Finansielt", "Kunde", "Interne processer", "Læring og vækst"], "answer": 3, "explanation": "Læring og vækst: medarbejderuddannelse, kompetenceudvikling, innovation.", "id": "OM-mc-068", "course": "OM", "lecture": 3, "lectureName": "L3 Præstationsmåling og ledelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L3", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 3 › De fire perspektiver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Et advokatkontor måler kapacitet i fakturerbare timer. Det er et:", "options": ["Outputmål", "Inputmål", "Teoretisk mål", "Normeret mål"], "answer": 1, "explanation": "Inputmål bruges når output ikke er standardiseret.", "id": "OM-mc-069", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L5", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Inputbaserede kapacitetsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Spot koster 1.800 kr./levering; kontrakt 60.000 kr. + 750 kr./levering. Indifferenspunkt?", "options": ["≈ 33", "≈ 57", "≈ 80", "≈ 333"], "answer": 1, "explanation": "1.800X = 60.000 + 750X ⇒ X = 60.000/1.050 ≈ 57,14. Under ≈57 er spot billigst.", "id": "OM-mc-070", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L5", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Indifferenspunkt (Vestjysk Møbelfragt)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "λ = 4 biler/t, µ = 6 biler/t. Gennemsnitlig tid i systemet TS?", "options": ["10 min", "20 min", "30 min", "60 min"], "answer": 2, "explanation": "TS = 1/(µ−λ) = 1/2 time = 30 min (Djursland Hurtigservice).", "id": "OM-mc-071", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L6", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Eksempel: Djursland Hurtigservice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvad sker der med ventetiden, når λ nærmer sig µ?", "options": ["Den falder", "Den er uændret", "Den vokser kraftigt", "Den bliver negativ"], "answer": 2, "explanation": "(µ−λ) står i nævneren, så ventetiden eksploderer.", "id": "OM-mc-072", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L6", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilken sammenhæng gælder altid, uanset fordelinger?", "options": ["TW = λ/(µ(µ−λ))", "Littles lov I = R·T", "ρ < 1 ⇒ ingen kø", "CW = λ²/µ"], "answer": 1, "explanation": "Littles lov gælder altid og bruges som tjek på simulationsresultater.", "id": "OM-mc-073", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L6", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Littles lov som tjek", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilken lov siger, at et forecast for produktfamilien er mere præcist end for én variant?", "options": ["Lov 1", "Lov 2", "Lov 3", "Lov 4"], "answer": 2, "explanation": "Lov 3: aggregering – tilfældige udsving udligner hinanden.", "id": "OM-mc-074", "course": "OM", "lecture": 8, "lectureName": "L8 Forecasting", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L8", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Lov 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilket fejlmål giver store fejl ekstra vægt?", "options": ["MFE", "MAD", "RMSE", "MAPE"], "answer": 2, "explanation": "RMSE kvadrerer fejlene.", "id": "OM-mc-075", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L9", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Måling af forecastfejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Et MFE tæt på 0 betyder:", "options": ["Høj præcision", "Ingen systematisk skævhed – men fejl kan udligne hinanden", "At MAPE også er 0", "At modellen er overfittet"], "answer": 1, "explanation": "MFE måler bias; positive og negative fejl kan udligne hinanden.", "id": "OM-mc-076", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L9", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Måling af forecastfejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Heartz-data har sæsonudsving på ca. 110 uafhængigt af niveauet. Hvilken model?", "options": ["SES", "Naiv", "Additiv Holt-Winters", "MA(5)"], "answer": 2, "explanation": "Level + trend + sæson med konstant absolut udsving ⇒ additiv sæson.", "id": "OM-mc-077", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L9", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Heartz-casen: nøgletal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Produktmixet ændrer sig væsentligt, og produkterne har forskellige ressourcekrav. Hvilken S&OP-tilgang?", "options": ["Top-down", "Bottom-up", "Level", "Ingen af dem"], "answer": 1, "explanation": "Bottom-up bør anvendes, når mixet ikke er stabilt.", "id": "OM-mc-078", "course": "OM", "lecture": 10, "lectureName": "L10 Sales and Operations Planning", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L10", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Valg mellem top-down og bottom-up", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilken plan holder lageret på et minimum?", "options": ["Level", "Chase", "Mixed", "Lead"], "answer": 1, "explanation": "Chase følger efterspørgslen gennem ansættelser, overarbejde mv.", "id": "OM-mc-079", "course": "OM", "lecture": 10, "lectureName": "L10 Sales and Operations Planning", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L10", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 10 › Chase", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Bagerimodel: max 30x+50y; x+2y≤40; 2x+y≤50. Optimal løsning?", "options": ["(25,0)", "(0,20)", "(20,10)", "(10,10)"], "answer": 2, "explanation": "Hjørnepunkter: (0,0)=0, (25,0)=750, (20,10)=1.100, (0,20)=1.000.", "id": "OM-mc-080", "course": "OM", "lecture": 11, "lectureName": "L11 Lineær programmering og Solver", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L11", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Bagerieksemplet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Delelighed betyder:", "options": ["Variable må antage brøkværdier", "Bidrag er proportionale", "Forbrug lægges sammen", "Alle bibetingelser binder"], "answer": 0, "explanation": "Ellers skal heltalsvariable bruges.", "id": "OM-mc-081", "course": "OM", "lecture": 11, "lectureName": "L11 Lineær programmering og Solver", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L11", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Antagelser bag LP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilken ligning er arbejdsstyrkebalancen?", "options": ["Iₜ = Iₜ₋₁ + RPₜ + OPₜ − Sₜ", "Wₜ = Wₜ₋₁ + Hₜ − Lₜ", "OPₜ ≤ γ·RPₜ", "RPₜ ≤ Pmax"], "answer": 1, "explanation": "W₀ = Ŵ.", "id": "OM-mc-082", "course": "OM", "lecture": 12, "lectureName": "L12 LP og optimering af S&OP", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L12", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Step 4", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Fysisk lager 300, restordrer 50, åbne ordrer 200. Lagerposition?", "options": ["250", "450", "500", "550"], "answer": 1, "explanation": "Lagerniveau = 300 − 50 = 250; position = 250 + 200 = 450.", "id": "OM-mc-083", "course": "OM", "lecture": 13, "lectureName": "L13 Lagerstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L13", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Måling af lager", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Lager opbygget før en kendt højsæson er:", "options": ["Cykluslager", "Sikkerhedslager", "Sæson-/udjævningslager", "Spekulationslager"], "answer": 2, "explanation": "Anticipation stock.", "id": "OM-mc-084", "course": "OM", "lecture": 13, "lectureName": "L13 Lagerstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L13", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lagertyper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Hvilken SCOR-aktivitet omfatter valg af leverandører og kontrakter?", "options": ["Plan", "Source", "Make", "Return"], "answer": 1, "explanation": "Source: vælge leverandører, forhandle kontrakter, sikre materialer.", "id": "OM-mc-085", "course": "OM", "lecture": 1, "lectureName": "L1 Intro til OM", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L1", "mc"], "source": {"file": "Operations Management.docx", "section": "Lektion 1 › SCOR-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Opgavetider i alt 250 s; efterspørgsel 40 enheder pr. time. Beregn takttid og minimum antal stationer.", "model": "Takttid = 3.600/40 = 90 s. Wmin = 250/90 = 2,78 → rundes op til 3 stationer.", "id": "OM-sa-086", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L2", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Første enhed tager 100 timer; læringsprocent 80 %. Hvor lang tid tager enhed nr. 4?", "model": "Fordobling to gange: 100 · 0,8² = 64 timer. (b = ln0,8/ln2 ≈ −0,322; 100·4^−0,322 ≈ 64.)", "id": "OM-sa-087", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L5", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Læringskurver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Kontrakt: 60.000 + 750X; leasing: 210.000 + 300X. Find indifferenspunktet og fortolk.", "model": "60.000 + 750X = 210.000 + 300X ⇒ 450X = 150.000 ⇒ X ≈ 333. Under ≈333 leveringer er kontrakt billigst, over er leasing billigst.", "id": "OM-sa-088", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L5", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Indifferenspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "λ = 8 kunder/t, µ = 10 kunder/t. Beregn ρ, CS, TS, TW og CW.", "model": "ρ = 0,8; CS = 8/2 = 4; TS = 1/2 t = 30 min; TW = 8/(10·2) = 0,4 t = 24 min; CW = 64/20 = 3,2. Tjek Littles lov: CS = λ·TS = 8·0,5 = 4.", "id": "OM-sa-089", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L6", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Gennemsnitlig efterspørgsel 50 pr. dag, gennemløbstid 4 dage. Gennemsnitligt antal i systemet (Littles lov)?", "model": "I = R·T = 50 · 4 = 200 enheder.", "id": "OM-sa-090", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L6", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Littles lov", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "SES med α = 0,3. Sidste forecast Fₜ₋₁ = 90, sidste efterspørgsel Dₜ₋₁ = 100. Nyt forecast?", "model": "Fₜ = 0,3·100 + 0,7·90 = 30 + 63 = 93.", "id": "OM-sa-091", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L9", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Simpel eksponentiel udjævning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Efterspørgsel de seneste tre uger: 10, 12, 14. Forecast for næste uge med naiv metode og MA(3)?", "model": "Naiv: 14. MA(3): (10+12+14)/3 = 12.", "id": "OM-sa-092", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L9", "calc"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Naiv forecasting og glidende gennemsnit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Formulér bagerimodellen (standard 30 kr., deluxe 50 kr.; forberedelse x+2y ≤ 40; emballage 2x+y ≤ 50) i ord og matematik, og forklar hvordan den sættes op i Excel Solver.", "model": "Variable: x, y = antal standard-/deluxeæsker næste uge. Max z = 30x + 50y. s.t. x+2y ≤ 40 (forberedelsestimer), 2x+y ≤ 50 (emballage), x,y ≥ 0. Solver: objektcelle = SUMPRODUCT(DB; variable), variable celler, bibetingelser venstreside ≤ kapacitet, 'Make unconstrained variables non-negative', Simplex LP. Optimum (20,10), z = 1.100; begge bibetingelser bindende.", "id": "OM-sa-093", "course": "OM", "lecture": 11, "lectureName": "L11 Lineær programmering og Solver", "type": "sa", "kind": "open", "tags": ["OM", "OM-L11", "open"], "source": {"file": "Operations Management.docx", "section": "Lektion 11 › Bagerieksemplet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Opstil S&OP-LP-modellen: variable, objektfunktion og begrænsninger.", "model": "Variable: Hₜ, Lₜ, Wₜ, RPₜ, OPₜ, Iₜ. Min πᴺΣRP + πᴼΣOP + πᴵΣI + πᴴΣH + πᴸΣL. s.t. Wₜ = Wₜ₋₁ + Hₜ − Lₜ; RPₜ = (τᵂ/τᴾ)Wₜ; OPₜ ≤ γRPₜ; Iₜ = Iₜ₋₁ + RPₜ + OPₜ − Sₜ; RPₜ ≤ Pmax; I_T ≥ Î, W_T ≥ Ŵ; alle ≥ 0.", "id": "OM-sa-094", "course": "OM", "lecture": 12, "lectureName": "L12 LP og optimering af S&OP", "type": "sa", "kind": "open", "tags": ["OM", "OM-L12", "open"], "source": {"file": "Operations Management.docx", "section": "Lektion 12 › Del 2: Optimering af S&OP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Konstruér et simpelt Balanced Scorecard med strategy map for en produktionsvirksomhed med fokus på leveringspræcision.", "model": "Læring & vækst: medarbejdertræning (KPI timer/medarbejder) → interne processer: vedligeholdelsesplan, gennemløbstid → kunde: leveringspræcision, klager → finansielt: omsætningsvækst/overskud. For hver: objective, KPI, target, initiative. Pas på gaming/suboptimering; sammenhænge er hypoteser.", "id": "OM-sa-095", "course": "OM", "lecture": 3, "lectureName": "L3 Præstationsmåling og ledelse", "type": "sa", "kind": "open", "tags": ["OM", "OM-L3", "open"], "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Balanced Scorecard / Strategy Map", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "Forklar hvorfor lagerstyring ikke handler om at minimere lageret, og nævn balancerede lager-KPI'er.", "model": "Lager skaber service men binder kapital – målet er balance. KPI'er: service (fillrate, restordreandel), kapital (lageromsætningshastighed, lagerdage), planlægning (forecastnøjagtighed, leverandørpålidelighed), data/spild (lagerpræcision, ukurans).", "id": "OM-sa-096", "course": "OM", "lecture": 13, "lectureName": "L13 Lagerstyring", "type": "sa", "kind": "open", "tags": ["OM", "OM-L13", "open"], "source": {"file": "Operations Management.docx", "section": "Lektion 13 › Lager-KPI'er og strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}}, {"question": "En kunde sammenligner sine forventninger med oplevelsen og bliver utilfreds. Hvilken teori?", "options": ["Service-dominerende logik", "Expectation Confirmation Theory", "ELM", "CLV"], "answer": 1, "explanation": "Oplevelse dårligere end forventet ⇒ utilfredshed.", "id": "MM-mc-060", "course": "MM", "lecture": 2, "lectureName": "L2 Kundeværdi", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L2", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Expectation Confirmation Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "En SBU med høj markedsvækst og lav relativ markedsandel er en:", "options": ["Star", "Cash Cow", "Question Mark", "Dog"], "answer": 2, "explanation": "Stor usikkerhed – kræver beslutning om investering eller frasalg.", "id": "MM-mc-062", "course": "MM", "lecture": 3, "lectureName": "L3 Strategisk planlægning", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L3", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Nye produkter til nye markeder er i Ansoff:", "options": ["Markedspenetrering", "Markedsudvikling", "Produktudvikling", "Diversifikation"], "answer": 3, "explanation": "Højeste risiko.", "id": "MM-mc-063", "course": "MM", "lecture": 3, "lectureName": "L3 Strategisk planlægning", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L3", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › Ansoffs vækstmatrice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvilken PLC-fase er kendetegnet ved aftagende vækst, intens konkurrence og profitpres?", "options": ["Introduktion", "Vækst", "Modning", "Nedgang"], "answer": 2, "explanation": "Mål: maksimere profit og forsvare markedsandel.", "id": "MM-mc-065", "course": "MM", "lecture": 4, "lectureName": "L4 PLC og konkurrence", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L4", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Modningsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Lav involvering og overtalelse via perifere signaler svarer til:", "options": ["Central rute / System 2", "Perifer rute / System 1", "Kompleks købsadfærd", "MAO høj"], "answer": 1, "explanation": "Giver svage holdninger, der let kan udfordres.", "id": "MM-mc-067", "course": "MM", "lecture": 6, "lectureName": "L6 B2C beslutningsprocesser", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L6", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › ELM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Høj involvering men få forskelle mellem brands giver:", "options": ["Kompleks købsadfærd", "Dissonansreducerende købsadfærd", "Variationssøgende", "Vanemæssig"], "answer": 1, "explanation": "Kotler fig. 5.4.", "id": "MM-mc-068", "course": "MM", "lecture": 6, "lectureName": "L6 B2C beslutningsprocesser", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L6", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Betydningen af involvering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvor mange beslutningstagere er i snit involveret i et B2B-køb ifølge slides?", "options": ["2,1", "4,0", "6,8", "12"], "answer": 2, "explanation": "Buying center ≈ 6,8 personer.", "id": "MM-mc-069", "course": "MM", "lecture": 7, "lectureName": "L7 B2B købsadfærd", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L7", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Nøgletal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Bunden af B2B-værdipyramiden er:", "options": ["Inspirerende værdi", "Table stakes", "Ease of doing business", "Individuel værdi"], "answer": 1, "explanation": "Opfylder specifikationer, acceptabel pris, overholder regler.", "id": "MM-mc-070", "course": "MM", "lecture": 7, "lectureName": "L7 B2B købsadfærd", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L7", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B elements of value", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "GDPR og markedsføringsloven hører i PESTEL til:", "options": ["Politiske", "Sociale", "Teknologiske", "Lovgivning"], "answer": 3, "explanation": "Lovgivning: konkurrence-, forbruger-, datalovgivning.", "id": "MM-mc-071", "course": "MM", "lecture": 8, "lectureName": "L8 Markedsanalyse", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L8", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › PESTEL", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Social listening og salgsstyrkens rapporter er kilder til:", "options": ["Interne data", "Marketing intelligence", "Primære data", "Eksperimenter"], "answer": 1, "explanation": "Systematisk overvågning af offentligt tilgængelig information.", "id": "MM-mc-072", "course": "MM", "lecture": 8, "lectureName": "L8 Markedsanalyse", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L8", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing intelligence", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "'Segmentet skal reagere forskelligt på marketing' er kravet:", "options": ["Measurable", "Accessible", "Substantial", "Differentiable"], "answer": 3, "explanation": "Et af de fem krav.", "id": "MM-mc-073", "course": "MM", "lecture": 9, "lectureName": "L9 STP", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L9", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Krav til effektiv segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Bruger-rate er en ____ segmenteringsvariabel.", "options": ["Geografisk", "Demografisk", "Psykografisk", "Adfærdsmæssig"], "answer": 3, "explanation": "Hvor ofte kunden bruger produktet.", "id": "MM-mc-074", "course": "MM", "lecture": 9, "lectureName": "L9 STP", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L9", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Adfærdsmæssig segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "At en forbruger kan nævne Colgate, når man siger 'tandpasta', er:", "options": ["Brand recognition", "Brand recall", "Brand image", "Brand term"], "answer": 1, "explanation": "Genkaldelse med få anvisninger.", "id": "MM-mc-075", "course": "MM", "lecture": 10, "lectureName": "L10 Branding 1", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L10", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand awareness", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Branding har mindst betydning, når produktet har mange:", "options": ["Tillidskvaliteter", "Erfaringskvaliteter", "Søgekvaliteter", "Associationer"], "answer": 2, "explanation": "Kvaliteten er kendt før købet ⇒ lav risiko.", "id": "MM-mc-077", "course": "MM", "lecture": 10, "lectureName": "L10 Branding 1", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L10", "mc"], "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Implikationer af den økonomiske forklaring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvordan skaber jeres case-virksomhed kundeværdi? Brug oplevede fordele/omkostninger og typerne af kundeværdi.", "model": "Definér kundeværdi som fordele vs. omkostninger (pris, tid, risiko, besvær). Gennemgå funktionel, emotionel, ekspressiv og omkostningsværdi med konkrete eksempler fra casen. Kobl til tilfredshed (ECT), loyalitet og CLV. (Jf. Case 1 Apple: kundeværdi.)", "id": "MM-sa-078", "course": "MM", "lecture": 2, "lectureName": "L2 Kundeværdi", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L2", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Diskutér sammenhængen mellem kundetilfredshed og loyalitet. Er tilfredshed nok?", "model": "Tilfredshed øger sandsynligheden for loyalitet, men loyalitet afhænger også af tillid, commitment, relationer, skifteomkostninger, konkurrence og vaner. Skel mellem adfærds- og holdningsbaseret loyalitet. Relationship marketing og CRM som redskaber.", "id": "MM-sa-079", "course": "MM", "lecture": 2, "lectureName": "L2 Kundeværdi", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L2", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 2 › Sammenhæng mellem tilfredshed og loyalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Placér virksomhedens forretningsområder i BCG-matricen og foreslå en vækststrategi med Ansoff.", "model": "Definér SBU'er, placér efter markedsvækst og relativ markedsandel; anbefal build/hold/harvest/divest; Cash Cows finansierer Stars/QM. Vælg Ansoff-felt og diskutér risiko. Nævn BCG's begrænsninger.", "id": "MM-sa-080", "course": "MM", "lecture": 3, "lectureName": "L3 Strategisk planlægning", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L3", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 3 › BCG og Ansoff", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvor i PLC befinder jeres produkt sig, og hvad betyder det for marketingmixet?", "model": "Argumentér for fasen ud fra salg, profit, konkurrence og kundetyper. Beskriv mål og 4P for fasen (fx modning: markeds-/produkt-/mixmodifikation; nedgang: maintain/harvest/repositionering/divest). Nævn PLC's begrænsninger.", "id": "MM-sa-081", "course": "MM", "lecture": 4, "lectureName": "L4 PLC og konkurrence", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L4", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Product Life Cycle", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvilke faktorer påvirker målgruppens købsadfærd? Brug modellen for forbrugeradfærd.", "model": "Stimuli → black box → reaktion. Kulturelle (kultur, subkultur, social klasse), sociale (grupper, familie, roller), personlige (beskæftigelse, økonomi, alder/livsstadie, livsstil) og psykologiske faktorer. Kobl til kunderejsen og berøringspunkter. (Jf. Case 2 IKEA: købsadfærd.)", "id": "MM-sa-082", "course": "MM", "lecture": 5, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L5", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Faktorer der påvirker købsadfærden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Forklar dual processing og ELM, og diskutér hvordan virksomheden bør kommunikere til målgruppen.", "model": "System 1/2; ELM central vs. perifer rute; MAO afgør rute. Høj involvering → argumenter og fakta; lav involvering → perifere signaler, affekt. Kobl til Kotlers fire typer købsadfærd.", "id": "MM-sa-083", "course": "MM", "lecture": 6, "lectureName": "L6 B2C beslutningsprocesser", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L6", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Dual processing og ELM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvordan adskiller B2B-købsadfærd sig fra B2C – og hvor er de ens?", "model": "Buying center (6,8 personer), professionel indkøbsproces (8 faser), købssituationer. Men følelser, tillid og personlige hensyn betyder også i B2B (myter afvises). Værdipyramiden, PoP/PoD, digital, kontinuerlig kunderejse.", "id": "MM-sa-084", "course": "MM", "lecture": 7, "lectureName": "L7 B2B købsadfærd", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L7", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B købsadfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Lav en PESTEL- og mikroanalyse af jeres case-marked og forklar hvordan en markedsanalyse kunne tilrettelægges.", "model": "PESTEL med eksempler + mikroaktører. Proaktiv/reaktiv håndtering. MIS (interne data, intelligence, research). Research-proces i 4 trin, sekundære før primære data, valg af metode (observation, interview, survey, adfærdsdata, eksperiment) og datakvalitet.", "id": "MM-sa-085", "course": "MM", "lecture": 8, "lectureName": "L8 Markedsanalyse", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L8", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketingmiljøet og research-processen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Gennemfør STP for jeres case: segmentér, vælg target og formulér positionering.", "model": "Segmentér med flere kriterier (geo/demo/psyko/adfærd), test mod de fem krav (MASDA), evaluér segmenter (størrelse/vækst, attraktivitet, mål/ressourcer), vælg target, formulér differentiering og value proposition. (Jf. Case 3 Carlsberg non-alcoholic STP.)", "id": "MM-sa-086", "course": "MM", "lecture": 9, "lectureName": "L9 STP", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L9", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › STP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvad er brand equity, og hvordan kan virksomheden styrke den?", "model": "Definition (Kotler). Keller: brand awareness (recall/recognition) og brand image (associationer). Økonomisk forklaring (signal: konsistens, klarhed, troværdighed) og psykologisk (associativt netværk). Fordele for virksomhed og forbruger.", "id": "MM-sa-087", "course": "MM", "lecture": 10, "lectureName": "L10 Branding 1", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L10", "oral"], "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}}, {"question": "Hvilken er typisk en indirekte omkostning i forhold til det enkelte vindue?", "options": ["Træ", "Glas", "Fabrikschefens løn", "Materialer til vinduet"], "answer": 2, "explanation": "Indirekte for vinduet, direkte for fabrikken.", "id": "ØS-mc-060", "course": "ØS", "lecture": 2, "lectureName": "L2 Omkostninger", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L2", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Direkte og indirekte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Overhead 65.100 kr., 2.480 maskintimer i alt. Job 100 bruger 500 MT, DM 45.000, DL 14.000. Jobomkostning?", "options": ["59.000", "65.100", "72.125", "104.800"], "answer": 2, "explanation": "Sats 26,25; OH 13.125; 45.000+14.000+13.125 = 72.125.", "id": "ØS-mc-061", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L3", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Eksempel på job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "WIP ultimo 5.000 enheder, 100 % mat., 20 % fremstilling; 30.000 færdige. Ækv. enheder fremstilling?", "options": ["30.000", "31.000", "35.000", "36.000"], "answer": 1, "explanation": "30.000 + 5.000 × 20 % = 31.000.", "id": "ØS-mc-062", "course": "ØS", "lecture": 4, "lectureName": "L4 Process-costing", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L4", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Snowdon Ltd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Hvilket allokeringskriterium er normalt det stærkeste?", "options": ["Evnen til at bære", "Retfærdighed", "Årsag og virkning", "Modtagne fordele"], "answer": 2, "explanation": "Skaber den mest realistiske sammenhæng mellem forbrug og omk.", "id": "ØS-mc-063", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L5", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Årsag og virkning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Fællesprodukter og biprodukter adskilles primært på:", "options": ["Fysisk mængde", "Relativ salgsværdi", "Produktionstid", "Vægt"], "answer": 1, "explanation": "Klassifikationen kan ændre sig (fx valle).", "id": "ØS-mc-064", "course": "ØS", "lecture": 6, "lectureName": "L6 Fællesproduktion", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L6", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Biprodukt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Fredonia: VC 49 kr., fast sats 4,50 kr. Produktion 10.000, salg 8.000. Forskel i resultat mellem metoderne?", "options": ["4.500", "9.000", "18.000", "0"], "answer": 1, "explanation": "2.000 enheder på lager × 4,50 = 9.000 højere under regnskabsmetoden.", "id": "ØS-mc-065", "course": "ØS", "lecture": 7, "lectureName": "L7 Bidrags- og regnskabsmetoden", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L7", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Fredonia Fixtures", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Når salg > produktion (lagernedbringelse), giver regnskabsmetoden:", "options": ["Højere resultat end bidragsmetoden", "Lavere resultat end bidragsmetoden", "Samme resultat", "Altid underskud"], "answer": 1, "explanation": "Faste omk. aktiveret tidligere udgiftsføres nu via vareforbruget.", "id": "ØS-mc-066", "course": "ØS", "lecture": 7, "lectureName": "L7 Bidrags- og regnskabsmetoden", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L7", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › År 2 – lagernedbringelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Dresses by Mary: pris 70, VC 42, FC 84.000. Break-even i enheder?", "options": ["1.200", "2.000", "3.000", "4.000"], "answer": 2, "explanation": "84.000 / (70 − 42) = 3.000 kjoler.", "id": "ØS-mc-067", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L8", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dresses by Mary", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "Hvis produktmixet ændrer sig i CVP med flere produkter:", "options": ["BE er uændret", "Det gennemsnitlige DB ændres og BE gælder ikke længere", "FC ændres", "Pris ændres"], "answer": 1, "explanation": "Konstant mix er en antagelse.", "id": "ØS-mc-068", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L8", "mc"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › CVP-modellens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}}, {"question": "I ABC fordeles akti
