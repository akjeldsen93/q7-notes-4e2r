s behov. Omkostningsregnskabet leverer information til begge.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Finansielt regnskab vs. økonomistyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb", "grund"], "level": "grund", "order": 383}, {"id": "ØS-term-L1-003", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Omkostningsstyring", "back": "Styring af omkostningerne gennem planlægning, kontrol og løbende omkostningsreduktion – typisk understøttet af ERP-systemer (SAP, Navision). En omkostning er en vurdering af ressourceforbrug, ikke en objektiv størrelse.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Omkostningsregnskab og omkostningsstyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb", "grund"], "level": "grund", "order": 384}, {"id": "ØS-term-L1-004", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Business partnering", "back": "Økonomifunktionen som strategisk samarbejdspartner frem for bogholder. Tre roller: hjælpe ledelsen med beslutninger, overvåge strategiske/operationelle mål, sikre overholdelse af regler.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Business Partnering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb", "grund"], "level": "grund", "order": 385}, {"id": "ØS-term-L1-008", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Cost–benefit-princippet", "back": "Et økonomistyringssystem skal skabe mere værdi end det koster – 'better to be roughly right than precisely wrong'. Information skal være beslutningsrelevant; adfærd er lige så vigtig som teknik.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Cost–Benefit princippet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb", "grund"], "level": "grund", "order": 386}, {"id": "ØS-term-L1-009", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Different costs for different purposes", "back": "Der findes ikke én rigtig omkostning – forskellige formål (pris, lager, kontrol, beslutning) kræver forskellige beregninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Centrale principper", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb", "grund"], "level": "grund", "order": 387}, {"id": "ØS-term-L1-005", "course": "ØS", "lecture": 1, "type": "card", "kind": "model", "front": "Fem hovedformål med økonomistyring", "back": "Strategi (langsigtede mål), ressourceallokering (produktmix, kundemix, priser), intern rapportering, omkostningskontrol (planlægge og styre aktiviteter) og præstationsmåling (medarbejdere, afdelinger, processer).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › De fem hovedformål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "model", "grund"], "level": "grund", "order": 388}, {"id": "ØS-term-L1-006", "course": "ØS", "lecture": 1, "type": "card", "kind": "model", "front": "Planlægning, kontrol og feedback", "back": "Planlægning: fastlæg mål → sammenlign alternativer → vælg bedste (budgettet = kvantitativ handlingsplan). Kontrol: mål resultater → sammenlign med budget → feedback → korrigér. Feedback: find årsager til afvigelser og lær fremadrettet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Planlægning, kontrol og beslutningstagning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "model", "grund"], "level": "grund", "order": 389}, {"id": "ØS-term-L1-007", "course": "ØS", "lecture": 1, "type": "card", "kind": "model", "front": "Tre roller i økonomistyringen", "back": "Opgørelse af resultater (er vi på rette vej?), fokusområde (hvad bør undersøges først?) og problemløsning (hvilket alternativ er bedst?).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Tre roller", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "model", "grund"], "level": "grund", "order": 390}, {"question": "[Begrebsspørgsmål] Forklar forskelle og ligheder mellem management accounting og financial accounting.", "model": "Financial: eksternt, regelbaseret, historisk, hele virksomheden. Management: internt, tilpasset ledelsens behov, fremadrettet, finansielle og ikke-finansielle data, ingen lovkrav. Fælles: bygger på omkostningsregnskabet.", "id": "ØS-sa-089", "course": "ØS", "lecture": 1, "lectureName": "L1 Hvad er økonomistyring?", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L1", "open", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Finansielt regnskab vs. økonomistyring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 391}, {"id": "ØS-term-L2-001", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omkostning", "back": "Værdien af de ressourcer, virksomheden forbruger for at opnå et bestemt mål (materialer, løn, husleje, energi, maskiner). Faktisk/historisk kostpris = reelt afholdte omkostninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 392}, {"id": "ØS-term-L2-002", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Udgift, udbetaling og omkostning", "back": "Udgift: ved anskaffelse af ressourcen (køb af maskine). Udbetaling: når der betales. Omkostning: når ressourcen forbruges (afskrivninger på maskinen).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Udgift, omkostning og udbetaling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 393}, {"id": "ØS-term-L2-003", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omkostningsobjekt (cost object)", "back": "Det man ønsker at kende omkostningen for: produkt, produktlinje, kunde, afdeling, marked, datterselskab. Valget afgør, om en omkostning er direkte eller indirekte.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Omkostningsobjekter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 394}, {"id": "ØS-term-L2-004", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Omkostningsakkumulering vs. -fordeling", "back": "Akkumulering: registrering/opsamling i regnskabssystemet. Fordeling: tildeling til et omkostningsobjekt – enten direkte sporing eller via fordelingsnøgler.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Omkostningsakkumulering og omkostningsfordeling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 395}, {"id": "ØS-term-L2-005", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Direkte omkostning", "back": "Kan spores direkte til omkostningsobjektet på en økonomisk hensigtsmæssig måde (træ og glas i et vindue).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Direkte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 396}, {"id": "ØS-term-L2-006", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Indirekte omkostning", "back": "Kan ikke spores direkte til objektet på en økonomisk hensigtsmæssig måde (fabrikschefens løn, husleje, rengøring). Fabrikschefens løn er direkte for fabrikken, indirekte for vinduet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Indirekte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 397}, {"id": "ØS-term-L2-007", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Variable og faste omkostninger", "back": "Variable ændrer sig med aktiviteten (styr à 52 € × antal cykler). Faste ændrer sig ikke (fabriksleje 94.500 €) – kaldes kapacitetsomkostninger. Uafhængig af direkte/indirekte (fastansat produktionsmedarbejder: direkte men fast).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Variable og faste omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 398}, {"id": "ØS-term-L2-008", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Cost driver", "back": "Den faktor der påvirker størrelsen af en omkostning – forklarer hvorfor den opstår (materialer → enheder, fragt → leverancer, el → maskintimer). Central i ABC.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Cost Drivers", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 399}, {"id": "ØS-term-L2-009", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Relevant interval", "back": "Det aktivitetsinterval hvor faste omkostninger er faste (fx 1.000–5.000 cykler). Udenfor kræves flere lokaler/maskiner, og de faste omk. stiger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Relevant interval", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 400}, {"id": "ØS-term-L2-011", "course": "ØS", "lecture": 2, "type": "card", "kind": "begreb", "front": "Kapitaliserede omkostninger (produktomkostninger) vs. periodeomkostninger", "back": "Kapitaliserede placeres på lageret og bliver omkostning (vareforbrug) når varen sælges. Periodeomkostninger udgiftsføres i den periode de afholdes (salg, administration).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Kapitaliserede omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "begreb", "grund"], "level": "grund", "order": 401}, {"id": "ØS-term-L2-010", "course": "ØS", "lecture": 2, "type": "card", "kind": "metode", "front": "Enhedsomkostning", "back": "Samlede omkostninger / antal producerede enheder. Varsomhed: den faste del pr. enhed falder med volumen, så enhedsomk. ved én mængde er misvisende ved en anden – brug samlede variable og faste omk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Enhedsomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "metode", "eksamen"], "level": "eksamen", "order": 402}, {"id": "ØS-term-L2-012", "course": "ØS", "lecture": 2, "type": "card", "kind": "sammenligning", "front": "Direkte vs. variabel omkostning", "back": "To forskellige inddelinger: direkte/indirekte handler om sporbarhed til objektet; variabel/fast om adfærd ved ændret aktivitet. Fastansat produktionsmedarbejder: direkte men fast.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Variable og faste omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 403, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "sammenligning", "eksamen"]}, {"id": "ØS-term-L2-013", "course": "ØS", "lecture": 2, "type": "card", "kind": "hvorfor", "front": "Hvorfor er enhedsomkostninger farlige?", "back": "Den faste del pr. enhed afhænger af volumen – en enhedsomk. beregnet ved 1.000 enheder er forkert ved 2.000. Brug samlede variable og faste omkostninger i beslutninger.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Enhedsomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 404, "lectureName": "L2 Omkostninger", "tags": ["ØS", "ØS-L2", "hvorfor", "eksamen"]}, {"question": "Hvilken er typisk en indirekte omkostning i forhold til det enkelte vindue?", "options": ["Træ", "Glas", "Fabrikschefens løn", "Materialer til vinduet"], "answer": 2, "explanation": "Fabrikschefens løn kan ikke spores økonomisk til det enkelte vindue (men er direkte for fabrikken). Forkert: træ, glas og materialer spores direkte til vinduet.", "id": "ØS-mc-060", "course": "ØS", "lecture": 2, "lectureName": "L2 Omkostninger", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L2", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 2 › Direkte og indirekte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 405}, {"id": "ØS-term-L3-002", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Cost tracing vs. cost allocation", "back": "Tracing: direkte omk. spores til jobbet. Allocation: indirekte omk. fordeles via fordelingsnøgle. Jo større andel der spores, desto mere præcis beregning.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Direkte og indirekte omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb", "grund"], "level": "grund", "order": 406}, {"id": "ØS-term-L3-003", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Cost pool", "back": "En samling af indirekte omkostninger, der senere fordeles (fx produktions-overhead: el, husleje, vedligehold, produktionsledelse).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Cost Pool", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb", "grund"], "level": "grund", "order": 407}, {"id": "ØS-term-L3-004", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Cost allocation base", "back": "Fordelingsnøglen for indirekte omk. (maskintimer, arbejdstimer, materialeforbrug, enheder) – bør afspejle hvad der driver omkostningerne.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Cost Allocation Base", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb", "grund"], "level": "grund", "order": 408}, {"id": "ØS-term-L3-008", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Faktisk vs. normal costing", "back": "Faktisk: reelle omk. og satser – præcist, men kendes først sent. Normal: faktiske direkte omk. + budgetteret overheadsats × faktisk forbrug – rettidigt; afvigelse (under/overabsorption) justeres ved periodens slut.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Faktiske omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb", "grund"], "level": "grund", "order": 409}, {"id": "ØS-term-L3-009", "course": "ØS", "lecture": 3, "type": "card", "kind": "begreb", "front": "Produktionsformer og kalkulationsmetode", "back": "Produktion efter ordre → job-costing; serieproduktion → kombination; masseproduktion af identiske varer → process-costing. Vestas: fra projektorienteret mod mere procesorienteret, havvindprojekter stadig job.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Produktionsformer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "begreb", "grund"], "level": "grund", "order": 410}, {"id": "ØS-term-L3-001", "course": "ØS", "lecture": 3, "type": "card", "kind": "model", "front": "Job-costing", "back": "Beregner omkostningen ved et specifikt job/projekt/ordre som selvstændigt omkostningsobjekt. Bruges når opgaver er forskellige (entreprenører, konsulenter, revision, specialproduktion) – til pris, lønsomhed, planlægning og kontrol.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "model", "grund"], "level": "grund", "order": 411}, {"id": "ØS-term-L3-011", "course": "ØS", "lecture": 3, "type": "card", "kind": "sammenligning", "front": "Job-costing vs. process-costing", "back": "Job: hvert job er et omkostningsobjekt – forskellige ordrer (entreprenør, revision). Process: gennemsnit over ens enheder – masseproduktion (bryggeri, cement), færre registreringer.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Produktionsformer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 412, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "sammenligning", "grund"]}, {"id": "ØS-term-L3-005", "course": "ØS", "lecture": 3, "type": "card", "kind": "metode", "front": "Seks-trins modellen (job-costing)", "back": "1) Identificér jobbet, 2) direkte omk. (DM, DL), 3) vælg fordelingsnøgle, 4) saml indirekte omk. i cost pool, 5) overheadsats = indirekte omk. / aktivitetsbase, 6) jobomk. = DM + DL + sats × jobbets forbrug.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Den seks-trins model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "metode", "eksamen"], "level": "eksamen", "order": 413}, {"id": "ØS-term-L3-006", "course": "ØS", "lecture": 3, "type": "card", "kind": "metode", "front": "Overheadsats", "back": "Indirekte omkostninger / aktivitetsbase. Eks.: 65.100 / 2.480 MT = 26,25 kr./MT; job med 500 MT får 13.125 kr.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Eksempel på job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "metode", "eksamen"], "level": "eksamen", "order": 414}, {"id": "ØS-term-L3-007", "course": "ØS", "lecture": 3, "type": "card", "kind": "metode", "front": "Bruttoavance og bruttomargin", "back": "Bruttoavance = omsætning − COGS (104.800 − 72.125 = 32.675). Bruttomargin = bruttoavance / omsætning (31,2 %) – andel tilbage efter vareomkostningerne.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Bruttoavance", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "metode", "eksamen"], "level": "eksamen", "order": 415}, {"id": "ØS-term-L3-010", "course": "ØS", "lecture": 3, "type": "card", "kind": "eksempel", "front": "Eksempel: job-costing trin for trin", "back": "1) Sats = 65.100/2.480 MT = 26,25. 2) OH til job = 500 MT × 26,25 = 13.125. 3) Jobomk. = DM 45.000 + DL 14.000 + 13.125 = 72.125. 4) Bruttoavance = 104.800 − 72.125 = 32.675 (31,2 %).", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Eksempel på job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 416, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "eksempel", "eksamen"]}, {"question": "Overhead 65.100 kr., 2.480 maskintimer i alt. Job 100 bruger 500 MT, DM 45.000, DL 14.000. Jobomkostning?", "options": ["59.000", "65.100", "72.125", "104.800"], "answer": 2, "explanation": "Sats 65.100/2.480 = 26,25; OH 500 × 26,25 = 13.125; 45.000 + 14.000 + 13.125 = 72.125. Forkert: 59.000 = kun DM + DL; 65.100 = den samlede overhead; 104.800 = omsætningen.", "id": "ØS-mc-061", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L3", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Eksempel på job-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 417}, {"question": "[Eksamensstil] Indirekte produktionsomk. 120.000 kr., 4.000 maskintimer. Job A: DM 20.000, DL 8.000, 150 MT, salgspris 40.000. Beregn overheadsats, jobomkostning og bruttomargin.", "model": "Sats = 120.000/4.000 = 30 kr./MT. OH = 150 × 30 = 4.500. Jobomk. = 20.000 + 8.000 + 4.500 = 32.500. Bruttoavance 7.500; bruttomargin = 7.500/40.000 = 18,75 %.", "id": "ØS-sa-077", "course": "ØS", "lecture": 3, "lectureName": "L3 Job-costing", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L3", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 3 › Den seks-trins model", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 418}, {"id": "ØS-sa-093", "course": "ØS", "lecture": 3, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Budgetteret IPO-sats 40 kr./DLH. Faktiske timer 5.000; faktiske IPO 212.000. Beregn absorberet IPO og under-/overabsorption.", "model": "Absorberet = 5.000 × 40 = 200.000. Faktisk 212.000 ⇒ underabsorption 12.000 (justeres typisk via vareforbruget ved periodens slut).", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 419, "lectureName": "L3 Job-costing", "tags": ["ØS", "ØS-L3", "calc", "eksamen"]}, {"id": "ØS-term-L4-007", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "WA vs. FIFO – forskel", "back": "Forskellen opstår når omk. pr. ækv. enhed i primo-WIP afviger fra periodens. WA blander gamle og nye priser (høje priser 'forurener' WIP/COGS længe); FIFO holder perioderne adskilt. Total at gøre rede for er ens (Snowdon 153.600).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Sammenligning af WA og FIFO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb", "grund"], "level": "grund", "order": 420}, {"id": "ØS-term-L4-009", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "Standard costing i process-costing", "back": "Fast standardomk. pr. inputenhed for perioden (fx 74 kr. materialer, 54 kr. fremstilling pr. stk.) – stabil og forenkler beregningen; samme procedure som FIFO/WA.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Standard costing i process-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb", "grund"], "level": "grund", "order": 421}, {"id": "ØS-term-L4-010", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "Transferred-in costs", "back": "Omkostninger der følger med enhederne fra én afdeling til den næste (fx støberi → montage). Behandles som en ekstra omkostningstype i den modtagende afdeling (100 % færdige ved modtagelse).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Transferred-in costs", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb", "grund"], "level": "grund", "order": 422}, {"id": "ØS-term-L4-011", "course": "ØS", "lecture": 4, "type": "card", "kind": "begreb", "front": "Bogføring i process-costing", "back": "WIP-konto pr. afdeling debiteres med materialer og fremstillingsomk.; færdige enheder overføres til næste afdelings WIP → færdigvarer → COGS; resten bliver i WIP ultimo.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Bogføring i process-costing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "begreb", "grund"], "level": "grund", "order": 423}, {"id": "ØS-term-L4-001", "course": "ØS", "lecture": 4, "type": "card", "kind": "model", "front": "Process-costing", "back": "Enhedsomkostningen findes som gennemsnit af de samlede omkostninger over ens produkter, der behandles ensartet (bryggerier, cement, mursten). Kræver langt færre registreringer end job-costing; separat WIP-konto pr. afdeling.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Hvornår anvendes process-costing?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "model", "grund"], "level": "grund", "order": 424}, {"id": "ØS-term-L4-002", "course": "ØS", "lecture": 4, "type": "card", "kind": "model", "front": "De fem trin i process-costing", "back": "1) Fysiske enheder (primo-WIP + påbegyndt = færdige + WIP ultimo), 2) ækvivalente enheder pr. omkostningstype, 3) omk. pr. ækvivalent enhed, 4) samlede omk. at gøre rede for, 5) fordel til færdige/videreførte enheder og WIP ultimo.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › De fem trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "model", "grund"], "level": "grund", "order": 425}, {"id": "ØS-term-L4-003", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Ækvivalente enheder", "back": "Fysiske enheder × færdiggørelsesgrad – omregner WIP til færdige enheder. Graden kan være forskellig for materialer (fx 100 %) og fremstilling (fx 20 %). Snowdon: fremstilling 30.000 + 5.000 × 20 % = 31.000.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Ækvivalente enheder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode", "eksamen"], "level": "eksamen", "order": 426}, {"id": "ØS-term-L4-004", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Omkostning pr. ækvivalent enhed", "back": "Omkostninger for typen / ækvivalente enheder for typen (Snowdon: materialer 84.050/35.000 = 2,4014; fremstilling 62.000/31.000 = 2,00). Beregnes separat for materialer og fremstilling.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Snowdon Ltd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode", "eksamen"], "level": "eksamen", "order": 427}, {"id": "ØS-term-L4-005", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Vægtet gennemsnit (WA)", "back": "Gennemsnitlig enhedsomk. for alt udført arbejde uanset periode: (primo-WIP-omk. + periodens omk.) / alle ækvivalente enheder (færdige + WIP ultimo). Snowdon: materialer 86.400/36.000 = 2,40; fremstilling 67.200/32.000 = 2,10.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Vægtet gennemsnit (WA)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode", "eksamen"], "level": "eksamen", "order": 428}, {"id": "ØS-term-L4-006", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "FIFO (process-costing)", "back": "Først færdiggøres primo-WIP, derefter påbegyndes nye enheder. Ækv. enheder = arbejde for at færdiggøre primo-WIP + påbegyndt og afsluttet + WIP ultimo; kun periodens omk. indgår i satsen (fremstilling 62.000/31.400 = 1,975).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › FIFO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode", "eksamen"], "level": "eksamen", "order": 429}, {"id": "ØS-term-L4-008", "course": "ØS", "lecture": 4, "type": "card", "kind": "metode", "front": "Kontrol i process-costing", "back": "Videreførte enheders omk. + WIP ultimo = omkostninger at gøre rede for (primo-WIP + periodens omk.).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Eksamensfokus", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "metode", "eksamen"], "level": "eksamen", "order": 430}, {"id": "ØS-term-L4-012", "course": "ØS", "lecture": 4, "type": "card", "kind": "eksempel", "front": "Eksempel: WA trin for trin (Snowdon)", "back": "1) Fysiske enheder. 2) Ækv. enheder = færdige + WIP ultimo × grad (alle). 3) Omk. = primo-WIP + periodens: mat. 86.400/36.000 = 2,40; fremst. 67.200/32.000 = 2,10. 4) Fordel til færdige og WIP. 5) Kontrol: sum = 153.600.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Vægtet gennemsnit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 431, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "eksempel", "eksamen"]}, {"id": "ØS-term-L4-013", "course": "ØS", "lecture": 4, "type": "card", "kind": "eksempel", "front": "Eksempel: FIFO trin for trin", "back": "1) Ækv. enheder = arbejde for at færdiggøre primo-WIP + påbegyndt og afsluttet + WIP ultimo × grad. 2) Kun periodens omk. i satsen (fremst. 62.000/31.400 = 1,975). 3) Færdige = primo-WIP-omk. + periodens arbejde. 4) Kontrol mod totalen.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › FIFO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 432, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "eksempel", "eksamen"]}, {"id": "ØS-term-L4-014", "course": "ØS", "lecture": 4, "type": "card", "kind": "hvorfor", "front": "Hvornår giver WA og FIFO samme resultat?", "back": "Når der ikke er primo-WIP, eller når omk. pr. ækvivalent enhed er den samme i primo-WIP og i perioden – forskellen skyldes kun, hvordan gamle og nye omk. blandes.", "level": "svaer", "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Sammenligning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 433, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "hvorfor", "svaer"]}, {"question": "WIP ultimo 5.000 enheder, 100 % mat., 20 % fremstilling; 30.000 færdige. Ækv. enheder fremstilling?", "options": ["30.000", "31.000", "35.000", "36.000"], "answer": 1, "explanation": "30.000 + 5.000 × 20 % = 31.000. Forkert: 30.000 glemmer WIP; 35.000 bruger 100 % (materialegraden); 36.000 er ikke en mulig kombination.", "id": "ØS-mc-062", "course": "ØS", "lecture": 4, "lectureName": "L4 Process-costing", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L4", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › Snowdon Ltd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 434}, {"id": "ØS-mc-106", "course": "ØS", "lecture": 4, "type": "mc", "kind": "mc", "question": "Der er ingen primo-WIP i en periode. Hvad gælder for WA og FIFO?", "options": ["WA giver altid højere omk.", "De giver samme resultat", "FIFO kan ikke bruges", "Kun FIFO giver ækvivalente enheder"], "answer": 1, "explanation": "Uden primo-WIP er der ingen gamle omk. at blande, så metoderne giver samme resultat. Forkert: begge bruger ækvivalente enheder, og ingen af dem er altid højere.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 435, "lectureName": "L4 Process-costing", "tags": ["ØS", "ØS-L4", "mc", "eksamen"]}, {"question": "[Eksamensstil] Ingen primo-WIP. 24.000 påbegyndt, 20.000 færdige, 4.000 i WIP ultimo (100 % mat., 25 % fremstilling). Materialer 72.000, fremstilling 42.000. Fordel omkostningerne.", "model": "Ækv.: mat. 24.000, fremst. 20.000 + 1.000 = 21.000. Pr. ækv.: mat. 3,00; fremst. 2,00. Færdige: 20.000 × 5 = 100.000. WIP: 4.000 × 3 + 1.000 × 2 = 14.000. I alt 114.000 ✓.", "id": "ØS-sa-078", "course": "ØS", "lecture": 4, "lectureName": "L4 Process-costing", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L4", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 4 › De fem trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 436}, {"id": "ØS-term-L5-001", "course": "ØS", "lecture": 5, "type": "card", "kind": "begreb", "front": "Omkostningsallokering", "back": "Fordeling af indirekte og fælles omkostninger mellem omkostningsobjekter via en allokeringsbase (medarbejdere, løntimer, maskintimer, m², ordrer). Skal være logisk, relevant og anvendelig for beslutningen – ikke 'objektivt korrekt'.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Omkostningsallokering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "begreb", "grund"], "level": "grund", "order": 437}, {"id": "ØS-term-L5-005", "course": "ØS", "lecture": 5, "type": "card", "kind": "begreb", "front": "Fællesomkostninger (common costs)", "back": "Opstår når en ressource eller aktivitet understøtter flere omkostningsobjekter (hovedkontor, økonomi, HR).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Fællesomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "begreb", "grund"], "level": "grund", "order": 438}, {"id": "ØS-term-L5-003", "course": "ØS", "lecture": 5, "type": "card", "kind": "model", "front": "Fire kriterier for valg af allokeringsbase", "back": "Årsag og virkning (stærkest), modtagne fordele (hvem har gavn), retfærdighed/rimelighed (kontrakter, subjektivt) og evnen til at bære omkostningen (svag sammenhæng med ressourceforbrug). I praksis mest de to første.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Kriterier for fordeling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "model", "grund"], "level": "grund", "order": 439}, {"id": "ØS-term-L5-004", "course": "ØS", "lecture": 5, "type": "card", "kind": "model", "front": "Fire formål med omkostningsallokering", "back": "Information til økonomiske beslutninger (pris, lønsomhed, outsourcing), motivation af ledere og medarbejdere, retfærdiggørelse og refusion (kontrakter), måling af indkomst og aktiver (lager, COGS).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Fire formål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "model", "grund"], "level": "grund", "order": 440}, {"id": "ØS-term-L5-002", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Allokeringsrate", "back": "Allokeringsrate = omk. i puljen / samlet mængde af basen. Allokeret omk. = objektets forbrug af basen × raten.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Omkostningsallokering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode", "eksamen"], "level": "eksamen", "order": 441}, {"id": "ØS-term-L5-006", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Single-rate-metoden", "back": "Faste og variable supportomk. i én pulje fordelt med én sats: budgetterede omk. / budgetteret mængde af basen (IT: 1.000.000/10.000 = 100 pr. time). Enkel, men skjuler forskellen på fast og variabel.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Single-rate-metoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode", "eksamen"], "level": "eksamen", "order": 442}, {"id": "ØS-term-L5-007", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Dual-rate-metoden", "back": "Variable omk. fordeles efter faktisk forbrug med variabel sats; faste omk. fordeles efter budgetteret/planlagt kapacitetsbehov. Giver bedre adfærd og kontrollerbarhed.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Dual-rate-metoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode", "eksamen"], "level": "eksamen", "order": 443}, {"id": "ØS-term-L5-008", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Direkte metode (serviceafdelinger)", "back": "Supportomk. fordeles kun til driftsafdelinger; ydelser mellem supportafdelinger ignoreres. Enkel, men mindst præcis.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Den direkte metode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode", "eksamen"], "level": "eksamen", "order": 444}, {"id": "ØS-term-L5-009", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Trinvis metode", "back": "Supportafdelinger fordeles i en rækkefølge (typisk den der yder mest til andre først); en fordelt afdeling modtager ikke senere omk. Delvis anerkendelse af gensidige ydelser.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Den trinvise metode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode", "eksamen"], "level": "eksamen", "order": 445}, {"id": "ØS-term-L5-010", "course": "ØS", "lecture": 5, "type": "card", "kind": "metode", "front": "Reciprok metode", "back": "Fuld anerkendelse af gensidige ydelser mellem supportafdelinger via ligningssystem. Mest præcis, men mest kompleks. Kontrol: totale omk. før = efter allokering (allokering skaber ikke nye omk.).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Den reciprokke metode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "metode", "eksamen"], "level": "eksamen", "order": 446}, {"id": "ØS-term-L5-012", "course": "ØS", "lecture": 5, "type": "card", "kind": "sammenligning", "front": "Direkte vs. trinvis vs. reciprok metode", "back": "Direkte: ignorerer ydelser mellem supportafdelinger. Trinvis: delvis anerkendelse i en rækkefølge. Reciprok: fuld anerkendelse via ligninger – mest præcis. Totalen er den samme i alle tre.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Serviceafdelinger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 447, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "sammenligning", "eksamen"]}, {"id": "ØS-term-L5-011", "course": "ØS", "lecture": 5, "type": "card", "kind": "eksempel", "front": "Eksempel: single- vs. dual-rate", "back": "Single: 1.000.000/10.000 timer = 100 pr. time → afdeling med 2.000 timer får 200.000. Dual: variable omk. × faktisk forbrug + faste omk. efter planlagt kapacitetsandel – afdelingen bærer kun faste omk. for den kapacitet, den har bestilt.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Single- og dual-rate", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 448, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "eksempel", "eksamen"]}, {"question": "Hvilket allokeringskriterium er normalt det stærkeste?", "options": ["Evnen til at bære", "Retfærdighed", "Årsag og virkning", "Modtagne fordele"], "answer": 2, "explanation": "Årsag og virkning giver den mest realistiske sammenhæng mellem forbrug og omkostning. Forkert: modtagne fordele er næststærkest; retfærdighed er subjektiv; evnen til at bære har svag sammenhæng med ressourceforbrug.", "id": "ØS-mc-063", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L5", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Årsag og virkning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 449}, {"id": "ØS-sa-095", "course": "ØS", "lecture": 5, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Samme data: fordel med trinvis metode med S1 først.", "model": "S1: 20.000 til S2, 40.000 til P1, 40.000 til P2. S2 = 70.000 fordeles 50:40 ⇒ P1 38.889, P2 31.111. P1 = 78.889; P2 = 71.111. Sum 150.000 ✓.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 450, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "calc", "eksamen"]}, {"question": "[Eksamensstil, jf. 2024 ord.] HR 75 mio. (fordeles på medarbejdere), Vedl. 26 mio. (m²). ECON: 300 medarb., 1.300 m²; Jura: 400 medarb., 1.400 m². Vedl. har 25 medarb., HR 210 m². Fordel med (A) direkte metode og (B) trinvis metode med HR først.", "model": "A: HR → ECON 75·300/700 = 32,14; Jura 42,86. Vedl. → ECON 26·1.300/2.700 = 12,52; Jura 13,48. B: HR fordeles på Vedl./ECON/Jura (25/300/400 af 725): 2,59 / 31,03 / 41,38. Vedl. i alt 28,59 → ECON 13,76; Jura 14,82. ECON i alt allokeret 44,79; Jura 56,20 (≈101 mio.).", "id": "ØS-sa-079", "course": "ØS", "lecture": 5, "lectureName": "L5 Omkostningsallokering", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L5", "calc", "svaer"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 5 › Allokering fra serviceafdelinger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "svaer", "order": 451}, {"id": "ØS-sa-094", "course": "ØS", "lecture": 5, "type": "sa", "kind": "calc", "question": "[Eksamensstil] S1 (100.000) yder 20 % til S2, 40 % til P1, 40 % til P2. S2 (50.000) yder 10 % til S1, 50 % til P1, 40 % til P2. Fordel med reciprok metode.", "model": "S1 = 100.000 + 0,1·S2; S2 = 50.000 + 0,2·S1 ⇒ S1 = 105.000/0,98 = 107.143; S2 = 71.429. P1 = 0,4·107.143 + 0,5·71.429 = 78.571. P2 = 0,4·107.143 + 0,4·71.429 = 71.429. Sum 150.000 ✓.", "level": "svaer", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 452, "lectureName": "L5 Omkostningsallokering", "tags": ["ØS", "ØS-L5", "calc", "svaer"]}, {"id": "ØS-term-L6-001", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Fællesproduktion", "back": "Én proces frembringer samtidig flere produkter (råmælk → fløde og skummetmælk; råolie → benzin, diesel). Fællesomkostningerne har ingen direkte årsagssammenhæng med det enkelte produkt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesproduktion", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb", "grund"], "level": "grund", "order": 453}, {"id": "ØS-term-L6-002", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Fællesomkostninger (joint costs)", "back": "Omkostningerne ved den fælles proces før produkterne bliver særskilt identificerbare – skal fordeles med en valgt metode.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb", "grund"], "level": "grund", "order": 454}, {"id": "ØS-term-L6-003", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Opsplitningspunkt (split-off point)", "back": "Tidspunktet/procestrinnet hvor produkterne bliver særskilt identificerbare; derefter kan de sælges, videreforarbejdes eller lagres.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Opsplitningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb", "grund"], "level": "grund", "order": 455}, {"id": "ØS-term-L6-004", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Separate omkostninger (separable costs)", "back": "Omkostninger efter opsplitningspunktet, som kan henføres til ét produkt (videreforarbejdning, emballage, kvalitetskontrol, distribution).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Separate omkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb", "grund"], "level": "grund", "order": 456}, {"id": "ØS-term-L6-005", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Fællesprodukt, hovedprodukt, biprodukt, skrot", "back": "Klassificeres efter relativ salgsværdi: fællesprodukter har hver høj værdi; hovedprodukt klart størst; biprodukt lav værdi (kan ændre sig – valle); skrot meget lav; affald ingen/negativ værdi.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesprodukter, hovedprodukter og biprodukter", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb", "grund"], "level": "grund", "order": 457}, {"id": "ØS-term-L6-006", "course": "ØS", "lecture": 6, "type": "card", "kind": "begreb", "front": "Formål med at fordele fællesomkostninger", "back": "Lagerværdi og COGS, omkostningsgodtgørelse ved kontrakter, forsikringsafregninger, prisregulering, juridiske/skattemæssige opgørelser – ikke til interne økonomiske beslutninger.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Hvorfor fordeles fællesomkostninger?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "begreb", "grund"], "level": "grund", "order": 458}, {"id": "ØS-term-L6-007", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Salgsværdi ved opsplitningspunktet", "back": "Andel = (mængde × salgspris ved split-off) / samlet salgsværdi; allokeret = fællesomk. × andel. Kræver markedspris ved split-off.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Salgsværdi ved opsplitningspunktet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode", "eksamen"], "level": "eksamen", "order": 459}, {"id": "ØS-term-L6-008", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Fysisk målemetode", "back": "Fordeler efter fysisk mængde (vægt, volumen, antal). Enkel, men ignorerer at produkterne har meget forskellig værdi.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fysisk målemetode", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode", "eksamen"], "level": "eksamen", "order": 460}, {"id": "ØS-term-L6-009", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Estimeret NRV-metode", "back": "NRV = endelig salgsværdi − separate omkostninger efter split-off. Fællesomk. fordeles efter relativ NRV. Bruges når produkter videreforarbejdes og ikke har pris ved split-off.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Estimeret nettorealisationsværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode", "eksamen"], "level": "eksamen", "order": 461}, {"id": "ØS-term-L6-010", "course": "ØS", "lecture": 6, "type": "card", "kind": "metode", "front": "Konstant bruttomarginprocent-NRV", "back": "Fællesomk. fordeles så alle produkter får samme bruttomarginprocent: samlet bruttomargin % → bruttomargin pr. produkt → træk separate omk. fra → resten er fællesomk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Konstant bruttomarginprocent-NRV", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "metode", "eksamen"], "level": "eksamen", "order": 462}, {"id": "ØS-term-L6-011", "course": "ØS", "lecture": 6, "type": "card", "kind": "eksempel", "front": "Eksempel: salgsværdi ved split-off", "back": "Fællesomk. 60.000. A: 4.000 × 20 = 80.000; B: 2.000 × 10 = 20.000; i alt 100.000. A får 80 % = 48.000; B 20 % = 12.000. (Fysisk mængde ville give 40.000/20.000.)", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Salgsværdi ved opsplitningspunktet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 463, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "eksempel", "eksamen"]}, {"id": "ØS-term-L6-012", "course": "ØS", "lecture": 6, "type": "card", "kind": "hvorfor", "front": "Hvorfor bruges allokerede fællesomk. ikke til 'sælg eller videreforarbejd'?", "back": "Fællesomkostningerne er afholdt uanset beslutningen (sunk). Kun merindtægt minus separate meromkostninger efter split-off er relevante.", "level": "svaer", "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fællesomkostninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 464, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "hvorfor", "svaer"]}, {"question": "Fællesprodukter og biprodukter adskilles primært på:", "options": ["Fysisk mængde", "Relativ salgsværdi", "Produktionstid", "Vægt"], "answer": 1, "explanation": "Relativ salgsværdi – og klassifikationen kan ændre sig (valle). Forkert: fysisk mængde, tid og vægt siger intet om produktets økonomiske betydning.", "id": "ØS-mc-064", "course": "ØS", "lecture": 6, "lectureName": "L6 Fællesproduktion", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L6", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Biprodukt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 465}, {"question": "[Eksamensstil] Fællesomk. 60.000 kr. Ved split-off: A 4.000 enh. à 20 kr., B 2.000 enh. à 10 kr. Fordel efter (a) fysisk mængde og (b) salgsværdi ved split-off.", "model": "(a) A 4.000/6.000 × 60.000 = 40.000; B 20.000. (b) Salgsværdi A 80.000, B 20.000 (i alt 100.000): A 48.000; B 12.000.", "id": "ØS-sa-080", "course": "ØS", "lecture": 6, "lectureName": "L6 Fællesproduktion", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L6", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 6 › Fordelingsmetoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 466}, {"id": "ØS-sa-096", "course": "ØS", "lecture": 6, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Fællesomk. 100.000. P: 5.000 enh. à 30 efter videreforarbejdning (separate omk. 50.000). Q: 2.000 enh. à 40 (separate 30.000). Fordel med NRV-metoden.", "model": "NRV P = 150.000 − 50.000 = 100.000; NRV Q = 80.000 − 30.000 = 50.000; i alt 150.000. P = 2/3 × 100.000 = 66.667; Q = 33.333.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 467, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "calc", "eksamen"]}, {"id": "ØS-sa-097", "course": "ØS", "lecture": 6, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Samme data: fordel med konstant bruttomarginprocent-NRV.", "model": "Samlet salg 230.000; samlede omk. 180.000; bruttomargin 50.000 = 21,74 %. P: omk. = 150.000 × 78,26 % = 117.391 − 50.000 = 67.391. Q: 80.000 × 78,26 % = 62.609 − 30.000 = 32.609. Sum 100.000 ✓.", "level": "svaer", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 468, "lectureName": "L6 Fællesproduktion", "tags": ["ØS", "ØS-L6", "calc", "svaer"]}, {"id": "ØS-term-L7-003", "course": "ØS", "lecture": 7, "type": "card", "kind": "begreb", "front": "Dækningsbidrag vs. bruttoresultat", "back": "DB = omsætning − alle variable omk. (adfærdsopdelt). Bruttoresultat = omsætning − vareforbrug inkl. allokerede faste produktionsomk. (funktionsopdelt).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Resultatopgørelsens opbygning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "begreb", "grund"], "level": "grund", "order": 469}, {"id": "ØS-term-L7-007", "course": "ØS", "lecture": 7, "type": "card", "kind": "begreb", "front": "Lageropbygning (incitament)", "back": "Under regnskabsmetoden kan ledere øge resultatet ved at producere mere end der sælges, fordi faste omk. parkeres i lageret. Bidragsmetoden fjerner dette incitament.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Lageropbygning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "begreb", "grund"], "level": "grund", "order": 470}, {"id": "ØS-term-L7-001", "course": "ØS", "lecture": 7, "type": "card", "kind": "model", "front": "Bidragsmetoden (variable costing)", "back": "Kun variable produktionsomk. (DM + DL + variable IPO) indgår i lagerværdien; faste produktionsomk. er periodeomk. Resultatopgørelse: omsætning − variable omk. = DB − faste omk. = driftsresultat. God til intern beslutningsstøtte og CVP.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Bidragsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "model", "grund"], "level": "grund", "order": 471}, {"id": "ØS-term-L7-002", "course": "ØS", "lecture": 7, "type": "card", "kind": "model", "front": "Regnskabsmetoden (absorption/full costing)", "back": "Både variable og allokerede faste produktionsomk. indgår i lagerværdien. Resultatopgørelse: omsætning − vareforbrug ± produktionsvolumenafvigelse = bruttoresultat − salgs-/adm.omk. = driftsresultat. Krævet eksternt.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Regnskabsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "model", "grund"], "level": "grund", "order": 472}, {"id": "ØS-term-L7-009", "course": "ØS", "lecture": 7, "type": "card", "kind": "sammenligning", "front": "Bidrags- vs. regnskabsmetoden", "back": "Bidrag: kun variable produktionsomk. i lageret – intern beslutning og CVP. Regnskab: også faste produktionsomk. i lageret – kræves eksternt. Forskellen er kun timing.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Bidragsmetoden og regnskabsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 473, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "sammenligning", "grund"]}, {"id": "ØS-term-L7-004", "course": "ØS", "lecture": 7, "type": "card", "kind": "metode", "front": "Fast produktionsomkostningssats", "back": "Budgetterede faste produktionsomk. / normalproduktion (Fredonia: 54.000/12.000 = 4,50 kr.). Kostpris regnskabsmetoden = VC + sats (49 + 4,50 = 53,50).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Fredonia Fixtures", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "metode", "eksamen"], "level": "eksamen", "order": 474}, {"id": "ØS-term-L7-005", "course": "ØS", "lecture": 7, "type": "card", "kind": "metode", "front": "Produktionsvolumenafvigelse (regnskabsmetoden)", "back": "(Normalproduktion − faktisk produktion) × fast sats. Fredonia år 1: (12.000 − 10.000) × 4,50 = 9.000 U, fratrækkes bruttoresultatet.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Regnskabsmetoden i år 1", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "metode", "eksamen"], "level": "eksamen", "order": 475}, {"id": "ØS-term-L7-006", "course": "ØS", "lecture": 7, "type": "card", "kind": "metode", "front": "Resultatforskel mellem metoderne", "back": "Resultat (regnskab) − resultat (bidrag) = lagerændring i enheder × fast sats. Lageropbygning → regnskabsmetoden højest; lagernedbringelse → bidragsmetoden højest. Metoderne ændrer kun timing, ikke pengestrømme.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › År 1 og år 2", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "metode", "eksamen"], "level": "eksamen", "order": 476}, {"id": "ØS-term-L7-008", "course": "ØS", "lecture": 7, "type": "card", "kind": "eksempel", "front": "Eksempel: resultatforskel Fredonia", "back": "Fast sats = 54.000/12.000 = 4,50. Produktion 10.000, salg 8.000 ⇒ lager +2.000. Forskel = 2.000 × 4,50 = 9.000 højere resultat under regnskabsmetoden.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Fredonia Fixtures", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 477, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "eksempel", "eksamen"]}, {"question": "Når salg > produktion (lagernedbringelse), giver regnskabsmetoden:", "options": ["Højere resultat end bidragsmetoden", "Lavere resultat end bidragsmetoden", "Samme resultat", "Altid underskud"], "answer": 1, "explanation": "Lagernedbringelse: faste omk. fra tidligere perioder udgiftsføres nu via vareforbruget ⇒ lavere resultat. 'Højere' gælder ved lageropbygning; 'samme' kun ved uændret lager.", "id": "ØS-mc-066", "course": "ØS", "lecture": 7, "lectureName": "L7 Bidrags- og regnskabsmetoden", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L7", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › År 2 – lagernedbringelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 478}, {"question": "Fredonia: VC 49 kr., fast sats 4,50 kr. Produktion 10.000, salg 8.000. Forskel i resultat mellem metoderne?", "options": ["4.500", "9.000", "18.000", "0"], "answer": 1, "explanation": "Lagerændring 2.000 × fast sats 4,50 = 9.000 højere resultat under regnskabsmetoden. Forkert: 4.500 bruger 1.000 enh.; 18.000 dobbelttæller; 0 gælder kun ved uændret lager.", "id": "ØS-mc-065", "course": "ØS", "lecture": 7, "lectureName": "L7 Bidrags- og regnskabsmetoden", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L7", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Fredonia Fixtures", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 479}, {"question": "[Eksamensstil] Faste produktionsomk. 60.000, normalproduktion 10.000 enh., VC 30 kr./enh., pris 50. Produktion 10.000, salg 9.000, ingen primolager. Beregn forskel i resultat og lagerværdier.", "model": "Fast sats = 6 kr. Lager 1.000 enh. Regnskabsmetoden: lager 1.000 × 36 = 36.000; bidragsmetoden 1.000 × 30 = 30.000. Regnskabsmetoden viser 6.000 kr. højere resultat (1.000 × 6). Ingen volumenafvigelse (prod. = normal).", "id": "ØS-sa-081", "course": "ØS", "lecture": 7, "lectureName": "L7 Bidrags- og regnskabsmetoden", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L7", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 7 › Bidragsmetoden og regnskabsmetoden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 480}, {"id": "ØS-sa-098", "course": "ØS", "lecture": 7, "type": "sa", "kind": "calc", "question": "[Eksamensstil] Faste produktionsomk. 80.000, normalproduktion 8.000 (sats 10). VC 25, pris 60. Produktion 7.000, salg 7.500, primolager 1.000. Hvilken metode giver højest resultat, og hvor stor er volumenafvigelsen?", "model": "Lager falder 500 ⇒ bidragsmetoden giver 500 × 10 = 5.000 højere resultat. Produktionsvolumenafvigelse (regnskabsmetoden) = (8.000 − 7.000) × 10 = 10.000 U.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 481, "lectureName": "L7 Bidrags- og regnskabsmetoden", "tags": ["ØS", "ØS-L7", "calc", "eksamen"]}, {"id": "ØS-term-L8-001", "course": "ØS", "lecture": 8, "type": "card", "kind": "model", "front": "CVP-analyse", "back": "Cost-Volume-Profit: sammenhængen mellem salgsvolumen, indtægter, omk. og resultat. Svarer på: hvor meget skal sælges for at gå i nul / nå mål-profit, og hvordan påvirker pris, VC og FC resultatet? Kortsigtet planlægningsværktøj.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Formålet med CVP-analyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "model", "grund"], "level": "grund", "order": 482}, {"id": "ØS-term-L8-007", "course": "ØS", "lecture": 8, "type": "card", "kind": "model", "front": "CVP-antagelser", "back": "Omk. kan opdeles i variable/faste, lineær omsætning og omk., konstant pris og enhedsomk., konstant produktmix, ingen tidsværdi af penge, kun volumen ændrer sig, produktion = salg – alt inden for det relevante interval.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › CVP-modellens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "model", "grund"], "level": "grund", "order": 483}, {"id": "ØS-term-L8-002", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Dækningsbidrag og dækningsgrad", "back": "DB pr. enhed = pris − VC pr. enhed (70 − 42 = 28). DG = DB / omsætning (40 %). DB dækker først faste omk., derefter overskud.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dækningsbidrag", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 484}, {"id": "ØS-term-L8-003", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Break-even-punkt", "back": "BE (enheder) = faste omk. / DB pr. enhed (84.000/28 = 3.000 kjoler). BE (kr.) = faste omk. / DG (210.000).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Break-even", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 485}, {"id": "ØS-term-L8-004", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Mål-resultat (target operating income)", "back": "Enheder = (faste omk. + ønsket driftsresultat) / DB pr. enhed. Eks. (84.000 + 14.000)/28 = 3.500. Efter skat: ønsket resultat før skat = ønsket resultat efter skat / (1 − skattesats).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Target operating income", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 486}, {"id": "ØS-term-L8-005", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Sikkerhedsmargin og sikkerhedsgrad", "back": "Sikkerhedsmargin = forventet salg − BE-salg (enheder eller kr.). Sikkerhedsgrad = sikkerhedsmargin / forventet omsætning (Mary: 200 kjoler = 14.000 £ = 6,25 %). Lille margin = høj driftsrisiko.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Sikkerhedsmargin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 487}, {"id": "ØS-term-L8-006", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Driftsmæssig gearing (operating leverage)", "back": "Grad = samlet DB / driftsresultat (98.000/14.000 = 7,0 ⇒ 1 % salgsændring ≈ 7 % resultatændring). Høje faste og lave variable omk. = høj gearing og høj risiko.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Driftsmæssig gearing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 488}, {"id": "ØS-term-L8-008", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "Følsomhedsanalyse", "back": "Hvordan ændres resultatet når volumen, pris, VC eller FC ændres? Basisscenarie vs. optimistisk/forventet/pessimistisk; fokus på ændringer – poster der er ens i alle alternativer påvirker ikke valget.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Følsomhedsanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 489}, {"id": "ØS-term-L8-009", "course": "ØS", "lecture": 8, "type": "card", "kind": "metode", "front": "CVP med flere produkter", "back": "Brug vægtet gennemsnitligt DB efter salgsmix (eller DB pr. 'pakke'); BE gælder kun ved konstant mix – ændres mixet, ændres BE.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › CVP-modellens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "metode", "eksamen"], "level": "eksamen", "order": 490}, {"id": "ØS-term-L8-011", "course": "ØS", "lecture": 8, "type": "card", "kind": "hvorfor", "front": "Hvorfor giver høje faste omk. høj risiko?", "back": "Med høje faste og lave variable omk. er DG høj – resultatet svinger meget ved små salgsændringer (høj gearing), og BE-punktet ligger højt.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Driftsmæssig gearing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 491, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "hvorfor", "eksamen"]}, {"id": "ØS-term-L8-010", "course": "ØS", "lecture": 8, "type": "card", "kind": "eksempel", "front": "Eksempel: CVP trin for trin (Mary)", "back": "1) DB = 70 − 42 = 28; DG = 40 %. 2) BE = 84.000/28 = 3.000 stk. (210.000 £). 3) Mål 14.000: (84.000 + 14.000)/28 = 3.500. 4) Gearing ved 3.500: DB 98.000 / 14.000 = 7.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dresses by Mary", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 492, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "eksempel", "eksamen"]}, {"question": "Hvis produktmixet ændrer sig i CVP med flere produkter:", "options": ["BE er uændret", "Det gennemsnitlige DB ændres og BE gælder ikke længere", "FC ændres", "Pris ændres"], "answer": 1, "explanation": "Konstant mix er en CVP-antagelse; ændres mixet, ændres det vægtede DB og dermed BE. Forkert: FC og pris ændres ikke af mixet; BE er ikke uændret.", "id": "ØS-mc-068", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L8", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › CVP-modellens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 493}, {"question": "Dresses by Mary: pris 70, VC 42, FC 84.000. Break-even i enheder?", "options": ["1.200", "2.000", "3.000", "4.000"], "answer": 2, "explanation": "BE = 84.000/(70 − 42) = 3.000. Forkert: 1.200 = 84.000/70; 2.000 = 84.000/42; 4.000 er en tilfældig mængde.", "id": "ØS-mc-067", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L8", "mc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dresses by Mary", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 494}, {"id": "ØS-mc-104", "course": "ØS", "lecture": 8, "type": "mc", "kind": "mc", "question": "Pris 50, VC 30, FC 60.000, forventet salg 4.000 enh. Sikkerhedsgrad?", "options": ["25 %", "33 %", "50 %", "75 %"], "answer": 0, "explanation": "BE = 60.000/20 = 3.000. Sikkerhedsmargin = 1.000 enh. ⇒ 1.000/4.000 = 25 %. Forkert: 33 % deler med BE; 75 % er BE-andelen af salget.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 495, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "mc", "eksamen"]}, {"question": "[Eksamensstil] Pris 70, VC 42, FC 84.000. Beregn (a) BE i enheder og kr., (b) salg for driftsresultat 14.000, (c) sikkerhedsmargin og operating leverage ved salg af 4.000 enheder.", "model": "DB 28, DG 40 %. (a) 3.000 enh.; 210.000 kr. (b) (84.000 + 14.000)/28 = 3.500 enh. (c) Sikkerhedsmargin 1.000 enh. = 25 %; DB 112.000, resultat 28.000 ⇒ operating leverage 4,0.", "id": "ØS-sa-082", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L8", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Dresses by Mary", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 496}, {"question": "[Begrebsspørgsmål] Forklar begrebet driftsmæssig gearing (operating leverage).", "model": "Forholdet mellem DB og driftsresultat. Høje faste omk. ⇒ høj gearing ⇒ resultatet ændres procentvis mere end salget (både op og ned) – højere risiko.", "id": "ØS-sa-092", "course": "ØS", "lecture": 8, "lectureName": "L8 CVP-analyse", "type": "sa", "kind": "open", "tags": ["ØS", "ØS-L8", "open", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 8 › Operating leverage", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 497}, {"id": "ØS-sa-099", "course": "ØS", "lecture": 8, "type": "sa", "kind": "calc", "question": "[Eksamensstil] FC 200.000, pris 100, VC 60. Ønsket resultat efter skat 60.000, skat 22 %. Hvor mange enheder?", "model": "Før skat: 60.000/0,78 = 76.923. Enheder = (200.000 + 76.923)/40 = 6.923,1 ⇒ 6.924 enheder.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 498, "lectureName": "L8 CVP-analyse", "tags": ["ØS", "ØS-L8", "calc", "eksamen"]}, {"id": "ØS-term-L9-001", "course": "ØS", "lecture": 9, "type": "card", "kind": "begreb", "front": "Overcosting og undercosting", "back": "Over: objektet belastes med flere omk. end det forbruger (ser dyrere ud). Under: færre (ser mere rentabelt ud). Giver krydssubsidiering – for høje priser på standardprodukter, for lave på specialprodukter.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Overcosting og undercosting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "begreb", "grund"], "level": "grund", "order": 499}, {"id": "ØS-term-L9-002", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Traditionel omkostningsfordeling", "back": "Én eller få store puljer fordelt med volumenbaserede nøgler (løntimer, maskintimer). Misvisende når produkter varierer i volumen og kompleksitet – standardprodukter overcostes, specialprodukter undercostes.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Traditionel omkostningsfordeling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model", "grund"], "level": "grund", "order": 500}, {"id": "ØS-term-L9-003", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Activity-Based Costing (ABC)", "back": "Ressourcer → aktiviteter → omkostningsobjekter: produkter forbruger aktiviteter, aktiviteter forbruger ressourcer. Mange homogene aktivitetspuljer fordelt med cost drivers med årsagssammenhæng. Relevant ved store indirekte omk. og forskelligartede produkter.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC-systemets grundidé", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model", "grund"], "level": "grund", "order": 501}, {"id": "ØS-term-L9-004", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Tre retningslinjer for forbedret omkostningssystem", "back": "1) Spor så mange direkte omk. som økonomisk forsvarligt, 2) flere og mere homogene indirekte puljer, 3) hver pulje en fordelingsnøgle med rimelig årsagssammenhæng.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Tre retningslinjer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model", "grund"], "level": "grund", "order": 502}, {"id": "ØS-term-L9-005", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Omkostningshierarki", "back": "Enhedsniveau (pr. enhed: materialer, maskintid) → batchniveau (pr. serie: omstilling) → produkt-/serviceniveau (design, specifikationer) → kunde-/kanalniveau (kundebesøg) → facilitetsniveau (fabriksledelse, forsikring – svære at fordele).", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Omkostningshierarkier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model", "grund"], "level": "grund", "order": 503}, {"id": "ØS-term-L9-008", "course": "ØS", "lecture": 9, "type": "card", "kind": "model", "front": "Activity-Based Management (ABM)", "back": "Bruger ABC-information aktivt: ABC beregner hvad aktiviteter koster – ABM spørger hvorfor. Ændr priser, design, sortiment, batchstørrelser og kundebetingelser; reducér omstillinger. Høj produktomk. betyder ikke automatisk nedlæggelse.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Activity-Based Management", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "model", "grund"], "level": "grund", "order": 504}, {"id": "ØS-term-L9-010", "course": "ØS", "lecture": 9, "type": "card", "kind": "sammenligning", "front": "Traditionel fordeling vs. ABC", "back": "Traditionel: få puljer, volumenbaserede nøgler – standardprodukter overcostes, specialprodukter undercostes. ABC: mange aktivitetspuljer og cost drivers – mere præcis, men dyrere at drive.", "level": "grund", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 505, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "sammenligning", "grund"]}, {"id": "ØS-term-L9-006", "course": "ØS", "lecture": 9, "type": "card", "kind": "metode", "front": "De syv trin i ABC", "back": "Definér omkostningsobjekter → identificér direkte omk. → vælg aktiviteter og cost drivers → beregn aktivitetspuljernes omk. → beregn cost driver rate (pulje / samlet driver) → fordel til objekter (rate × forbrug) → summér direkte og fordelte omk.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › De syv trin i ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "metode", "eksamen"], "level": "eksamen", "order": 506}, {"id": "ØS-term-L9-007", "course": "ØS", "lecture": 9, "type": "card", "kind": "metode", "front": "Cost driver rate", "back": "Aktivitetspuljens omk. / samlet mængde af cost driveren (fx omstillingsomk. / antal omstillinger). Objektets andel = rate × objektets forbrug af driveren.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Omkostningssats", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "metode", "eksamen"], "level": "eksamen", "order": 507}, {"id": "ØS-term-L9-009", "course": "ØS", "lecture": 9, "type": "card", "kind": "eksempel", "front": "Eksempel: ABC-rate og fordeling", "back": "Omstillingspulje 50.000 / 200 omstillinger = 250 pr. omstilling. Produkt med 30 omstillinger: 7.500 kr.; ved 1.500 enheder = 5 kr. pr. enhed.", "level": "eksamen", "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › Cost driver rate", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "order": 508, "lectureName": "L9 ABC og ABM", "tags": ["ØS", "ØS-L9", "eksempel", "eksamen"]}, {"question": "I ABC fordeles aktivitetsomkostninger efter:", "options": ["Kun direkte løntimer", "Cost drivers med årsagssammenhæng", "Omsætning", "Lige fordeling"], "answer": 1, "explanation": "Cost drivers med årsagssammenhæng (fx antal omstillinger). Forkert: kun løntimer er traditionel volumenbaseret fordeling; omsætning og lige fordeling har ingen årsagssammenhæng.", "id": "ØS-mc-069", "course": "ØS", "lecture": 9, "lectureName": "L9 ABC og ABM", "type": "mc", "kind": "mc", "tags": ["ØS", "ØS-L9", "mc", "grund"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "grund", "order": 509}, {"question": "[Eksamensstil] Omstillingspulje 50.000 kr., 200 omstillinger. Produkt X: 30 serier à 1 omstilling, 1.500 enheder. Beregn cost driver rate og omstillingsomk. pr. enhed X.", "model": "Rate = 50.000/200 = 250 kr./omstilling. X: 30 × 250 = 7.500 kr. ⇒ 5 kr./enhed.", "id": "ØS-sa-083", "course": "ØS", "lecture": 9, "lectureName": "L9 ABC og ABM", "type": "sa", "kind": "calc", "tags": ["ØS", "ØS-L9", "calc", "eksamen"], "source": {"file": "Økonomistyring.docx", "section": "Lektion 9 › ABC", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "level": "eksamen", "order": 510}, {"id": "ØS-sa-100", "course": "ØS", "lecture": 9, "type": "sa", "kind": "calc", "question": "[Eksamensstil] IPO 300.000: omstilling 120.000 (60 omstillinger), kontrol 180.000 (300 kontroller). A: 10.000 enh., 10 omstillinger, 50 kontroller, 2.000 DLH. B: 2.000 enh., 50 omstillinger, 250 kontroller, 1.000 DLH. Sammenlign traditionel (DLH) og ABC pr. enhed.", "model": "Traditionel: 300.000/3.000 = 100/DLH ⇒ A 200.000 (2
