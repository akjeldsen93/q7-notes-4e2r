ind": "model", "front": "SCOR-modellen", "back": "Fem aktiviteter i forsyningskæden: Plan (balancere efterspørgsel og ressourcer), Source (leverandører, kontrakter), Make (produktion/service), Deliver (ordrer, lager, transport), Return (returnering, genbrug).", "source": {"file": "Operations Management.docx", "section": "Lektion 1 › SCOR-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L1 Intro til OM", "tags": ["OM", "OM-L1", "model", "grund"], "level": "grund", "order": 6}, {"id": "OM-term-L1-007", "course": "OM", "lecture": 1, "type": "card", "kind": "model", "front": "Værdiindeks", "back": "Vægtet gennemsnit af performancemål. Kunden vælger det produkt, der opfylder minimumskravene og har højest værdiindeks.", "source": {"file": "Operations Management.docx", "section": "Lektion 1 › Kundeværdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L1 Intro til OM", "tags": ["OM", "OM-L1", "model", "grund"], "level": "grund", "order": 7}, {"id": "OM-term-L1-009", "course": "OM", "lecture": 1, "type": "card", "kind": "model", "front": "SCOR + Balanced Scorecard", "back": "SCOR beskriver forsyningskædens aktiviteter (Plan, Source, Make, Deliver, Return); den kan supplere Balanced Scorecard med operationelle mål for kæden.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 1 › SCOR-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 8, "lectureName": "L1 Intro til OM", "tags": ["OM", "OM-L1", "model", "grund"]}, {"question": "Hvilken SCOR-aktivitet omfatter valg af leverandører og kontrakter?", "options": ["Plan", "Source", "Make", "Return"], "answer": 1, "explanation": "Source: leverandører, kontrakter og materialer. Forkert: Plan balancerer efterspørgsel og ressourcer; Make er produktionen; Return er returnering og genbrug.", "id": "OM-mc-085", "course": "OM", "lecture": 1, "lectureName": "L1 Intro til OM", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L1", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 1 › SCOR-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 9}, {"id": "OM-term-L2-001", "course": "OM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Strategisk fit (procesvalg)", "back": "Sammenhængen mellem markedskrav, produktkarakteristika og proceskapabiliteter. Før procesvalg: hvilke fysiske krav stiller produktet, hvor ens er produkterne, hvor stor er volumen, hvor sker kundetilpasningen? Intet procesvalg er bedst på alle mål.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Strategisk fit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "begreb", "grund"], "level": "grund", "order": 10}, {"id": "OM-term-L2-017", "course": "OM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Cyklustid (linje)", "back": "Den største stationsbelastning efter afbalancering – flaskehalsstationen bestemmer linjens kapacitet. Skal være ≤ takttid, ellers nås efterspørgslen ikke.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Linjeafbalancering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 11, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "begreb", "grund"]}, {"id": "OM-term-L2-002", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Job Shop", "back": "Meget lav volumen, meget høj variation, generalister og funktionelt layout (fx specialmaskiner). Fleksibel, men høje enhedsomkostninger.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 12}, {"id": "OM-term-L2-003", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Batchproduktion", "back": "Lav-middel volumen, middel-høj variation; produktion i partier, der kræver omstillinger.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 13}, {"id": "OM-term-L2-004", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Produktionslinje", "back": "Høj volumen, lav variation, specialiserede ressourcer og produktbaseret layout (fx bilproduktion).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 14}, {"id": "OM-term-L2-005", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Kontinuert produktion", "back": "Meget høj volumen, meget lav variation, kapitalintensiv med tæt koblede processer (fx olieraffinering).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Proceskontinuum", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 15}, {"id": "OM-term-L2-006", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Fast position", "back": "Produktet flyttes ikke – ressourcerne flyttes til produktet (fx skibsbygning).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Fast position", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 16}, {"id": "OM-term-L2-007", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Gruppeteknologi og cellulært layout", "back": "Produkter med lignende procesbehov samles i produktfamilier; ressourcerne organiseres i celler efter familiens dominerende flow (familie A → celle A). En hybridproces.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Hybridprocesser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 17}, {"id": "OM-term-L2-008", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Produkt-proces-matricen", "back": "Kobler volumen/standardisering med procesvalg: lav volumen + høj variation → Job Shop; mellem → Batch; høj volumen + lav variation → linje/kontinuert. Mismatch giver høje enhedsomk., dyre omstillinger, lange leveringstider og dårlig respons.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Produkt-proces-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 18}, {"id": "OM-term-L2-009", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Kundetilpasningspunkt (ETO/MTO/ATO/MTS)", "back": "Hvor kundeordren kommer ind: ETO (design efter ordre), MTO (produktion efter ordre), ATO (montage efter ordre), MTS (produktion før ordre). Tidligt punkt: høj fleksibilitet, lang leveringstid, høje omk. Sent: kort leveringstid, lave omk., begrænset fleksibilitet.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundetilpasningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 19}, {"id": "OM-term-L2-010", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Tre servicedimensioner", "back": "1) Servicepakken (forhold mellem fysiske og immaterielle elementer), 2) kundetilpasning (hvor meget servicen ændres fra kunde til kunde), 3) kundekontakt (interaktionens omfang).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Serviceprocesser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 20}, {"id": "OM-term-L2-011", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Kundeintroduceret variabilitet (Frei)", "back": "Fem typer: ankomst-, anmodnings-, kapacitets- (evne til selvbetjening), indsats- og subjektiv præferencevariabilitet. Håndteres ved segmentering, målrettet markedsføring, automatisering og standardisering af dele af servicen.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundeintroduceret variabilitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 21}, {"id": "OM-term-L2-012", "course": "OM", "lecture": 2, "type": "card", "kind": "model", "front": "Service blueprinting", "back": "Forbinder kundeoplevelsen med driften: kundehandlinger → front-room (synlige aktiviteter, direkte kontakt) → back-room (usynlig intern drift) → støtteprocesser (bemanding, IT). Grænser: kontaktlinje og synlighedslinje.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Service Blueprinting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "model", "grund"], "level": "grund", "order": 22}, {"id": "OM-term-L2-022", "course": "OM", "lecture": 2, "type": "card", "kind": "sammenligning", "front": "Job Shop vs. produktionslinje", "back": "Job Shop: lav volumen, høj variation, generalister, funktionelt layout – fleksibel men dyr pr. enhed. Linje: høj volumen, lav variation, specialiserede ressourcer, produktlayout – billig pr. enhed men ufleksibel.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Produkt-proces-matricen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 23, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "sammenligning", "grund"]}, {"id": "OM-term-L2-023", "course": "OM", "lecture": 2, "type": "card", "kind": "sammenligning", "front": "MTS vs. MTO", "back": "MTS: produceres før ordren – kort leveringstid, lave omk., lav fleksibilitet, kræver forecast. MTO: produceres efter ordren – høj fleksibilitet, længere leveringstid, intet færdigvarelager.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundetilpasningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 24, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "sammenligning", "grund"]}, {"id": "OM-term-L2-020", "course": "OM", "lecture": 2, "type": "card", "kind": "hvorfor", "front": "Hvorfor rundes Wmin op?", "back": "En station kan ikke deles – med færre stationer end den beregnede værdi bliver mindst én stationstid større end takttiden, og efterspørgslen kan ikke nås.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 25, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "hvorfor", "grund"]}, {"id": "OM-term-L2-018", "course": "OM", "lecture": 2, "type": "card", "kind": "begreb", "front": "Begrænsninger ved linjeafbalancering", "back": "Heuristikken ser bort fra kvalitet, variation i opgavetider og ergonomi – resultatet er et udgangspunkt, ikke en færdig løsning.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Linjeafbalancering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 26, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "begreb", "eksamen"]}, {"id": "OM-term-L2-013", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Takttid", "back": "Takttid = tilgængelig produktionstid / efterspørgsel. Den maksimalt tilladte tid mellem to færdige enheder. Eks.: 3.600 s / 60 enh. = 60 s.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode", "eksamen"], "level": "eksamen", "order": 27}, {"id": "OM-term-L2-014", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Minimum antal stationer (Wmin)", "back": "Wmin = samlet arbejdstid / takttid, rundes altid op. Eks.: 180 s / 60 s = 3 stationer.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode", "eksamen"], "level": "eksamen", "order": 28}, {"id": "OM-term-L2-015", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Linjeafbalancering", "back": "Fordel opgaver på stationer, så outputkravet nås med færrest stationer og mindst spildtid. Heuristik: vælg den længste kvalificerede opgave, overhold præcedens, stationstid ≤ takttid.", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Linjeafbalancering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode", "eksamen"], "level": "eksamen", "order": 29}, {"id": "OM-term-L2-016", "course": "OM", "lecture": 2, "type": "card", "kind": "metode", "front": "Belastningsfunktion (funktionelt layout)", "back": "L = Σ(Nij × Dij), Nij = antal ture mellem afdeling i og j, Dij = afstand. Placér afdelinger med stort flow tæt og centralt; test ombytninger. Heuristik, fordi antal layout = N!. Eks.: byt B og C → 1.900 → 1.400 tur-meter (≈26 %).", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Funktionelt layout", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "metode", "eksamen"], "level": "eksamen", "order": 30}, {"id": "OM-term-L2-019", "course": "OM", "lecture": 2, "type": "card", "kind": "eksempel", "front": "Eksempel: takttid og Wmin", "back": "1) Takttid = tilgængelig tid / efterspørgsel = 3.600 s / 60 = 60 s. 2) Wmin = samlet arbejdstid / takttid = 180/60 = 3. 3) Rund altid op (2,1 → 3).", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 31, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "eksempel", "eksamen"]}, {"id": "OM-term-L2-021", "course": "OM", "lecture": 2, "type": "card", "kind": "eksempel", "front": "Eksempel: belastningsfunktion", "back": "1) Gang antal ture Nij med afstand Dij for hvert afdelingspar. 2) Summér: L = Σ Nij·Dij. 3) Byt to afdelinger med stort flow tættere på hinanden og beregn L igen. Eks.: byt B og C → 1.900 → 1.400 tur-meter (−26 %).", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Funktionelt layout", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 32, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "eksempel", "eksamen"]}, {"question": "Hvilken proces passer bedst til olieraffinering?", "options": ["Job Shop", "Batch", "Kontinuert produktion", "Fast position"], "answer": 2, "explanation": "Kontinuert produktion: meget høj volumen, meget lav variation, kapitalintensiv. Forkert: Job Shop og Batch er til lav/middel volumen med variation; Fast position bruges, når produktet ikke kan flyttes (skibe).", "id": "OM-mc-064", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L2", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kontinuert produktion", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 33}, {"question": "En konfigurerbar computer, hvor kundeordren aktiverer montage, er et eksempel på:", "options": ["MTS", "ATO", "MTO", "ETO"], "answer": 1, "explanation": "ATO: komponenterne findes på lager, og kundeordren aktiverer montagen. Forkert: MTS er produceret før ordren; MTO starter selve produktionen ved ordren; ETO starter allerede ved design.", "id": "OM-mc-065", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L2", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Kundetilpasningspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 34}, {"question": "Samlet arbejdstid 180 s, produktionstid 3.600 s, efterspørgsel 60 enheder. Minimum antal stationer?", "options": ["2", "3", "4", "6"], "answer": 1, "explanation": "Takttid = 3.600/60 = 60 s; Wmin = 180/60 = 3. Forkert: 2 giver stationstid > takttid; 4 og 6 er mere end minimum; man runder op, ikke ned.", "id": "OM-mc-066", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L2", "mc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Eksempel på linjeafbalancering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 35}, {"question": "Opgavetider i alt 250 s; efterspørgsel 40 enheder pr. time. Beregn takttid og minimum antal stationer.", "model": "Takttid = 3.600/40 = 90 s. Wmin = 250/90 = 2,78 → rundes op til 3 stationer.", "id": "OM-sa-086", "course": "OM", "lecture": 2, "lectureName": "L2 Procesvalg", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L2", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 2 › Takttid", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 36}, {"id": "OM-sa-097", "course": "OM", "lecture": 2, "type": "sa", "kind": "calc", "question": "[Øvelse] Et skift har 7,5 timer produktionstid; efterspørgslen er 450 enheder. Opgavetiderne summer til 290 s. Beregn takttid og Wmin.", "model": "Takttid = 27.000 s / 450 = 60 s. Wmin = 290/60 = 4,83 → 5 stationer.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 37, "lectureName": "L2 Procesvalg", "tags": ["OM", "OM-L2", "calc", "eksamen"]}, {"id": "OM-term-L3-001", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Performance measurement vs. performance management", "back": "Measurement: den tekniske proces – registrere data, beregne indikatorer, rapportere. Management: bruge målingerne til at påvirke adfærd og beslutninger og understøtte strategien. Målinger er ikke neutrale – de signalerer, hvad der er vigtigt.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Præstationsmåling og præstationsledelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb", "grund"], "level": "grund", "order": 38}, {"id": "OM-term-L3-002", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Lagging indikator", "back": "Viser resultatet af tidligere handlinger; bagudskuende (fx ROI, kundetilfredshed efter levering, punktlighed sidste kvartal).", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading og lagging indikatorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb", "grund"], "level": "grund", "order": 39}, {"id": "OM-term-L3-003", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Leading indikator", "back": "Peger på fremtidig performance; måler aktiviteter og drivere og kan forebygge problemer (fx medarbejdertræning, forecastnøjagtighed, gennemført vedligehold). Skaber grundlaget for senere lagging-resultater.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading og lagging indikatorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb", "grund"], "level": "grund", "order": 40}, {"id": "OM-term-L3-004", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "KPI'er på ledelsesniveauer", "back": "Strategisk (direktion, år: markedsandel, ROI), taktisk (afdelingsledere, måneder: lageromsætning, leveringspræcision), operationelt (teamledere, dage/realtid: maskinudnyttelse, fejlrate). KPI'en skal passe til den, der beslutter.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › KPI'er på forskellige ledelsesniveauer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb", "grund"], "level": "grund", "order": 41}, {"id": "OM-term-L3-009", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Objectives, KPI'er, targets, initiatives", "back": "Objective: hvad vi vil opnå (fx reducere fejl). KPI: hvordan det måles. Target: det konkrete niveau/deadline. Initiative: projektet/handlingen, der skal nå målet – vælges først når målene er defineret.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Fra strategi til handling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb", "grund"], "level": "grund", "order": 42}, {"id": "OM-term-L3-010", "course": "OM", "lecture": 3, "type": "card", "kind": "begreb", "front": "Gaming og suboptimering", "back": "En måling forbedres på kort sigt uden at den samlede performance forbedres (fx udskudt vedligehold for at nå produktionsmål). Undgås med balancerede mål og kombination af objektiv og subjektiv evaluering.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Gaming og suboptimering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "begreb", "grund"], "level": "grund", "order": 43}, {"id": "OM-term-L3-005", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Agency Theory", "back": "Antager at medarbejdere og ledelse har forskellige interesser → fokus på kontrol, overvågning, incitamenter og bonus via målbare KPI'er.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Agency Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model", "grund"], "level": "grund", "order": 44}, {"id": "OM-term-L3-006", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Stewardship Theory", "back": "Antager at medarbejdere ønsker at bidrage → fokus på faglig stolthed, udvikling og indre motivation; målesystemer som støtte til læring frem for kontrol.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Stewardship Theory", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model", "grund"], "level": "grund", "order": 45}, {"id": "OM-term-L3-007", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Balanced Scorecard (BSC)", "back": "Fire perspektiver ud over finans: finansielt (værdi for ejerne), kunde (hvordan oplever kunderne os?), interne processer (hvad skal vi være dygtige til?), læring og vækst (hvordan udvikler vi os?).", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Balanced Scorecard", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model", "grund"], "level": "grund", "order": 46}, {"id": "OM-term-L3-008", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "Strategy map", "back": "Viser forventede årsag-virkningssammenhænge: læring og vækst → interne processer → kundeværdi → finansielle resultater. Virksomhedens teori om værdiskabelse – hypoteser der løbende testes.", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Strategy Map", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model", "grund"], "level": "grund", "order": 47}, {"id": "OM-term-L3-013", "course": "OM", "lecture": 3, "type": "card", "kind": "model", "front": "BSC-logikken (mission → initiatives)", "back": "Mission → strategi → objectives → KPI'er → targets → initiatives. Initiativer vælges først, når mål og målinger er defineret.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Balanced Scorecard", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 48, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "model", "grund"]}, {"id": "OM-term-L3-014", "course": "OM", "lecture": 3, "type": "card", "kind": "sammenligning", "front": "Agency vs. Stewardship", "back": "Agency: interesser er forskellige → kontrol, overvågning og bonus på KPI'er. Stewardship: medarbejdere vil bidrage → målinger som støtte til læring og indre motivation.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Agency og Stewardship", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 49, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "sammenligning", "grund"]}, {"id": "OM-term-L3-015", "course": "OM", "lecture": 3, "type": "card", "kind": "sammenligning", "front": "Leading vs. lagging indikator", "back": "Leading måler drivere og peger frem (træning, vedligehold) – kan forebygge. Lagging måler resultater bagud (ROI, punktlighed sidste kvartal). Begge behøves: leading skaber senere lagging-resultater.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading og lagging", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 50, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "sammenligning", "grund"]}, {"id": "OM-term-L3-012", "course": "OM", "lecture": 3, "type": "card", "kind": "metode", "front": "Root Cause Analysis", "back": "Når en KPI udvikler sig negativt, findes den bagvedliggende årsag – strategiske problemer brydes ned til operationelle årsager (fx faldende punktlighed: leverandørpålidelighed, vedligehold, responstid, fejlrapportering). »Det man måler, styrer man.«", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Root Cause Analysis", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "metode", "eksamen"], "level": "eksamen", "order": 51}, {"id": "OM-term-L3-011", "course": "OM", "lecture": 3, "type": "card", "kind": "sammenligning", "front": "Objektiv vs. subjektiv præstationsevaluering", "back": "Objektiv: målbare data – sammenlignelig og opleves retfærdig, men giver tunnelsyn. Subjektiv: lederens helhedsvurdering – fanger usynlige bidrag, men risiko for bias og favorisering. Bedst kombineret (holistisk).", "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Objektiv og subjektiv præstationsevaluering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L3 Præstationsmåling og ledelse", "tags": ["OM", "OM-L3", "sammenligning", "eksamen"], "level": "eksamen", "order": 52}, {"question": "Hvilken er en leading indikator?", "options": ["ROI", "Kundetilfredshed efter levering", "Gennemført vedligeholdelse", "Punktlighed i sidste kvartal"], "answer": 2, "explanation": "Gennemført vedligehold er en driver, der peger fremad (leading). Forkert: ROI, kundetilfredshed efter levering og punktlighed sidste kvartal måler resultater af tidligere handlinger (lagging).", "id": "OM-mc-067", "course": "OM", "lecture": 3, "lectureName": "L3 Præstationsmåling og ledelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L3", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Leading indikatorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 53}, {"question": "Medarbejderuddannelse hører i BSC til perspektivet:", "options": ["Finansielt", "Kunde", "Interne processer", "Læring og vækst"], "answer": 3, "explanation": "Læring og vækst dækker medarbejdere, kompetencer og innovation. Forkert: finansielt = værdi for ejerne; kunde = kundens oplevelse; interne processer = hvad vi skal være dygtige til.", "id": "OM-mc-068", "course": "OM", "lecture": 3, "lectureName": "L3 Præstationsmåling og ledelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L3", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 3 › De fire perspektiver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 54}, {"question": "Konstruér et simpelt Balanced Scorecard med strategy map for en produktionsvirksomhed med fokus på leveringspræcision.", "model": "Læring & vækst: medarbejdertræning (KPI timer/medarbejder) → interne processer: vedligeholdelsesplan, gennemløbstid → kunde: leveringspræcision, klager → finansielt: omsætningsvækst/overskud. For hver: objective, KPI, target, initiative. Pas på gaming/suboptimering; sammenhænge er hypoteser.", "id": "OM-sa-095", "course": "OM", "lecture": 3, "lectureName": "L3 Præstationsmåling og ledelse", "type": "sa", "kind": "open", "tags": ["OM", "OM-L3", "open", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 3 › Balanced Scorecard / Strategy Map", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 55}, {"id": "OM-term-L5-001", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Kapacitet", "back": "Evnen til at producere et bestemt output inden for en given periode (mængde + tid). For lidt kapacitet: ventetid, forsinkelser, mistet salg. For meget: høje faste omk. og lav udnyttelse.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Kapacitetsbegrebet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb", "grund"], "level": "grund", "order": 56}, {"id": "OM-term-L5-002", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Input- vs. outputbaseret kapacitetsmål", "back": "Output (biler vasket/time, liter/dag) ved standardiserede produkter. Input (fakturerbare timer, hotelværelser, sengepladser) ved kundetilpassede ydelser.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Input- og outputbaserede kapacitetsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb", "grund"], "level": "grund", "order": 57}, {"id": "OM-term-L5-003", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Teoretisk vs. normeret kapacitet", "back": "Teoretisk: maks. output under ideelle forhold (ingen nedbrud, pauser, omstilling, spild). Normeret: realistisk langsigtet niveau inkl. planlagt vedligehold, pauser, omstillinger og forventet spild.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Teoretisk og normeret kapacitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb", "grund"], "level": "grund", "order": 58}, {"id": "OM-term-L5-004", "course": "OM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Flaskehals / svageste led", "back": "Det trin med mindst kapacitet bestemmer hele kædens output – også hos leverandører og distributører. Eks.: store ovne hjælper ikke, hvis pakningen er langsom.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Faktorer der begrænser kapaciteten", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "begreb", "grund"], "level": "grund", "order": 59}, {"id": "OM-term-L5-005", "course": "OM", "lecture": 5, "type": "card", "kind": "model", "front": "Lead-strategi", "back": "Kapaciteten udvides før efterspørgslen opstår. + høj leveringsevne, vinde markedsandele. − ledig kapacitet, høje faste omk., kapital bindes før indtægter. Relevant når mangel er dyr eller kapacitet tager lang tid.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Lead-strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "model", "grund"], "level": "grund", "order": 60}, {"id": "OM-term-L5-006", "course": "OM", "lecture": 5, "type": "card", "kind": "model", "front": "Lag-strategi", "back": "Kapaciteten udvides først når efterspørgslen er realiseret. + høj udnyttelse, lav risiko for ledig kapacitet. − risiko for kapacitetsmangel, tabt salg og længere leveringstid.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Lag-strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "model", "grund"], "level": "grund", "order": 61}, {"id": "OM-term-L5-007", "course": "OM", "lecture": 5, "type": "card", "kind": "model", "front": "Match-strategi", "back": "Kombinerer elementer fra lead og lag. Valg af kapacitetsstrategi afhænger af efterspørgselsusikkerhed, leveringstid på ny kapacitet, omk. ved over- vs. underkapacitet, finansiel styrke, konkurrence og mulighed for at udvide i små trin.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Match-strategi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "model", "grund"], "level": "grund", "order": 62}, {"id": "OM-term-L5-016", "course": "OM", "lecture": 5, "type": "card", "kind": "sammenligning", "front": "Lead vs. lag", "back": "Lead: udvid før efterspørgslen – høj leveringsevne, men ledig kapacitet og kapital bundet tidligt. Lag: udvid efter – høj udnyttelse og lav risiko, men risiko for mangel og tabt salg.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Kapacitetsstrategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 63, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "sammenligning", "grund"]}, {"id": "OM-term-L5-008", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Indifferenspunkt", "back": "Aktivitetsniveau hvor to alternativer har samme totalomk.: FC₁ + VC₁·X = FC₂ + VC₂·X ⇒ X = (FC₂ − FC₁)/(VC₁ − VC₂). Eks. spot 1.800X vs. kontrakt 60.000 + 750X ⇒ X ≈ 57 leveringer.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Indifferenspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode", "eksamen"], "level": "eksamen", "order": 64}, {"id": "OM-term-L5-009", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Break-even (kapacitet)", "back": "Viser hvornår indtægterne dækker omkostningerne: X = FC / (indtægt pr. enhed − VC). Bruges til at vurdere, om et kapacitetsalternativ er rentabelt (fx DB 2.500 kr. pr. levering i Vestjysk Møbelfragt).", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Break-even", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode", "eksamen"], "level": "eksamen", "order": 65}, {"id": "OM-term-L5-010", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Læringskurve", "back": "Tₙ = T₁·nᵇ, b = ln(læringsprocent)/ln(2). Tₙ = tid for enhed n, T₁ = tid for første enhed. Ved 80 % falder tiden til 80 % hver gang kumuleret produktion fordobles. Øger effektiv kapacitet uden flere ressourcer.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Læringskurver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode", "eksamen"], "level": "eksamen", "order": 66}, {"id": "OM-term-L5-011", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Forventet værdi", "back": "EV = Σ(sandsynlighed × udfald). Bruges ved usikker efterspørgsel til at sammenligne kapacitetsalternativer – suppleres med risikovurdering.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Forventet værdi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode", "eksamen"], "level": "eksamen", "order": 67}, {"id": "OM-term-L5-012", "course": "OM", "lecture": 5, "type": "card", "kind": "metode", "front": "Beslutningstræ", "back": "Tegnes fra venstre mod højre: beslutningspunkter (kvadrat) og udfaldspunkter (cirkel, sandsynligheder summer til 100 %). Løses ved baglæns induktion: beregn EV i udfaldspunkter, vælg bedste gren i beslutningspunkter. Suppleres med kvalitative vurderinger.", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Beslutningstræer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "metode", "eksamen"], "level": "eksamen", "order": 68}, {"id": "OM-term-L5-017", "course": "OM", "lecture": 5, "type": "card", "kind": "hvorfor", "front": "Hvornår vælges lead-strategi?", "back": "Når kapacitetsmangel er dyr (tabt salg, kunder skifter), når ny kapacitet tager lang tid at etablere, og når virksomheden har finansiel styrke til at bære ledig kapacitet.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Kapacitetsstrategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 69, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "hvorfor", "eksamen"]}, {"id": "OM-term-L5-013", "course": "OM", "lecture": 5, "type": "card", "kind": "eksempel", "front": "Eksempel: indifferenspunkt", "back": "Spot 1.800X vs. kontrakt 60.000 + 750X. 1) Sæt totalomk. lig hinanden: 1.800X = 60.000 + 750X. 2) Isolér: 1.050X = 60.000. 3) X ≈ 57. 4) Fortolk: under 57 leveringer er spot billigst, over er kontrakt.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Vestjysk Møbelfragt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 70, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "eksempel", "eksamen"]}, {"id": "OM-term-L5-014", "course": "OM", "lecture": 5, "type": "card", "kind": "eksempel", "front": "Eksempel: læringskurve", "back": "T₁ = 12 min, 80 %: enhed 2 = 9,6; enhed 4 = 7,68; enhed 8 ≈ 6,14 min. Generelt Tₙ = T₁·nᵇ med b = ln(0,8)/ln(2) ≈ −0,322.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Læringskurven", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 71, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "eksempel", "eksamen"]}, {"id": "OM-term-L5-015", "course": "OM", "lecture": 5, "type": "card", "kind": "eksempel", "front": "Eksempel: beslutningstræ", "back": "1) Tegn beslutning (□) og udfald (○) fra venstre. 2) Skriv sandsynligheder og payoffs. 3) Baglæns: EV i hver cirkel = Σ p·udfald. 4) I hvert kvadrat vælges grenen med bedst EV. 5) Vurdér risiko kvalitativt.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Beslutningstræer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 72, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "eksempel", "eksamen"]}, {"question": "Et advokatkontor måler kapacitet i fakturerbare timer. Det er et:", "options": ["Outputmål", "Inputmål", "Teoretisk mål", "Normeret mål"], "answer": 1, "explanation": "Inputmål – kapaciteten måles i ressourcen (timer), fordi ydelserne er kundetilpassede. Forkert: outputmål kræver standardiseret output; teoretisk/normeret angiver niveau, ikke type af mål.", "id": "OM-mc-069", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L5", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Inputbaserede kapacitetsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 73}, {"question": "Spot koster 1.800 kr./levering; kontrakt 60.000 kr. + 750 kr./levering. Indifferenspunkt?", "options": ["≈ 33", "≈ 57", "≈ 80", "≈ 333"], "answer": 1, "explanation": "1.800X = 60.000 + 750X ⇒ X = 60.000/1.050 ≈ 57. Forkert: ≈333 er indifferenspunktet kontrakt/leasing; 33 og 80 kommer ud af forkerte divisioner.", "id": "OM-mc-070", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L5", "mc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Indifferenspunkt (Vestjysk Møbelfragt)", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 74}, {"question": "Første enhed tager 100 timer; læringsprocent 80 %. Hvor lang tid tager enhed nr. 4?", "model": "Fordobling to gange: 100 · 0,8² = 64 timer. (b = ln0,8/ln2 ≈ −0,322; 100·4^−0,322 ≈ 64.)", "id": "OM-sa-087", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L5", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Læringskurver", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 75}, {"question": "Kontrakt: 60.000 + 750X; leasing: 210.000 + 300X. Find indifferenspunktet og fortolk.", "model": "60.000 + 750X = 210.000 + 300X ⇒ 450X = 150.000 ⇒ X ≈ 333. Under ≈333 leveringer er kontrakt billigst, over er leasing billigst.", "id": "OM-sa-088", "course": "OM", "lecture": 5, "lectureName": "L5 Kapacitetsstyring", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L5", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 5 › Indifferenspunkt", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 76}, {"id": "OM-sa-098", "course": "OM", "lecture": 5, "type": "sa", "kind": "calc", "question": "[Øvelse] Første enhed tager 50 timer; læringsprocent 90 %. Hvor lang tid tager enhed 8?", "model": "8 = tre fordoblinger: 50 · 0,9³ = 36,45 timer.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 77, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "calc", "eksamen"]}, {"id": "OM-sa-099", "course": "OM", "lecture": 5, "type": "sa", "kind": "calc", "question": "[Øvelse] Alternativ A: 60 % sandsynlighed for +500, 40 % for −100. Alternativ B: 60 % for +300, 40 % for +100. Hvilket vælges efter EV – og hvad taler imod?", "model": "EV(A) = 0,6·500 + 0,4·(−100) = 260. EV(B) = 0,6·300 + 0,4·100 = 220. A har højest EV, men B kan ikke give tab – en risikoavers beslutningstager kan foretrække B.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 78, "lectureName": "L5 Kapacitetsstyring", "tags": ["OM", "OM-L5", "calc", "eksamen"]}, {"id": "OM-term-L6-005", "course": "OM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Steady state", "back": "Tilstanden hvor gennemsnitlige ankomster pr. tidsenhed = gennemsnitlige afgange; her gælder Littles lov og køformlerne.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Køteoriens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "begreb", "grund"], "level": "grund", "order": 79}, {"id": "OM-term-L6-008", "course": "OM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Gennemsnit skjuler risiko (Martingale)", "back": "At dimensionere efter gennemsnitlig efterspørgsel kan se fornuftigt ud, men bryde sammen når variationen rammer – simulation afslører den risiko.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Når gennemsnittet ser trygt ud", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "begreb", "grund"], "level": "grund", "order": 80}, {"id": "OM-term-L6-001", "course": "OM", "lecture": 6, "type": "card", "kind": "model", "front": "Køteori – antagelser", "back": "Lukkede formler (6.6–6.11) kræver: Poisson-ankomster, eksponentialfordelt servicetid, én kanal og én fase, FCFS, uendelig population og steady state.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Køteoriens antagelser", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "model", "grund"], "level": "grund", "order": 81}, {"id": "OM-term-L6-007", "course": "OM", "lecture": 6, "type": "card", "kind": "model", "front": "Theory of Constraints", "back": "»Elevate the constraint«: en lille forbedring ved flaskehalsen slår langt hårdere igennem end forbedringer andre steder (pollenfilter 14 → 11 min halverer køen).", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Kapacitetsbeslutning: flaskehals i serie", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "model", "grund"], "level": "grund", "order": 82}, {"id": "OM-term-L6-002", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Udnyttelsesgrad ρ", "back": "ρ = λ/µ, λ = ankomstrate, µ = servicerate. Eks. 4/6 ≈ 66,7 %. Når λ → µ, vokser ventetiden kraftigt.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode", "eksamen"], "level": "eksamen", "order": 83}, {"id": "OM-term-L6-003", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Køformler (én kanal)", "back": "CS = λ/(µ−λ) (antal i systemet); TS = 1/(µ−λ) (tid i systemet); TW = λ/(µ(µ−λ)) (ventetid i kø); CW = λ²/(µ(µ−λ)) (antal i kø).", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode", "eksamen"], "level": "eksamen", "order": 84}, {"id": "OM-term-L6-004", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Littles lov", "back": "I = R · T: antal i systemet = gennemløbsrate × gennemløbstid. Gælder altid, uanset fordelinger – bruges som tjek på simulationsresultater (CW = R·TW, CS = R·TS).", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Littles lov som tjek", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode", "eksamen"], "level": "eksamen", "order": 85}, {"id": "OM-term-L6-006", "course": "OM", "lecture": 6, "type": "card", "kind": "metode", "front": "Monte Carlo-simulation af kø (Excel)", "back": "Trin 1 deterministisk (faste tider → ingen kø), trin 2 stokastisk (=-15*LN(RAND()), =-10*LN(RAND())), trin 3 ≥100 kunder pr. run + Data Table med ≥50 replikationer. Starttid = MAX(ankomst; forrige sluttid). Bruges når formlernes antagelser ikke holder.", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Simulation i tre trin", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "metode", "eksamen"], "level": "eksamen", "order": 86}, {"id": "OM-term-L6-010", "course": "OM", "lecture": 6, "type": "card", "kind": "hvorfor", "front": "Hvorfor simulere i stedet for formler?", "back": "Køformlerne kræver Poisson-ankomster, eksponentiel servicetid, én kanal og steady state. Holder antagelserne ikke (flere faser, andre fordelinger, opstart), giver simulation et realistisk billede – Littles lov bruges som tjek.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Simulation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 87, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "hvorfor", "eksamen"]}, {"id": "OM-term-L6-009", "course": "OM", "lecture": 6, "type": "card", "kind": "eksempel", "front": "Eksempel: køformler (λ = 4, µ = 6)", "back": "ρ = 4/6 = 0,667. CS = 4/(6−4) = 2. TS = 1/2 t = 30 min. TW = 4/(6·2) = 1/3 t = 20 min. CW = 16/12 = 1,33. Tjek Littles lov: CS = λ·TS = 4·0,5 = 2 ✓.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Djursland Hurtigservice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 88, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "eksempel", "eksamen"]}, {"question": "λ = 4 biler/t, µ = 6 biler/t. Gennemsnitlig tid i systemet TS?", "options": ["10 min", "20 min", "30 min", "60 min"], "answer": 2, "explanation": "TS = 1/(µ−λ) = 1/(6−4) = 0,5 t = 30 min. Forkert: 20 min er TW (λ/(µ(µ−λ)) = 1/3 t); 10 min er servicetiden 1/µ; 60 min ville kræve µ−λ = 1.", "id": "OM-mc-071", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L6", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Eksempel: Djursland Hurtigservice", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 89}, {"question": "Hvad sker der med ventetiden, når λ nærmer sig µ?", "options": ["Den falder", "Den er uændret", "Den vokser kraftigt", "Den bliver negativ"], "answer": 2, "explanation": "µ−λ står i nævneren, så ventetiden vokser kraftigt, når λ → µ. Forkert: den falder ikke og er ikke uændret; ved λ ≥ µ er systemet ustabilt (køen vokser uden grænse), ikke negativt.", "id": "OM-mc-072", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L6", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 90}, {"question": "Hvilken sammenhæng gælder altid, uanset fordelinger?", "options": ["TW = λ/(µ(µ−λ))", "Littles lov I = R·T", "ρ < 1 ⇒ ingen kø", "CW = λ²/µ"], "answer": 1, "explanation": "Littles lov gælder uanset fordelinger og bruges som tjek. Forkert: TW-formlen kræver Poisson/eksponential-antagelser; ρ < 1 betyder stabilitet, ikke ingen kø; CW = λ²/(µ(µ−λ)), ikke λ²/µ.", "id": "OM-mc-073", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L6", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Littles lov som tjek", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 91}, {"question": "λ = 8 kunder/t, µ = 10 kunder/t. Beregn ρ, CS, TS, TW og CW.", "model": "ρ = 0,8; CS = 8/2 = 4; TS = 1/2 t = 30 min; TW = 8/(10·2) = 0,4 t = 24 min; CW = 64/20 = 3,2. Tjek Littles lov: CS = λ·TS = 8·0,5 = 4.", "id": "OM-sa-089", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L6", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Symboler og formler", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 92}, {"question": "Gennemsnitlig efterspørgsel 50 pr. dag, gennemløbstid 4 dage. Gennemsnitligt antal i systemet (Littles lov)?", "model": "I = R·T = 50 · 4 = 200 enheder.", "id": "OM-sa-090", "course": "OM", "lecture": 6, "lectureName": "L6 Køteori, Littles lov og simulation", "type": "sa", "kind": "calc", "tags": ["OM", "OM-L6", "calc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 6 › Littles lov", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 93}, {"id": "OM-sa-100", "course": "OM", "lecture": 6, "type": "sa", "kind": "calc", "question": "[Øvelse, jf. Hector's Shoe department] λ = 11 kunder/t; betjening tager 4 min (µ = 15/t). Beregn ρ, antal i kø og ventetid i kø.", "model": "ρ = 11/15 = 0,733. CW = λ²/(µ(µ−λ)) = 121/60 = 2,02 kunder. TW = λ/(µ(µ−λ)) = 11/60 = 0,183 t ≈ 11 min.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 94, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "calc", "eksamen"]}, {"id": "OM-sa-101", "course": "OM", "lecture": 6, "type": "sa", "kind": "open", "question": "[Excel] Beskriv opbygningen af en Monte Carlo-køsimulation i Excel.", "model": "Ankomst = forrige ankomst + mellemankomsttid (fx =-15*LN(RAND())). Servicetid = -10*LN(RAND()). Start = MAX(ankomst; forrige sluttid); slut = start + servicetid; ventetid = start − ankomst. ≥100 kunder pr. run, Data Table med ≥50 replikationer; rapportér gennemsnit og tjek med Littles lov.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 95, "lectureName": "L6 Køteori, Littles lov og simulation", "tags": ["OM", "OM-L6", "open", "eksamen"]}, {"id": "OM-term-L8-001", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Forecast", "back": "Et estimat af fremtidige værdier: Fₜ₊ₕ|ₜ = E(Dₜ₊ₕ | Iₜ) – forventet værdi h perioder frem givet informationen Iₜ. Svarer på »hvad kan forventes«, ikke »hvad bør vi gøre«.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Forecasting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb", "grund"], "level": "grund", "order": 96}, {"id": "OM-term-L8-002", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Efterspørgsels-, udbuds- og prisforecast", "back": "Efterspørgsel: driver produktion, lager, bemanding, transport. Udbud: tilgængelighed af råvarer, komponenter, arbejdskraft. Pris: salgspriser, råvarer, energi, valuta – påvirker timing af beslutninger.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Hvad forecastes?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb", "grund"], "level": "grund", "order": 97}, {"id": "OM-term-L8-004", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Uafhængig vs. afhængig efterspørgsel", "back": "Uafhængig: skabes af kunderne og skal forecastes. Afhængig: følger af en produktionsplan og kan beregnes (1.000 enh. × 4 komp. = 4.000).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Lov 4", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb", "grund"], "level": "grund", "order": 98}, {"id": "OM-term-L8-006", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Tidsseriemodel vs. kausal model", "back": "Tidsserie: fremtid estimeres ud fra tidligere observationer og tid. Kausal: variablen forklares af andre variable (fx pris, kampagner).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Kvantitative metoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb", "grund"], "level": "grund", "order": 99}, {"id": "OM-term-L8-007", "course": "OM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Tidsseriens komponenter", "back": "Niveau, trend (langsigtet op/ned), sæsonvariation (gentager sig med faste intervaller), konjunkturvariation (længere økonomiske bevægelser) og tilfældig variation.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Kvantitative metoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "begreb", "grund"], "level": "grund", "order": 100}, {"id": "OM-term-L8-003", "course": "OM", "lecture": 8, "type": "card", "kind": "model", "front": "De fire love om forecasting", "back": "1) Forecasts er næsten altid forkerte (mål fejl, opdatér). 2) Kortsigtede er mere præcise. 3) Grupper/aggregater er mere præcise (men mindre detaljerede). 4) Forecast ikke det, der kan beregnes (afhængig efterspørgsel).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › De fire love om forecasting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "model", "grund"], "level": "grund", "order": 101}, {"id": "OM-term-L8-015", "course": "OM", "lecture": 8, "type": "card", "kind": "sammenligning", "front": "MAD vs. MAPE", "back": "MAD: typisk fejl i enheder – god for samme produkt og til lager/kapacitet. MAPE: fejl i % – sammenlignelig på tværs af produkter, men umulig ved D = 0 og ekstrem ved små værdier.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Fejlmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 102, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "sammenligning", "grund"]}, {"id": "OM-term-L8-005", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "Kvalitative forecastmetoder", "back": "Bruges når data mangler eller ikke er repræsentative (nye produkter): panel consensus, Delphi (anonyme runder med feedback), market survey, life cycle analogy, build-up (sælgere/regioner summeres – risiko for optimisme).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Kvalitative metoder", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 103}, {"id": "OM-term-L8-008", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "Forecastfejl (FE)", "back": "FEᵢ = Dᵢ − Fᵢ. Positiv = forecastet for lavt (underforecast); negativ = for højt. Definitionen skal bruges konsekvent.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Forecastfejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 104}, {"id": "OM-term-L8-009", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "MFE (Mean Forecast Error)", "back": "MFE = ΣFEᵢ / n. Måler bias: positiv = systematisk underforecasting, negativ = overforecasting. MFE ≈ 0 betyder ikke præcision, fordi fejl kan udligne hinanden.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Mean Forecast Error", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 105}, {"id": "OM-term-L8-010", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "MAD (Mean Absolute Deviation)", "back": "MAD = Σ|FEᵢ| / n. Typisk fejl i samme enhed som data. God til at sammenligne modeller for samme produkt og koble til lager/kapacitet; dårlig på tværs af produkter med forskellig størrelse.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Mean Absolute Deviation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 106}, {"id": "OM-term-L8-011", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "MAPE", "back": "MAPE = (100/n)·Σ|FEᵢ/Dᵢ|. Fejl i procent – sammenlignelig på tværs af produkter. Kan ikke beregnes hvis Dᵢ = 0 (erstat fx med 0,01), og små værdier giver ekstreme %.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Mean Absolute Percentage Error", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 107}, {"id": "OM-term-L8-012", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "SSE og RMSE", "back": "SSE = ΣFEᵢ²; RMSE = √(SSE/n). Kvadrering straffer store fejl hårdt – relevant når store fejl er dyre; følsom for ekstreme observationer. Skal være så lav som mulig.", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › SSE og RMSE", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 108}, {"id": "OM-term-L8-013", "course": "OM", "lecture": 8, "type": "card", "kind": "metode", "front": "Tracking signal", "back": "TS = kumulativ forecastfejl / MAD. Overvåger bias over tid; kontrolgrænse typisk −4 ≤ TS ≤ +4. Udenfor → modellen beskriver ikke længere udviklingen (trendskifte, ændret marked).", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Tracking signal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "metode", "eksamen"], "level": "eksamen", "order": 109}, {"id": "OM-term-L8-016", "course": "OM", "lecture": 8, "type": "card", "kind": "hvorfor", "front": "Hvorfor bruge RMSE frem for MAD?", "back": "Når store fejl er særligt dyre (fx stockout), fordi kvadreringen straffer store fejl hårdere end små.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Fejlmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 110, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "hvorfor", "eksamen"]}, {"id": "OM-term-L8-014", "course": "OM", "lecture": 8, "type": "card", "kind": "eksempel", "front": "Eksempel: MAD, MAPE og MFE", "back": "D = 100, 120; F = 110, 110. FE = −10, +10. MFE = 0 (ingen bias), MAD = (10+10)/2 = 10, MAPE = (100/2)·(10/100 + 10/120) ≈ 9,2 %. MFE = 0 trods fejl viser, at MFE ikke måler præcision.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Fejlmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 111, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "eksempel", "eksamen"]}, {"question": "Hvilken lov siger, at et forecast for produktfamilien er mere præcist end for én variant?", "options": ["Lov 1", "Lov 2", "Lov 3", "Lov 4"], "answer": 2, "explanation": "Lov 3: aggregerede forecasts er mere præcise, fordi udsving udligner hinanden. Forkert: lov 1 = forecasts er forkerte; lov 2 = kort sigt er mere præcist; lov 4 = beregn afhængig efterspørgsel.", "id": "OM-mc-074", "course": "OM", "lecture": 8, "lectureName": "L8 Forecasting", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L8", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 8 › Lov 3", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 112}, {"id": "OM-mc-113", "course": "OM", "lecture": 8, "type": "mc", "kind": "mc", "question": "Et forecast har tracking signal +6 i flere perioder. Hvad betyder det?", "options": ["Modellen er præcis", "Systematisk underforecasting", "Systematisk overforecasting", "MAD er nul"], "answer": 1, "explanation": "TS > +4: kumuleret fejl (D − F) er positiv ⇒ efterspørgslen er konsekvent højere end forecastet. Forkert: præcision vurderes med MAD/RMSE; overforecasting giver negativt TS.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 113, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "mc", "eksamen"]}, {"id": "OM-sa-102", "course": "OM", "lecture": 8, "type": "sa", "kind": "calc", "question": "[Øvelse] Kumuleret forecastfejl efter 6 perioder er 40; MAD = 8. Beregn tracking signal og fortolk.", "model": "TS = 40/8 = 5 > 4 ⇒ uden for kontrolgrænsen: systematisk underforecasting – modellen bør revideres.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 114, "lectureName": "L8 Forecasting", "tags": ["OM", "OM-L8", "calc", "eksamen"]}, {"id": "OM-term-L9-006", "course": "OM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Additiv vs. multiplikativ sæson", "back": "Additiv: sæsonudsvinget er omtrent lige stort i absolutte enheder (Heartz: ca. 110). Multiplikativ: udsvinget vokser/falder med niveauet.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "begreb", "grund"], "level": "grund", "order": 115}, {"id": "OM-term-L9-007", "course": "OM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Validering og overfitting", "back": "Den model, der passer bedst historisk, er ikke nødvendigvis bedst fremad. Opdel i træningssæt (vælg model/parametre) og valideringssæt (test på usete data) – Heartz: tilpasset år 1–3, valideret år 4. Sammenlign modeller på samme perioder.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Validering og overfitting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "begreb", "grund"], "level": "grund", "order": 116}, {"id": "OM-term-L9-008", "course": "OM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Systematiske fejl", "back": "Fejl bør være tilfældige. Ligger modellen konsekvent lavt i opgang og højt i nedgang, mangler den en struktur (fx sæson) – løsningen er en anden model, ikke blot nye parametre.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Systematiske fejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "begreb", "grund"], "level": "grund", "order": 117}, {"id": "OM-term-L9-005", "course": "OM", "lecture": 9, "type": "card", "kind": "model", "front": "Holt-Winters (additiv)", "back": "Fₜ₊₁ = lₜ + bₜ + sₜ₊₁₋ₘ. Opdatering: lₜ = α(Dₜ − sₜ₋ₘ) + (1−α)(lₜ₋₁ + bₜ₋₁); bₜ = β(lₜ − lₜ₋₁) + (1−β)bₜ₋₁; sₜ = γ(Dₜ − lₜ) + (1−γ)sₜ₋ₘ. m = perioder pr. sæson (52 uger). Parametre vælges ved at minimere fejl.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters: de tre opdateringer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "model", "grund"], "level": "grund", "order": 118}, {"id": "OM-term-L9-009", "course": "OM", "lecture": 9, "type": "card", "kind": "model", "front": "Forecasting som beslutningsproces", "back": "Forstå data og beslutningsproblem → opstil kandidatmodeller → evaluér fejl → validér på nye data → vælg model ud fra beslutningens konsekvenser → overvåg løbende. Mere kompleksitet er kun værd, hvis det giver bedre beslutninger.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Forecasting som beslutningsproces", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "model", "grund"], "level": "grund", "order": 119}, {"id": "OM-term-L9-014", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Vægtet glidende gennemsnit (WMA)", "back": "Fₜ = Σ wᵢ·Dₜ₋ᵢ med Σwᵢ = 1; de seneste observationer vægtes højest (fx 0,6/0,4). Reagerer hurtigere end MA(n).", "level": "grund", "source": {"file": "Operations Management Opgavehæfte.docx", "section": "Opgavehæfte T4 › Forecasting 1", "path": "/workspace/OM/Tutorials/Operations Management Opgavehæfte.docx"}, "order": 120, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode", "grund"]}, {"id": "OM-term-L9-011", "course": "OM", "lecture": 9, "type": "card", "kind": "sammenligning", "front": "MA(n) vs. SES", "back": "MA(n): lige vægt på de n seneste observationer, kræver n data. SES: alle observationer med eksponentielt faldende vægt, styres af α. Begge egner sig kun uden trend/sæson.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Glidende gennemsnit og SES", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 121, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "sammenligning", "grund"]}, {"id": "OM-term-L9-001", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Naiv forecastmodel", "back": "Fₜ₊₁ = Dₜ – seneste observation er forecast. Simpel og hurtig; vigtig baseline som andre modeller skal slå. Kopierer støj og reagerer altid forsinket.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Naiv forecasting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode", "eksamen"], "level": "eksamen", "order": 122}, {"id": "OM-term-L9-002", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Glidende gennemsnit MA(n)", "back": "Fₜ = (Dₜ₋₁ + … + Dₜ₋ₙ)/n. Udjævner tilfældig variation: stort n = stabilt men langsomt; lille n = hurtigt men følger støj. Ligger bagefter ved trend. Kræver n observationer.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Glidende gennemsnit", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode", "eksamen"], "level": "eksamen", "order": 123}, {"id": "OM-term-L9-003", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Simpel eksponentiel udjævning (SES)", "back": "Fₜ = αDₜ₋₁ + (1−α)Fₜ₋₁, 0 ≤ α ≤ 1. Høj α = responsiv; lav α = mere udjævning. Alle observationer får vægt, faldende eksponentielt. Egnet ved stabilt niveau uden trend/sæson.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Simpel eksponentiel udjævning", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode", "eksamen"], "level": "eksamen", "order": 124}, {"id": "OM-term-L9-004", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Holts metode", "back": "Udvider SES med trend: opdaterer både niveau lₜ og trend bₜ. Forecast = lₜ + h·bₜ.", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters-modellen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode", "eksamen"], "level": "eksamen", "order": 125}, {"id": "OM-term-L9-013", "course": "OM", "lecture": 9, "type": "card", "kind": "metode", "front": "Holt-Winters i Excel (opsætning)", "back": "1) Startværdier for l, b og s. 2) Opdateringsformler i kolonner for l, b, s og forecast. 3) Beregn fejl og fx SSE/MAD. 4) Solver: minimer fejlmålet ved at ændre α, β, γ (0 ≤ … ≤ 1). 5) Validér på usete data.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 126, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "metode", "eksamen"]}, {"id": "OM-term-L9-012", "course": "OM", "lecture": 9, "type": "card", "kind": "hvorfor", "front": "Hvornår vælges Holt-Winters?", "back": "Når data har både trend og sæson (fx ugedata med årlig sæson, m = 52). SES/MA ligger systematisk bagefter ved trend og fanger ikke sæsonen.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Holt-Winters", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 127, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "hvorfor", "eksamen"]}, {"id": "OM-term-L9-015", "course": "OM", "lecture": 9, "type": "card", "kind": "hvorfor", "front": "Hvorfor sammenligne med naiv benchmark?", "back": "En avanceret model er kun værd at bruge, hvis den slår den naive model på samme perioder (Cooper Toys: naiv slog justeret ES ved α = 0,25, β = 0,4).", "level": "eksamen", "source": {"file": "Operations Management Opgavehæfte.docx", "section": "Opgavehæfte T4 › Cooper Toys", "path": "/workspace/OM/Tutorials/Operations Management Opgavehæfte.docx"}, "order": 128, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "hvorfor", "eksamen"]}, {"id": "OM-term-L9-010", "course": "OM", "lecture": 9, "type": "card", "kind": "eksempel", "front": "Eksempel: SES-opdatering", "back": "α = 0,3, Fₜ₋₁ = 90, Dₜ₋₁ = 100: Fₜ = 0,3·100 + 0,7·90 = 93. Forecastet flytter sig 30 % af fejlen (10) mod den seneste observation.", "level": "eksamen", "source": {"file": "Operations Management.docx", "section": "Lektion 9 › SES", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 129, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "eksempel", "eksamen"]}, {"question": "Hvilket fejlmål giver store fejl ekstra vægt?", "options": ["MFE", "MAD", "RMSE", "MAPE"], "answer": 2, "explanation": "RMSE kvadrerer fejlene, så store fejl vægtes ekstra. Forkert: MFE måler bias; MAD vægter alle fejl lineært; MAPE måler procentvis fejl.", "id": "OM-mc-075", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L9", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Måling af forecastfejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 130}, {"question": "Et MFE tæt på 0 betyder:", "options": ["Høj præcision", "Ingen systematisk skævhed – men fejl kan udligne hinanden", "At MAPE også er 0", "At modellen er overfittet"], "answer": 1, "explanation": "MFE ≈ 0: ingen systematisk skævhed, men positive og negative fejl kan udligne hinanden. Forkert: det siger intet om præcision (brug MAD/RMSE), intet om MAPE og intet om overfitting.", "id": "OM-mc-076", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L9", "mc", "grund"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Måling af forecastfejl", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "grund", "order": 131}, {"question": "Heartz-data har sæsonudsving på ca. 110 uafhængigt af niveauet. Hvilken model?", "options": ["SES", "Naiv", "Additiv Holt-Winters", "MA(5)"], "answer": 2, "explanation": "Trend + sæson med konstant absolut udsving ⇒ additiv Holt-Winters. Forkert: SES og naiv fanger hverken trend eller sæson; MA(5) udjævner sæsonen væk og ligger bagefter.", "id": "OM-mc-077", "course": "OM", "lecture": 9, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "type": "mc", "kind": "mc", "tags": ["OM", "OM-L9", "mc", "eksamen"], "source": {"file": "Operations Management.docx", "section": "Lektion 9 › Heartz-casen: nøgletal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "level": "eksamen", "order": 132}, {"id": "OM-sa-104", "course": "OM", "lecture": 9, "type": "sa", "kind": "calc", "question": "[Øvelse] Holt: niveau lₜ = 200, trend bₜ = 10. Forecast 3 perioder frem?", "model": "Fₜ₊₃ = lₜ + 3·bₜ = 200 + 30 = 230.", "level": "grund", "source": {"file": "Operations Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Operations Management.docx"}, "order": 133, "lectureName": "L9 Forecasting til beslutningsunderstøttelse", "tags": ["OM", "OM-L9", "calc", "grund"]}, {"question": "SES med α =
