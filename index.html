ål: kendskab og prøvekøb. Selektiv distribution, information/demonstration/PR.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 258}, {"id": "MM-term-L4-005", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: vækstfasen", "back": "Salget stiger hurtigt, omk. pr. kunde falder, profit vokser, flere konkurrenter. Mål: udbygge markedsandel (kvalitet, varianter, nye segmenter, bredere distribution, brandpræference). Valg mellem kortsigtet profit og langsigtet andel.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Vækstfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 259}, {"id": "MM-term-L4-006", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: modningsfasen", "back": "Væksten aftager, markedet mættes, intens konkurrence og profitpres. Mål: maksimere profit og forsvare andel via markedsmodifikation (nye brugere/anvendelser), produktmodifikation og modifikation af marketingmixet. Fastholdelse bliver centralt.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Modningsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 260}, {"id": "MM-term-L4-007", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "PLC: nedgangsfasen", "back": "Faldende salg og profit. Identificér svage produkter (profit, potentiale, strategisk betydning). Strategier: maintain, harvest (skær omk. for cash), repositionering, divest/udfasning.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Nedgangsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 261}, {"id": "MM-term-L4-011", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Porters generiske strategier", "back": "Omkostningslederskab (laveste omk. i branchen – lav pris er resultatet, ikke fordelen), differentiering (noget kunder opfatter som unikt; lykkes når betalingsvillighed > omk.), fokus (smalt segment/niche med omkostnings- eller differentieringsfokus).", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Porters generiske konkurrencestrategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 262}, {"id": "MM-term-L4-012", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Markedslederens strategier", "back": "Udvide det samlede marked (nye brugere, anvendelser, mere forbrug), beskytte markedsandelen og evt. øge den.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Markedslederens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 263}, {"id": "MM-term-L4-013", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Udfordrerens strategier", "back": "Vælg hvem der angribes (svag leder, svage lige store, små lokale). Frontalt angreb (efterligner modstanderens stærke sider – kræver ressourcer) eller flankeangreb (oversete segmenter/behov).", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Udfordrerens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 264}, {"id": "MM-term-L4-014", "course": "MM", "lecture": 4, "type": "card", "kind": "model", "front": "Følger- og nichestrategier", "back": "Følger: stabil profit uden at udfordre lederen; lærer af lederen, men skal have en tydelig fordel. Niche: specialisering efter kundegruppe, geografi, produkt, service eller kanal → høje marginer; risiko for afhængighed (multiple niching).", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Markedsfølgerens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "model", "grund"], "level": "grund", "order": 265}, {"id": "MM-term-L4-016", "course": "MM", "lecture": 4, "type": "card", "kind": "sammenligning", "front": "Skimming vs. penetration pricing", "back": "Skimming: høj startpris – ved tydelig differentiering og kunder, der betaler for nyhed. Penetration: lav startpris – ved prisfølsomt marked og stordriftsfordele, hurtig markedsandel.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 266, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "sammenligning", "grund"]}, {"id": "MM-term-L4-017", "course": "MM", "lecture": 4, "type": "card", "kind": "sammenligning", "front": "Omkostningslederskab vs. differentiering", "back": "Omkostningslederskab: laveste omk. i branchen (lav pris er resultatet). Differentiering: noget kunderne opfatter som unikt – lykkes når betalingsvilligheden overstiger meromkostningen.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Porters generiske strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 267, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "sammenligning", "grund"]}, {"id": "MM-term-L4-003", "course": "MM", "lecture": 4, "type": "card", "kind": "metode", "front": "Market-skimming pricing", "back": "Lancering til høj pris, der gradvist udnytter forskellige kunders betalingsvillighed. Relevant ved tydelig differentiering og kunder der vil betale for nyhed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "metode", "eksamen"], "level": "eksamen", "order": 268}, {"id": "MM-term-L4-004", "course": "MM", "lecture": 4, "type": "card", "kind": "metode", "front": "Market-penetration pricing", "back": "Lancering til relativt lav pris for hurtigt at vinde kunder og markedsandel. Relevant ved prisfølsomt marked og stordriftsfordele.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Introduktionsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "metode", "eksamen"], "level": "eksamen", "order": 269}, {"id": "MM-term-L4-010", "course": "MM", "lecture": 4, "type": "card", "kind": "metode", "front": "Konkurrentanalyse", "back": "Tre trin: identificér konkurrenterne, vurdér deres mål, strategier, styrker/svagheder og reaktioner, og beslut hvem der skal angribes eller undgås. Konkurrenter former også kundernes forventninger og spillereglerne.", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Konkurrentanalyse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "metode", "eksamen"], "level": "eksamen", "order": 270}, {"id": "MM-term-L4-018", "course": "MM", "lecture": 4, "type": "card", "kind": "sammenligning", "front": "Frontalt vs. flankeangreb", "back": "Frontalt: angriber modstanderens stærke sider direkte – kræver store ressourcer. Flanke: går efter oversete segmenter eller behov – billigere og mindre risikabelt.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Udfordrerens strategier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 271, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "sammenligning", "eksamen"]}, {"question": "Hvilken PLC-fase er kendetegnet ved aftagende vækst, intens konkurrence og profitpres?", "options": ["Introduktion", "Vækst", "Modning", "Nedgang"], "answer": 2, "explanation": "Modningsfasen: aftagende vækst, mættet marked, profitpres. Forkert: introduktion har lavt salg; vækst har hurtigt stigende salg; nedgang har faldende salg og profit.", "id": "MM-mc-065", "course": "MM", "lecture": 4, "lectureName": "L4 PLC og konkurrence", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L4", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Modningsfasen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 272}, {"id": "MM-mc-097", "course": "MM", "lecture": 4, "type": "mc", "kind": "mc", "question": "En lille producent fokuserer udelukkende på glutenfri bagværk til et smalt segment med høje marginer. Strategi?", "options": ["Markedsleder", "Udfordrer", "Følger", "Nichestrategi"], "answer": 3, "explanation": "Niche: specialisering efter kundegruppe/produkt med høje marginer. Forkert: leder/udfordrer kræver stor andel og ressourcer; følgeren kopierer lederen i massemarkedet.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 273, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "mc", "eksamen"]}, {"question": "Hvor i PLC befinder jeres produkt sig, og hvad betyder det for marketingmixet?", "model": "Argumentér for fasen ud fra salg, profit, konkurrence og kundetyper. Beskriv mål og 4P for fasen (fx modning: markeds-/produkt-/mixmodifikation; nedgang: maintain/harvest/repositionering/divest). Nævn PLC's begrænsninger.", "id": "MM-sa-081", "course": "MM", "lecture": 4, "lectureName": "L4 PLC og konkurrence", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L4", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 4 › Product Life Cycle", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 274}, {"id": "MM-sa-090", "course": "MM", "lecture": 4, "type": "sa", "kind": "oral", "question": "[Mundtlig] Hvilken konkurrenceposition har jeres case-virksomhed (leder, udfordrer, følger, niche), og hvilken strategi anbefaler du?", "model": "Argumentér ud fra markedsandel og ressourcer. Leder: udvid markedet, beskyt/øg andel. Udfordrer: vælg modstander, frontalt vs. flankeangreb. Følger: stabil profit, lær af lederen. Niche: specialisering, høje marginer, risiko for afhængighed. Kobl til Porters generiske strategier.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 275, "lectureName": "L4 PLC og konkurrence", "tags": ["MM", "MM-L4", "oral", "eksamen"]}, {"id": "MM-term-L5-001", "course": "MM", "lecture": 5, "type": "card", "kind": "begreb", "front": "Forbrugeradfærd (B2C)", "back": "De processer og handlinger hvorigennem private forbrugere identificerer behov, søger information, vurderer alternativer, køber, anvender og vurderer produkter. Kan ikke forklares alene ud fra pris og funktion.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Forbrugeradfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "begreb", "grund"], "level": "grund", "order": 276}, {"id": "MM-term-L5-002", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Stimulus-respons-modellen (black box)", "back": "Marketingstimuli (4P) og øvrige stimuli (økonomi, teknologi, kultur, politik) → kundens black box (karakteristika + beslutningsproces) → reaktion (produkt/brand, hvor/hvornår, mængde, frekvens, genkøb/skift).", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › En simpel model for forbrugeradfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 277}, {"id": "MM-term-L5-003", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Kulturelle faktorer", "back": "Kultur (grundlæggende værdier lært via familie/institutioner), subkultur (mindre gruppe med fælles værdier) og social klasse (stabile grupper efter job, indkomst, uddannelse). Undgå stereotyper; kulturelle skift skaber nye behov.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Kulturelle faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 278}, {"id": "MM-term-L5-004", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Sociale faktorer", "back": "Medlemsgrupper, referencegrupper (sammenligningsgrundlag), aspirationsgrupper (man ønsker at tilhøre), familie (roller: initiativtager, påvirker, beslutningstager, køber, bruger), sociale roller/status og digitale fællesskaber/influencers.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Sociale faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 279}, {"id": "MM-term-L5-005", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Personlige faktorer", "back": "Beskæftigelse, økonomisk situation (købekraft), alder og livsstadie, livsstil, personlighed og selvopfattelse – påvirker behov, overvejede løsninger og betalingsvillighed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Personlige faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 280}, {"id": "MM-term-L5-006", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Psykologiske faktorer", "back": "Motivation (behov → motiv; Maslows hierarki), perception (selektiv opmærksomhed, forvrængning, fastholdelse), læring (ændret adfærd via erfaring og forstærkning) og overbevisninger/holdninger.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Psykologiske faktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 281}, {"id": "MM-term-L5-007", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Maslows behovshierarki", "back": "Fysiologiske behov → sikkerhed → sociale behov → anerkendelse → selvrealisering. Mere basale behov kræver typisk en vis tilfredsstillelse først.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Motivation", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 282}, {"id": "MM-term-L5-008", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Fire typer købsadfærd", "back": "Involvering × oplevede brandforskelle: kompleks (høj/store – læreproces viden → holdning → valg), dissonansreducerende (høj/få), variationssøgende (lav/store), vanemæssig (lav/få).", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Typer af købsadfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 283}, {"id": "MM-term-L5-009", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Købsprocessen", "back": "Behovserkendelse (forskel mellem faktisk og ønsket tilstand; push vs. pull) → informationssøgning → evaluering af alternativer → købsbeslutning → efterkøbsadfærd. Forenkling – faser kan springes over; erfaring påvirker alle faser.", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Købsprocessen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 284}, {"id": "MM-term-L5-010", "course": "MM", "lecture": 5, "type": "card", "kind": "model", "front": "Kunderejsen", "back": "Alle interaktioner med brandet fra første opmærksomhed til efter købet. Dynamisk, ikke-lineær, multikanal, kundecentrisk, socialt påvirket. Tre faser: før-køb, køb og efter-køb (Lemon & Verhoef).", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Kunderejsen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "model", "grund"], "level": "grund", "order": 285}, {"id": "MM-term-L5-011", "course": "MM", "lecture": 5, "type": "card", "kind": "sammenligning", "front": "Kompleks vs. vanemæssig købsadfærd", "back": "Kompleks: høj involvering, store brandforskelle – kunden lærer (viden → holdning → valg). Vanemæssig: lav involvering, få forskelle – køb af vane uden stærk brandholdning.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Fire typer købsadfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 286, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "sammenligning", "grund"]}, {"id": "MM-mc-098", "course": "MM", "lecture": 5, "type": "mc", "kind": "mc", "question": "Kunden køber altid samme mærke mælk uden at overveje alternativer. Købsadfærd?", "options": ["Kompleks", "Dissonansreducerende", "Variationssøgende", "Vanemæssig"], "answer": 3, "explanation": "Vanemæssig: lav involvering og få oplevede brandforskelle. Forkert: kompleks og dissonansreducerende kræver høj involvering; variationssøgende skifter mærke trods lav involvering.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 287, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "mc", "eksamen"]}, {"question": "Hvilke faktorer påvirker målgruppens købsadfærd? Brug modellen for forbrugeradfærd.", "model": "Stimuli → black box → reaktion. Kulturelle (kultur, subkultur, social klasse), sociale (grupper, familie, roller), personlige (beskæftigelse, økonomi, alder/livsstadie, livsstil) og psykologiske faktorer. Kobl til kunderejsen og berøringspunkter. (Jf. Case 2 IKEA: købsadfærd.)", "id": "MM-sa-082", "course": "MM", "lecture": 5, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L5", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 5 › Faktorer der påvirker købsadfærden", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 288}, {"id": "MM-sa-091", "course": "MM", "lecture": 5, "type": "sa", "kind": "oral", "question": "[Mundtlig] Kortlæg kunderejsen for jeres målgruppe og find de vigtigste berøringspunkter.", "model": "Før-køb (behovserkendelse, søgning), køb, efter-køb (Lemon & Verhoef). Berøringspunkter ejet af brand, partnere, kunden selv og sociale/eksterne. Rejsen er ikke-lineær og multikanal. Kobl til købsprocessen og påvirkningsfaktorer.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 289, "lectureName": "L5 B2C-købsadfærd og kunderejsen", "tags": ["MM", "MM-L5", "oral", "eksamen"]}, {"id": "MM-term-L6-006", "course": "MM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Heuristikker", "back": "Mentale genveje i System 1 (Tversky & Kahneman) – hurtige vurderinger uden megen bearbejdning, der kan give bias.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Historien bag dual processing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "begreb", "grund"], "level": "grund", "order": 290}, {"id": "MM-term-L6-007", "course": "MM", "lecture": 6, "type": "card", "kind": "begreb", "front": "Involvering", "back": "Graden af personlig relevans/risiko ved købet. Kobler ELM til de fire typer købsadfærd: høj involvering → central rute/System 2; lav → perifer rute/System 1.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Betydningen af involvering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "begreb", "grund"], "level": "grund", "order": 291}, {"id": "MM-term-L6-001", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "Dual processing (System 1/System 2)", "back": "System 1: hurtigt, automatisk, intuitivt, heuristikker, følelser, impulsivt. System 2: langsomt, bevidst, logisk, faktabaseret, vejer flere egenskaber. Bruges ofte samtidig; købets kompleksitet afgør hvilket dominerer (Kahneman).", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Forbrugerpsykologi og dual processing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model", "grund"], "level": "grund", "order": 292}, {"id": "MM-term-L6-002", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "Samson & Voyer (2012)", "back": "Ramme med dualitet i tre faser: overtalelse/holdningsændring (central/systematisk vs. perifer/heuristisk), evaluering/beslutning (reflektiv/analytisk vs. intuitiv/oplevelsesbaseret), købs-/forbrugeradfærd (reflektiv 'cool' vs. impulsiv 'hot').", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Overblik: dualitet i forbrugerpsykologi", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model", "grund"], "level": "grund", "order": 293}, {"id": "MM-term-L6-003", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "ELM (Elaboration Likelihood Model)", "back": "To ruter til overtalelse. Central: høj involvering → fokus på argumenter og produktegenskaber → stærke, stabile holdninger. Perifer: lav involvering → perifere signaler, følelser, klassisk betingning → svage holdninger.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Overtalelse og holdningsændring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model", "grund"], "level": "grund", "order": 294}, {"id": "MM-term-L6-004", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "MAO-modellen", "back": "Effektiv informationsbearbejdning kræver Motivation, Ability (evne) og Opportunity (mulighed). Mangler én → heuristisk/perifer bearbejdning (Pelsmacker, 2022).", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › MAO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model", "grund"], "level": "grund", "order": 295}, {"id": "MM-term-L6-005", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "HSM (Heuristic-Systematic Model)", "back": "Minder om ELM, men systematisk og heuristisk bearbejdning kan foregå samtidig og påvirke hinanden.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › HSM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model", "grund"], "level": "grund", "order": 296}, {"id": "MM-term-L6-008", "course": "MM", "lecture": 6, "type": "card", "kind": "model", "front": "Forbrugerværdier (Schwartz)", "back": "Værdier = grundlæggende principper der guider valg på tværs af situationer. Schwartz: 10 basale værdier i fire overordnede områder; værdier er forbundet med affekt og forklarer, hvorfor forbrugere prioriterer bestemte brands.", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Forbrugerværdier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "model", "grund"], "level": "grund", "order": 297}, {"id": "MM-term-L6-009", "course": "MM", "lecture": 6, "type": "card", "kind": "sammenligning", "front": "Central vs. perifer rute (ELM)", "back": "Central: høj motivation/evne → argumenter og produktegenskaber → stærke, stabile holdninger. Perifer: lav involvering → signaler, følelser, afsender → svage holdninger, der let ændres.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › ELM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 298, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "sammenligning", "grund"]}, {"id": "MM-term-L6-010", "course": "MM", "lecture": 6, "type": "card", "kind": "sammenligning", "front": "ELM vs. HSM", "back": "ELM: én rute dominerer (central eller perifer). HSM: systematisk og heuristisk bearbejdning kan ske samtidig og påvirke hinanden.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › HSM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 299, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "sammenligning", "eksamen"]}, {"id": "MM-term-L6-011", "course": "MM", "lecture": 6, "type": "card", "kind": "hvorfor", "front": "Hvorfor er MAO vigtig for kommunikationen?", "back": "Mangler motivation, evne eller mulighed (fx kort eksponering i et feed), bearbejdes budskabet heuristisk – så skal kommunikationen bygge på enkle signaler frem for argumenter.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › MAO", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 300, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "hvorfor", "eksamen"]}, {"question": "Lav involvering og overtalelse via perifere signaler svarer til:", "options": ["Central rute / System 2", "Perifer rute / System 1", "Kompleks købsadfærd", "MAO høj"], "answer": 1, "explanation": "Perifer rute/System 1: lav involvering, perifere signaler, svage holdninger. Forkert: central rute/System 2 kræver høj involvering; kompleks købsadfærd er høj involvering; høj MAO fører til central bearbejdning.", "id": "MM-mc-067", "course": "MM", "lecture": 6, "lectureName": "L6 B2C beslutningsprocesser", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L6", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › ELM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 301}, {"question": "Høj involvering men få forskelle mellem brands giver:", "options": ["Kompleks købsadfærd", "Dissonansreducerende købsadfærd", "Variationssøgende", "Vanemæssig"], "answer": 1, "explanation": "Dissonansreducerende: høj involvering men få brandforskelle. Forkert: kompleks = høj involvering og store forskelle; variationssøgende = lav involvering og store forskelle; vanemæssig = lav og få.", "id": "MM-mc-068", "course": "MM", "lecture": 6, "lectureName": "L6 B2C beslutningsprocesser", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L6", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Betydningen af involvering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 302}, {"question": "Forklar dual processing og ELM, og diskutér hvordan virksomheden bør kommunikere til målgruppen.", "model": "System 1/2; ELM central vs. perifer rute; MAO afgør rute. Høj involvering → argumenter og fakta; lav involvering → perifere signaler, affekt. Kobl til Kotlers fire typer købsadfærd.", "id": "MM-sa-083", "course": "MM", "lecture": 6, "lectureName": "L6 B2C beslutningsprocesser", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L6", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 6 › Dual processing og ELM", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 303}, {"id": "MM-sa-092", "course": "MM", "lecture": 6, "type": "sa", "kind": "oral", "question": "[Mundtlig] Hvilke forbrugerværdier (Schwartz) appellerer jeres brand til, og hvordan kan det bruges i kommunikationen?", "model": "Værdier guider valg på tværs af situationer og er forbundet med affekt. Identificér relevante værdier, kobl til brandets budskab, og vælg central/perifer rute efter involvering og MAO.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 304, "lectureName": "L6 B2C beslutningsprocesser", "tags": ["MM", "MM-L6", "oral", "eksamen"]}, {"id": "MM-term-L7-001", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "B2B-myter", "back": "Lektionen afviser at B2B-køb er langt mere rationelle end B2C og at følelser ingen rolle spiller – usikkerhed, tillid og personlige hensyn betyder meget.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B adskiller sig mindre fra B2C", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"], "level": "grund", "order": 305}, {"id": "MM-term-L7-002", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "Buying center", "back": "De personer, der deltager i et B2B-køb – ifølge slides i snit 6,8 beslutningstagere. 80–90 % har en 'Day One'-liste, og 90 % vælger fra den – leverandøren skal være kendt, før købet starter.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Nøgletal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"], "level": "grund", "order": 306}, {"id": "MM-term-L7-003", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "B2B-købssituationer", "back": "Nykøb (typisk alle faser), modificeret genkøb og rutinemæssigt genkøb (springer ofte faser over). Den reelle proces er mere kompliceret end flowdiagrammet.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Den professionelle indkøbsproces", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"], "level": "grund", "order": 307}, {"id": "MM-term-L7-007", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "PoP og PoD", "back": "Points of parity: essentielle værdielementer på niveau med næstbedste alternativ. Points of difference: overlegne/ekstraordinære elementer i forhold til næstbedste alternativ.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B elements of value", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"], "level": "grund", "order": 308}, {"id": "MM-term-L7-009", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "Hvad B2B-kunder efterspørger", "back": "74 % foretrækker personlig betjening frem for dobbelt så hurtig chatbot; 58 % ønsker valgmuligheder frem for den præcise løsning – læring, valgfrihed og relationer vægtes højt.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Hvad leder B2B-kunderne efter?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"], "level": "grund", "order": 309}, {"id": "MM-term-L7-010", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "Moderne B2B marketing", "back": "Bevæger sig fra ren leadgenerering mod kundeoplevelser, relationer, engagement og værdiskabende indhold (kundecases, netværk, webinarer, en-til-en-samtaler).", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Udviklingen i B2B marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"], "level": "grund", "order": 310}, {"id": "MM-term-L7-011", "course": "MM", "lecture": 7, "type": "card", "kind": "begreb", "front": "B2B digital kunderejse", "back": "71 % starter købet digitalt, kunden har 10–15 berøringspunkter, og sælgeren får kun ca. 5 % af køberens tid.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Buying center", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 311, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "begreb", "grund"]}, {"id": "MM-term-L7-004", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "Den professionelle indkøbsproces", "back": "Otte faser: problemerkendelse → generel behovsbeskrivelse → produktspecifikation → leverandørsøgning → indhentning af tilbud → leverandørvalg → ordrerutine → evaluering af leverandørens præstation.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Den professionelle indkøbsproces", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model", "grund"], "level": "grund", "order": 312}, {"id": "MM-term-L7-005", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "Lineær, kontinuerlig og forstærkende kunderejse", "back": "Lineær (Lemon & Verhoef 2016: før-køb, køb, efter-køb), kontinuerlig (Edelman & Singer 2015: loop frem for tragt), forstærkende (Siebert et al. 2020: loyalty loops vs. involvement spirals).", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Kunderejsen i B2B", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model", "grund"], "level": "grund", "order": 313}, {"id": "MM-term-L7-006", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "Loyalty loop vs. involvement spiral", "back": "Loyalty loop: bevidst førstekøb fulgt af strømlinede genkøb. Involvement spiral: hurtigt førstekøb fulgt af stigende involvering (Siebert et al., 2020).", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Den forstærkende kunderejse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model", "grund"], "level": "grund", "order": 314}, {"id": "MM-term-L7-008", "course": "MM", "lecture": 7, "type": "card", "kind": "model", "front": "B2B elements of value (Almquist et al., 2018)", "back": "Pyramide (Almquist et al., 2018), nedefra: table stakes (specifikationer, pris, regler) → funktionel værdi → ease of doing business → individuel værdi (karriere, personlig) → inspirerende værdi (vision, socialt ansvar). Flere højværdielementer → højere NPS og genkøb.", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B elements of value", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "model", "grund"], "level": "grund", "order": 315}, {"id": "MM-term-L7-013", "course": "MM", "lecture": 7, "type": "card", "kind": "sammenligning", "front": "PoP vs. PoD", "back": "PoP: værdielementer på niveau med næstbedste alternativ (nødvendige for at blive overvejet). PoD: overlegne elementer (grunden til at blive valgt).", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › PoP og PoD", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 316, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "sammenligning", "grund"]}, {"question": "Hvor mange beslutningstagere er i snit involveret i et B2B-køb ifølge slides?", "options": ["2,1", "4,0", "6,8", "12"], "answer": 2, "explanation": "Ifølge slides ca. 6,8 beslutningstagere i et buying center. De øvrige tal står ikke i materialet – pointen er, at B2B-køb involverer mange personer.", "id": "MM-mc-069", "course": "MM", "lecture": 7, "lectureName": "L7 B2B købsadfærd", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L7", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › Nøgletal", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 317}, {"question": "Hvilket niveau udgør bunden af B2B-værdipyramiden (Almquist et al.)?", "options": ["Inspirerende værdi", "Table stakes", "Ease of doing business", "Individuel værdi"], "answer": 1, "explanation": "Table stakes (specifikationer, acceptabel pris, regler) er bunden. Forkert: inspirerende værdi er toppen; ease of doing business og individuel værdi ligger i midten.", "id": "MM-mc-070", "course": "MM", "lecture": 7, "lectureName": "L7 B2B købsadfærd", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L7", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B elements of value", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 318}, {"question": "Hvordan adskiller B2B-købsadfærd sig fra B2C – og hvor er de ens?", "model": "Buying center (6,8 personer), professionel indkøbsproces (8 faser), købssituationer. Men følelser, tillid og personlige hensyn betyder også i B2B (myter afvises). Værdipyramiden, PoP/PoD, digital, kontinuerlig kunderejse.", "id": "MM-sa-084", "course": "MM", "lecture": 7, "lectureName": "L7 B2B købsadfærd", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L7", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 7 › B2B købsadfærd", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 319}, {"id": "MM-sa-093", "course": "MM", "lecture": 7, "type": "sa", "kind": "oral", "question": "[Mundtlig] Brug B2B-værdipyramiden på en B2B-leverandør: hvor skaber den værdi, og hvad er PoP og PoD?", "model": "Table stakes og funktionel værdi er typisk PoP; ease of doing business, individuel og inspirerende værdi kan være PoD. Flere højværdielementer → højere NPS og genkøb. Husk buying center (6,8 personer) og den digitale rejse.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 320, "lectureName": "L7 B2B købsadfærd", "tags": ["MM", "MM-L7", "oral", "eksamen"]}, {"id": "MM-term-L8-001", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Marketingmiljø", "back": "Aktører og kræfter der påvirker virksomhedens evne til at skabe værdi for kunderne – opdeles i mikro- og makromiljø (Kotler fig. 3.1 og 3.2).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketingmiljøet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 321}, {"id": "MM-term-L8-004", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Fad, trend og megatrend", "back": "Fad: kortvarig, uden social/økonomisk/politisk betydning. Trend: retning med momentum og holdbarhed. Megatrend: store forandringer der tager lang tid at danne og påvirker længe.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Fad, trend og megatrend", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 322}, {"id": "MM-term-L8-005", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Proaktiv vs. reaktiv håndtering", "back": "Proaktiv: strategier der påvirker omgivelserne. Reaktiv: overvåg ændringer tæt og tilpas dig.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Håndtering af makrofaktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 323}, {"id": "MM-term-L8-006", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Big data", "back": "Enorme komplekse datasæt kendetegnet ved volume, velocity, variety og volatility. Problemet er at finde de rette data (information overload) og omsætte dem til indsigt.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Big data og behovet for MIS", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 324}, {"id": "MM-term-L8-007", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Customer insights", "back": "Ny indsigt i kunder og marked baseret på markedsføringsoplysninger – grundlaget for kundeværdi, engagement og relationer.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Big data og behovet for MIS", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 325}, {"id": "MM-term-L8-009", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Marketing intelligence", "back": "Systematisk overvågning og analyse af offentligt tilgængelig information om forbrugere, konkurrenter og miljøet. Kilder fx salgsstyrken, værdikædepartnere, social listening, messer og reviews.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing intelligence", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 326}, {"id": "MM-term-L8-010", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Marketing research", "back": "Formelle analyser af markedet ved dataindsamling for at forstå kunderne bedre; reducerer usikkerhed og risiko og giver input til strategier.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing research", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 327}, {"id": "MM-term-L8-012", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Primære vs. sekundære data", "back": "Sekundære: findes allerede (statistikker, rapporter, databaser) – hurtigere og billigere, afsøg først. Primære: indsamles til det konkrete formål.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Forskningsplan og dataindsamling", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 328}, {"id": "MM-term-L8-014", "course": "MM", "lecture": 8, "type": "card", "kind": "begreb", "front": "Datakvalitet: validitet og reliabilitet", "back": "Validitet (intern/ekstern): måler vi det, vi vil måle? Reliabilitet: er målingen pålidelig/gentagelig? Overvej også stikprøve (tilfældig vs. kvota/convenience), svarprocent og bias (social desirability).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Overvejelser om datakvalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "begreb", "grund"], "level": "grund", "order": 329}, {"id": "MM-term-L8-002", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Mikromiljøet", "back": "Aktører tæt på virksomheden: virksomheden selv, leverandører, marketingmellemled, konkurrenter, offentligheder (publics) og kunder.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Mikrofaktorer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model", "grund"], "level": "grund", "order": 330}, {"id": "MM-term-L8-003", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "PESTEL", "back": "Makromiljøets seks kræfter: Politiske (stabilitet, handels-/skattepolitik), Environment (klima, ressourcer), Sociale (demografi, værdier, CSR), Teknologiske (digitalisering, GAI), Economy (indkomst, rente, opsparing), Lovgivning (GDPR, markedsføringsloven).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › PESTEL", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model", "grund"], "level": "grund", "order": 331}, {"id": "MM-term-L8-008", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Marketing Information System (MIS)", "back": "Mennesker og procedurer: vurdér informationsbehov → udvikl information fra interne databaser, marketing intelligence og marketing research → analysér og brug informationen (fig. 4.1).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › MIS", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model", "grund"], "level": "grund", "order": 332}, {"id": "MM-term-L8-011", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Marketing research-processen", "back": "1) Definér problem og formål (udforskende 'hvorfor/hvordan' vs. beskrivende/kausale 'hvor mange'), 2) forskningsplan (sekundære før primære data), 3) indsaml og analysér, 4) fortolk og rapportér.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing research-processen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model", "grund"], "level": "grund", "order": 333}, {"id": "MM-term-L8-015", "course": "MM", "lecture": 8, "type": "card", "kind": "model", "front": "Brand funnel", "back": "Kendskab → prøvet → nyligt prøvet → lejlighedsvis bruger → fast bruger → mest brugt. Sammenlign brands for at se, hvor de taber kunder, og sæt ind dér.", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Brand funnel", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "model", "grund"], "level": "grund", "order": 334}, {"id": "MM-term-L8-016", "course": "MM", "lecture": 8, "type": "card", "kind": "sammenligning", "front": "Mikro- vs. makromiljø", "back": "Mikro: aktører tæt på virksomheden (leverandører, mellemled, konkurrenter, publics, kunder). Makro: brede kræfter (PESTEL), som virksomheden sjældent kan påvirke.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketingmiljøet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 335, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "sammenligning", "grund"]}, {"id": "MM-term-L8-013", "course": "MM", "lecture": 8, "type": "card", "kind": "metode", "front": "Dataindsamlingsmetoder", "back": "Observationer ((n)etnografi), kvalitative interviews (fokusgrupper, dybdeinterviews, laddering), surveys, adfærdsdata (scannerdata, big data) og eksperimenter (lab/online, eye-tracking, neuromarketing).", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Indsamling og analyse af data", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "metode", "eksamen"], "level": "eksamen", "order": 336}, {"id": "MM-term-L8-017", "course": "MM", "lecture": 8, "type": "card", "kind": "sammenligning", "front": "Validitet vs. reliabilitet", "back": "Validitet: måler vi det, vi vil måle? Reliabilitet: giver målingen samme resultat ved gentagelse? En måling kan være reliabel uden at være valid.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Datakvalitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 337, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "sammenligning", "eksamen"]}, {"id": "MM-term-L8-018", "course": "MM", "lecture": 8, "type": "card", "kind": "sammenligning", "front": "Udforskende vs. beskrivende/kausal research", "back": "Udforskende: 'hvorfor/hvordan' – kvalitative metoder, når problemet er uklart. Beskrivende/kausal: 'hvor mange/hvad sker hvis' – surveys og eksperimenter, når problemet er defineret.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Research-processen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 338, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "sammenligning", "eksamen"]}, {"question": "GDPR og markedsføringsloven hører i PESTEL til:", "options": ["Politiske", "Sociale", "Teknologiske", "Lovgivning"], "answer": 3, "explanation": "Lovgivning (L) dækker konkurrence-, forbruger- og datalovgivning som GDPR. Forkert: politiske = stabilitet, handels- og skattepolitik; sociale = demografi/værdier; teknologiske = digitalisering.", "id": "MM-mc-071", "course": "MM", "lecture": 8, "lectureName": "L8 Markedsanalyse", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L8", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › PESTEL", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 339}, {"question": "Social listening og salgsstyrkens rapporter er kilder til:", "options": ["Interne data", "Marketing intelligence", "Primære data", "Eksperimenter"], "answer": 1, "explanation": "Marketing intelligence: systematisk overvågning af offentligt tilgængelig information. Forkert: interne data er virksomhedens egne databaser; primære data og eksperimenter er marketing research.", "id": "MM-mc-072", "course": "MM", "lecture": 8, "lectureName": "L8 Markedsanalyse", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L8", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketing intelligence", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 340}, {"id": "MM-mc-099", "course": "MM", "lecture": 8, "type": "mc", "kind": "mc", "question": "En virksomhed vil forstå, hvorfor kunder forlader brandet, men ved ikke hvad de skal spørge om. Hvilken research først?", "options": ["Kausalt eksperiment", "Beskrivende survey", "Udforskende kvalitative interviews", "Scannerdata"], "answer": 2, "explanation": "Udforskende research ('hvorfor/hvordan') bruges, når problemet er uklart. Forkert: surveys og eksperimenter kræver et defineret problem; scannerdata viser adfærd, ikke årsager.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 341, "lectureName": "L8 Markedsanalyse", "tags": ["MM", "MM-L8", "mc", "eksamen"]}, {"question": "Lav en PESTEL- og mikroanalyse af jeres case-marked og forklar hvordan en markedsanalyse kunne tilrettelægges.", "model": "PESTEL med eksempler + mikroaktører. Proaktiv/reaktiv håndtering. MIS (interne data, intelligence, research). Research-proces i 4 trin, sekundære før primære data, valg af metode (observation, interview, survey, adfærdsdata, eksperiment) og datakvalitet.", "id": "MM-sa-085", "course": "MM", "lecture": 8, "lectureName": "L8 Markedsanalyse", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L8", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 8 › Marketingmiljøet og research-processen", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 342}, {"id": "MM-term-L9-001", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Kundedrevet marketingstrategi", "back": "At skabe værdi for målgruppen – virksomheden kan ikke være alt for alle og må vælge kunder og hvordan den skaber mest værdi for dem (STP).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › En kundedrevet marketingstrategi og STP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb", "grund"], "level": "grund", "order": 343}, {"id": "MM-term-L9-002", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Segmentering", "back": "At opdele markedet i mindre grupper med lignende behov, karakteristika eller købsadfærd. Formål: forstå behov bedre, tilpasse produkter, målrette marketing og bruge ressourcer strategisk.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Hvad er segmentering?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb", "grund"], "level": "grund", "order": 344}, {"id": "MM-term-L9-005", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "B2B-segmentering", "back": "Branche, virksomhedsstørrelse, geografisk placering, købsvolumen og specifikke behov.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Segmentering på B2B-markedet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb", "grund"], "level": "grund", "order": 345}, {"id": "MM-term-L9-009", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Positionering", "back": "Hvordan virksomheden vil opfattes i kundernes bevidsthed i forhold til konkurrenterne; bygger på differentiering.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positionering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb", "grund"], "level": "grund", "order": 346}, {"id": "MM-term-L9-011", "course": "MM", "lecture": 9, "type": "card", "kind": "begreb", "front": "Differentiering", "back": "At skabe forskelle i tilbuddet som kunder opfatter som værdifulde – via produkt, service, kanaler, medarbejdere eller image.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Differentiering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "begreb", "grund"], "level": "grund", "order": 347}, {"id": "MM-term-L9-003", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Fire segmenteringskriterier", "back": "Geografisk (land, region, klima), demografisk (alder, livsstadie, indkomst – let at måle), psykografisk (livsstil, personlighed, værdier) og adfærdsmæssig (anledning, søgte fordele, bruger-rate, loyalitet). Kombineres ofte.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › 4 segmenteringskriterier", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model", "grund"], "level": "grund", "order": 348}, {"id": "MM-term-L9-006", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Krav til effektiv segmentering", "back": "Measurable (kan måles), Accessible (kan nås), Substantial (stort/profitabelt nok), Differentiable (reagerer forskelligt), Actionable (der kan laves effektive strategier).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Krav til effektiv segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model", "grund"], "level": "grund", "order": 349}, {"id": "MM-term-L9-008", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Market-targeting strategier", "back": "Fra bred til smal: udifferentieret/mass (ét tilbud til hele markedet), differentieret (flere segmenter med hvert sit tilbud), koncentreret/niche (ét eller få segmenter – ekspertise), mikromarketing (lokal eller individuel tilpasning).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Market-targeting strategies", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model", "grund"], "level": "grund", "order": 350}, {"id": "MM-term-L9-012", "course": "MM", "lecture": 9, "type": "card", "kind": "model", "front": "Value proposition", "back": "Udtrykker positioneringen: hvilke fordele kunden får, til hvilken pris, og hvorfor ('hvorfor vælge os?'). Typer: more for more, more for the same, the same for less, less for much less, more for less.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Value proposition", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "model", "grund"], "level": "grund", "order": 351}, {"id": "MM-term-L9-014", "course": "MM", "lecture": 9, "type": "card", "kind": "sammenligning", "front": "Differentieret vs. koncentreret targeting", "back": "Differentieret: flere segmenter med hvert sit tilbud – højere salg, højere omk. Koncentreret: ét/få segmenter – ekspertise og stærk position, men afhængighed af segmentet.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Targeting", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 352, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "sammenligning", "grund"]}, {"id": "MM-term-L9-007", "course": "MM", "lecture": 9, "type": "card", "kind": "metode", "front": "Evaluering af segmenter", "back": "Segmentets størrelse og vækst, segmentets attraktivitet (konkurrence, barrierer, risici) og virksomhedens ressourcer og mål (passer det til kompetencer og strategi?).", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Hvordan evaluerer vi et segment?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "metode", "eksamen"], "level": "eksamen", "order": 353}, {"id": "MM-term-L9-010", "course": "MM", "lecture": 9, "type": "card", "kind": "metode", "front": "Positioneringskort (perceptual map)", "back": "Viser hvordan kunder opfatter brands ift. hinanden på dimensioner som pris, kvalitet, innovation; bruges til at identificere konkurrenter og ledige positioner.", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positioneringskort", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "metode", "eksamen"], "level": "eksamen", "order": 354}, {"id": "MM-term-L9-013", "course": "MM", "lecture": 9, "type": "card", "kind": "metode", "front": "Positioning statement", "back": "Formulering der sikrer klar og konsistent position: 'For (målgruppe) er (brand) en/et (produktkategori), der tilbyder (unik fordel).'", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positioning statement", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "metode", "eksamen"], "level": "eksamen", "order": 355}, {"id": "MM-term-L9-015", "course": "MM", "lecture": 9, "type": "card", "kind": "eksempel", "front": "Eksempel: positioning statement", "back": "'For (målgruppe) er (brand) en/et (kategori), der tilbyder (unik fordel).' Fx: For travle studerende er [brand] en måltidskasse, der giver sunde retter på 15 minutter.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Positioning statement", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 356, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "eksempel", "eksamen"]}, {"question": "'Segmentet skal reagere forskelligt på marketing' er kravet:", "options": ["Measurable", "Accessible", "Substantial", "Differentiable"], "answer": 3, "explanation": "Differentiable: segmenterne skal reagere forskelligt på marketing. Forkert: measurable = kan måles; accessible = kan nås; substantial = stort/profitabelt nok.", "id": "MM-mc-073", "course": "MM", "lecture": 9, "lectureName": "L9 STP", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L9", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Krav til effektiv segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 357}, {"question": "En mobiloperatør opdeler kunderne i lette, mellemstore og tunge brugere efter forbrug. Hvilken type segmentering?", "options": ["Geografisk", "Demografisk", "Psykografisk", "Adfærdsmæssig"], "answer": 3, "explanation": "Adfærdsmæssig (bruger-rate). Forkert: geografisk = sted; demografisk = alder, indkomst m.m.; psykografisk = livsstil, værdier.", "id": "MM-mc-074", "course": "MM", "lecture": 9, "lectureName": "L9 STP", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L9", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › Adfærdsmæssig segmentering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 358}, {"id": "MM-mc-096", "course": "MM", "lecture": 9, "type": "mc", "kind": "mc", "question": "Et fitness-brand tilbyder flere features end konkurrenterne til samme pris. Hvilken value proposition?", "options": ["More for more", "More for the same", "The same for less", "Less for much less"], "answer": 1, "explanation": "More for the same: flere fordele uden højere pris. Forkert: more for more tager overpris; the same for less og less for much less konkurrerer på pris.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Case-/beregningsspørgsmål", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 359, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "mc", "eksamen"]}, {"question": "Gennemfør STP for jeres case: segmentér, vælg target og formulér positionering.", "model": "Segmentér med flere kriterier (geo/demo/psyko/adfærd), test mod de fem krav (MASDA), evaluér segmenter (størrelse/vækst, attraktivitet, mål/ressourcer), vælg target, formulér differentiering og value proposition. (Jf. Case 3 Carlsberg non-alcoholic STP.)", "id": "MM-sa-086", "course": "MM", "lecture": 9, "lectureName": "L9 STP", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L9", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 9 › STP", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 360}, {"id": "MM-sa-094", "course": "MM", "lecture": 9, "type": "sa", "kind": "oral", "question": "[Mundtlig] Formulér en value proposition og et positioning statement for jeres case, og vis den på et positioneringskort.", "model": "Vælg type (more for more, more for the same, the same for less, less for much less, more for less). Statement: 'For (målgruppe) er (brand) en/et (kategori), der tilbyder (unik fordel)'. Kort med to købsrelevante dimensioner (fx pris/kvalitet) og konkurrenter.", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 361, "lectureName": "L9 STP", "tags": ["MM", "MM-L9", "oral", "eksamen"]}, {"id": "MM-term-L10-002", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand (AMA)", "back": "'A name, term, sign, symbol or design or a combination of these' der identificerer og differentierer fra konkurrenter. To funktioner: identificere og differentiere.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Hvad er et brand?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 362}, {"id": "MM-term-L10-005", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Branding", "back": "Den ledelsesmæssige proces, der skal føre til et stærkt brand. Landor: 'Products are produced in the factory, but brands are produced in the minds of the consumer.'", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand positionering", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 363}, {"id": "MM-term-L10-006", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand equity", "back": "'The differential effect that knowing the brand name has on customer response to the product and its marketing.' Brandets værdi, bestemt af evnen til at fange præferencer og loyalitet. Tragt: awareness, associations, loyalty, perceived quality.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 364}, {"id": "MM-term-L10-007", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Fordele ved stærke brands", "back": "Virksomhed: finansielt aktiv, forudsigelige pengestrømme, bedre indtjening, magt over for detailhandlen, licenser og extensions. Forbruger: identifikation, mindre risiko, oplevet kvalitet, loyalitet, mindre prisfølsomhed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Værdien af brand equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 365}, {"id": "MM-term-L10-009", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Søge-, erfarings- og tillidskvaliteter", "back": "Søge: kendt før købet. Erfaring: afsløres efter købet. Tillid: ukendt både før og efter købet.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Produktkvalitet og usikkerhed", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 366}, {"id": "MM-term-L10-011", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand awareness", "back": "Evnen til at identificere brandet under forskellige forhold. Brand recall: genkalde med få anvisninger (med/uden hjælp). Brand recognition: bekræfte tidligere eksponering. Vigtigst ved lav involvering.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand awareness", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 367}, {"id": "MM-term-L10-012", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand image", "back": "Opfattelser af brandet afspejlet i associationer i hukommelsen. Typer: egenskaber (produkt-/ikke-produktrelaterede), fordele (funktionelle, oplevelsesmæssige, symbolske), holdninger. Dimensioner: valens, styrke, unikhed.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand image", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 368}, {"id": "MM-term-L10-013", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Producentbrand vs. detailhandelsbrand", "back": "Branding kan ske på alle niveauer af værdikæden, hvis brandhaveren kan sikre klarhed og troværdighed (Lurpak vs. Coops Xtra Smör-Smør).", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Hvem skal brande?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 369}, {"id": "MM-term-L10-014", "course": "MM", "lecture": 10, "type": "card", "kind": "begreb", "front": "Brand identitet vs. brand image", "back": "Identitet: hvordan virksomheden ønsker at positionere sig (afsenderens USP). Image: hvordan kunderne faktisk opfatter brandet. De er ikke nødvendigvis ens.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand positionering og brand identitet", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "begreb", "grund"], "level": "grund", "order": 370}, {"id": "MM-term-L10-001", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Produktets tre niveauer", "back": "Kerneværdi for kunden (hvad køber kunden egentlig?) → det faktiske produkt (brand name, features, design, kvalitet, emballage) → det udvidede produkt (service, garanti, support). Eks.: iPad = underholdning, selvudtryk, produktivitet.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Branding – en central del af marketing", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model", "grund"], "level": "grund", "order": 371}, {"id": "MM-term-L10-003", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Fem brand elementer", "back": "Navn (ordbaserede, opfundne, ikke-ord/akronymer), term (fx 'Coke', 'LV'), tegn (verbale/visuelle/auditive signaler, fx 'I'm loving it'), symbol (logo/ikon) og design (former, farver, materialer).", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand elementer", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model", "grund"], "level": "grund", "order": 372}, {"id": "MM-term-L10-004", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Store brandstrategiske beslutninger (fig. 8.5)", "back": "Brand positioning (attributes, benefits, beliefs/values), brand name selection, brand sponsorship (producent-, privat-, licens-, co-branding) og brand development (line extensions, brand extensions, multibrands, nye brands).", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Store brandstrategiske beslutninger", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model", "grund"], "level": "grund", "order": 373}, {"id": "MM-term-L10-008", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Den økonomiske forklaring", "back": "Et brand reducerer risiko og informationsomk. for køberen. Brandet er et signal, hvis det er konsistent, klart og troværdigt. Branding betyder mest ved oplevet risiko og mindst ved mange søgekvaliteter.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Den økonomiske forklaring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model", "grund"], "level": "grund", "order": 374}, {"id": "MM-term-L10-010", "course": "MM", "lecture": 10, "type": "card", "kind": "model", "front": "Den psykologiske forklaring (Keller, 1993)", "back": "Brandet er symbol for køberens samlede erfaringer. Brand knowledge = brand awareness (recall + recognition) + brand image (associationer). Hukommelse som associativt netværk af noder og links med varierende styrke.", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Den psykologiske forklaring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "model", "grund"], "level": "grund", "order": 375}, {"id": "MM-term-L10-015", "course": "MM", "lecture": 10, "type": "card", "kind": "sammenligning", "front": "Brand recall vs. recognition", "back": "Recall: forbrugeren genkalder selv brandet ud fra kategorien (få anvisninger). Recognition: forbrugeren bekræfter at have set brandet, når det vises.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand awareness", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 376, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "sammenligning", "grund"]}, {"id": "MM-term-L10-016", "course": "MM", "lecture": 10, "type": "card", "kind": "sammenligning", "front": "Line extension vs. brand extension", "back": "Line extension: nye varianter i samme kategori under samme brand. Brand extension: brandet bruges i en ny kategori.", "level": "grund", "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand development", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 377, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "sammenligning", "grund"]}, {"question": "En forbruger nævner selv Colgate, når hun bliver bedt om at nævne et tandpastamærke. Hvad måles?", "options": ["Brand recognition", "Brand recall", "Brand image", "Brand term"], "answer": 1, "explanation": "Brand recall: hun genkalder brandet med få anvisninger. Forkert: recognition = bekræfte tidligere eksponering, når brandet vises; brand image = associationer; brand term er et brand element.", "id": "MM-mc-075", "course": "MM", "lecture": 10, "lectureName": "L10 Branding 1", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L10", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand awareness", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 378}, {"question": "For hvilket produkt betyder branding mindst ifølge den økonomiske forklaring?", "options": ["Et produkt med mange tillidskvaliteter (fx rådgivning)", "Et produkt med mange erfaringskvaliteter (fx vin)", "Et produkt med mange søgekvaliteter (fx en T-shirt, hvor størrelse og farve ses før køb)", "Et produkt med høj oplevet risiko"], "answer": 2, "explanation": "Søgekvaliteter kendes før købet ⇒ lav risiko ⇒ branding betyder mindst. Forkert: erfarings- og tillidskvaliteter giver usikkerhed, hvor brandet reducerer risiko; høj oplevet risiko øger brandets betydning.", "id": "MM-mc-077", "course": "MM", "lecture": 10, "lectureName": "L10 Branding 1", "type": "mc", "kind": "mc", "tags": ["MM", "MM-L10", "mc", "grund"], "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Implikationer af den økonomiske forklaring", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "grund", "order": 379}, {"question": "Hvad er brand equity, og hvordan kan virksomheden styrke den?", "model": "Definition (Kotler). Keller: brand awareness (recall/recognition) og brand image (associationer). Økonomisk forklaring (signal: konsistens, klarhed, troværdighed) og psykologisk (associativt netværk). Fordele for virksomhed og forbruger.", "id": "MM-sa-087", "course": "MM", "lecture": 10, "lectureName": "L10 Branding 1", "type": "sa", "kind": "oral", "tags": ["MM", "MM-L10", "oral", "eksamen"], "source": {"file": "Marketing Management.docx", "section": "Lektion 10 › Brand equity", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "level": "eksamen", "order": 380}, {"id": "MM-sa-095", "course": "MM", "lecture": 10, "type": "sa", "kind": "oral", "question": "[Mundtlig] Hvilke brandstrategiske beslutninger står jeres case over for (positionering, navn, sponsorship, development)?", "model": "Positionering på attributes, benefits eller beliefs/values; navnevalg; producent- vs. privat-/licens-/co-branding; line extension, brand extension, multibrands eller nye brands. Diskutér risiko for udvanding og kobl til brand equity (Keller).", "level": "eksamen", "source": {"file": "Marketing Management.docx", "section": "Eksamensøvelse", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Marketing Management.docx"}, "order": 381, "lectureName": "L10 Branding 1", "tags": ["MM", "MM-L10", "oral", "eksamen"]}, {"id": "ØS-term-L1-001", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Økonomistyring (management accounting)", "back": "Internt ledelsesværktøj der leverer finansielle og ikke-finansielle informationer, så ledere træffer bedre beslutninger og når virksomhedens mål: beslutningsstøtte, strategi og planlægning, ressourcestyring, præstationsmåling.", "source": {"file": "Økonomistyring.docx", "section": "Lektion 1 › Hvad er økonomistyring?", "path": "/workspace/sem3/3. Semester Bøger +  Noter/Økonomistyring.docx"}, "lectureName": "L1 Hvad er økonomistyring?", "tags": ["ØS", "ØS-L1", "begreb", "grund"], "level": "grund", "order": 382}, {"id": "ØS-term-L1-002", "course": "ØS", "lecture": 1, "type": "card", "kind": "begreb", "front": "Finansielt regnskab vs. økonomistyring", "back": "Finansielt regnskab: eksternt og regelbaseret. Økonomistyring: internt og tilpasset ledelsens behov. Omkostningsregnskabet leverer information til begge.", "source": {"file": "Økonomistyring.docx", "se
