og 2 – salgsbudget og produktionsbudget for Wessex Engineering. Padding og budgetary slack. Salgsbudgettet er udgangspunktet for alle de øvrige budgetter, så fejl her forplanter sig. Slides nævner to udfordringer. Padding (polstring): salget overvurderes. Budgetary slack. salget undervurderes. Trin 3: Materialeforbrugsbudget (direkte materialer). Først beregnes, hvor mange kg der skal bruges i produktionen: produktion i enheder × kg pr. enhed. Regular bruger 12 kg af 111 og 6 kg af 112; Heavy-duty bruger 12 kg af 111 og 8 kg af 112. Fysiske enheder (kg). 111 blanding. 112 blanding. Total. Regular. 6.000 × 12 kg og 6 kg. 72.000. 36.000. Heavy-duty. 1.000 × 12 kg og 8 kg. 12.000. 8.000. Nødvendige kg i produktionen. 84.000. 44.000. Derefter værdisættes forbruget. Først bruges det, der er til rådighed primo, og resten skal indkøbes i perioden: Omkostningsbudget. 111 blanding. 112 blanding. Total. Primo lager (kg). 7.000. 6.000. Omkostning pr. kg. €7. €10. Omkostninger fra primo. €49.000. €60.000. €109.000. Indkøbes til produktion (kg). 84.000 − 7.000 og 44.000 − 6.000. 77.000. 38.000. Omkostning pr. kg. €7. €10. Omkostninger fra indkøb til produktion. €539.000. €380.000. €919.000. Totale materialeomkostninger til produktion. €588.000. €440.000. €1.028.000. Det samlede materialeforbrug på €1.028.000 indgår senere i vareforbrugsbudgettet (trin 7). Slide 26: Trin 3 – materialeforbrugsbudget for direkte materialer. Trin 3: Materialeindkøbsbudget (direkte materialer). Indkøbsbudgettet følger samme logik som produktionsbudgettet, blot for råvarer: Indkøb=forbrug i produktionen+ønsket råvarelager ultimo-råvarelager primo. Fysiske enheder (kg). 111. 112. Total. Forbrug. 84.000. 44.000. + Lager ultimo (budget). 8.000. 2.000. = Totale behov. 92.000. 46.000. − Primo lager. 7.000. 6.000. = Indkøb (kg). 85.000. 40.000. Omk. pr. kg. €7. €10. Totale indkøb. €595.000. €400.000. €995.000. Bemærk forskellen mellem forbrug (€1.028.000) og indkøb (€995.000): forbruget er en omkostning, der indgår i vareforbruget, mens indkøbet er en udgift, der fører til udbetalinger (jf. slide 21). Trin 4: Lønbudget (direkte løn)."},{"t":"Eksempel: Wessex Engineering (fortsat)","b":"Direkte løn=produceret antal×timer pr. enhed×timeløn. Antal enheder af driveren. Timer pr. enhed. Totale timer. Timeløn. Totalt. Regular. 6.000. 4. 24.000. €20. €480.000. Heavy-duty. 1.000. 6.000. €20. €120.000. I alt. 30.000. €600.000. Bemærk, at der budgetteres ud fra produktionen (6.000 og 1.000 enheder) – ikke salget. De 30.000 direkte arbejdstimer bruges i trin 5 som fordelingsgrundlag for IPO. Trin 5: Budget for IPO (indirekte produktionsomkostninger). Givet det budgetterede niveau af direkte arbejdstimer på 30.000 (udspecificering af IPO findes i bogen s. 434): Budget for IPO. Beløb. Variable IPO. €780.000. Faste IPO. €420.000. Totale IPO. €1.200.000. IPO-sats pr. direkte løntime=€1.200.000/30.000 timer=€40. Trin 6: Enhedsomkostninger og varelagre ultimo. For at kunne værdisætte færdigvarelageret beregnes produktionsomkostningen pr. enhed (omkostning pr. input × input pr. enhed). Omk. pr. enhed input. Input Regular. Regular. Input Heavy. Heavy. 111 blanding. €7. 12 kg. €84. 12 kg. €84. 112 blanding. €10. 6 kg. €60. 8 kg. €80. Direkte arbejde. €20. 4 timer. €80. 6 timer. €120. IPO. €40. 4 timer. €160. 6 timer. €240. I alt. €384. €524. Der anvendes absorption costing (regnskabsmetoden, jf. de faste IPO indregnes i enhedsomkostningen. Derfor arbejder man med bruttofortjeneste (bruttoresultat) og ikke dækningsbidrag. Direkte timer bruges som cost driver for IPO. Slide 30: Trin 6 – beregning af enhedsomkostninger på færdigvarelageret. Varelagrene ultimo værdisættes med enhedsomkostningerne: Budget for varelagre ultimo. Omk. pr. enhed. Antal enheder. Total. Direkte materialer. 111 blanding. €7. 8.000. €56.000. Direkte materialer. 112 blanding. €10. 2.000. €20.000. Færdigvarer. Regular. €384. 1.100. €422.400. Færdigvarer. Heavy-duty. €524. 50. €26.200. I alt. €524.600. Råvarelageret ultimo har dermed en værdi på €76.000, og færdigvarelageret ultimo har en værdi på €448.600. Trin 7: Budget for vareforbrug (COGS). Vareforbruget beregnes som i Lektion 2 (COGS): primo færdigvarelager + periodens produktionsomkostninger − ultimo færdigvarelager. Budget for omkostninger ved solgte varer. Beløb. Færdigvarelager primo (givet). €64.600. Direkte materialer (trin 3). €1.028.000. Direkte arbejde (trin 4). €600.000. Indirekte produktionsomkostninger (trin 5). €1.200.000. Omkostninger for varer produceret i perioden. €2.828.000. Værdi af varer til rådighed for salg. €2.892.600. − Færdigvarelager ultimo (trin 6). €448.600. Vareforbrug i alt. €2.444.000. Trin 8 og 9: Andre driftsomkostninger og budgetteret resultatopgørelse. Til sidst samles driftsbudgettet. Andre driftsomkostninger (periodeomkostninger/nonmanufacturing costs) er givet i bogen (s. 436). Driftsbudget samlet. Beløb. Varesalg/omsætning (trin 1). €3.800.000."},{"t":"Eksempel: Wessex Engineering (fortsat)","b":"− Omkostninger ved solgte varer (trin 7). 2.444.000. = Bruttoresultat. 1.356.000. Andre driftsomkostninger (trin 8): R&D. €136.000. Marketing. 200.000. Distribution. 100.000. Kundeservice. 60.000. Administrationsomkostninger. 374.000. 870.000. = Resultat af ordinær drift. €486.000. Slide 33: Trin 9 (og 8) – det samlede driftsbudget (budgetteret resultatopgørelse). Eksamensrelevans. Du skal kunne opstille hele driftsbudgettet trin for trin. De vigtigste sammenhænge er. Produktion=salg+ønsket færdigvarelager ultimo-færdigvarelager primo. Materialeindkøb=forbrug+ønsket råvarelager ultimo-råvarelager primo. Løn og materialeforbrug budgetteres ud fra produktionen – ikke salget. IPO-sats=budgetterede IPO divideret med budgetteret fordelingsgrundlag (her direkte timer). Vareforbrug=færdigvarelager primo+produktionsomkostninger-færdigvarelager ultimo. Resultat=omsætning-vareforbrug-andre driftsomkostninger."},{"t":"Finansiel planlægning og følsomhedsanalyse","b":"Følsomhedsanalyse (what-if-analyse). man ændrer én af budgettets nøgleforudsætninger ad gangen og ser, hvordan det budgetterede driftsresultat påvirkes. Det kan gøres med computerbaserede planlægningsmodeller. Exhibit 14.5 viser effekten for Wessex Engineering af ændringer i budgetforudsætningerne: Scenarie. Solgt Regular. Solgt Heavy-duty. Pris Regular. Pris Heavy-duty. 111 pr. kg. 112 pr. kg. Driftsresultat. Ændring. Masterbudget. 5000. 1000. €600. €800. €7,00. €10,00. €486.000. –. Scenarie 1. 5000. 1000. 582. 776. 7,00. 10,00. 386.250. 21 % fald. Scenarie 2. 4800. 960. 600. 800. 7,00. 10,00. 438.273. 10 % fald. Scenarie 3. 5000. 1000. 600. 800. 7,35. 10,50. 448.380. 9 % fald. Scenarie 1 svarer til 3 % lavere salgspriser, scenarie 2 til 4 % lavere salgsmængder, og scenarie 3 til 5 % højere materialepriser. Selv små ændringer i forudsætningerne giver altså store udsving i resultatet – især prisfaldet på 3 %, som giver et fald i driftsresultatet på 21 %. Slide 35: Exhibit 14.5 – følsomhedsanalyse af budgetforudsætningerne for Wessex Engineering."},{"t":"Opgaver til forelæsningen","b":"Til forelæsningen skal følgende opgaver fra kapitel 14 laves: Opgave 14.1–14.5. Opgave 14.17."},{"t":"Det vigtigste til eksamen","b":"Budget = den økonomiske konsekvensprognose; budgettering = processen med periodisk valg af handlingsprogram. Budgetteringscyklussen består af planlægning (mål, strategi, masterbudget) og styring (implementering, måling mod budget, reevaluering). Fordele. planlægning, præstationskriterier samt koordination og kommunikation. Udfordringer. ressourcekrævende, rigidt, gaming, stress, suboptimering m.m. Budgetmål bør være af mellemhøj sværhedsgrad for at give den højeste faktiske præstation. Rullende budgetter holder altid samme horisont, men kræver flere ressourcer. Masterbudget = operationelle budgetter (driftsbudget/budgetteret resultatopgørelse) + finansielle budgetter (kapitalbudget, balancebudget, likviditetsbudget). Driftsbudgettet opstilles i trin. salg → produktion → materialer (forbrug og indkøb) → løn → IPO → varelagre ultimo → vareforbrug → andre driftsomkostninger → resultatopgørelse. Wessex Engineering. omsætning €3.800.000 − vareforbrug €2.444.000 = bruttoresultat €1.356.000 − andre driftsomkostninger €870.000 = resultat €486.000. Padding = overvurdering af salget; budgetary slack = undervurdering af salget (som defineret på slides). Følsomhedsanalyse viser, hvor følsomt det budgetterede resultat er over for ændringer i nøgleforudsætninger."}]},{"n":11,"name":"L11 Budgettering fortsat","items":[{"t":"Kaizen-budgettering","b":"Lektion 11 – Budgettering fortsat: Kaizen, ABB, ansvarscentre og likviditetsbudget (kapitel 14). Kaizen er japansk og betyder »løbende forbedringer« (continuous improvements). Kaizen-budgettering er en budgettilgang, der eksplicit indarbejder løbende forbedringer i de budgetterede tal gennem hele budgetperioden. Eksempel – budgetteret timeforbrug pr. enhed, hvor traditionel budgettering ville bruge 3 timer hele året: januar–marts: 3,00. april–juni. 2,95. juli–september. 2,90. oktober–december. 2,85."},{"t":"Activity-Based Budgeting (ABB)","b":"Activity-Based Budgeting bygger budgettet op ud fra efterspørgslen efter aktiviteter og består af to stadier. Stage 1 (primært ikke-finansielt): Markedet sætter via strategien efterspørgslen efter objekter (produkter, services og kunder). Objekterne skaber et behov for aktiviteter, aktiviteterne skaber et behov for ressourceforbrug, og ressourceforbruget skaber et behov for ressourceanskaffelse (omkostninger). Eksempel. Virksomheden regner med 200 kunder næste år. Hver kunde kræver ét besøg om året, dvs. 200 kundebesøg. En sælger kan klare 100 besøg årligt, så der er behov for 2 sælgere – under forudsætning af, at ingen andre aktiviteter trækker på dem. Stage 2 (finansielt): Pilene vender, og man starter ved ressourcerne og sætter kroner på. 2 sælgere à 200.000 kr. giver en ressourcepulje på 400.000 kr. Et kundebesøg koster i gennemsnit 400.000 divideret med 200=2.000 kr., som tildeles den enkelte kunde efter det faktiske antal besøg."},{"t":"Ansvarscentre","b":"Et ansvarscenter er en organisationsenhed, hvor lederen holdes ansvarlig for aktiviteten. Det er som en lille virksomhed i virksomheden, men stadig en del af organisationen. Lederen holdes ansvarlig for nogle af organisationens mål – finansielle (budgetansvaret) suppleret med ikke-finansielle mål. Virksomhedens struktur er afgørende for, hvordan budgetlægningen tilrettelægges (decentralisering vs. centralisering). Målene for et ansvarscenter bør være specifikke og målbare, være i organisationens langsigtede interesse og øge koordinationen mellem ansvarscentrene. Aktiviteterne skal være målkongruente. Koordinationsproblemer opdages generelt bedre og hurtigere gennem ikke-finansielle mål (fx kvalitet og kundetilfredshed) end gennem finansielle resultater. Ansvarscentrene adskiller sig i graden af delegeret beslutningskraft og dermed i, hvilke præstationsindikatorer de bør holdes ansvarlige for (kontrollabilitet). Standard omkostningscenter. Output kan måles præcist, og inputkravet kan specificeres for hver enhed output (fx produktion). Centeret har ofte fokus på produktivitetsmål. Ansvar. effektivitet i at opfylde ekstern efterspørgsel inden for kapacitetsgrænsen samt at opfylde produktionsplanen med kvalitet og rettidighed – IKKE variation i efterspørgsel, omsætning eller profit. Måles typisk på output pr. tidsenhed (fx stk. pr. medarbejdertime eller pr. maskintime) eller omkostningskategorier, suppleret med ikke-finansielle mål som kvalitet og leveringssikkerhed. Discretionary omkostningscenter. Centeret »producerer« output, der ikke kan måles finansielt, eller hvor der ikke er en stærk sammenhæng mellem input og output, fx R&D, produktionssupport og HR. Ansvar. inputniveauet (antal ansatte, omkostninger, udstyr) – ikke resultater/output. Effektiviteten er meget svær at analysere og kan evt. benchmarkes mod eksterne konkurrenter eller måles relativt (»bedre end sidste år«). Omsætningscenter. Organiseringen af markedsaktiviteterne (salgsafdelinger). Ansvar. salg og distribution af varer – omsætning (hvis centeret fastsætter priser) eller salgsmængde og mix (hvis topledelsen fastsætter priser), potentielt bruttoavance eller dækningsbidrag. Salgs- og marketingomkostninger og ikke-finansielle mål bør også indgå. Pas på. Omsætningsfokus kan føre til »volumensyge«, fordi målene ofte relaterer sig til markedsstørrelse, -vækst og -andele uden at inddrage produktionsomkostningerne. Profitcenter. Lederen har fået delegeret ansvaret for indkøb, produktion og hvad (og til hvem) der sælges, fx en strategisk forretningsenhed (SBU). Ansvar. omsætning og omkostninger – IKKE investerings- og finansieringsbeslutninger. Måles på profit eller nøgletal som overskudsgrad og dækningsgrad, suppleret med kvalitet, etik og miljø."},{"t":"Ansvarscentre (fortsat)","b":"I praksis behandles fx de enkelte butikker, hoteller og restauranter ofte som profitcentre, selvom de ikke fuldt ud lever op til kriterierne. Investeringscenter. Profitansvar samt investeringsansvar (aktiver), men oftest ikke finansieringen af investeringerne. Måles oftest på afkastningsgrad (AG/ROI) eller EVA."},{"t":"Kontrollabilitetsprincippet","b":"Kontrollabilitet er graden af indflydelse, en specifik leder har på omkostninger, omsætning og andre forhold. En kontrollerbar omkostning er en omkostning, som lederen af et ansvarscenter har ansvaret for og kan styre i en given tidsperiode. Responsibility accounting fokuserer på information og viden: Hvem har det bedste vidensniveau til at træffe beslutninger om og styre en given omkostning? Et ansvarscenter bør ekskludere alle ikke-kontrollerbare omkostninger, så lederen ikke holdes ansvarlig for dem. Kontrollerbarhed er dog svær at definere i praksis, og manglende overensstemmelse påvirker adfærden."},{"t":"Fordele og ulemper ved ansvarscentre","b":"Fordele. decentralt placerede ledere har og kan udnytte lokal information. hurtigere responstid på både problemer og muligheder. frigørelse af topledelsens tid. mindre datamængder og kompleksitet. træning af kommende ledere. større jobmotivation. Ulemper. risiko for suboptimering. fokus på lokale mål på bekostning af globale mål. konkurrence mellem koncernforbundne afdelinger/selskaber. risiko for dobbeltfunktioner (meromkostninger). svært at opstille de »rigtige« præstationsmål (fx ROI eller EVA), der sikrer målkongruens."},{"t":"Likviditetsbudget","b":"Et likviditetsbudget viser de forventede pengestrømme ind og ud af kassen. Det viser derfor, i hvilke måneder der er likviditetsunderskud, og i hvilke der er overskud. Likviditetsbudgettet viser præcis, hvad virksomheden har af likvider – bevægelserne ind og ud af bankkontoen. Den budgetterede profit afspejler resultatopgørelsen, dvs. registreringerne af salgs- og købsfakturaer. Forskelle på profit og likviditet. Betalingsbetingelser: En salgsfaktura registreres i én måned, men betalingen modtages måneden efter. Afdrag på gæld ses i likviditeten, men IKKE i resultatopgørelsen. Afskrivninger registreres i resultatopgørelsen, men ses IKKE i likviditeten. Man kan altså godt have profit og alligevel gå konkurs. Bankernes likviditetskrise 2008–2010 og de seks bankpakker blev brugt som eksempel. Eksempel – Maui Diving. Kunderne betaler 50 % i salgsmåneden, 27 % måneden efter og 20 % i 2. efterfølgende måned, mens 3 % tabes. Maui Diving betaler for alle indkøb, arbejdstid, produktionsoverhead og andre omkostninger i samme måned. Budgetteret salg. juni €200.000, juli €250.000, august €264.000 og september €260.000. Indbetalinger i august. 264.000×50 %=132.000+250.000×27 %=67.500+200.000×20 %=40.000, i alt €239.500. Udbetalinger i august. indkøb 4.620 + direkte løn 22.680 + overhead 31.320 + andre omkostninger 39.760 (ekskl. afskrivninger), i alt €98.380. Nettoeffekt på likviditeten i august. 239.500-98.380=+€141.120."},{"t":"Eksamensfokus","b":"De fire (fem) typer af ansvarscentre, og hvad de holdes ansvarlige for. Kontrollabilitetsprincippet. Kaizen-budgettering og ABB (stage 1 og 2). Likviditetsbudget. indbetalinger efter betalingsmønster, og hvorfor afskrivninger ikke er likviditet. Opgave 14.6–14.10 og 14.20."}]},{"n":12,"name":"L12 Variansanalyse","items":[{"t":"Budgetopfølgning","b":"Budgetopfølgning er sammenligningen af faktiske resultater med planlagte. Målet er at isolere årsagen. Den overordnede afvigelse dekomponeres, dvs. man går ind på de bagvedliggende poster for at finde årsagen. Det gøres på tre niveauer. En sammenligning på overordnet niveau viser hurtigt, om der er afvigelser. Nogle årsager kan man gøre noget ved, andre må man acceptere. En fordelagtig varians (F) er en varians, der forbedrer driftsresultatet i forhold til det budgetterede resultat. En ufordelagtig varians (U) er en varians, der forværrer driftsresultatet i forhold til det budgetterede resultat."},{"t":"Tre variansniveauer","b":"Niveau 1: faktiske omkostninger og salg vs. statisk budget. Niveau 2: fleksibelt budget-varians og salgsvolumenvarians. Niveau 3: prisvarians og forbrugsvarians (efficiens) for produktions- og lønomkostninger – samt IPO i kapitel 16."},{"t":"Niveau 1 – statisk budget","b":"Niveau 1 viser kun, at der er en afvigelse – vi vil gerne vide mere."},{"t":"Niveau 2 – fleksibelt budget","b":"Det fleksible budget genberegner budgettet ud fra det faktiske antal solgte enheder. Det er kun korrigeret for forskellen i output mellem budget og faktisk. Fremgangsmåde. Bestem budgetteret salgspris pr. enhed (€180), budgetteret variabel omkostning pr. enhed (€99) og budgetterede faste omkostninger (€710.000). Find det faktiske antal af omsætningsdriveren – her 10.000 solgte jakker. Fleksibelt budget for omsætningen. 10.000×€180=€1.800.000. Find det faktiske antal af omkostningsdriveren – også 10.000 jakker. Fleksibelt budget for omkostningerne. 10.000×€99=€990.000. Fleksibelt budget-varians=faktisk-fleksibelt budget. Salgsvolumenvarians (planning varians) = fleksibelt budget − statisk budget. Resultat (fleksibelt budget-varians / salgsvolumenvarians): Salg: €50.000 F / €360.000 U. Variable omkostninger. 130.000 U / 198.000 F. Dækningsbidrag. 80.000 U / 162.000 U. Faste omkostninger. 5.000 F / 0. Resultat. €75.000 U / €162.000 U. Kontrol. 75.000 U+162.000 U=237.000 U = niveau 1-variansen."},{"t":"Niveau 3 – pris- og forbrugsvarians","b":"Budgetdata pr. jakke. Direkte materialer: 2,00 m² stof à €30=€60. Direkte produktionsløn. 0,80 timer à €20=€16. Direkte marketingløn. 0,25 timer à €24=€6. Prisvarians=AP-SP×AQ, dvs. (faktisk pris pr. input − budgetteret pris pr. input) × faktisk inputmængde. Direkte materialer. 31-30×22.200 m²=€22.200 U. Direkte produktionsløn. 22-20×9.000 timer=€18.000 U. Direkte marketingløn. 25-24×2.304 timer=€2.304 U. Forbrugsvarians (efficiens) = AQ-SQ×SP, dvs. (faktisk inputmængde − budgetteret inputmængde tilladt for faktisk output) × budgetteret pris pr. input. Direkte materialer. 22.200-20.000×30=€66.000 U (SQ=10.000×2 m²). Direkte produktionsløn. 9.000-8.000×20=€20.000 U (SQ=10.000×0,8 timer). Direkte marketingløn. 2.304-2.500×24=€4.704 F (SQ=10.000×0,25 timer). Opsummering. First-level varians = forskellen mellem masterbudget og realiseret. Second-level varians=planning varians+fleksibel budget-varians. Third-level varians=prisvarians+mængdevarians."},{"t":"Fortolkning og ansvar","b":"Ufavorable effektivitetsvarianser på direkte arbejdskraft kan skyldes dårligt trænede medarbejdere, materialer af dårlig kvalitet, dårligt vedligeholdt udstyr eller dårlig supervision. Årsagerne hænger ofte sammen, og ansvaret kan skubbes rundt mellem indkøb, produktion og HR. Materialevarianser ved lagerændring. Hvis forbruget ikke er lig det indkøbte, beregnes prisvariansen på hele den indkøbte mængde (så den bliver mere rettidig), mens mængdevariansen beregnes på forbrugsmængden. Eksempel. 2.800 kg indkøbt×£3,90-£4,00=£280 F. Pas på med at fortolke materialevarianser isoleret: En fordelagtig prisvarians opstår ofte, fordi kvaliteten af de indkøbte materialer falder, hvilket kan give ufordelagtige mængde- og timevarianser."},{"t":"Fokus på mere end prisvarians","b":"Variansanalyse bruges primært til præstationsevaluering. To dimensioner bør måles. Effektivitet udtrykker, i hvor høj grad de planlagte målsætninger eller mål er opnået. Efficiens udtrykker, hvor meget input der bruges for at opnå et givent output. Hvis kun ét præstationsmål vægtes, fx efficiensvariansen på direkte arbejde, vil lederne maksimere præstationen på netop det mål – og prisvariansen kan stige, fordi man ansætter for dyr arbejdskraft. Indkøbsafdelingens mål bør derfor fokusere på mere end prisvarianser."},{"t":"Kaizen, ABC og varians","b":"Kaizen costing fokuserer på løbende at nedbringe omkostningerne mod et target-omkostningsmål. ABC giver et mere detaljeret budget ved at se på de aktiviteter, der indgår i produktionen (kapitel 11). Variansanalysen kan laves på aktivitetsniveau, fx materialehåndtering (1.080 serier × 5 timer pr. serie). fleksibel budget-varians 11.655 U = prisvarians 2.835 U + efficiensvarians 8.820 U."},{"t":"Benchmarking og Beyond Budgeting","b":"Benchmarking betyder at sammenligne med interne sammenlignelige enheder, sammenligne med branchen og optimere i forhold til konkurrenter. Beyond Budgeting (Hope & Fraser, 2003) bygger på relative mål, relativ belønning, kontinuert planlægning, on-demand allokering af ressourcer og decentralisering."},{"t":"Eksamensfokus","b":"De tre variansniveauer og notationen (F)/(U). Statisk vs. fleksibelt budget og salgsvolumenvarians. Formlerne for pris- og forbrugsvarians – hvilken mængde og pris der holdes fast. Sammenhænge mellem varianser og placering af ansvar. Opgave 15.1–15.10, 15.15 og 15.16."},{"t":"Opgaver til Kap 15","b":"Løsninger til review questions 15.1–15.10 samt opgave 15.15 og 15.16. 15.1 What is a benchmark? Give an example of three types of benchmark of interest to managers. Et benchmark er en standard eller et referencepunkt, som man sammenligner faktisk præstation med for at vurdere performance. Tre typer benchmarks af interesse for ledere. • Finansielle benchmarks – f.eks. budgetterede omkostninger eller indtægter, eller branchens gennemsnitlige overskudsgrad. • Procesbenchmarks – f.eks. cycle time eller fejlrater sammenlignet med best-in-class virksomheder. • Interne benchmarks – f.eks. tidligere perioders præstation eller bedste afdeling inden for virksomheden. 15.2 What is the key question in deciding which variances should be calculated and analysed?. Det centrale spørgsmål er. Hvilke afvigelser (variances) giver ledelsen den mest nyttige information til at træffe beslutninger og forbedre performance? Man bør fokusere på de afvigelser, der er væsentlige (materiale), kontrollerbare og kan føre til handlinger, snarere end at beregne alle mulige afvigelser. 15.3 Why might managers find a Level 2 flexible-budget analysis more informative than a Level 1 static-budget analysis?. En Level 1 static-budget analyse sammenligner faktiske resultater med det oprindelige budget (uden justering for volumen). En Level 2 flexible-budget analyse justerer budgettet til det faktiske outputniveau. Dette isolerer den rene performance-afvigelse (flexible-budget variance) fra volumeneffekten (sales-volume variance). Ledere får derfor et mere retvisende billede af effektivitet og omkostningskontrol, uafhængigt af om man har produceret mere eller mindre end planlagt. 15.4 ‘Performance may be both effective and efficient, but either condition can occur without the other.’ Do you agree? Give an example of effectiveness. Give an example of efficiency. Ja, jeg er enig. Effectiveness handler om at nå de ønskede mål/outputs (gøre de rigtige ting). Efficiency handler om at bruge ressourcerne bedst muligt (gøre tingene rigtigt). Eksempel på effectiveness. En salgsafdeling når sit salgsmål for kvartalet (men bruger måske for mange ressourcer). Eksempel på efficiency. En produktionslinje producerer enheder med lavere omkostning pr. enhed end budgetteret (men når måske ikke det ønskede outputvolumen). 15.5 List four reasons for using standard costs. •Budgettering og planlægning – standarder danner grundlag for fleksible budgetter. •Kontrol og performance evaluation – beregning af variances til at identificere afvigelser. •Produktkalkulation og prisfastsættelse – hurtig beregning af produktomkostninger. •Motivation og målsætning – standarder giver medarbejdere klare mål at arbejde hen imod."},{"t":"Opgaver til Kap 15 (fortsat)","b":"15.6 Describe why direct materials price and direct materials efficiency variances may be calculated with reference to different points in time. Price variance beregnes typisk på købstidspunktet (når materialerne indkøbes), så indkøbsafdelingen holdes ansvarlig for prisen. Efficiency (usage) variance beregnes på forbrugstidspunktet (når materialerne bruges i produktionen), så produktionsafdelingen holdes ansvarlig for forbruget. Dette giver en mere præcis ansvarsplacering, da de to afdelinger kontrollerer forskellige faktorer. 15.7 ‘There are many costs associated with acquiring and using materials over and above materials purchase costs.’ Give three examples. •Bestillings- og indkøbsomkostninger (ordering costs). •Lageromkostninger (holding/carrying costs) – rente, lagerplads, forsikring, forældelse. •Kvalitetskontrol, inspektion og spild/scrap ved dårlig kvalitet. 15.8 How might the continuous improvement theme be incorporated into the process of setting budgeted costs?. Ved at sætte standarder/budgetterede omkostninger, der gradvist forbedres over tid (f.eks. lavere materialeforbrug eller lavere enhedsomkostninger hvert år), eller ved at bruge kaizen budgeting, hvor man planlægger løbende forbedringer i effektivitet og omkostninger i budgetperioden. 15.9 Why might an analyst examining variances in the production area look beyond that business function for explanations of those variances?. Fordi årsagerne ofte ligger uden for produktionsafdelingen. F.eks. kan en ugunstig materialeefficiency variance skyldes dårlig kvalitet fra indkøb, designændringer fra produktudvikling, eller utilstrækkelig træning fra HR. Interdependens mellem funktioner betyder, at man skal se på hele værdikæden. 15.10 Comment on the following statement made by a plant supervisor: ‘Meetings with my plant accountant are frustrating. All he wants to do is pin the blame for the many variances he reports.’. Udsagnet peger på en problematisk brug af variance analysis. Variances bør bruges som et lærings- og forbedringsværktøj, ikke til at placere skyld. Hvis regnskabsfolk kun fokuserer på at pege fingre, skaber det modstand og forringer samarbejdet. Bedre tilgang. fælles analyse af årsager, fokus på kontrollerbare faktorer og konstruktive løsninger. Supervisoren bør involveres i at forstå standarderne, og regnskabsafdelingen bør kommunikere variances mere pædagogisk. 15.15 Flexible budget. Data. •Budgetterede priser pr. attaché case. Direct materials €40, Direct manufacturing labour €8, Direct marketing labour €12. •Static budget. DM €400.000, DML €80.000, DMk €120.000 → budgetteret output = 10.000 cases. •Actual output = 8.800 cases. •Actual costs. DM €364.000, DML €78.000, DMk €110.000. Beregning af flexible budget (ved 8.800 cases). •DM. 8.800 × 40 = €352.000."},{"t":"Opgaver til Kap 15 (fortsat)","b":"•DML. 8.800 × 8 = €70.400. •DMk. 8.800 × 12 = €105.600. Revised performance report. Actual. Flexible budget. Flex. var. Static budget. Direct materials. 364.000. 352.000. 12.000 U. 400.000. Direct manuf. labour. 78.000. 70.400. 7.600 U. 80.000. Direct marketing labour. 110.000. 105.600. 4.400 U. 120.000. Konklusion. Chairmans glæde er ikke berettiget. De favorable static-budget variances skyldes udelukkende det lavere output (8.800 vs. 10.000). Når man justerer for volumen (flexible budget), er alle flexible-budget variances unfavorable – man har brugt mere pr. enhed end budgetteret. Performance er altså dårligere end forventet. 15.16 Price and efficiency variances. Data. •Budgetteret. 15.000 kg @ £0,89/kg for 60.000 pies → standardforbrug = 0,25 kg/pie. •Actual. 16.000 kg @ £0,82/kg, output 60.800 pies. 1. Flexible-budget variance. Standard quantity allowed (SQ) = 60.800 × 0,25 = 15.200 kg. Flexible budget cost = 15.200 × 0,89 = £13.528. Actual cost = 16.000 × 0,82 = £13.120. Flexible-budget variance = 13.120 – 13.528 = £408 F. 2. Price og efficiency variances. Price variance = (AP – SP) × AQ = (0,82 – 0,89) × 16.000 = £1.120 F. Efficiency variance = (AQ – SQ) × SP = (16.000 – 15.200) × 0,89 = £712 U. Check. 1.120 F + 712 U = 408 F. 3. Kommentar. Den samlede flexible-budget variance er favorable (£408 F). Det skyldes en stor favorable price variance (£1.120 F), som mere end opvejer den unfavorable efficiency variance (£712 U). Man har købt billigere ost end budgetteret, men brugt mere ost pr. pie end standarden tillader. Mulige årsager. dårligere kvalitet på den billigere ost (højere spild), eller ineffektivitet i produktionen. Ledelsen bør undersøge, om den lavere pris har kompromitteret kvaliteten."}]},{"n":13,"name":"L13 Variansanalyse – IPO","items":[{"t":"Variable og faste IPO","b":"Indirekte produktionsomkostninger (IPO) er en stor del af virksomhedens produktionsomkostninger og derfor vigtige at styre. Variable IPO varierer med omkostningsobjektets mængde, fx el, vand, olie, maskinvedligeholdelse, indirekte materialer og indirekte arbejde. Faste IPO varierer ikke med omkostningsobjektets mængde, fx leasingomkostninger (maskiner, biler, bygninger), en andel af administrative omkostninger (fx fabrikschefens løn) og afskrivninger."},{"t":"Budgetteret variabel IPO-sats","b":"Satsen beregnes i tre trin. Vælg eller afgræns den periode, budgettet skal dække. Vælg fordelingsnøglen, fx maskintimer eller løntimer – den aktivitet, omkostningerne varierer med. Beregn raten pr. aktivitetsenhed (maskintime eller løntime). Eksempel. Hvis det tager 0,4 maskintimer at sy en jakke, og maskintimen koster €30, er raten 0,4×30=€12 pr. jakke."},{"t":"Variabel IPO – niveau 2","b":"Faktisk / fleksibelt budget / statisk budget. Enheder (jakker): 10.000 / 10.000 / 12.000. Maskintimer pr. enhed. 0,45 / 0,40 / 0,40. Maskintimer. 4.500 / 4.000 / 4.800. Variable IPO. 130.500 / 120.000 / €144.000. Variable IPO pr. maskintime. €29 / €30 / €30. Variable IPO pr. enhed. €13,05 / €12 / €12. Fleksibelt budget=10.000×0,4×30=€120.000. Fleksibelt budget-varians=130.500-120.000=€10.500 U. Salgsvolumenvarians=120.000-144.000=€24.000 F. Statisk budget-varians (niveau 1) = 130.500-144.000=€13.500 F. NB. Ifølge slides er der fejl i den statiske budget-varians og fleksibelt budget-variansen i bogen (s. 493)."},{"t":"Variabel IPO – niveau 3","b":"Efficiensvarians=faktiske timer-budgetterede timer×budgetrate pr. time=4.500-4.000×€30=€15.000 U. Budgetraten holdes fast, så man fokuserer på timeforskellen. Det er efficiensen i brugen af omkostningsallokeringsbasen (timerne), der måles. Prisvarians (spending) = (faktisk pris − budgetpris) × faktiske timer = €29-€30×4.500=€4.500 F. De faktiske maskintimer holdes fast, så man fokuserer på timeprisen. Samlet 3. niveau (kapitel 15 + 16): Direkte materialer: prisvarians €22.200 U, forbrugsvarians €66.000 U. Direkte produktionsløn. prisvarians €18.000 U, forbrugsvarians €20.000 U. Direkte marketingløn. prisvarians €2.304 U, forbrugsvarians €4.704 F. Variable indirekte produktionsomkostninger. prisvarians €4.500 F, forbrugsvarians €15.000 U. Variable indirekte marketingomkostninger. ikke analyseret, €4.300 F. Variable omkostninger i alt. €130.000 U."},{"t":"Fast IPO","b":"Faste omkostninger er uafhængige af aktiviteten, men satsen beregnes stadig i tre trin: Vælg perioden, vælg fordelingsnøglen (der skal stadig være et link til en aktivitet) og beregn satsen. Eksempel. €276.000/4.800 maskintimer=€57,50 pr. maskintime. Fast IPO-varians (spending/pris) = faktisk − fleksibelt budget = 285.000-276.000=€9.000 U. Den illustrerer en direkte omkostningsafvigelse, fx en forkert fastsat afskrivning eller leasing. Der er aldrig efficiensvarians for faste omkostninger, da de er omkostninger til at stille kapacitet til rådighed. NB. Ifølge slides er der fejl i den statiske budget-varians for fast IPO i bogen (s. 498)."},{"t":"Produktionsvolumenvarians","b":"Produktionsvolumenvariansen opstår kun for faste omkostninger. Grunden er, at en fast omkostningspulje er blandet med en aktivitet, der kan variere (maskintimer), og omregnet til en sats. Satsen er beregnet ved fuld udnyttelse af kapaciteten (12.000 jakker): 0,4 timer×€57,50=€23 pr. jakke. Ved 10.000 jakker allokeres kun 10.000×€23=€230.000. Produktionsvolumenvarians=276.000-230.000=€46.000 U. NB. Ifølge slides er der fejl i beregningen i bogen (s. 500): 10,4 skal være 0,4."},{"t":"Integreret variansanalyse","b":"4-varians-analyse (pris / efficiens / produktionsvolumen): Variabel IPO: €4.500 F / €15.000 U / aldrig en varians. Fast IPO. €9.000 U / aldrig en varians / €46.000 U. 3-varians-analyse (kombineret): pris €4.500 U, efficiens €15.000 U og produktionsvolumen €46.000 U. Fleksibelt budget-varians for total IPO=4.500 U+15.000 U=€19.500 U. Total IPO-varians=19.500+46.000=€65.500 U. Vær opmærksom på fortegn, når (U) og (F) lægges sammen."},{"t":"Planlægning og kontrol vs. lagerværdiansættelse","b":"Faste omkostninger som leasing og afskrivninger kan planlægges og kontrolleres som kendte, konstante beløb. Allokeringen af faste omkostninger til lager kan IKKE bruges til planlægning og kontrol. Her er de faste omkostninger gjort variable for at beregne en vares kostpris, og da den allokerede omkostning varierer med output, kan målestokken ikke bruges, når volumen og produktion planlægges."},{"t":"Bogføring af omkostningsflowet (nedprioriteret)","b":"Direkte materialer forstås som noget, der kommer fra råvarelageret. Eksempel. Råvarelager 32.000 og andre omkostninger 18.600 føres til varer under fremstilling. 24.500 overføres til færdigvarelager, og saldoen på varer under fremstilling er 26.100."},{"t":"Varianser i ABC/ABB – setup","b":"Aktiviteten setup bruger både variable og faste OH. Level 2 (fleksibelt budget for variabel OH) beregnes i tre trin: Brug budgetteret seriestørrelse til at beregne antal setups ved faktisk output: 151.200 divideret med 150=1.008 serier. Brug budgetterede setup-timer pr. serie til at beregne de timer, der burde være brugt: 1.008×6=6.048 setup-timer. Brug budgetteret variabel OH pr. setup-time. fleksibelt budget=6.048×€20=€120.960. Fleksibelt budget-varians = faktisk variabel OH − fleksibelt budget = 141.750-120.960=€20.790 U. Level 3: Prisvarians=21-20×6.750=€6.750 U, fordi den faktiske pris pr. setup-time er højere end budgetteret. Efficiensvarians=6.750-6.048×20=€14.040 U, fordi der er brugt flere setup-timer end budgetteret. I alt €20.790 U. Fast OH. Fleksibelt budget = statisk budget, så spending-variansen er faktisk − budget = 220.000-216.000=€4.000 U. Produktionsvolumenvarians for fast OH beregnes i fire trin: Fastsæt perioden (1 år), fastsæt fordelingsnøglen (budgetterede setup-timer, 7.200), identificér aktivitetens faste OH (216.000) og beregn raten pr. enhed af fordelingsnøglen. 216.000 divideret med 7.200=€30 pr. setup-time. Spørgsmål til eftertanke. Variansen udtrykker ineffektivt forbrug af setup-kapaciteten – skal vi gøre noget ved den, og kan vi gøre noget ved den?"},{"t":"Eksamensfokus","b":"Variabel IPO. pris- (spending) og efficiensvarians. Fast IPO. spending-varians og produktionsvolumenvarians. Hvorfor faste omkostninger aldrig har efficiensvarians, og variable aldrig har produktionsvolumenvarians. 4- og 3-varians-analyse. Opgave 16.1–16.10 og 16.16."}]}]</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('data').textContent),M=DATA.meta,ITEMS=DATA.items,BYID={};ITEMS.forEach(i=>BYID[i.id]=i);
const KEY='eksamenstraener_v1';
let S=load();function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return s}catch(e){}return{cards:{},att:{},log:[],theme:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5;
// --- filter
function fill(){const fc=$('#fCourse');if(cur==='pod'){fc.innerHTML=`<option value="ØS">ØS – ${esc(M.courses['ØS'].name)}</option>`;fc.value='ØS'}else{fc.innerHTML='<option value="">Alle fag</option>'+Object.keys(M.courses).map(c=>`<option value="${c}">${c} – ${esc(M.courses[c].name)}</option>`).join('');fc.value=S.fc||''}lec()}
function lec(){const c=$('#fCourse').value,fl=$('#fLec');let o='<option value="">Alle lektioner</option>';(c?[c]:Object.keys(M.lectures)).forEach(cc=>Object.entries(M.lectures[cc]).forEach(([l,n])=>o+=`<option value="${cc}|${l}">${c?'':cc+' '}${esc(n)}</option>`));fl.innerHTML=o;fl.value=S.fl||'';if(fl.value!==(S.fl||''))fl.value=''}
function pool(){const c=$('#fCourse').value,l=$('#fLec').value;return ITEMS.filter(i=>(!c||i.course===c)&&(!l||l===i.course+'|'+i.lecture))}
$('#fCourse').onchange=()=>{S.fc=$('#fCourse').value;S.fl='';lec();save();go(cur==='home'?'fc':cur)};$('#fLec').onchange=()=>{S.fl=$('#fLec').value;save();go(cur==='home'?'fc':cur)};
// --- theme
function theme(){const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}
$('#theme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();theme()};
// --- recording
function record(id,ok){const a=S.att[id]||(S.att[id]={c:0,n:0});a.n++;if(ok)a.c++;S.log.push([id,ok?1:0,Date.now()]);if(S.log.length>5000)S.log=S.log.slice(-5000);save()}
const LEVEL={grund:'Grund',eksamen:'Eksamen',svaer:'Svær'};const KIND={eksempel:'Gennemregnet eksempel',sammenligning:'Sammenligning',hvorfor:'Hvorfor / hvornår',begreb:'Begreb',model:'Model',metode:'Metode',def:'Definition',cloze:'Udfyld',app:'Anvendelse',mc:'Multiple choice',calc:'Beregning',open:'Kort svar',oral:'Mundtligt'};
function cv(c){return `--c:var(--${c})`}
function chips(i){return `<span class="chip c" style="${cv(i.course)}">${esc(i.course)}</span><span class="chip">${esc(i.lectureName)}</span><span class="chip">${KIND[i.kind]||i.kind}</span>${i.level?`<span class="chip lv lv-${i.level}">${LEVEL[i.level]}</span>`:''}`}
function src(i){return `<div class="src">Kilde: ${esc(i.source.file)} › ${esc(i.source.section)}</div>`}
// --- SM-2
function sm2(id,g){const q=[1,3,4,5][g],c=S.cards[id]||{ef:2.5,iv:0,reps:0,lapses:0};
 if(q<3){c.reps=0;c.iv=0;c.lapses++;c.due=Date.now()+10*60e3}else{c.reps++;c.iv=c.reps===1?1:c.reps===2?(q===5?4:3):Math.round(c.iv*c.ef*(q===3?0.8:q===5?1.3:1));c.due=Date.now()+c.iv*DAY}
 c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));S.cards[id]=c;record(id,g>0)}
let cur='home',fcQ=[],fcShow=false,fcTot=0;
const V={home:'Oversigt',fc:'Flashcards',quiz:'Quiz',exam:'Eksamen',pod:'Podcast',weak:'Svage områder',stats:'Statistik',data:'Data'};
function nav(){$('#nav').innerHTML=Object.entries(V).map(([k,v])=>`<button data-v="${k}" class="${k===cur?'on':''}">${v}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v){if(v!==cur&&examT)stopExam();const leaving=cur==='pod'&&v!=='pod',entering=v==='pod'&&cur!=='pod';if(leaving)stopPod();if(leaving&&prePod){S.fc=prePod.fc;S.fl=prePod.fl;prePod=null;save()}if(entering){prePod={fc:S.fc||'',fl:S.fl||''};S.fc='ØS';if(!(S.fl||'').startsWith('ØS|'))S.fl='';save()}cur=v;if(entering||leaving)fill();nav();const m=$('#app');m.style.animation='none';m.offsetHeight;m.style.animation='';({home:vHome,fc:vFc,quiz:vQuiz,exam:vExam,pod:vPod,weak:vWeak,stats:vStats,data:vData})[v]();scrollTo({top:0})}
function ring(p,label,c,big){return `<div class="ring${big?' big':''}" style="--p:${Math.round(p)};${c?cv(c):''}"><span>${label}</span></div>`}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function streak(){const days=new Set((S.log||[]).map(l=>dayKey(l[2])));let n=0,d=Date.now();if(!days.has(dayKey(d)))d-=DAY;while(days.has(dayKey(d))){n++;d-=DAY}return n}
function isDue(i){const c=S.cards[i.id];return c&&c.due<=Date.now()}
function vHome(){const today=(S.log||[]).filter(l=>dayKey(l[2])===dayKey(Date.now())).length,st=streak();
 const cards=ITEMS.filter(i=>i.type==='card'),seen=cards.filter(i=>S.cards[i.id]).length,tot=ITEMS.reduce((s,i)=>{const a=S.att[i.id];if(a){s.c+=a.c;s.n+=a.n}return s},{c:0,n:0});
 const weak=lecStats(ITEMS).filter(o=>o.n>0&&acc(o)<.8).sort((a,b)=>acc(a)-acc(b)).slice(0,4);
 $('#app').innerHTML=`<div class="box hero">${ring(cards.length?100*seen/cards.length:0,Math.round(cards.length?100*seen/cards.length:0)+'%<small>kort set</small>',null,true)}<div style="flex:1;min-width:220px"><h2>${st?'🔥 '+st+' dages streak':'Klar til at lære?'}</h2><div class="meta">${today?today+' gennemgange i dag – godt gået.':'Start dagens repetition for at holde din streak i live.'}</div>
 <div class="kpis"><div class="kpi"><b>${ITEMS.filter(isDue).length}</b><span>forfaldne kort</span></div><div class="kpi"><b>${seen}/${cards.length}</b><span>kort set</span></div><div class="kpi"><b>${tot.n?Math.round(100*tot.c/tot.n)+'%':'–'}</b><span>træfsikkerhed</span></div></div></div></div>
 <div class="grid">${Object.entries(M.courses).map(([c,v])=>{const it=ITEMS.filter(i=>i.course===c),cs=it.filter(i=>i.type==='card'),sn=cs.filter(i=>S.cards[i.id]).length,du=it.filter(isDue).length,nw=cs.length-sn;
